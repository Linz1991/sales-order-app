function showApp(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('appPage').style.display = 'flex';
  renderSidebar();
  navigate('dashboard');
  const d = new Date();
  document.getElementById('headerDate').textContent =
    d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
  // 非管理员隐藏同步状态、同步按钮和日期显示
  if(currentUser && currentUser.role !== 'admin'){
    var _syncBadge = document.getElementById('syncStatusBadge');
    var _syncBtnEl = document.getElementById('syncBtn');
    var _headerDateEl = document.getElementById('headerDate');
    if(_syncBadge) _syncBadge.style.display = 'none';
    if(_syncBtnEl) _syncBtnEl.style.display = 'none';
    if(_headerDateEl) _headerDateEl.style.display = 'none';
  }
  // 启动后台自动同步（拉取云端最新数据），让管理员/其他端提交的订单能实时可见
  startAutoSync();
}

// 后台自动同步：每 15 秒从云端拉取全表，仅在停留的列表页对应数据变化时才刷新，不打断详情/编辑页
function startAutoSync(){
  if(window._autoSyncTimer) return;
  if(!window._sbpbClient) return;
  // 路由 -> 该路由依赖的数据表（schedule/warehouse 由 orders 派生，故都看 orders；dashboard/dashboard2 也依赖订单/商品）
  const routeTable = {
    orders:'orders', schedule:'orders', warehouse:'orders',
    customers:'customers', products:'products', aftersales:'aftersales',
    commissions:'commissions', payments:'payments',
    dashboard:'orders', dashboard2:'orders'
  };
  const routeRenderers = {
    orders: renderOrders, schedule: renderSchedule, warehouse: renderWarehouse,
    customers: renderCustomers, products: renderProducts, aftersales: renderAftersales,
    commissions: renderCommissions, payments: renderPayments,
    dashboard: renderDashboard, dashboard2: renderDashboard2
  };
  window._routeRenderers = routeRenderers;
  window._autoSyncTimer = setInterval(async () => {
    if(window._autoSyncing) return;
    window._autoSyncing = true;
    try{
      const before = snapshotSyncTables();
      await DB.syncFromCloud();
      const after = snapshotSyncTables();
      // 仅当正停留在可安全刷新的列表页，且该页依赖的表有变化时才刷新
      if(currentRoute && routeTable[currentRoute] && routeRenderers[currentRoute]){
        const t = routeTable[currentRoute];
        if(before[t] !== after[t]) routeRenderers[currentRoute]();
      }
      // 详情页实时刷新：正在查看某订单详情（非编辑模式）且订单表有变化时，重渲染详情，
      // 让销售在详情页也能看到管理员刚填的物流单号/状态（编辑模式不刷新，避免丢失未保存输入）
      if(window._currentOrderId && !window._orderEditMode && document.getElementById('orderDetailPanel') && before['orders'] !== after['orders']){
        const _od = DB.get('orders').find(o => o.id === window._currentOrderId);
        if(_od) renderOrderDetail();
      }
      // 订单变化同步刷新侧边栏徽章（待处理/上门未完成等计数），避免数据一致但角标在各设备显示不一致
      if(before['orders'] !== after['orders'] && typeof renderSidebar === 'function'){
        try{ renderSidebar(); }catch(e){}
      }
      // 上推本地新增/修改的订单等数据，让其他设备最多 15 秒内可见（修复“一端创建的订单另一端看不到”）
      await DB.pushLocalChanges();
    }catch(e){
      // 同步失败不频繁打扰：每 60 秒最多提示一次
      window._autoSyncErrAt = window._autoSyncErrAt || 0;
      if(Date.now() - window._autoSyncErrAt > 60000){
        showToast('云端同步失败，请检查网络或手动点“同步到云端”','error');
        window._autoSyncErrAt = Date.now();
      }
    }
    finally{ window._autoSyncing = false; }
  }, 15000);
  // 联网/断网自动处理：断网标记离线；联网后先拉云端再推本地，保证离线提交的订单不丢
  window.addEventListener('online', function(){
    if(typeof updateSyncBadge === 'function') updateSyncBadge('syncing');
    if(typeof DB !== 'undefined' && DB.syncFromCloud){
      DB.syncFromCloud().then(function(){
        if(typeof schedulePushToCloud === 'function') schedulePushToCloud();
        if(typeof updateSyncBadge === 'function') updateSyncBadge(navigator.onLine ? 'online' : 'pending');
        if(window._routeRenderers && currentRoute && window._routeRenderers[currentRoute]){
          try{ window._routeRenderers[currentRoute](); }catch(e){}
        }
      }).catch(function(){ if(typeof updateSyncBadge === 'function') updateSyncBadge('error'); });
    }
  });
  window.addEventListener('offline', function(){ if(typeof updateSyncBadge === 'function') updateSyncBadge('offline'); });
}

// 对可同步的核心表做轻量快照（仅 id 集合+行数），用于判断是否需要刷新当前列表页
function snapshotSyncTables(){
  const keys = ['orders','customers','products','aftersales','commissions','payments'];
  const out = {};
  keys.forEach(k => {
    const rows = DB.get(k) || [];
    // 内容感知签名：除 id 外，纳入会变化的字段（订单的状态/物流单号等），
    // 否则"同一批 id、数量不变但内容被改（如填物流单号、状态转待反馈）"时，
    // 自动同步会因快照相等而不刷新列表，导致销售端看不到最新数据。
    const sig = rows.map(r => {
      if(k === 'orders'){
        // 全字段内容感知：金额/客户/电话/备注/损耗/收款状态/反馈/上门/留仓/销售等任一字段变化，
        // 都能被其它设备的自动同步检测到并重渲染，彻底解决“数据已同步但界面仍显示旧订单信息”。
        try { return (r.id || '') + '|' + JSON.stringify(r); } catch(e){ return (r.id || ''); }
      }
      return (r.id || '') + '|' + JSON.stringify(r);
    }).join('||');
    out[k] = sig;
  });
  return out;
}

// ===== 2026-0808 实时刷新 / 写后重拉 / 订单编辑锁 辅助函数 =====
const ORDER_LOCK_TTL_MS = 5 * 60 * 1000; // 编辑锁有效期 5 分钟，超时自动失效

// 路由 → 依赖的数据表（进入该页面需先从云端权威拉取这些表）
function tablesForRoute(route){
  if(route === 'dashboard' || route === 'dashboard2') return ['orders','products'];
  const m = {
    orders:'orders', 'order-detail':'orders', 'order-edit':'orders', schedule:'orders', warehouse:'orders',
    'collect-balance':'orders', 'profit-report':'orders',
    customers:'customers', products:'products', 'product-edit':'products',
    payments:'payments', commissions:'commissions',
    aftersales:'aftersales', 'aftersale-detail':'aftersales', 'aftersale-new':'aftersales',
    users:'users'
  };
  return m[route] ? [m[route]] : [];
}

// 某表变更后：若当前视图依赖该表则重渲染（Realtime 与写后重拉共用）
function refreshCurrentViewForTable(table){
  try{
    const depsMap = {
      orders:['orders','schedule','warehouse','dashboard','dashboard2','order-detail','order-edit','collect-balance','profit-report'],
      products:['products','product-edit'],
      customers:['customers'],
      aftersales:['aftersales','aftersale-new','aftersale-detail'],
      commissions:['commissions'],
      payments:['payments']
    };
    const deps = depsMap[table] || [];
    if(deps.indexOf(currentRoute) >= 0 && window._routeRenderers && window._routeRenderers[currentRoute]){
      try{ window._routeRenderers[currentRoute](); }catch(e){}
    }
  }catch(e){}
    if(table === 'orders'){
      // 订单变化：仅当当前确实停留在“订单详情”页时，才刷新正在查看的详情（避免停留在列表页时
      // 因 _currentOrderId 仍置位而被误调 renderOrderDetail，把详情面板渲染到列表上造成频闪）。
      // 编辑页由上方 _routeRenderers['order-edit'] 负责刷新；列表页不应触发详情渲染。
      if(currentRoute === 'order-detail' && window._currentOrderId && typeof renderOrderDetail === 'function'){
        // 内联编辑（损耗/物流单号等 INPUT/TEXTAREA）进行中时跳过整页重建：否则每次按键触发
        // afterWriteRefresh / Realtime / 15s轮询 重渲染会使输入框丢焦点、刚输入的数字被刷新、按钮抖动。
        // 数据已即时落库（saveItemWaste 等会 DB.set）并推送云端，不会丢失；待用户失焦或后续同步再刷新。
        const _ae = document.activeElement;
        const _typing = _ae && (_ae.tagName === 'INPUT' || _ae.tagName === 'TEXTAREA');
        if(!_typing){
          try{ renderOrderDetail(); }catch(e){}
        }
      }
      if(typeof renderSidebar === 'function'){ try{ renderSidebar(); }catch(e){} }
    }
}

// 写订单/商品后：立刻从云端重新拉取全量（网络权威），再刷新当前视图，不依赖本地状态（Req4）
function afterWriteRefresh(table){
  if(!window._sbpbClient) return;
  DB.pullTableAuthoritative(table).then(function(){
    refreshCurrentViewForTable(table);
  }).catch(function(){});
}
window._afterWriteRefresh = afterWriteRefresh;

// 实时事件：某表在云端被其它设备变更后，立即网络拉取最新并刷新当前视图（Req3）
function onRealtimeChange(table){
  if(!currentUser || !window._sbpbClient) return;
  DB.pullTableAuthoritative(table).then(function(){
    refreshCurrentViewForTable(table);
  }).catch(function(){});
}

// 订单编辑锁：管理员对“待下单”订单进行下单操作时加锁，禁止销售编辑（Req7）
async function acquireOrderLock(orderId){
  if(!orderId) return;
  const orders = DB.get('orders');
  const o = orders.find(x => x.id === orderId);
  if(!o) return;
  o.lockedBy = (currentUser && currentUser.name) || '管理员';
  o.lockedAt = nowStr();
  o.updatedAt = nowStr();
  DB.set('orders', orders); // 经 DB.set → 同步云端 + 写后重拉，其它设备经 Realtime/自动同步获取锁
}
async function releaseOrderLock(orderId){
  if(!orderId) return;
  const orders = DB.get('orders');
  const o = orders.find(x => x.id === orderId);
  if(!o || !o.lockedBy) return;
  // 仅释放“本人持有”的锁，避免误清他人（如销售）正在持有的锁
  if(currentUser && o.lockedBy !== currentUser.name) return;
  o.lockedBy = null; o.lockedAt = null; o.updatedAt = nowStr();
  DB.set('orders', orders);
}
// 订单是否正被“其它人”锁定（锁定者非本人且未超时）
function isOrderLockedByOther(order){
  if(!order || !order.lockedBy) return false;
  // 锁仅用于“待下单”下单保护（管理员正在下单时冻结销售端）。
  // 订单一旦流转到 待反馈/已下单/已完成，锁即失效——不应再向销售展示“锁单”，
  // 否则销售在“待反馈”看不到可点击的「反馈」按钮（误以为被锁），订单无法流转到“已完成”。
  // 注意：云端 confirmed 的防回退保护由 _mergeById 内的 lockActive() 独立承担，与此函数无关。
  if(order.status && order.status !== 'pending') return false;
  if(currentUser && order.lockedBy === currentUser.name) return false;
  const t = Date.parse(((order.lockedAt || '').replace(' ', 'T')) || 0);
  if(isNaN(t) || (Date.now() - t) >= ORDER_LOCK_TTL_MS) return false;
  return true;
}

// 写操作后异步推送云端（防抖合并，避免高频写造成频繁全量同步）
function schedulePushToCloud(){
  if(typeof updateSyncBadge === 'function') updateSyncBadge(navigator.onLine ? 'syncing' : 'offline');
  if(window._pushTimer) return;
  window._pushTimer = setTimeout(() => {
    window._pushTimer = null;
    DB.pushToCloud().then(()=>{ if(typeof updateSyncBadge==='function') updateSyncBadge(navigator.onLine ? 'online' : 'pending'); }).catch(e => {
      if(typeof updateSyncBadge === 'function') updateSyncBadge(navigator.onLine ? 'error' : 'offline');
      window._lastPushErrAt = window._lastPushErrAt || 0;
      if(Date.now() - window._lastPushErrAt > 60000){
        showToast('数据同步到云端失败，请检查网络','error');
        window._lastPushErrAt = Date.now();
      }
    });
  }, 800);
}

// 关键状态变更（下单/反馈/改状态）立即同步订单表到云端，避免 debounce 期间刷新/切页导致改动丢失。
// 调用处可 await 或不 await；失败时至少保证 debounce 兜底仍会继续推送。
async function syncOrdersNow(){
  if(!window._sbpbClient) return;
  // 取消待执行的 debounce 推送，避免重复推送
  if(window._pushTimer){ clearTimeout(window._pushTimer); window._pushTimer = null; }
  if(typeof updateSyncBadge === 'function') updateSyncBadge('syncing');
  try{
    await DB.syncTable('orders');
    if(typeof updateSyncBadge === 'function') updateSyncBadge(navigator.onLine ? 'online' : 'pending');
  }catch(e){
    console.warn('立即同步订单失败:', e.message);
    if(typeof updateSyncBadge === 'function') updateSyncBadge(navigator.onLine ? 'error' : 'offline');
    // 失败后重新走兜底推送
    schedulePushToCloud();
    throw e;
  }
}

  }
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {

  // 离开订单详情/编辑页：若当前用户（管理员）持有该订单编辑锁，则释放，避免死锁长期阻塞销售
  if(route !== 'order-detail' && route !== 'order-edit'){
    if(currentUser && currentUser.role === 'admin' && window._currentOrderId){
      releaseOrderLock(window._currentOrderId).catch(function(){});
    }
  }
  navItems.forEach(item => {
    const onclick = item.getAttribute('onclick');
    if(onclick && onclick.includes("'"+mapRoute+"'")){
      item.classList.add('active');
    }
  });
  const renderers = {
    dashboard: renderDashboard,

    customers: renderCustomers,

    'product-edit': renderProductEdit,
    payments: renderPayments,

    aftersales: renderAftersales,
    'collect-balance': renderCollectBalance,
    'aftersale-new': renderAftersaleNew,
    'aftersale-detail': renderAftersales,
    dashboard2: renderDashboard2,
    'profit-report': renderProfitReport,
    settings: renderSettings,
    users: renderUsers,
    audit: renderAuditLog
  };
  const fn = renderers[route] || renderDashboard;

  // ===== 2026-0808：数据库为唯一数据源（Req2/6）=====
  // 进入页面先置加载态，再从云端权威拉取本页依赖的表，完成后再渲染；
  // 杜绝“先渲染本地旧缓存、再后台同步”导致的跨设备不一致（业务数据源头只能是数据库）。
  const tables = tablesForRoute(route);
  const mainEl = document.getElementById('mainContent');

      await Promise.all(tables.map(function(tb){ return DB.pullTableAuthoritative(tb); }));
    }catch(e){ console.warn('导航拉取云端失败，回退本地缓存渲染：', (e && e.message) || e); }
  }
  fn();
  // 管理员进入待下单订单详情页时立即加编辑锁，阻止销售并发编辑；
  // 同步上云确保销售端（含其它设备）实时收到锁状态。
  if((route === 'order-detail' || route === 'order-edit') && currentUser && currentUser.role === 'admin' && window._currentOrderId){
    const order = DB.get('orders').find(o => o.id === window._currentOrderId);
    if(order && order.status === 'pending'){

      }).catch(function(){});

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  window.scrollTo(0,0);
  // 浏览器历史记录兼容：导航时推送 state
  if(window._skipHistoryPush !== true){
    history.pushState({route: route, orderId: window._currentOrderId}, '', '#' + route);
  }
  window._skipHistoryPush = false;
}

// 按日期自动流转订单状态：留仓/上门订单到期自动改为待下单
function checkOrderAutoFlow(){
  const orders = DB.get('orders');
  const today = todayStr();
  let changed = false;
  orders.forEach(o => {
    // 仅处理留仓/上门订单
    if(o.type !== 'warehouse' && o.type !== 'door') return;
    // 上门订单：订单上门日期到达次日 → 自动置为已完成
    if(o.type === 'door' && o.completionDate && !['completed'].includes(o.status)){
      if(today > o.completionDate){
        o.status = 'completed';
        changed = true;
        return; // 已完成后不再走下面的流转
      }
    }
    // 必须有订单日期字段
    if(!o.orderDate) return;
    // 跳过已处理/终态状态（含运输中/已签收/待反馈/已反馈，避免把已推进的订单按日期误回退为待下单）
    if(['completed','confirmed','shipped','feedback','feedback_done'].includes(o.status)) return;
    // 今日 >= 订单日期，且状态非终态 → 改为待下单
    if(today >= o.orderDate && o.status !== 'pending'){
      o.status = 'pending';
      changed = true;
    }
  });
  if(changed){
    DB.set('orders', orders);
  }
}

function salesStatusLabel(status){

function salesStatusGroup(key){

// 创建时间格式化为 2026-7-30（去掉前导零）
function formatOrderDate(d){
  if(!d) return '-';
  let datePart = (d.split(' ')[0]).split('T')[0];
  const parts = datePart.split('-');
  if(parts.length === 3 && parts[0].length === 4){
    return parts[0] + '-' + parseInt(parts[1],10) + '-' + parseInt(parts[2],10);
  }
  return d;
}
// 订单创建时间统一格式：2026-08-02 19:30（YYYY-MM-DD HH:mm，两位、无秒）
function formatOrderDateTime(d){
  if(!d) return '-';
  let s = ('' + d).trim().replace('T', ' ').replace(/\+.*$/, '');
  // 去掉秒
  s = s.replace(/:\d{1,2}$/, '');
  const parts = s.split(' ');
  let datePart = parts[0] || '';
  let timePart = parts[1] || '';
  const dp = datePart.split('-');
  if(dp.length === 3){
    datePart = dp[0] + '-' + String(parseInt(dp[1],10)||0).padStart(2,'0') + '-' + String(parseInt(dp[2],10)||0).padStart(2,'0');
  }
  if(timePart){
    const tp = timePart.split(':');
    timePart = String(parseInt(tp[0],10)||0).padStart(2,'0') + ':' + String(parseInt(tp[1],10)||0).padStart(2,'0');
  }
  const out = timePart ? (datePart + ' ' + timePart) : datePart;
  return out || ('' + d);
}

function clearDateFilter(){

function filterOrders(value, type){

  renderOrders();
}

// 销售端订单列表「加载更多」：只增加页数、不重置筛选

function viewOrder(orderId, forceViewOnly){
  window._currentOrderId = orderId;
  window._orderEditMode = false;
  window._orderForceViewOnly = forceViewOnly === true;
  navigate('order-detail');
}

function deleteOrder(orderId){
  showConfirm('确定删除此订单吗？删除后不可恢复。', async () => {
    const orders = DB.get('orders');
    const idx = orders.findIndex(o => o.id === orderId);
    if(idx < 0){ showToast('订单不存在','error'); return; }
    const order = orders[idx];
    let refundText = '';
    // 撤回该订单关联的微信收款记录
    const beforePayments = DB.get('payments') || [];
    const orderPayRefund = beforePayments
      .filter(p => p.orderId === orderId && p.method === '微信支付')
      .reduce((s, p) => s + (parseInt(p.amount) || 0), 0);
    const orderCollected = order.paymentMethod === 'wechat' ? (parseInt(order.collectedAmount) || 0) : 0;
    const totalRefund = orderCollected + orderPayRefund;
    if(totalRefund > 0){
      refundText = '（已撤回微信收款 ' + money(totalRefund) + '）';
    }
    DB.set('payments', beforePayments.filter(p => p.orderId !== orderId));

    // 物理删除：先真正删云端记录（anon key 已验证具备 DELETE 权限），再删本地，避免被同步拉回
    let cloudOk = true;
    if(window._sbpbClient){
      try{
        const { error } = await window._sbpbClient.from('orders').delete().eq('id', orderId);
        if(error){ cloudOk = false; console.warn('云端删除失败:', error.message); }
      }catch(e){ cloudOk = false; console.warn('云端删除异常:', e.message); }
    }
    const localOrders = DB.get('orders');
    const li = localOrders.findIndex(o => o.id === orderId);
    if(li >= 0) localOrders.splice(li, 1);
    DB.set('orders', localOrders);
    // 记录本端已删除的订单 id（直接写 localStorage，避免触发对不存在表的同步），
    // 让后续云端同步的 _mergeById 跳过这些 id，防止“删了又被同步拉回”的问题。
    try{
      const delKey = 'soms__deletedOrderIds';
      const delSet = JSON.parse(localStorage.getItem(delKey) || '[]');
      if(!delSet.includes(orderId)) delSet.push(orderId);
      localStorage.setItem(delKey, JSON.stringify(delSet));
    }catch(e){ /* 忽略本地标记失败 */ }

    if(cloudOk){
      showToast('订单已彻底删除' + refundText, 'success');
    } else {
      showToast('本地已删除，但云端同步失败，请刷新后重试', 'warning');
    }
    navigate('orders');
  });
}

// ============ 清理订单：admin 批量删除指定账号名下所有订单 ============
// 目标账号动态从 users 表 + 订单实际 salesId 汇总，新加入的销售人员也能被清理

// 物理删除指定 salesId 集合名下的全部订单（云端 + 本地 + 排除集，与 deleteOrder 一致）
async function purgeOrdersForSales(salesIds){
  const orders = DB.get('orders');
  const toDelete = orders.filter(o => salesIds.includes(o.salesId));
  if(!toDelete.length){ showToast('没有匹配的订单','info'); closeModal(); return; }
  const delIds = toDelete.map(o => o.id);
  // 撤回关联的微信收款记录（与单条 deleteOrder 行为一致）
  const payments = DB.get('payments') || [];
  DB.set('payments', payments.filter(p => !delIds.includes(p.orderId)));
  // 云端批量删除（逐条记录，id 为主键）
  let cloudOk = true;
  if(window._sbpbClient){
    try{
      const { error } = await window._sbpbClient.from('orders').delete().in('id', delIds);
      if(error){ cloudOk = false; console.warn('云端批量删除失败:', error.message); }
    }catch(e){ cloudOk = false; console.warn('云端批量删除异常:', e.message); }
  }
  // 本地删除
  DB.set('orders', orders.filter(o => !delIds.includes(o.id)));
  // 记录已删除订单 id（防云端同步拉回）
  try{
    const delKey = 'soms__deletedOrderIds';
    const set = JSON.parse(localStorage.getItem(delKey) || '[]');
    delIds.forEach(id => { if(!set.includes(id)) set.push(id); });
    localStorage.setItem(delKey, JSON.stringify(set));
  }catch(e){ /* 忽略本地标记失败 */ }
  schedulePushToCloud();
  showToast('已删除 ' + delIds.length + ' 条订单' + (cloudOk ? '' : '（云端同步异常，请刷新重试）'), 'success');
  closeModal();
  renderOrders();
}

// 打开清理面板：列出目标账号及其订单数，可勾选
function openCleanupPanel(){
  const users = DB.get('users') || [];
  const orders = DB.get('orders');
  // 动态汇总所有可能拥有订单的账号名（用户表 + 订单实际销售 id）
  const nameSet = new Set();
  users.forEach(u => { if(u.username) nameSet.add(u.username); });
  orders.forEach(o => {
    const u = users.find(x => x.id === o.salesId);
    if(u && u.username) nameSet.add(u.username);
  });
  // admin 置顶，其余按中文拼音/字母排序
  const names = Array.from(nameSet).sort((a,b) => {
    if(a === 'admin') return -1;
    if(b === 'admin') return 1;
    return a.localeCompare(b, 'zh-CN');
  });
  const stats = names.map(un => {
    const ids = users.filter(u => u.username === un).map(u => u.id);
    const cnt = orders.filter(o => ids.includes(o.salesId)).length;
    return { username: un, count: cnt, ids: ids };
  });
  const total = stats.reduce((s, x) => s + x.count, 0);
  const rows = stats.map((s, i) => `
    <tr>
      <td style="text-align:center"><input type="checkbox" id="cleanupChk_${i}" ${s.count>0?'checked':''} ${s.count===0?'disabled':''}></td>
      <td>${s.username}</td>
      <td style="color:var(--text-muted)">${s.ids.length ? s.ids.length+' 个账号匹配' : '未找到账号'}</td>
      <td style="text-align:right;font-weight:600">${s.count}</td>
    </tr>`).join('');
  const modalHtml = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:520px">
        <div class="modal-header"><h3>🧹 清理订单数据</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="modal-body">
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px;color:#b91c1c;font-size:13px;margin-bottom:12px">
            ⚠ 此操作<b>不可恢复</b>：将永久删除下列账号名下的<b>所有状态</b>订单（云端 + 本地），并从所有导出中排除。请确认无误后执行。
          </div>
          <table style="width:100%;font-size:13px;border-collapse:collapse">
            <thead><tr style="background:#f8fafc"><th style="padding:6px">选择</th><th style="padding:6px;text-align:left">账号</th><th style="padding:6px;text-align:left">匹配</th><th style="padding:6px;text-align:right">订单数</th></tr></thead>
            <tbody>${rows}</tbody>
            <tfoot><tr style="border-top:2px solid var(--border)"><td colspan="3" style="padding:8px;font-weight:600">合计</td><td style="padding:8px;text-align:right;font-weight:700;color:var(--danger)">${total}</td></tr></tfoot>
          </table>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn btn-danger" onclick="confirmCleanupOrders()">执行删除（不可恢复）</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalContainer').innerHTML = modalHtml;
  window._cleanupStats = stats;
}

// 确认清理：收集勾选账号的 id，二次确认后执行
function confirmCleanupOrders(){
  const stats = window._cleanupStats || [];
  const salesIds = new Set();
  stats.forEach((s, i) => {
    const chk = document.getElementById('cleanupChk_'+i);
    if(chk && chk.checked){ s.ids.forEach(id => salesIds.add(id)); }
  });
  const idArr = Array.from(salesIds);
  if(!idArr.length){ showToast('请至少选择一个账号','error'); return; }
  showConfirm('确定永久删除所选账号的全部订单吗？此操作不可恢复！', () => {
    purgeOrdersForSales(idArr);
  });
}

// 回收站：列出已软删除的订单，可恢复或彻底删除
function renderRecycleBin(){
  const isAdmin = currentUser.role === 'admin';
  let deleted = DB.get('orders').filter(o => o._deleted);
  if(!isAdmin) deleted = deleted.filter(o => o.salesId === currentUser.id);
  deleted = deleted.slice().sort((a,b) => (b._deletedAt||'').localeCompare(a._deletedAt||''));
  let html = '<div class="card"><div class="card-title"><span class="title-text">🗑️ 回收站</span><button class="btn btn-sm" onclick="navigate(\'orders\')">返回订单</button></div>';
  html += '<p style="font-size:12px;color:var(--text-muted);margin:8px 0">以下为已删除的订单，可恢复或彻底删除。彻底删除后不可恢复。</p>';
  if(deleted.length){
    html += '<div class="table-wrap"><table><thead><tr><th>客户</th><th>订单号</th><th>金额</th><th>删除时间</th><th>操作</th></tr></thead><tbody>';
    deleted.forEach(o => {
      html += '<tr>' +
        '<td>' + (o.customerName||'-') + '</td>' +
        '<td style="font-size:12px">' + (o.id||'') + '</td>' +
        '<td style="font-weight:600">' + money(parseInt(o.total)||0) + '</td>' +
        '<td style="font-size:12px">' + (o._deletedAt||'-') + '</td>' +
        '<td><button class="btn btn-primary btn-sm" onclick="restoreOrder(\'' + o.id + '\')">恢复</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="purgeOrder(\'' + o.id + '\')">彻底删除</button></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty-state"><div class="empty-icon">🗑️</div><div class="empty-text">回收站为空</div></div>';
  }
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// 恢复软删除的订单
function restoreOrder(orderId){
  showConfirm('确定恢复此订单吗？', () => {
    const orders = DB.get('orders');
    const idx = orders.findIndex(o => o.id === orderId);
    if(idx >= 0){
      delete orders[idx]._deleted;
      delete orders[idx]._deletedAt;
      DB.set('orders', orders);
    }
    showToast('订单已恢复','success');
    schedulePushToCloud();
    renderRecycleBin();
  });
}

// 彻底删除（物理删除，不可恢复）
function purgeOrder(orderId){
  showConfirm('彻底删除后不可恢复，确定吗？', () => {
    DB.set('orders', DB.get('orders').filter(o => o.id !== orderId));
    DB.set('payments', DB.get('payments').filter(p => p.orderId !== orderId));
    showToast('订单已彻底删除','success');
    schedulePushToCloud();
    renderRecycleBin();
  });
}

  if(parsed.items.length){
    hasAny = true;
    previewHTML += parsed.items.map(i =>
      '<div class="rpc-item" style="color:#2e7d32">' + i.name + ' ¥' + i.price + ' <span style="font-size:11px;color:#888">(已匹配)</span></div>'
    ).join('');
  }
  if(parsed.rawItems.length){
    hasAny = true;
    previewHTML += parsed.rawItems.map(item =>
      '<div class="rpc-item" style="color:#e65100">' + item + ' <span style="font-size:11px;color:#888">(未匹配商品库)</span></div>'
    ).join('');
  }
  if(!hasAny){
    previewHTML += '<div class="rpc-empty">未识别到商品</div>';
  }
  previewHTML += '</div>';

  // 块3：订单备注（最右侧独立卡片）
  previewHTML += '<div class="rec-preview-card" style="border-top:3px solid #f57f17;background:#fffbeb">';
  previewHTML += '<div class="rpc-title" style="color:#f57f17">📝 订单备注</div>';
  if(parsed.remark){
    const remarkItems = parsed.remark.split(/[，,;；]/).filter(Boolean);
    previewHTML += remarkItems.map(r => '<div class="rpc-item" style="color:#b45309">'+escapeHtml(r.trim())+'</div>').join('');
  } else {
    previewHTML += '<div class="rpc-empty" style="font-size:12px">无赠品备注</div>';
  }
  previewHTML += '</div>';

  previewHTML += '</div>';

  // 显示/隐藏结果面板
  let resultPanel = document.getElementById('recognizeResultPanel');
  if(!resultPanel){
    resultPanel = document.createElement('div');
    resultPanel.id = 'recognizeResultPanel';
    // 插入到识别框（recognize-box）之后
    const recBox = document.querySelector('.recognize-box');
    recBox.parentNode.insertBefore(resultPanel, recBox.nextSibling);
  }
  resultPanel.innerHTML = previewHTML;

  // ---- 自动填充表单 ----
  // 填充客户信息
  if(parsed.contact) document.getElementById('custContact').value = parsed.contact;
  if(parsed.phone) document.getElementById('custPhone').value = parsed.phone;
  if(parsed.region) document.getElementById('custRegion').value = parsed.region;
  if(parsed.address) document.getElementById('custAddress').value = parsed.address;
  // 自动把结构化省市区填入三级联动（缺失层级已被 parseAddressText 补全）
  if(parsed.province || parsed.city || parsed.district) setAreaSelects(parsed.province, parsed.city, parsed.district);
  let custDisplay = '';
  if(parsed.fullAddress) custDisplay += parsed.fullAddress + ' ';
  if(parsed.contact) custDisplay += parsed.contact + ' ';
  if(parsed.phone) custDisplay += parsed.phone;
  if(custDisplay.trim()){
    document.getElementById('custInfo').value = custDisplay.trim();
  }
  // 填充商品
  if(parsed.items.length){
    cart = parsed.items.map(it => ({
      productId: it.productId,
      name: it.name,
      price: it.price,
      qty: it.qty,
      subtotal: it.subtotal
    }));
    renderCart();
  }
  // 填充备注
  if(parsed.remark){
    const remarkEl = document.getElementById('orderRemark');
    remarkEl.value = parsed.remark;
  }

  const itemCount = parsed.items.length + parsed.rawItems.length;
  const matchedCount = parsed.items.length;
  const unmatchedCount = parsed.rawItems.length;
  let toastMsg = '识别完成：'+itemCount+' 件商品';
  if(matchedCount && unmatchedCount) toastMsg += '（'+matchedCount+' 已匹配，'+unmatchedCount+' 待确认）';
  if(parsed.remark) toastMsg += '，'+parsed.remark.split(/[，,]/).length+' 条备注';
  if(parsed.contact) toastMsg += '，客户 '+parsed.contact;
  showToast(toastMsg,'success');
  if(parsed.contact || parsed.phone || parsed.address){
    setTimeout(()=>showToast('已识别客户信息','info'),500);
  }
}

// 解析客户信息文本 → 拆分姓名/电话/地区/地址
function parseCustInfo(text){
  if(!text) return;
  text = text.trim();
  // 复用统一的订单解析器，正确处理「地址.姓名电话」等粘连格式（避免姓名提取失败导致提交报“请填写收件人”）
  const parsed = parseOrderText(text);
  const name = parsed.contact || '';
  const phone = parsed.phone || '';
  const region = parsed.region || ([parsed.province, parsed.city, parsed.district].filter(Boolean).join(' '));
  const address = parsed.address || '';
  document.getElementById('custContact').value = name;
  document.getElementById('custPhone').value = phone;
  document.getElementById('custRegion').value = region;
  document.getElementById('custAddress').value = address;
  if(parsed.province || parsed.city || parsed.district) setAreaSelects(parsed.province, parsed.city, parsed.district);
  // 销售前台：把完整客户信息写回“客户信息”文本域，避免单独展示省市区/详细地址模块
  const custInfoEl = document.getElementById('custInfo');
  if(custInfoEl && (name || phone || region || address)){
    const fullInfo = [name, phone, region, address].filter(Boolean).join(' ');
    if(fullInfo) custInfoEl.value = fullInfo;
  }
  // 显示解析结果
  const el = document.getElementById('custInfoParsed');
  if(el && (name || phone || region || address)){
    el.style.display = 'block';
    let info = [];
    if(name) info.push('收件人: ' + name);
    if(phone) info.push('电话: ' + phone);
    if(region) info.push('地区: ' + region);
    if(address) info.push('地址: ' + address);
    el.innerHTML = '<span style="color:var(--success)">已识别:</span> ' + info.join(' | ');
  }else if(el){
    el.style.display = 'none';
  }
}

// 生成订单号
function generateOrderNumber(){
  const d = new Date();
  const ymd = '' + d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0');
  // 唯一后缀：销售标识 + 毫秒时间戳 + 2位随机，避免多端/多销售同天提交撞号互相覆盖
  const salesTag = (currentUser && currentUser.id) ? currentUser.id.replace(/[^a-zA-Z0-9]/g,'').slice(-4) : 'sys';
  const ms = String(Date.now() % 100000).padStart(5,'0');
  const rand = String(Math.floor(Math.random()*90)+10);
  return 'ORD' + ymd + '-' + salesTag + ms + rand;
}

// 商品搜索（多选模式，不显示售价）
let _searchSelected = new Set(); // 多选商品ID集合
function searchProducts(keyword){
  const results = document.getElementById('searchResults');
  if(!keyword.trim()){ _searchSelected.clear(); results.style.display='none'; return; }
  const products = DB.get('products').filter(p => p.status !== 'off');
  const kw = keyword.toLowerCase();
  const matched = products.filter(p => p.name.toLowerCase().includes(kw) ||
                                       (p.category && p.category.toLowerCase().includes(kw)));
  let html = `<div style="padding:8px 14px;border-bottom:1px solid var(--border)"><button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();showManualAddProduct()" style="width:100%">+ 手动添加新商品</button></div>`;
  if(matched.length === 0){
    html += `<div class="ps-empty" style="padding:10px 14px">未找到匹配商品</div>`;
  }else{
    html += matched.map(p => {
      const checked = _searchSelected.has(p.id) ? 'checked' : '';
      return `
      <div class="ps-item" style="cursor:pointer" onclick="toggleSearchSelect('${p.id}',event)">
        <input type="checkbox" ${checked} style="width:16px;height:16px;flex-shrink:0;cursor:pointer" onclick="event.stopPropagation();toggleSearchSelect('${p.id}',event)">
        <div>
          <div style="font-weight:500">${escapeHtml(p.name)}</div>
          <div style="font-size:12px;color:var(--text-muted)">${p.category||''}</div>
        </div>
      </div>`;
    }).join('');
  }
  results.innerHTML = html;
  results.style.display = 'block';
}

// 多选切换 — 勾选即添加到购物车
function toggleSearchSelect(productId, e){
  e && e.stopPropagation();
  const products = DB.get('products');
  const product = products.find(p => p.id === productId);
  if(!product) return;
  if(_searchSelected.has(productId)){
    _searchSelected.delete(productId);
    const idx = cart.findIndex(c => c.productId === productId);
    if(idx >= 0){ cart.splice(idx, 1); }
  }else{
    _searchSelected.add(productId);
    const existing = cart.find(c => c.productId === productId);
    if(existing){
      existing.qty += 1;
      existing.subtotal = existing.price * existing.qty;
    }else{
      cart.push({ productId: product.id, name: product.name, price: product.price, cost: product.cost, qty: 1, subtotal: product.price, stock: '否' });
    }
  }
  renderCart();
  // 更新复选框状态
  const results = document.getElementById('searchResults');
  const cbs = results.querySelectorAll('input[type=checkbox]');
  const items = results.querySelectorAll('.ps-item');
  items.forEach((item, i) => {
    const match = item.getAttribute('onclick')?.match(/toggleSearchSelect\('([^']+)'/);
    if(match){
      cbs[i] && (cbs[i].checked = _searchSelected.has(match[1]));
    }
  });
}

function changeQty(index, delta){
  cart[index].qty = Math.max(1, cart[index].qty + delta);
  cart[index].subtotal = Math.round(cart[index].price) * cart[index].qty;
  renderCart();
}
function setQty(index, val){
  const qty = Math.max(1, parseInt(val) || 1);
  cart[index].qty = qty;
  cart[index].subtotal = Math.round(cart[index].price) * qty;
  renderCart();
}
// 销售编辑单价（仅影响该订单，不改商品库）
function setCartPrice(index, val){
  const price = Math.max(0, parseInt(val) || 0);
  cart[index].price = price;
  cart[index].subtotal = price * cart[index].qty;
  const subEl = document.getElementById('cartSub_'+index);
  if(subEl) subEl.textContent = money(cart[index].subtotal);
  // 更新合计
  const total = cart.reduce((s,c)=>s+c.subtotal, 0);
  document.getElementById('cartTotal').textContent = money(total);
  calcFinalPay();
}
function removeFromCart(index){
  cart.splice(index, 1);
  renderCart();
}

// 图片选择 → 裁剪
function handleImageSelect(input, source){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    openCropInterface(e.target.result, source);
  };

// 裁剪界面
let cropState = { img:null, canvas:null, ctx:null, box:{x:0,y:0,w:0,h:0}, dragging:false, start:{x:0,y:0} };

function openCropInterface(imgSrc, source){
  const img = new Image();
  img.onload = function(){
    cropState.img = img;
    const maxW = Math.min(window.innerWidth - 40, 700);
    const maxH = window.innerHeight * 0.6;
    let w = img.width, h = img.height;
    const scale = Math.min(maxW/w, maxH/h, 1);
    w = w * scale; h = h * scale;

    const html = `
      <div class="crop-overlay" id="cropOverlay">
        <div style="color:#fff;font-size:16px;margin-bottom:12px">拖拽选择裁剪区域</div>
        <div class="crop-canvas-wrap" id="cropCanvasWrap">
          <canvas id="cropCanvas" width="${w}" height="${h}"></canvas>
          <div class="crop-select-box" id="cropSelectBox" style="left:0;top:0;width:0;height:0;display:none"></div>
        </div>
        <div class="crop-actions">
          <button class="btn btn-secondary" onclick="cancelCrop()">取消</button>
          <button class="btn btn-primary" onclick="confirmCrop('${source}')">确认裁剪并识别</button>
          <button class="btn btn-secondary" onclick="confirmCropNoCrop('${source}')">使用原图</button>
        </div>
      </div>
    `;
    document.getElementById('cropContainer').innerHTML = html;

    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    cropState.canvas = canvas;
    cropState.ctx = ctx;
    cropState.box = {x:0,y:0,w:0,h:0};
    ctx.drawImage(img, 0, 0, w, h);

    // 鼠标/触摸事件
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    };

    const onStart = (e) => {
      e.preventDefault();
      cropState.dragging = true;
      const p = getPos(e);
      cropState.start = p;
      cropState.box = {x:p.x, y:p.y, w:0, h:0};
    };
    const onMove = (e) => {
      if(!cropState.dragging) return;
      e.preventDefault();
      const p = getPos(e);
      cropState.box = {
        x: Math.min(cropState.start.x, p.x),
        y: Math.min(cropState.start.y, p.y),
        w: Math.abs(p.x - cropState.start.x),
        h: Math.abs(p.y - cropState.start.y)
      };
      // 重绘
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      // 遮罩
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      // 清除选中区域
      ctx.clearRect(cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
      ctx.drawImage(img, cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h,
                    cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
      // 边框
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
    };
    const onEnd = (e) => {
      cropState.dragging = false;
    };

    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);
    canvas.addEventListener('touchstart', onStart, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onEnd);
  };
  img.src = imgSrc;
}

function cancelCrop(){
  document.getElementById('cropContainer').innerHTML = '';
}

function confirmCrop(source){
  const canvas = cropState.canvas;
  const img = cropState.img;
  const box = cropState.box;
  if(!box.w || !box.h || box.w < 10 || box.h < 10){
    showToast('请先拖拽选择裁剪区域','error');
    return;
  }
  // 计算原图坐标
  const scaleX = img.width / canvas.width;
  const scaleY = img.height / canvas.height;
  const sx = box.x * scaleX;
  const sy = box.y * scaleY;
  const sw = box.w * scaleX;
  const sh = box.h * scaleY;

  const outCanvas = document.createElement('canvas');
  outCanvas.width = sw;
  outCanvas.height = sh;
  const outCtx = outCanvas.getContext('2d');
  outCtx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const base64 = outCanvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('cropContainer').innerHTML = '';
  finishImageRecognize(base64, source);
}

function confirmCropNoCrop(source){
  const img = cropState.img;
  const outCanvas = document.createElement('canvas');
  outCanvas.width = img.width;
  outCanvas.height = img.height;
  const outCtx = outCanvas.getContext('2d');
  outCtx.drawImage(img, 0, 0);
  const base64 = outCanvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('cropContainer').innerHTML = '';
  finishImageRecognize(base64, source);
}

// 模拟OCR识别
function finishImageRecognize(base64, source){
  // 存储图片
  newOrderImages.push(base64);
  // 模拟识别：随机预填一些信息
  const recognizedCount = Math.floor(Math.random() * 3) + 2;
  showToast('已识别到 '+recognizedCount+' 条信息（模拟OCR），图片已保存','success');

// 提交订单
function submitOrder(){
  const orderId = document.getElementById('orderNumber').value;
  const contact = document.getElementById('custContact').value.trim();
  const phone = normalizePhone(document.getElementById('custPhone').value);
  const region = document.getElementById('custRegion').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  let province = document.getElementById('custProvince') ? document.getElementById('custProvince').value.trim() : '';
  let city = document.getElementById('custCity') ? document.getElementById('custCity').value.trim() : '';
  let district = document.getElementById('custDistrict') ? document.getElementById('custDistrict').value.trim() : '';
  // 兜底：若三级联动未选，但地区/详细地址有值，则用行政区划数据自动补全省市区
  if((!province && !city && !district) && (region || address)){
    const ad = parseAddressText((region + ' ' + address).trim());
    province = ad.province; city = ad.city; district = ad.district;
  }
  const remark = document.getElementById('orderRemark').value.trim();

  if(!contact){ showToast('请填写收件人','error'); return; }
  if(!phone){ showToast('请填写手机号码','error'); return; }
  if(cart.length === 0){ showToast('请至少添加一个商品','error'); return; }

  const isAdmin = currentUser.role === 'admin';
  let salesId, salesName;
  if(isAdmin){
    salesId = document.getElementById('orderSales').value;
    if(!salesId){ showToast('请指派销售','error'); return; }
    salesName = DB.get('users').find(u=>u.id===salesId).name;
  }else{
    salesId = currentUser.id;
    salesName = currentUser.name;
  }

  // 自动创建或匹配客户
  const customers = DB.get('customers');
  let customer = customers.find(c => c.phone === phone);
  if(!customer){
    customer = {
      id: DB.uid('c_'),
      name: contact,
      contact: contact,
      phone: phone,
      email: '',
      region: region,
      address: address,
      province: province,
      city: city,
      district: district,
      remark: '',
      ownerId: salesId,
      createdAt: nowStr()
    };
    customers.push(customer);
    DB.set('customers', customers);
  }else{
    // 更新客户信息
    customer.name = contact;
    customer.contact = contact;
    if(region) customer.region = region;
    if(address) customer.address = address;
    if(province) customer.province = province;
    if(city) customer.city = city;
    if(district) customer.district = district;
    DB.set('customers', customers);
  }
  // 立即把客户同步到云端，确保新建/更新后的客户可靠进入「客户管理」板块（不依赖 800ms 防抖推送）
  if(window._sbpbClient){
    DB.syncTable('customers').catch(function(e){ console.warn('同步客户到云端失败:', (e&&e.message)||e); });
  }

  const total = cart.reduce((s,c)=>s+c.subtotal, 0);

  // B组：备货/上门日期校验（提交订单时生效）
  const _orderType = document.getElementById('orderTypeVal') ? document.getElementById('orderTypeVal').value : 'normal';
  if(_orderType === 'warehouse' || _orderType === 'door'){
    const _today = new Date();
    const _todayStr = `${_today.getFullYear()}-${String(_today.getMonth()+1).padStart(2,'0')}-${String(_today.getDate()).padStart(2,'0')}`;
    const _stockDate = document.getElementById('newOrderDate') ? document.getElementById('newOrderDate').value.trim() : '';
    const _stockLabel = _orderType === 'door' ? '备货日期' : '发货日期';
    if(!_stockDate){ showToast('请填写'+_stockLabel,'error'); return; }
    if(_stockDate < _todayStr){ showToast(_stockLabel+'不能早于今天','error'); return; }
    if(_orderType === 'door'){
      const _doorDate = document.getElementById('newCompletionDate') ? document.getElementById('newCompletionDate').value.trim() : '';
      if(!_doorDate){ showToast('请填写上门日期','error'); return; }
      if(_stockDate > _doorDate){ showToast('备货日期不能晚于订单上门日期','error'); return; }
    }
  }

  // 留仓/上门订单状态为"待下单"
  let status = 'pending';
  if(isAdmin){
    // 管理员也可直接创建普通订单，默认待下单
    status = 'pending';
  }

  // 校验核对订单金额：定金不能超过订单总额
  const payModeEl = document.querySelector('input[name="newOrderPayMode"]:checked');
  const payMode = payModeEl ? payModeEl.value : 'full';
  const depositEl = document.getElementById('newOrderDeposit');
  const deposit = depositEl ? (parseInt(depositEl.value) || 0) : 0;
  if(deposit > total){ showToast('定金不能大于订单总额','error'); return; }

  // 收款方式：微信/扫码必须选一个
  const payMethodEl = document.querySelector('input[name="newOrderPayMethod"]:checked');
  if(!payMethodEl){ showToast('请选择收款方式（微信或扫码）','error'); return; }
  const payMethod = payMethodEl.value;
  const collectedEl = document.getElementById('newOrderCollected');
  const collected = collectedEl ? (parseInt(collectedEl.value) || 0) : 0;
  // 定金订单：收款金额不能大于定金；全款订单：不能大于订单总额
  const maxCollect = payMode === 'deposit' ? deposit : total;
  if(collected > maxCollect){
    showToast(payMode === 'deposit' ? '收款金额不能大于定金' : '收款金额不能大于订单总额','error');
    return;
  }

  // ===== 防重复提交：按钮防抖（2.5s）+ 内容指纹去重（8s 内相同内容拦截） =====
  const _now = Date.now();
  if(window._submitLockUntil && _now < window._submitLockUntil){ showToast('请勿重复点击提交','error'); return; }
  window._submitLockUntil = _now + 2500;
  const _fp = [contact, phone, (cart||[]).map(c => (c.productId||'')+':'+(c.qty||0)+':'+(c.price||0)).join('|'), total, newOrderType].join('§');
  try{
    const _last = JSON.parse(localStorage.getItem('soms_last_submit')||'null');
    if(_last && _last.fp === _fp && (_now - _last.t) < 8000){ showToast('该订单刚刚已提交，请勿重复提交','error'); return; }
  }catch(e){}
  localStorage.setItem('soms_last_submit', JSON.stringify({ fp: _fp, t: _now }));

  const newOrder = {
    id: orderId,
    customerId: customer.id,
    customerName: contact,
    contact, phone, region, address, province, city, district,
    salesId, salesName,
    items: JSON.parse(JSON.stringify(cart)),
    total,
    status,
    type: newOrderType,
    orderDate: (newOrderType==='warehouse'||newOrderType==='door') ? (document.getElementById('newOrderDate') ? document.getElementById('newOrderDate').value.trim() : '') : todayStr(),
    completionDate: (newOrderType==='warehouse'||newOrderType==='door') ? (document.getElementById('newCompletionDate') ? document.getElementById('newCompletionDate').value.trim() : '') : '',
    remark,
    images: newOrderImages,
    createdAt: nowStr()
  };

  // 核对订单金额 + 收款方式
  newOrder.fullPayment = payMode === 'full' ? total : 0;
  newOrder.deposit = deposit;
  newOrder.finalPayment = payMode === 'full' ? 0 : Math.max(0, total - deposit);
  newOrder.paymentMethod = payMethod;
  newOrder.collectedAmount = collected;

  const orders = DB.get('orders');
  orders.push(newOrder);
  DB.set('orders', orders);

  // 自动把订单中“库内不存在”的商品写入商品库，成本默认等于售价并标记 auto_added，管理员后续校准真实采购成本
  (function ensureProductsInLibrary(){
    const lib = DB.get('products');
    let changed = false;
    (cart||[]).forEach(c => {
      if(!c || !c.name) return;
      const exists = (c.productId && lib.some(p => p.id === c.productId)) || lib.some(p => p.name === c.name);
      if(!exists){
        const np = { id: DB.uid('p_'), name: c.name, category: '自定义', price: c.price||0, cost: c.price||0, status: 'on', createdBy: currentUser.id, auto_added: true, createdAt: nowStr() };
        lib.push(np);
        changed = true;
        c.productId = np.id; // 重映射到新商品，便于后续利润/详情计算
        pushSingleProductToCloud(np);
      }
    });
    if(changed) DB.set('products', lib);
  })();

  logAudit({action:'create_order', targetType:'order', targetId: orderId, targetLabel: contact, before: '', after: total, detail: '金额 '+money(total)+' / 类型 '+(newOrder.type==='warehouse'?'留仓':newOrder.type==='door'?'上门':'普通')});

  window._currentOrderId = orderId;
  window._orderFilter = '';
  schedulePushToCloud();
  navigate('order-success');
  clearOrderDraft();
  var _dbx = document.getElementById('draftBar'); if(_dbx) _dbx.remove();
}

    document.getElementById('mainContent').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠</div><div class="empty-text">订单不存在</div></div>';
    return;
  }
  const isAdmin = currentUser.role === 'admin';

  // 非管理员查看非本人订单：仅上门订单允许查看（财务字段隐藏），其余类型无权限
  if(!isAdmin && !isOwner && order.type !== 'door'){

  // 只要管理员未点进去（未加锁），销售即可编辑商品数量/客户信息等（含已有部分商品被下单的情况，见需求第2点）。
  const hasOrderedItem = order.items.some(it => it.ordered === true);

  const isFullyPaid = getOrderRemaining(order) === 0;
  const _lockedByOther = isOrderLockedByOther(order);
  // 被其它人（管理员）加锁下单时，强制只读，禁止编辑（Req7）
  const viewOnly = window._orderForceViewOnly === true || _lockedByOther;
  // 销售若已在编辑模式，而管理员此时加锁，强制退出编辑并提示，避免继续保存冲突内容

/* ============ 一键复制功能（读取实时最新数据） ============ */
function copyCustomerInfo(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  const text = formatOrderAddress(order);
  copyToClipboard(text, '客户信息');
}

// 复制完整订单信息（客户信息 + 商品清单 + 备注，三段空行排版）
function copyFullOrderInfo(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  // 第一段：客户信息
  const customerPart = formatOrderAddress(order);
  // 第二段：商品清单
  const productPart = order.items.map(it => it.name + ' ' + it.qty + '件').join('\n');
  // 组装：三段之间空一行，备注无内容时不展示
  let fullText = customerPart + '\n\n' + productPart;
  if(order.remark && order.remark.trim()){
    fullText += '\n\n' + '订单备注：' + order.remark.trim();
  }
  copyToClipboardWithMsg(fullText);
}

// 导出用日期格式化：2026/8/1 19:07:00（斜杠分隔，无前导零，含秒）
function fmtExportDateTime(dtStr){
  if(!dtStr) return '';
  var d = new Date(dtStr);
  if(isNaN(d.getTime())) return dtStr;
  return d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' +
    String(d.getMinutes()).padStart(2,'0') + ':' +
    String(d.getSeconds()).padStart(2,'0');
}

// 一键复制当前订单信息（多行格式：客户行 + 每个商品一行 + 备注行）
function copySingleOrderInfo(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  const lines = [];
  // 第一行：客户 电话 地址
  let head = (order.customerName || '未知客户');
  if(order.phone) head += ' ' + escapeHtml(order.phone);
  const addr = formatOrderAddress(order);
  if(addr) head += addr;
  else if(order.region || order.address) head += (order.region || '') + (order.address || '');
  lines.push(head);
  // 每个商品一行：商品名 ×数量
  if(order.items && order.items.length){
    order.items.forEach(it => { lines.push((it.name || '未命名商品') + ' ×' + (it.qty || 1)); });
  }
  // 备注行（始终显示）
  lines.push('备注：' + (order.remark || ''));
  copyToClipboardWithMsg(lines.join('\n'));
}

function copyProductList(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  const text = order.items.map(it => it.name + ' ' + it.qty + '件').join('\n');

}

function copyProductWithTracking(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  const text = order.items.map(it => {
    const tracking = it.trackingNo && it.trackingNo.trim() ? '#' + it.trackingNo.trim() : '无物流单号';
    return it.name + ' ' + tracking;
  }).join('\n');

function copyToClipboard(text, label){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      showToast(label + '已复制到剪贴板','success');
    }).catch(() => {
      fallbackCopy(text, label);
    });
  } else {
    fallbackCopy(text, label);
  }
}

// 订单号 + 复制按钮（销售与admin通用，所有订单列表复用）
function orderIdCell(id){

}


// 综合复制：弹窗提示「订单信息已复制，可直接粘贴」，电脑手机全端兼容
function copyToClipboardWithMsg(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      showToast('订单信息已复制，可直接粘贴','success');
    }).catch(() => {
      fallbackCopyWithMsg(text);
    });
  } else {
    fallbackCopyWithMsg(text);
  }
}

function fallbackCopyWithMsg(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  // 关键：使用 white-space: pre-wrap 保证换行符在移动端正确传递
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px;white-space:pre-wrap';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  // 移动端兼容：设置 selectionRange
  ta.setSelectionRange(0, ta.value.length);
  try{
    document.execCommand('copy');
    showToast('订单信息已复制，可直接粘贴','success');
  }catch(e){
    showToast('复制失败，请手动复制','error');
  }
  document.body.removeChild(ta);
}

function fallbackCopy(text, label){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast(label + '已复制到剪贴板','success');
  }catch(e){
    showToast('复制失败，请手动复制','error');
  }
  document.body.removeChild(ta);
}

// 保存订单编辑页的物流单号（核心：localStorage 缓存 + 云端同步模拟）
function saveOrderEditTracking(orderId){

  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0){ showToast('订单不存在','error'); return; }
  const order = orders[idx];
  let changedCount = 0;
  let hasTracking = false;

  order.items.forEach((it, i) => {
    const input = document.getElementById('editTrackingNo_' + i);
    if(input){
      const newVal = input.value.trim();
      if(newVal !== (it.trackingNo || '')){
        it.trackingNo = newVal;
        it.expressCompany = newVal ? detectExpressCompany(newVal) : '';
        changedCount++;
      }
      if(newVal) hasTracking = true;
    }
  });

  if(changedCount === 0){
    showToast('单号无变更','info');
    return;
  }

  // 自动状态流转
  const allTracking = order.items.every(it => it.trackingNo);
  if(hasTracking && (order.status === 'confirmed' || order.status === 'pending') && order.type !== 'door'){
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
    } else {
      order.status = 'shipped';
      order.shippedAt = nowStr();
    }
  } else if(order.status === 'shipped' && allTracking && order.type !== 'door'){
    order.status = 'feedback';
    order.feedbackAt = nowStr();
  }

  // 记录同步时间戳
  const syncTime = nowStr();
  order.syncedAt = syncTime;
  order.updatedAt = syncTime;

  // 1. 保存到 localStorage（主数据源）
  DB.set('orders', orders);

  // 2. 本地缓存物流单号（独立缓存，支持离线查看）
  const trackingCache = JSON.parse(localStorage.getItem('soms_tracking_cache') || '{}');
  trackingCache[orderId] = {
    items: order.items.map(it => ({
      name: it.name,
      trackingNo: it.trackingNo || '',
      expressCompany: it.expressCompany || ''
    })),
    syncedAt: syncTime,
    syncedFrom: navigator.userAgent.includes('Mobile') ? 'mobile' : 'desktop'
  };
  localStorage.setItem('soms_tracking_cache', JSON.stringify(trackingCache));

  // 3. 模拟云端同步（实际项目此处调用后端API）
  const syncResultEl = document.getElementById('syncResult_' + orderId);
  if(syncResultEl){
    syncResultEl.innerHTML = `
      <div style="padding:10px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;font-size:13px">
        <div style="color:#15803d;font-weight:600">✅ 同步成功</div>
        <div style="margin-top:4px;color:#666">
          • 本地缓存已更新（localStorage）<br>
          • 云端数据库已同步（${syncTime}）<br>
          • 多端访问将自动获取最新单号<br>
          • 修改商品数：${changedCount} 件，订单状态：${statusTag(order.status)}
        </div>
      </div>
    `;
  }

  // 更新同步状态显示
  const syncStatusEl = document.getElementById('syncStatus_' + orderId);
  if(syncStatusEl){
    syncStatusEl.innerHTML = '✅ 已同步：' + syncTime + '（' + (navigator.userAgent.includes('Mobile') ? '手机端' : '电脑端') + '）';
    syncStatusEl.style.color = 'var(--success)';
  }

  showToast('物流单号已保存，已同步至云端（' + changedCount + ' 件变更）','success');
}

// 上门订单：当全部商品的备货状态均为“已备货”(是) 且当前为待下单(pending)时，自动流转为已下单(confirmed)
function autoDoorConfirmIfAllStocked(order){
  if(order.type !== 'door' || order.status !== 'pending') return false;
  if(!order.items || !order.items.length) return false;
  const allStocked = order.items.every(it => it.stock === '是');
  if(allStocked){
    order.status = 'confirmed';
    order.confirmedAt = nowStr();
    order.updatedAt = nowStr();
    return true;
  }
  return false;
}

// 重新计算编辑项小计，并实时同步订单总额 / 全款金额 / 收款信息显示
function recalcEditItem(i){
  const price = parseInt(document.getElementById('editItemPrice_'+i).value) || 0;
  const qty = Math.max(1, parseInt(document.getElementById('editItemQty_'+i).value) || 1);
  const subtotal = price * qty;
  // 同步到数据：更新该项并重新计算订单总额（遍历所有行输入框，不依赖不存在的小计单元格）
  const orderId = window._currentOrderId;
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx >= 0){
    const it = orders[idx].items[i];
    if(it){ it.price = price; it.qty = qty; it.subtotal = subtotal; }
    // 重新计算订单总额：保证「合计」随任意商品售价/数量编辑实时变动
    let total = 0;
    orders[idx].items.forEach((x, k) => {
      const p = parseInt((document.getElementById('editItemPrice_'+k)||{}).value) || 0;
      const q = Math.max(1, parseInt((document.getElementById('editItemQty_'+k)||{}).value) || 1);
      x.price = p; x.qty = q; x.subtotal = p * q;
      total += p * q;
    });
    orders[idx].total = total;
    // 全款订单：同步「全款金额」(fullPayment) = 最新订单总额
    if(orders[idx].fullPayment){ orders[idx].fullPayment = total; }
    orders[idx].updatedAt = nowStr();
    DB.set('orders', orders);
    schedulePushToCloud();
    // 实时刷新「合计」单元格
    const totalCell = document.getElementById('editTotalCell');
    if(totalCell) totalCell.textContent = money(total);
    // 实时刷新收款信息里的「全款金额」（readonly 输入框）
    const fp = document.getElementById('doorFullPay');
    if(fp) fp.value = (orders[idx].fullPayment || total || '');
    // 同步定金上限 / 尾款 / 收款金额 / 微信总额，保持收款信息一致
    const depEl = document.getElementById('doorDeposit');
    if(depEl && depEl.value){ validateDetailDeposit(); }
    calcDetailFinalPay();
    fillDoorCollectedByMode();
  }
}

function toggleEditSelect(pid, e){
  e && e.stopPropagation();
  const products = DB.get('products');
  const product = products.find(p => p.id === pid);
  if(!product) return;
  const orderId = window._currentOrderId;
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  if(_editSearchSelected.has(pid)){
    // 取消勾选 → 从订单移除
    _editSearchSelected.delete(pid);
    const itemIdx = orders[idx].items.findIndex(it => it.productId === pid);
    if(itemIdx >= 0){ orders[idx].total -= (orders[idx].items[itemIdx].price * orders[idx].items[itemIdx].qty || 0); orders[idx].items.splice(itemIdx, 1); }
  }else{
    // 勾选 → 立即加入订单
    _editSearchSelected.add(pid);
    orders[idx].items.push({ productId: product.id, name: product.name, price: product.price, cost: product.cost, qty: 1, subtotal: product.price, stock: '否' });
    orders[idx].total += product.price;
  }
  // 全款订单：同步「全款金额」(fullPayment) = 最新订单总额
  if(orders[idx].fullPayment){ orders[idx].fullPayment = orders[idx].total; }
  orders[idx].updatedAt = nowStr(); // 关键：刷新时间戳，保证勾选新增/移除的商品项不会被云端旧副本合并覆盖
  DB.set('orders', orders);
  renderOrderDetail();
  window._orderEditMode = true;
  renderOrderDetail();
  // 更新复选框状态
  const results = document.getElementById('editSearchResults');
  const items = results.querySelectorAll('.ps-item');
  const cbs = results.querySelectorAll('input[type=checkbox]');
  items.forEach((item, i) => {
    const m = item.getAttribute('onclick')?.match(/toggleEditSelect\('([^']+)'/);
    if(m) cbs[i] && (cbs[i].checked = _editSearchSelected.has(m[1]));
  });
}

  _editSearchSelected.forEach(pid => {
    const product = products.find(p => p.id === pid);
    if(!product) return;
    orders[idx].items.push({
      productId: product.id, name: product.name, price: product.price, cost: product.cost,
      qty: 1, subtotal: product.price, stock: '否'
    });
    orders[idx].total += product.price;
  });
  orders[idx].updatedAt = nowStr(); // 关键：刷新时间戳，保证批量新增的商品项不会被云端旧副本合并覆盖
  DB.set('orders', orders);
  _editSearchSelected.clear();
  showToast('商品已添加','success');
  renderOrderDetail();
  window._orderEditMode = true;
  renderOrderDetail();
}

function removeEditItem(i){
  const orderId = window._currentOrderId;
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  if(orders[idx].items.length <= 1){ showToast('至少保留一个商品','error'); return; }
  orders[idx].items.splice(i, 1);
  orders[idx].total = orders[idx].items.reduce((s,it)=>s+it.subtotal,0);
  // 全款订单：同步「全款金额」(fullPayment) = 最新订单总额
  if(orders[idx].fullPayment){ orders[idx].fullPayment = orders[idx].total; }
  orders[idx].updatedAt = nowStr(); // 关键：刷新时间戳，保证删除商品项后不会被云端旧副本合并覆盖回来
  DB.set('orders', orders);
  renderOrderDetail();
  // 重新进入编辑模式
  window._orderEditMode = true;
  renderOrderDetail();
}

// 保存编辑订单
function saveEditOrder(orderId){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  if(orders[idx] && currentUser.role !== 'admin' && (orders[idx].status === 'completed')){
    showToast('该订单已完结，无法修改','error');
    return;
  }
  const order = orders[idx];
  const auditBeforeTotal = order.total;
  let total = 0;
  order.items.forEach((it,i) => {
    const name = document.getElementById('editItemName_'+i).value.trim();
    const price = parseInt(document.getElementById('editItemPrice_'+i).value) || 0;
    const qty = Math.max(1, parseInt(document.getElementById('editItemQty_'+i).value) || 1);
    it.name = name;
    it.price = price;
    it.qty = qty;
    it.subtotal = price * qty;
    total += it.subtotal;
    const stockEl = document.getElementById('editItemStock_'+i);
    if(stockEl) it.stock = stockEl.value;
    // 同时回读物流单号（管理员可在编辑态直接改运单号；分支2输入框现已带 id，避免保存时丢失）
    const tEl = document.getElementById('trackItem_'+i);
    if(tEl !== null) it.trackingNo = (tEl.value || '').trim();
    const whEl = document.getElementById('whTrackItem_'+i);
    if(whEl !== null) it.trackingNo = (whEl.value || '').trim();
    if(it.trackingNo) it.expressCompany = detectExpressCompany(it.trackingNo);
    // 回读损耗（编辑模式也需保留，避免保存后丢失）
    const wEl = document.getElementById('wasteItem_'+i);
    if(wEl !== null) it.waste = parseInt(wEl.value) || 0;
  });
  order.total = total;

  // 定金任何时候不能大于订单总额
  if(order.deposit > total){
    order.deposit = total;
    showToast('定金已自动调整为订单总额','warning');
  }
  order.finalPayment = Math.max(0, total - (order.deposit || 0));

  // 保存收款信息（与新建订单逻辑一致）
  const modeEl = document.querySelector('input[name="doorPayMode"]:checked');
  const methodEl = document.querySelector('input[name="doorPayMethod"]:checked');
  const dpEl = document.getElementById('doorDeposit');
  const collectedEl = document.getElementById('doorCollected');
  const payMode = modeEl ? modeEl.value : 'full';
  let payDeposit = (payMode === 'deposit' && dpEl) ? (parseInt(dpEl.value) || 0) : 0;
  if(payDeposit > total){ showToast('定金不能大于订单总额','error'); return; }
  if(!methodEl){ showToast('请选择收款方式（微信或扫码）','error'); return; }
  const payCollected = collectedEl ? (parseInt(collectedEl.value) || 0) : 0;
  const maxCollect = payDeposit > 0 ? payDeposit : total;
  if(payCollected > maxCollect){
    showToast(payDeposit > 0 ? '收款金额不能大于定金' : '收款金额不能大于订单总额','error');
    return;
  }
  order.fullPayment = payMode === 'full' ? total : 0;
  order.deposit = payDeposit;
  order.finalPayment = Math.max(0, total - payDeposit);
  order.paymentMethod = methodEl.value;
  order.collectedAmount = payCollected;
  order.updatedAt = nowStr();

  // 保存客户信息（从隐藏字段读取）
  const contactEl = document.getElementById('custContact');
  if(contactEl){ order.contact = contactEl.value.trim(); order.customerName = contactEl.value.trim(); }
  const phoneEl = document.getElementById('custPhone');
  if(phoneEl) order.phone = normalizePhone(phoneEl.value);
  const regionEl = document.getElementById('custRegion');
  if(regionEl) order.region = regionEl.value.trim();
  const addrEl = document.getElementById('custAddress');
  if(addrEl) order.address = addrEl.value.trim();
  // 保存备注
  const remarkEl = document.getElementById('editOrderRemark') || document.getElementById('editRemark');
  if(remarkEl) order.remark = remarkEl.value.trim();
  // 保存发货日期（留仓/上门订单）
  const orderDateEl = document.getElementById('editOrderDate');
  if(orderDateEl) order.orderDate = orderDateEl.value;
  // 保存履约日期/完成日期
  const _editFulfillmentDateEl = document.getElementById('editFulfillmentDate');
  if(_editFulfillmentDateEl) order.fulfillmentDate = _editFulfillmentDateEl.value;
  const _editCompletionDateEl = document.getElementById('editCompletionDate');
  if(_editCompletionDateEl) order.completionDate = _editCompletionDateEl.value;
  // 上门订单：备货日期不能晚于订单上门日期
  if(order.type === 'door' && order.orderDate && order.completionDate && order.orderDate > order.completionDate){
    showToast('备货日期不能晚于订单上门日期','error'); return;
  }
  orders[idx] = order;
  DB.set('orders', orders);
  logAudit({action:'edit_amount', targetType:'order', targetId: orderId, targetLabel: order.customerName||order.contact||'-', before: auditBeforeTotal, after: order.total, detail: '修改订单金额/损耗'});

  // 注意：保存编辑订单时同样不再把库中不存在的商品自动写入商品库，避免污染商品库。
  // 订单行始终保留自带名称/价格，未匹配商品库的商品不影响订单展示与流转。

  window._orderEditMode = false;
  showToast('订单已保存','success');
  schedulePushToCloud();
  navigate('order-saved-success');
}

// 新建订单：根据支付方式自动计算全款/尾款
function calcFinalPay(){
  const total = cart.reduce((s,c)=>s+(c.subtotal||0),0);
  const modeEl = document.querySelector('input[name="newOrderPayMode"]:checked');
  const mode = modeEl ? modeEl.value : 'full';

  const fullRow = document.getElementById('fullPayRow');
  const depositRow = document.getElementById('depositPayRow');
  if(fullRow) fullRow.style.display = mode === 'full' ? '' : 'none';
  if(depositRow) depositRow.style.display = mode === 'deposit' ? '' : 'none';

  const fullPayEl = document.getElementById('newOrderFullPay');
  const depositEl = document.getElementById('newOrderDeposit');
  const finalPayEl = document.getElementById('newOrderFinalPay');

  if(mode === 'full'){
    if(fullPayEl) fullPayEl.value = total || '';
    if(depositEl) depositEl.value = '';
    if(finalPayEl) finalPayEl.value = '';
  }else{
    if(fullPayEl) fullPayEl.value = '';
    const deposit = depositEl ? (parseInt(depositEl.value) || 0) : 0;
    if(finalPayEl) finalPayEl.value = total > 0 ? Math.max(0, total - deposit) : '';
  }
  validatePaymentInput(document.getElementById('newOrderCollected'));
}

// 收款方式输入校验：定金订单不能大于定金，全款订单不能大于订单总额
function validatePaymentInput(el){
  if(!el) return;
  const total = cart.reduce((s,c)=>s+(c.subtotal||0),0);
  const modeEl = document.querySelector('input[name="newOrderPayMode"]:checked');
  const mode = modeEl ? modeEl.value : 'full';
  const depositEl = document.getElementById('newOrderDeposit');
  const deposit = depositEl ? (parseInt(depositEl.value) || 0) : 0;
  const max = mode === 'deposit' ? deposit : total;
  const val = parseInt(el.value) || 0;
  const hint = document.getElementById('paymentHint');
  if(val > max){
    el.value = max || '';
    const label = mode === 'deposit' ? '定金' : '订单总额';
    if(hint) hint.textContent = '收款金额不能大于' + label + ' ' + money(max) + '';
  }else{
    if(hint) hint.textContent = '';
  }
  // 微信收款总额实时刷新
  updateWechatTotalDisplay();
}

// 选择收款方式（微信/扫码）后，按当前付款模式自动把对应金额填入“收款金额”

// 新建订单：定金任何时候不能大于订单总额，超出自动 clamp

/* ============ 微信收款总额（按账号：初始值 + 该账号微信收款订单累计） ============ */
function getSettings(){
  return DB.get('settings', {}) || {};
}
function setSettings(s){
  DB.set('settings', s);
}
// 新建订单归属的账号（销售自己建的=自己；管理员代建=所选指派销售）
function getNewOrderOwnerId(){
  if(currentUser.role === 'admin'){
    const sel = document.getElementById('orderSales');
    return sel ? (sel.value || currentUser.id) : currentUser.id;
  }
  return currentUser.id;
}
// 某账号的微信收款总额 = 初始值 + 订单微信收款(collectedAmount) + 收款记录中微信支付的金额
// （统一口径：任何通过「记录收款」录入的微信支付，都累计进微信总收款）
function getWechatCollectedSum(salesId){
  const orders = DB.get('orders') || [];
  const orderSum = orders
    .filter(o => o.paymentMethod === 'wechat' && o.salesId === salesId)
    .reduce((s, o) => s + (parseInt(o.collectedAmount) || 0), 0);
  const pays = DB.get('payments') || [];
  const paySum = pays
    .filter(p => p.method === '微信支付' && p.salesId === salesId)
    .reduce((s, p) => s + (parseInt(p.amount) || 0), 0);
  return orderSum + paySum;
}
// 某账号微信收款总额（含初始值）：初始值 + 订单微信收款 + 收款记录微信支付
// 作为微信总收款的唯一口径，弹窗提示与订单页显示保持一致
function getWechatTotal(salesId){
  const user = (DB.get('users') || []).find(u => u.id === salesId) || {};
  return (parseInt(user.wechatAmount) || 0) + getWechatCollectedSum(salesId);
}
// 某个订单已经产生的微信支付总额：订单本身的微信收款 + 该订单 payments 记录里的微信支付
// 编辑订单时用于从微信总额中扣除本单旧收款，避免重复计算
function getOrderWechatTotal(order){
  if(!order) return 0;
  let sum = 0;
  if(order.paymentMethod === 'wechat'){
    sum += parseInt(order.collectedAmount) || 0;
  }
  const payments = (DB.get('payments') || []).filter(p => p.orderId === order.id && p.method === '微信支付');
  sum += payments.reduce((s, p) => s + (parseInt(p.amount) || 0), 0);
  return sum;
}
// 新建订单时，微信收款总额 = 微信总收款(含初始值) + 当前单收款（若选微信，尚未保存故额外加）
function getWechatProjectedTotal(){
  const ownerId = getNewOrderOwnerId();
  let sum = getWechatTotal(ownerId);
  const methodEl = document.querySelector('input[name="newOrderPayMethod"]:checked');
  if(methodEl && methodEl.value === 'wechat'){
    const collected = parseInt(document.getElementById('newOrderCollected').value) || 0;
    sum += collected;
  }
  return sum;
}
function updateWechatTotalDisplay(){
  const wrap = document.getElementById('wechatTotalDisplay');
  if(!wrap) return;
  const methodEl = document.querySelector('input[name="newOrderPayMethod"]:checked');
  if(methodEl && methodEl.value === 'wechat'){
    wrap.style.display = 'block';
    const v = document.getElementById('wechatTotalValue');
    if(v){
      const ownerId = getNewOrderOwnerId();
      const beforeTotal = getWechatTotal(ownerId);
      const thisAmount = parseInt(document.getElementById('newOrderCollected').value) || 0;
      const afterTotal = beforeTotal + thisAmount;
      v.innerHTML = '此次微信收款 <b>' + money(thisAmount) + '</b>，之前微信总额是 <b>' + money(beforeTotal) + '</b>，那么现在微信总额是 <b>' + money(afterTotal) + '</b>';
    }
  }else{
    wrap.style.display = 'none';
  }
}

// 编辑详情页：微信收款总额（微信总收款含初始值，若选微信则按实时金额反映本单）
function getWechatProjectedTotalForOrder(){
  const order = DB.get('orders').find(o=>o.id===window._currentOrderId);
  const salesId = order ? (order.salesId||currentUser.id) : currentUser.id;
  let sum = getWechatTotal(salesId);
  const methodEl = document.querySelector('input[name="doorPayMethod"]:checked');
  const collectedEl = document.getElementById('doorCollected');
  if(methodEl && methodEl.value === 'wechat' && collectedEl){
    const live = parseInt(collectedEl.value) || 0;
    const orderWechat = getOrderWechatTotal(order);
    sum = sum - orderWechat + live;
  }
  return sum;
}
function updateDoorWechatTotal(){
  const wrap = document.getElementById('wechatTotalDisplayEdit');
  const v = document.getElementById('wechatTotalValueEdit');
  if(!wrap || !v) return;
  const order = DB.get('orders').find(o=>o.id===window._currentOrderId);
  // 仅在「待下单」状态的编辑详情页展示微信总额提示
  if(!order || order.status !== 'pending'){
    wrap.style.display = 'none';
    return;
  }
  const methodEl = document.querySelector('input[name="doorPayMethod"]:checked');
  if(methodEl && methodEl.value === 'wechat'){
    wrap.style.display = 'block';
    const salesId = order ? (order.salesId||currentUser.id) : currentUser.id;
    const orderWechat = getOrderWechatTotal(order);
    const beforeTotal = getWechatTotal(salesId) - orderWechat;
    const thisAmount = parseInt(document.getElementById('doorCollected').value) || 0;
    const afterTotal = getWechatProjectedTotalForOrder();
    v.innerHTML = '此次微信收款 <b>' + money(thisAmount) + '</b>，之前微信总额是 <b>' + money(beforeTotal) + '</b>，那么现在微信总额是 <b>' + money(afterTotal) + '</b>';
  }else{
    wrap.style.display = 'none';
  }
}

// 详情页：自动计算尾款（订单总额 - 定金）
function calcDetailFinalPay(){
  const order = DB.get('orders').find(o=>o.id===window._currentOrderId);
  const total = order ? (order.total||0) : 0;
  const deposit = parseInt(document.getElementById('doorDeposit').value) || 0;
  const finalPay = Math.max(0, total - deposit);
  document.getElementById('doorFinalPayment').value = finalPay || '';
}

// 更新订单状态
async function updateOrderStatus(orderId, status){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx >= 0){
    const auditOldStatus = orders[idx].status;
    orders[idx].status = status;
    if(status === 'confirmed') orders[idx].confirmedAt = nowStr();
    if(status === 'completed'){
      if(!orders[idx].completionDate){
        orders[idx].completionDate = todayStr();
      }
      orders[idx].completedAt = nowStr();
    }
    if(status === 'shipped') orders[idx].shippedAt = nowStr();
    orders[idx].updatedAt = nowStr();
    DB.set('orders', orders);
    logAudit({action:'edit_status', targetType:'order', targetId: orderId, targetLabel: orders[idx].customerName||'-', before: auditOldStatus, after: status});
    await syncOrdersNow().catch(function(){});
    showToast('订单状态已更新','success');
    window._orderEditMode = false;
    renderOrderDetail();
  }
}

// 快递公司识别
function detectExpressCompany(trackingNo) {
  if (!trackingNo) return '';
  const n = trackingNo.trim();
  if (/^SF/.test(n)) return '顺丰速运';
  if (/^JD/.test(n)) return '京东物流';
  if (/^YT/.test(n)) return '圆通速递';
  if (/^ZTO/.test(n) || /^7/.test(n)) return '中通快递';
  if (/^YD/.test(n)) return '韵达快递';
  if (/^STO/.test(n)) return '申通快递';
  if (/^EMS/.test(n)) return 'EMS';
  if (/^DB/.test(n)) return '德邦快递';
  if (/^YZPY/.test(n) || /^8/.test(n)) return '邮政包裹';
  return '其他快递';
}

// 利润计算
function calcOrderProfit(order) {
  if (!order || !order.items) return 0;
  const products = DB.get('products');
  const grossProfit = order.items.reduce((total, it) => {
    const prod = products.find(p => p.id === it.productId);
    const cost = (it.cost != null) ? it.cost : (prod ? prod.cost : 0);
    const itemProfit = it.price * it.qty - cost * it.qty - (it.waste || 0);
    return total + itemProfit;
  }, 0);
  // 扣减售后损耗金额（财务联动）
  return grossProfit - (order.afterSaleLoss || 0);
}

// 利润归属日期
function calcProfitDate(order) {
  if (!order) return null;
  if (order.type === 'door') {
    // 上门订单：利润算在已完成那天
    return (order.completedAt || '').slice(0, 10) || null;
  }
  if (order.type === 'warehouse') {
    // 留仓订单：利润算在变为已下单那天
    return (order.confirmedAt || '').slice(0, 10) || (order.orderDate || null);
  }
  // 普通订单：利润算在变为已下单那天
  return (order.confirmedAt || '').slice(0, 10) || null;
}
