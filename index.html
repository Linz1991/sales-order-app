// 管理员对订单逐商品标记"已下单"：点击后该商品 ordered=true；全部商品已下单则订单状态转为"已下单"(confirmed)
// 支持所有订单类型（普通/留仓/上门），始终停留在订单详情页不跳转
async function markItemOrdered(orderId, idx){
  // 防连击：DOM 重绘很快，快速点击/双击可能让第二击落到刚出现的"已下单"按钮上触发撤销
  const cdKey = orderId + ':' + idx;
  if(!window._itemOrderCooldown) window._itemOrderCooldown = {};
  const last = window._itemOrderCooldown[cdKey];
  if(last && Date.now() - last < 600){ return; }
  window._itemOrderCooldown[cdKey] = Date.now();

  // 2026-0808：管理员进行下单操作时对订单加锁，禁止销售（订单提交人）编辑（Req7）
  // await 确保锁先写入本地再上推云端，避免推送时锁字段丢失
  await acquireOrderLock(orderId).catch(function(){});

  const orders = DB.get('orders');
  const oi = orders.findIndex(o => o.id === orderId);
  if(oi < 0) return;
  const o = orders[oi];
  if(!o.items || !o.items[idx]) return;
  if(o.items[idx].ordered === true) return;
  o.items[idx].ordered = true;
  o.items[idx].orderedAt = new Date().toISOString();
  const allOrdered = o.items.length > 0 && o.items.every(it => it.ordered === true);
  const wasPending = o.status === 'pending';
  // 关键修复：每次点击立即落库（不只改内存），并刷新为全精度 updatedAt（含毫秒），
  // 避免防抖推送/15秒定时拉取期间用云端旧值（同秒、毫秒更旧）覆盖本地刚点的「已下单」。
  o.updatedAt = nowStr();
  DB.set('orders', orders);
  // 立即同步订单到云端，防止 debounce 期间刷新/切页/自动同步把改动冲掉
  syncOrdersNow().catch(function(){});
  renderOrderDetail();
  if(allOrdered && wasPending){
    // 最后一个商品下单：弹确认框，确认后状态改为"已下单"
    showConfirm('全部商品已下单，确认将该订单状态改为「已下单」？', async function(){
      const orders2 = DB.get('orders');
      const o2 = orders2.find(x => x.id === orderId);
      if(!o2) return;
      o2.status = 'confirmed';
      o2.updatedAt = nowStr();
      DB.set('orders', orders2);
      await syncOrdersNow().catch(function(){});
      showToast('✅ 订单状态已改为「已下单」','success');
      // 注意：确认下单后【不】立即释放编辑锁，保持订单锁定直到管理员离开详情页（navigate 会自动释放）。
      // 这样可防止销售手机端持有的陈旧“待下单”副本（时间戳可能因时钟偏差/晚同步而更新）在下单后把 confirmed 又推回 pending（修复下单回退+按钮抖动）。
      renderOrderDetail(); // 停留在详情页
    }, async function(){
      // 用户取消：撤回最后一个商品的下单标记
      const orders2 = DB.get('orders');
      const o2 = orders2.find(x => x.id === orderId);
      if(o2 && o2.items[idx]){
        o2.items[idx].ordered = false;
        o2.items[idx].orderedAt = null;
        o2.updatedAt = nowStr();
        DB.set('orders', orders2);
        await syncOrdersNow().catch(function(){});
        releaseOrderLock(orderId).catch(function(){}); // 管理员取消下单，释放锁（Req7）
        renderOrderDetail(); // 停留在详情页
      }
    });
  } else {
    showToast('已标记「' + (o.items[idx].name || '商品') + '」为已下单', 'success');
  }
}

// 撤销某商品的“已下单”标记；若订单已因全部下单而转为“已下单”，撤销任一商品后回到“待下单”
// 支持所有订单类型（普通/留仓/上门），并在列表与详情视图下都能正确重渲染
async function markItemUnordered(orderId, idx){
  // 防连击：避免双击"已下单"时第一下撤销、第二下又立刻重新下单导致闪烁回退
  const cdKey = orderId + ':' + idx;
  if(!window._itemOrderCooldown) window._itemOrderCooldown = {};
  const last = window._itemOrderCooldown[cdKey];
  if(last && Date.now() - last < 600){ return; }
  window._itemOrderCooldown[cdKey] = Date.now();

  const orders = DB.get('orders');
  const oi = orders.findIndex(o => o.id === orderId);
  if(oi < 0) return;
  const o = orders[oi];
  if(!o.items || !o.items[idx]) return;
  if(o.items[idx].ordered !== true) return;
  o.items[idx].ordered = false;
  o.items[idx].orderedAt = null;
  o.updatedAt = nowStr();
  if(o.status === 'confirmed' && !o.items.every(it => it.ordered === true)){
    o.status = 'pending';
    showToast('已撤销「' + (o.items[idx].name || '商品') + '」的下单，订单回到「待下单」', 'info');
  } else {
    showToast('已撤销「' + (o.items[idx].name || '商品') + '」的下单标记', 'info');
  }
  DB.set('orders', orders);
  syncOrdersNow().catch(function(){});
  releaseOrderLock(orderId).catch(function(){}); // 管理员撤销下单，释放锁（Req7）
  if(currentRoute === 'order-detail') renderOrderDetail();
  else renderOrders();
}

// 管理员订单详情（查看）统一实时利润重算：读取未保存的损耗输入，含售后损耗
function recalcAdminProfit(orderId){
  const o = DB.get('orders').find(x => x.id === orderId);
  if(!o) return;
  const products = DB.get('products');
  let profit = 0;
  o.items.forEach((it, i) => {
    const wEl = document.getElementById('wasteItem_' + i);
    const waste = wEl ? (parseInt(wEl.value) || 0) : (it.waste || 0);
    const prod = products.find(p => p.id === it.productId);
    const cost = (it.cost != null) ? it.cost : (prod ? prod.cost : 0);
    const itemProfit = it.price * it.qty - cost * it.qty - waste;
    profit += itemProfit;
    // 同步更新逐行利润单元格（管理员端上门订单明细布局）
    const itemProfitCell = document.getElementById('adminItemProfit_' + i);
    if(itemProfitCell){
      itemProfitCell.textContent = money(itemProfit);
      itemProfitCell.style.color = itemProfit >= 0 ? 'var(--success)' : 'var(--danger)';
    }
  });
  profit -= (o.afterSaleLoss || 0);
  const cell = document.getElementById('adminProfitCell');
  if(cell){
    cell.textContent = money(profit);
    cell.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
  }
}

// 管理员订单详情（查看）统一保存：损耗 + 物流单号，返回对应列表
async function saveAdminOrder(orderId){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  const o = orders[idx];
  const auditBeforeStatus = o.status;
  // ===== 多设备编辑冲突预检：云端该订单有更新则提示覆盖/放弃 =====
  window._conflictUseServer = false;
  try{
    const _cf = await checkOrderCloudConflict(orderId, o.updatedAt);
    if(_cf && _cf.newer){
      const _cont = await showConflictModal(_cf.serverUpdatedAt);
      if(!_cont){ showToast('已取消保存，保留服务器最新数据','info'); return; }
      if(window._conflictUseServer){ showToast('已放弃本地修改，请刷新查看服务器最新数据','info'); return; }
    }
  }catch(e){}
  o.updatedAt = nowStr(); // 关键：刷新时间戳，使云端合并以"本地新版"为准，避免刚填的物流单号/状态被旧云端数据覆盖
  o.items.forEach((it, i) => {
    const wEl = document.getElementById('wasteItem_' + i);
    if(wEl !== null) it.waste = parseInt(wEl.value) || 0;
    const tEl = document.getElementById('trackItem_' + i);
    if(tEl !== null) it.trackingNo = (tEl.value || '').trim();
    const whEl = document.getElementById('whTrackItem_' + i);
    if(whEl !== null) it.trackingNo = (whEl.value || '').trim();
    if(it.trackingNo) it.expressCompany = detectExpressCompany(it.trackingNo);
  });
  // 普通订单（已下单/运输中）：全部商品均填写物流单号、或标记为「无需物流」则保存后自动转入「待反馈」
  // （含 shipped：修复"运输中订单在详情页点保存修改后卡死、无法推进到待反馈"的死结；留仓订单单独处理）
  const isNormalConfirmed = o.type !== 'warehouse' && o.type !== 'door' && ['confirmed','shipped'].includes(o.status);
  if(isNormalConfirmed){
    const allTracked = o.items.length > 0 && o.items.every(it => (it.trackingNo||'').trim() !== '');
    const noTracking = !!o.noTracking;
    if((allTracked || noTracking) && !['feedback','completed','feedback_done'].includes(o.status)){
      o.status = 'feedback';
    }
  }
  // 留仓订单：全部商品均填写物流单号、或标记为「无需物流」则保存后自动转入「待反馈」
  if(o.type === 'warehouse'){
    const allTracked = o.items.length > 0 && o.items.every(it => (it.trackingNo||'').trim() !== '');
    const noTracking = !!o.noTracking;
    if((allTracked || noTracking) && !['feedback','completed','feedback_done'].includes(o.status)){
      o.status = 'feedback';
    }
  }
  // 留仓/上门订单：一并回存发货日期(备货日期)/上门日期，避免「查看」详情修改后日期丢失
  const dateEl = document.getElementById('detailOrderDate');
  if(dateEl !== null) o.orderDate = dateEl.value;
  const compEl = document.getElementById('detailCompletionDate');
  if(compEl !== null) o.completionDate = compEl.value;
  // 上门订单：备货日期不能晚于订单上门日期
  if(o.type === 'door' && o.orderDate && o.completionDate && o.orderDate > o.completionDate){
    showToast('备货日期不能晚于订单上门日期','error'); return;
  }
  DB.set('orders', orders);
  logAudit({action:'edit_order', targetType:'order', targetId: orderId, targetLabel: o.customerName||'-', before: auditBeforeStatus, after: o.status, detail: '管理员修改(物流/损耗/状态)'});
  schedulePushToCloud();
  showToast(o.status === 'feedback' ? (o.noTracking ? '已标记为无需物流，订单已转入「待反馈」' : '全部商品物流单号已录入，订单已转入「待反馈」') : '修改完成', 'success');
  // 返回对应列表（confirmed/shipped 归入「已下单」Tab；feedback_done 归入「已完成」Tab；completed 归入「已完成」Tab）
  window._orderTab = (o.status === 'pending') ? 'pending' : (o.status === 'feedback' ? 'feedback' : (o.status === 'feedback_done' ? 'completed' : (o.status === 'completed' ? 'completed' : 'confirmed')));
  renderOrders();
}

function collectPendingOrdersInfo() {
  const allOrders = DB.get('orders');

  const search = (document.getElementById('orderSearch') && document.getElementById('orderSearch').value) || '';

  const dTo = (document.getElementById('dateTo') && document.getElementById('dateTo').value) || '';
  let orders = allOrders.filter(o => o.status === 'pending');
  // 应用与列表相同的搜索过滤
  if(search){
    const kw = search.toLowerCase();
    orders = orders.filter(o =>
      (o.id&&o.id.toLowerCase().includes(kw)) ||
      (o.customerName&&o.customerName.toLowerCase().includes(kw)) ||
      (o.phone&&o.phone.includes(kw))
    );
  }
  if(dFrom) orders = orders.filter(o => o.createdAt && o.createdAt >= dFrom);
  if(dTo) orders = orders.filter(o => o.createdAt && o.createdAt <= dTo+'T23:59:59');
  if (!orders.length) { showToast('暂无待下单订单可收集','info'); return; }
  // 单行格式拼接：客户 电话 地址 商品 ×数量 … 备注：
  const lines = orders.map(o => {
    let line = (o.customerName || '未知客户');
    if(o.phone) line += ' ' + escapeHtml(o.phone);
    const addr = formatOrderAddress(o);
    if(addr) line += addr;
    else if(o.region || o.address) line += (o.region || '') + (o.address || '');
    if(o.items && o.items.length){
      o.items.forEach(it => { line += ' ' + (it.name || '未命名商品') + ' ×' + (it.qty || 1); });
    }
    line += ' 备注：';
    if(o.remark) line += o.remark;
    return line;
  });
  let text = lines.join('\n');
  text = text.trim();
  // 显示预览框 + 复制按钮
  const box = document.getElementById('collectInfoBox');
  if(box){
    box.style.display = 'block';
    box.style.cssText = 'display:block;margin-top:12px;padding:14px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-all;user-select:text';
    box.innerHTML = '<div style="margin-bottom:8px;font-weight:600;color:#166534">📋 待下单订单信息（共'+orders.length+'单）— 已自动复制</div>' +
      '<div style="color:#374151">' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</div>' +
      '<div style="margin-top:10px;text-align:center"><button class="btn btn-success btn-sm" onclick="navigator.clipboard.writeText(document.querySelector(\'#collectInfoBox div:nth-child(2)\').textContent).then(()=>showToast(\'已复制\',\'success\'))">📋 再复制一次</button></div>';
  }
  // 复制到剪贴板
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      showToast('✅ 已收集 '+orders.length+' 单待下单信息，可直接粘贴','success');
    }).catch(()=>{ doFallbackCopy(text, orders.length); });
  } else {
    doFallbackCopy(text, orders.length);
  }
}
// fallback 复制
function doFallbackCopy(text, cnt){
  try{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.cssText='position:fixed;opacity:0;left:-9999px;top:0;white-space:pre-wrap';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('✅ 已收集 '+cnt+' 单待下单信息，可直接粘贴','success');
  }catch(e){ showToast('⚠️ 自动复制失败，请手动复制下方文字','error'); }
}

  item.expressCompany = value.trim() ? detectExpressCompany(value.trim()) : '';
  const order = orders[idx];
  order.updatedAt = nowStr(); // 关键：刷新时间戳，使云端合并以"本地新版"为准
  const allTracking = order.items.every(it => it.trackingNo);
  const isAdmin = currentUser.role === 'admin';
  // 管理员填完最后一个物流单号：待下单/运输中状态弹确认框确认后转入待反馈；已下单(confirmed)不弹框，走下方自动流转直接转待反馈
  if(isAdmin && allTracking && (order.status === 'pending' || order.status === 'shipped') && order.type !== 'door'){
    showConfirm('所有商品物流单号已录入，确认将该订单转入「待反馈」？', () => {
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      DB.set('orders', orders);
      logAudit({action:'edit_status', targetType:'order', targetId: orderId, targetLabel: order.customerName||'-', before: auditBeforeStatus, after: 'feedback', detail: '录入物流单号后转待反馈'});
      window._orderTab = 'feedback';
      showToast('订单已转入待反馈', 'success');
      navigate('orders');
    }, () => {
      order.status = 'shipped';
      order.shippedAt = order.shippedAt || nowStr();
      DB.set('orders', orders);
      logAudit({action:'edit_status', targetType:'order', targetId: orderId, targetLabel: order.customerName||'-', before: auditBeforeStatus, after: 'shipped'});
      renderOrderDetail();
    });
    return;
  }
  if((order.status === 'confirmed' || order.status === 'pending') && order.type !== 'door'){
    const hasTracking = order.items.some(it => it.trackingNo);
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
    }else if(hasTracking){
      order.status = 'shipped';
      order.shippedAt = nowStr();
      showToast('已保存物流单号', 'success');
    }
  }else if(order.status === 'shipped' && order.type !== 'door'){
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
    }
  }
  DB.set('orders', orders);
  logAudit({action:'edit_logistics', targetType:'order', targetId: orderId, targetLabel: order.customerName||'-', before: auditBeforeTracking, after: item.trackingNo, detail: '商品#'+(itemIndex+1)+' 物流单号'+(auditBeforeStatus!==order.status?('；状态 '+auditBeforeStatus+'→'+order.status):'')});
  renderOrderDetail();
}

// 列表页保存物流单号（已下单Tab）
function saveTrackingNoFromList(orderId, itemIndex, value) {
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if (idx < 0) return;
  const order = orders[idx];
  const auditBeforeTracking = order.items[itemIndex] ? order.items[itemIndex].trackingNo : '';
  const auditBeforeStatus = order.status;
  order.updatedAt = nowStr(); // 关键：刷新时间戳，使云端合并以"本地新版"为准
  order.items[itemIndex].trackingNo = value.trim();
  order.items[itemIndex].expressCompany = value.trim() ? detectExpressCompany(value.trim()) : '';
  const hasTracking = order.items.some(it => it.trackingNo);
  const allTracking = order.items.every(it => it.trackingNo);
  const isAdmin = currentUser.role === 'admin';
  // 管理员填完最后一个物流单号：待下单/运输中状态弹确认框确认后转入待反馈；已下单(confirmed)不弹框，走下方自动流转直接转待反馈
  if(isAdmin && allTracking && (order.status === 'pending' || order.status === 'shipped') && order.type !== 'door'){
    showConfirm('所有商品物流单号已录入，确认将该订单转入「待反馈」？', () => {
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      DB.set('orders', orders);
      window._orderTab = 'feedback';
      showToast('订单已转入待反馈', 'success');
      renderOrders();
    }, () => {
      order.status = 'shipped';
      order.shippedAt = order.shippedAt || nowStr();
      DB.set('orders', orders);
      renderOrders();
    });
    return;
  }
  // 自动流转：确认/待下单 → 有物流 → 运输中
  if(hasTracking && (order.status === 'confirmed' || order.status === 'pending') && order.type !== 'door'){
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
    }else{
      order.status = 'shipped';
      order.shippedAt = nowStr();
      showToast('订单 ' + orderId + ' 物流单号已保存', 'success');
    }
  }else if(order.status === 'shipped' && allTracking){
    order.status = 'feedback';
    order.feedbackAt = nowStr();
    showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
  }
  DB.set('orders', orders);
  logAudit({action:'edit_logistics', targetType:'order', targetId: orderId, targetLabel: order.customerName||'-', before: auditBeforeTracking, after: order.items[itemIndex].trackingNo, detail: '商品#'+(itemIndex+1)+' 物流单号'+(auditBeforeStatus!==order.status?('；状态 '+auditBeforeStatus+'→'+order.status):'')});
  renderOrders();
}

let _customerRegionChart = null;

function extractRegionKey(region){
  if(!region) return '未知';
  let province = '', city = '';
  const provMatch = region.match(/^([^省]+省)/);
  if(provMatch) province = provMatch[1];
  const remaining = province ? region.slice(province.length) : region;
  const cityMatch = remaining.match(/^([^市]+市)/);
  if(cityMatch) city = cityMatch[1];
  if(province && city) return province + city;
  if(city) return city;
  if(province) return province;
  return region.slice(0, 4);
}

function renderCustomerCharts(){
  if(typeof Chart === 'undefined') return;
  const customers = DB.get('customers');

  var regionCount = {};
  customers.forEach(function(c){
    var key = extractRegionKey(c.region);
    regionCount[key] = (regionCount[key] || 0) + 1;
  });

  var sortedRegions = Object.keys(regionCount).sort(function(a,b){ return regionCount[b] - regionCount[a]; }).slice(0, 10);
  var regionData = sortedRegions.map(function(k){ return regionCount[k]; });

  var regionCtx = document.getElementById('customerRegionChart');
  if(regionCtx){
    if(_customerRegionChart) _customerRegionChart.destroy();
    _customerRegionChart = new Chart(regionCtx, {
      type: 'bar',
      data: {
        labels: sortedRegions,
        datasets: [{
          label: '客户数',
          data: regionData,
          backgroundColor: '#4f46e5',
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } } },
          y: { ticks: { font: { size: 11 } } }
        }
      }
    });
  }
}

function saveCustomer(){
  const id = document.getElementById('customerId').value;
  const name = document.getElementById('customerName').value.trim();
  const contact = document.getElementById('customerContact').value.trim();
  const phone = document.getElementById('customerPhone').value.trim();
  const region = document.getElementById('customerRegion').value.trim();
  const address = document.getElementById('customerAddress').value.trim();
  const remark = document.getElementById('customerRemark').value.trim();
  const gender = document.getElementById('customerGender') ? document.getElementById('customerGender').value : 'unknown';
  const isAdmin = currentUser.role === 'admin';
  let ownerId;
  if(isAdmin){
    ownerId = document.getElementById('customerOwner').value;
    if(!ownerId){ showToast('请选择归属销售','error'); return; }
  }else{
    ownerId = currentUser.id;
  }
  if(!name){ showToast('请输入客户名称','error'); return; }

  // 新增时按手机号（归一化）查重，避免录入重复客户（与自动建客户同源问题）
  if(!id){
    const _normPhone = (p) => String(p || '').replace(/[\s-]/g, '');
    const _exist = (DB.get('customers') || []).find(c => _normPhone(c.phone) === _normPhone(phone) && _normPhone(phone) !== '');
    if(_exist){
      showToast('该手机号客户已存在（' + (_exist.name||'-') + '），请勿重复添加，可直接编辑', 'error');
      return;
    }
  }

  const customers = DB.get('customers');
  if(id){
    const idx = customers.findIndex(c => c.id === id);
    if(idx >= 0){
      customers[idx] = {...customers[idx], name, contact, phone, region, address, remark, ownerId, gender};
    }
  }else{
    customers.push({
      id: DB.uid('c_'), name, contact, phone, region, address, remark, ownerId, gender, createdAt: nowStr()
    });
  }
  DB.set('customers', customers);
  closeModal();
  showToast('客户保存成功','success');
  schedulePushToCloud();
  renderCustomers();
}

function exportCustomers(){
  let customers = DB.get('customers');
  const isAdmin = currentUser.role === 'admin';
  if(!isAdmin) customers = customers.filter(c => c.ownerId === currentUser.id);
  const users = DB.get('users');
  const ownerName = (id) => { const u = users.find(x=>x.id===id); return u ? u.name : ''; };
  const genderMap = { male:'男', female:'女', unknown:'未标注' };
  const header = ['客户名称','联系人','电话','地区','详细地址','性别','归属销售','状态','创建时间','备注'];
  const rows = customers.map(c => [
    c.name||'', c.contact||'', c.phone||'', c.region||'', c.address||'',
    genderMap[c.gender]||'未标注',
    isAdmin ? ownerName(c.ownerId) : '',
    (c.status||'active')==='active' ? '启用' : '停用',
    c.createdAt||'', c.remark||''
  ]);
  const escapeCell = (cell) => {
    const s = String(cell == null ? '' : cell).replace(/"/g,'""');
    return /[",\n\r]/.test(s) ? '"'+s+'"' : s;
  };
  const csv = [header, ...rows].map(r => r.map(escapeCell).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '客户信息_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('客户信息已导出','success');
}

// 导出订单详情（含售后损耗）：导出当前管理员订单筛选结果
function exportOrders(){
  const isAdmin = currentUser.role === 'admin';
  if(!isAdmin){ showToast('仅管理员可导出','error'); return; }
  const deletedIds = (DB.get('_deletedOrderIds') || []);
  const orders = DB.get('orders').filter(o => deletedIds.indexOf(o.id) < 0);
  const products = DB.get('products');
  // 订单管理页面固定排除上门订单（上门订单在「上门订单」页面导出）
  let activeTab = window._orderTab || 'pending';
  // 售后Tab展示的是售后单而非订单，导出订单时回退为全部状态
  if(activeTab === 'aftersale') activeTab = 'all';

  // 导出筛选规则：选择了时间范围时，导出该时间范围内的全部订单（忽略类型/状态Tab）；否则复刻当前列表筛选
  const expStart = window._expStart, expEnd = window._expEnd;
  const hasDateRange = !!(expStart || expEnd);
  let filtered = orders.filter(o => o.type !== 'door'); // 订单管理排除上门订单
  if(!hasDateRange){
    if(activeTab === 'pending') filtered = filtered.filter(o => o.status === 'pending');
    else if(activeTab === 'confirmed') filtered = filtered.filter(o => o.status === 'confirmed');
    else if(activeTab === 'feedback') filtered = filtered.filter(o => o.status === 'feedback');
    else if(activeTab === 'completed') filtered = filtered.filter(o => ['completed','feedback_done'].includes(o.status));
  }
  // 时间筛选（按创建日期）
  if(hasDateRange){
    filtered = filtered.filter(o => {
      const d = (o.createdAt||'').slice(0,10);
      if(!d) return false;
      if(expStart && d < expStart) return false;
      if(expEnd && d > expEnd) return false;
      return true;
    });
  }
  filtered = [...filtered].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  // 当前标签无数据：自动回退导出全部非上门订单，避免"点了没反应"
  if(!filtered.length){
    const fallback = orders.filter(o => o.type !== 'door').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(fallback.length){
      filtered = fallback;
      const tabLabelMap = { pending:'待下单', confirmed:'已下单', feedback:'待反馈', completed:'已完成', all:'全部' };
      showToast('当前「'+(tabLabelMap[activeTab]||activeTab)+'」标签下没有订单，已为您导出全部订单','info');
    } else {
      showToast('当前没有可导出的订单（上门订单请到「上门订单」页面导出）','error');
      return;
    }
  }

  const typeLabel = { normal:'普通', warehouse:'留仓', door:'上门' };
  const statusLabel = { pending:'待下单', confirmed:'已下单', feedback:'待反馈', feedback_done:'已完成', completed:'已完成',  shipped:'已下单' };
  const escapeCell = (cell) => {
    const s = String(cell == null ? '' : cell).replace(/"/g,'""');
    return /[",\n\r]/.test(s) ? '"'+s+'"' : s;
  };

  // 表头：每个商品一行；新增「地址」「数量」列
  const header = ['订单号','订单类型','状态','客户','电话','地址','下单人','商品名称','数量','单价','小计','总金额','成本','损耗','售后损耗','利润','创建时间'];
  const rows = [];
  filtered.forEach(o => {
    const afterSaleLoss = o.afterSaleLoss || 0;
    const address = [o.province,o.city,o.district,o.region,o.address].filter(Boolean).join(' ');
    const items = (o.items&&o.items.length) ? o.items : [{ name:'(无商品)', price:0, qty:0, productId:null, waste:0 }];
    items.forEach((it, idx) => {
      const p = products.find(x=>x.id===it.productId);
      const qty = it.qty||0;
      const price = it.price||0;
      const subtotal = Math.round(price*qty);
      // 损耗跟着商品走：每个商品单独显示自己的损耗（单个商品单个计算）
      const itemWaste = Math.round(it.waste || 0);
      // 成本和利润按每个商品单独计算；售后损耗按商品数均摊到每行
      const itemCost = (it.cost != null) ? Math.round(it.cost * qty) : (p ? Math.round(p.cost * qty) : 0);
      const afterSaleLossPerItem = items.length > 0 ? Math.round(afterSaleLoss / items.length) : 0;
      // 最后一行承担余数，确保总和精确
      const isLastRow = idx === items.length - 1;
      const lossForThisRow = isLastRow ? (afterSaleLoss - afterSaleLossPerItem * (items.length - 1)) : afterSaleLossPerItem;
      const itemProfit = Math.round(subtotal - itemCost - itemWaste - lossForThisRow);
      // 售后损耗跟订单走：仅在订单首行展示，避免重复计入
      const showAfterSaleLoss = (idx === 0) ? Math.round(afterSaleLoss) : '';
      rows.push([
        o.id, typeLabel[o.type||'normal']||o.type, statusLabel[o.status]||o.status,
        o.customerName||'', o.phone||'', address, o.salesName||'',
        it.name||'', qty, Math.round(price), subtotal,
        Math.round(o.total||0), itemCost, itemWaste, showAfterSaleLoss, itemProfit,
        fmtExportDateTime(o.createdAt)
      ]);
    });
  });
  const csv = [header, ...rows].map(r => r.map(escapeCell).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fileTag = hasDateRange ? '全部' : '普通留仓';
  const dateTag = (expStart || expEnd) ? (expStart||'') + (expEnd && expStart ? '_' + expEnd : (expEnd||'')) : new Date().toISOString().slice(0,10);
  a.download = '订单详情_' + fileTag + '_' + dateTag + '.csv';
  document.body.appendChild(a);
  a.click();
  // 延迟清理，确保浏览器异步读取 blob 完成后再撤销，避免下载被中断
  setTimeout(function(){ try{ document.body.removeChild(a); }catch(e){} URL.revokeObjectURL(url); }, 1500);
  showToast('订单已按商品逐行导出：损耗随商品、售后损耗随订单','success');
}

// 只生成商品表格的 tbody 内容（含分页切片 + 序号），供整体渲染与搜索/翻页局部刷新
function renderProductRowsHtml(){
  const isAdmin = currentUser.role === 'admin';
  const products = DB.get('products');
  const keyword = window._productFilter || '';
  let filtered = products;
  if(keyword){
    filtered = filtered.filter(p => p.name.includes(keyword) || (p.category&&p.category.includes(keyword)));
  }
  // 排序：① 待校准商品（auto_added 或成本未录入）始终置顶并标记「待校准」；
  //       ② 其余按创建时间倒序（无论销售在订单新增还是管理员在商品库新增，最新新增的都排最上，不放末尾）
  filtered = filtered.slice().sort(function(a,b){
    const ca = isUncalibrated(a) ? 0 : 1;
    const cb = isUncalibrated(b) ? 0 : 1;
    if(ca !== cb) return ca - cb; // 待校准优先置顶
    const ta = Date.parse(((a.createdAt||'').replace(' ','T'))||0) || 0;
    const tb = Date.parse(((b.createdAt||'').replace(' ','T'))||0) || 0;
    return tb - ta; // 其余最新新增在上
  });
  const batchMode = window._productBatchMode || false;
  const exportMode = window._productExportMode || false;
  const selectedIds = window._productSelectedIds || {};
  const colspan = (isAdmin?((batchMode||exportMode)?9:8):5); // 多一列"序号"
  // 分页
  const pageSize = window._productPageSize || 20;
  let page = window._productPage || 1;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if(page > totalPages) page = window._productPage = totalPages;
  if(page < 1) page = window._productPage = 1;
  const start = (page - 1) * pageSize;
  const pageItems = filtered.slice(start, start + pageSize);
  if(!pageItems.length){
    return '<tr><td colspan="'+colspan+'" class="table-empty">暂无商品</td></tr>';
  }
  return pageItems.map((p, idx)=>{
    const no = start + idx + 1;
    const profit = p.price - p.cost;
    const profitColor = profit >= 0 ? 'var(--success)' : 'var(--danger)';
    const profitText = profit >= 0 ? '+'+profit : profit;
    const needCalibration = isAdmin && isUncalibrated(p);
    return `
      <tr style="${needCalibration ? 'background:#fff7ed' : ''}">
        ${isAdmin && (batchMode || exportMode) ? `<td><input type="checkbox" ${selectedIds[p.id]?'checked':''} onchange="toggleProductSelect('${p.id}', this.checked)"></td>` : ''}
        <td style="color:var(--text-muted);text-align:center">${no}</td>
        <td style="position:relative">
          ${needCalibration ? '<span style="position:absolute;top:0;right:0;background:#f59e0b;color:#fff;font-size:10px;padding:1px 6px;border-radius:0 0 0 4px;font-weight:500">待校准</span>' : ''}
          ${escAttr(p.name)}
        </td>
        <td>${escAttr(p.category)||'-'}</td>
        <td style="font-weight:600">${money(p.price)}</td>
        ${isAdmin ? `<td>${money(p.cost)}</td><td style="color:${profitColor};font-weight:600">${profitText}</td>` : ''}
        <td>${p.status==='on'?'<span class="tag tag-onshelf">在售</span>':'<span class="tag tag-offshelf">已下架</span>'}</td>
        ${isAdmin ? `<td>
          <button class="btn-link" onclick="openProductModal('${p.id}')">编辑</button>
          <button class="btn-link" onclick="toggleProductStatus('${p.id}')">${p.status==='on'?'下架':'上架'}</button>
        </td>` : ''}
      </tr>
    `;
  }).join('');
}

// 商品分页器 HTML
function renderProductPagerHtml(){
  const products = DB.get('products');
  const keyword = window._productFilter || '';
  let filtered = products;
  if(keyword) filtered = filtered.filter(p => p.name.includes(keyword) || (p.category&&p.category.includes(keyword)));
  const pageSize = window._productPageSize || 20;
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const page = window._productPage || 1;
  if(totalPages <= 1) return '';
  let pages = '';
  const startP = Math.max(1, page - 2), endP = Math.min(totalPages, page + 2);
  for(let i = startP; i <= endP; i++){
    pages += `<button class="btn btn-sm ${i===page?'btn-primary':'btn-secondary'}" onclick="gotoProductPage(${i})">${i}</button>`;
  }
  return `<div class="pager" style="display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px;flex-wrap:wrap">
    <span style="color:var(--text-muted);font-size:13px">共 ${total} 条，第 ${page}/${totalPages} 页</span>
    <button class="btn btn-sm btn-secondary" ${page<=1?'disabled':''} onclick="gotoProductPage(1)">首页</button>
    <button class="btn btn-sm btn-secondary" ${page<=1?'disabled':''} onclick="gotoProductPage(${page-1})">上一页</button>
    ${pages}
    <button class="btn btn-sm btn-secondary" ${page>=totalPages?'disabled':''} onclick="gotoProductPage(${page+1})">下一页</button>
    <button class="btn btn-sm btn-secondary" ${page>=totalPages?'disabled':''} onclick="gotoProductPage(${totalPages})">末页</button>
  </div>`;
}

// 跳转到指定页

  const total = DB.get('products').length;
  const pageSize = window._productPageSize || 20;

  refreshProductTable();
}

// 公共导入逻辑：lines 每项为已切分好的数组 [名称, 售价, 成本]（粘贴导入会先切分，Excel 直接按列传入）
function doImportProductLines(lines, category){
  const products = DB.get('products');
  let successCount = 0;
  const failed = [];
  lines.forEach((line, li) => {
    // Excel 模式直接传入数组；粘贴模式传入字符串，需要先切分
    let parts = Array.isArray(line) ? line.slice() : String(line).split(/\t+|\s{2,}|\s/).map(s => s.trim()).filter(Boolean);
    // 只保留前 3 列：名称、售价、成本
    parts = parts.slice(0, 3);
    const name = parts[0] || '';
    const priceRaw = parts[1] || '';
    const costRaw = parts[2] || '';
    let reason = '';
    if(parts.length < 2){
      reason = '格式错误：至少需要"名称 售价"（用 Tab 或空格分隔）';
    }else if(!name){
      reason = '缺少商品名称';
    }else if(priceRaw === '' || isNaN(parseInt(priceRaw))){
      reason = '售价不是有效数字';
    }else{
      const price = parseInt(priceRaw);
      if(price < 0){
        reason = '售价不能为负数';
      }else{
        const cost = costRaw ? parseInt(costRaw) : 0;
        if(costRaw !== '' && isNaN(cost)){
          reason = '成本不是有效数字';
        }else if(cost < 0){
          reason = '成本不能为负数';
        }else{
          products.push({
            id: 'p' + Date.now() + Math.random().toString(36).slice(2,6),
            name: name,
            category: category || '',
            price: price,
            cost: cost,
            status: 'on',
            createdAt: nowStr()
          });
          successCount++;
        }
      }
    }
    if(reason){
      failed.push({ no: li + 1, raw: Array.isArray(line) ? line.join('\t') : line, name: name, price: priceRaw, cost: costRaw, reason: reason });
    }
  });
  DB.set('products', products);
  schedulePushToCloud();
  renderProducts();
  renderSidebar(); // 校准角标实时刷新
  showImportResult(successCount, failed);
}

// 确认批量导入（粘贴模式）
function confirmBatchImport(){
  const data = document.getElementById('batchImportData').value.trim();
  const category = document.getElementById('batchImportCategory').value.trim();
  if(!data){ showToast('请粘贴商品数据','error'); return; }
  const lines = data.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  doImportProductLines(lines, category);
}

// ============ Excel 导入 / 模板 ============
// 动态加载 SheetJS（用于解析 .xlsx/.xls/.csv 并生成模板），失败可降级
let _xlsxLoading = null;
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(_xlsxLoading) return _xlsxLoading;
  _xlsxLoading = new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = function(){ resolve(window.XLSX); };
    s.onerror = function(){ reject(new Error('Excel 组件加载失败，请检查网络后重试')); };
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}

// 跳过表头（首行含"商品/售价/成本/名称/价格"等关键词时视为表头）
function skipHeaderIfNeeded(lines){
  if(!lines.length) return lines;
  if(/商品|售价|成本|名称|价格|profit|cost|name/i.test(lines[0])) return lines.slice(1);
  return lines;
}

// 下载 Excel 导入模板（含 商品名称 / 售价 / 成本 三列）
function downloadProductTemplate(){
  ensureXLSX().then(function(XLSX){
    const aoa = [['商品名称','售价','成本'],['示例商品A','100','60'],['示例商品B','200','120']];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '商品导入');
    XLSX.writeFile(wb, '商品导入模板.xlsx');
  }).catch(function(err){ showToast('模板生成失败：' + (err && err.message ? err.message : err), 'error'); });
}

// 选择 Excel/CSV 文件并导入商品
function importProductsExcel(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv,.tsv,.txt';
  input.onchange = function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    showToast('正在解析 Excel...', 'info');
    ensureXLSX().then(function(XLSX){
      const reader = new FileReader();
      const isText = /\.(csv|tsv|txt)$/i.test(file.name);
      reader.onload = function(ev){
        try{
          const wb = isText
            ? XLSX.read(ev.target.result, { type:'string' })
            : XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
          let lines = rows.map(function(r){
            // 直接以数组形式传入，保留商品名称内的空格；只取前 3 列
            return (r || []).slice(0,3).map(function(c){ return String(c == null ? '' : c).trim(); });
          }).filter(function(arr){ return arr.length > 0 && arr.some(function(c){ return c !== ''; }); });
          // 跳过表头：首行包含商品/售价/成本等关键词
          if(lines.length && /商品|售价|成本|名称|价格|profit|cost|name/i.test(lines[0].join(''))) lines = lines.slice(1);
          if(!lines.length){ showToast('文件中没有可导入的商品数据', 'error'); return; }
          doImportProductLines(lines, '');
        }catch(err){
          showToast('Excel 解析失败：' + (err && err.message ? err.message : err), 'error');
        }
      };
      if(isText) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    }).catch(function(err){
      showToast('Excel 组件加载失败：' + (err && err.message ? err.message : err), 'error');
    });
  };
  document.body.appendChild(input);
  input.click();
}

// 导出失效商品（CSV：名称,售价,成本,失效原因），方便用户修正后重新导入
function exportInvalidProducts(){
  const rows = window._invalidImportRows || [];
  if(!rows.length){ showToast('没有可导出的失效数据','error'); return; }
  const header = ['名称','售价','成本','失效原因'];
  const escapeCell = (cell) => {
    const s = String(cell == null ? '' : cell).replace(/"/g,'""');
    return /[",\n\r]/.test(s) ? '"'+s+'"' : s;
  };
  const csv = [header, ...rows.map(r => [r.name, r.price, r.cost, r.reason])]
    .map(r => r.map(escapeCell).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '失效商品_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('失效商品已导出','success');
}

// 生成并下载商品 CSV（含名称/分类/售价/成本/利润/状态），仅管理员可用
function downloadProductsCSV(list, filename){
  if(currentUser.role !== 'admin'){ showToast('仅管理员可导出','error'); return; }
  if(!list || !list.length){ showToast('没有可导出的商品','error'); return; }
  const header = ['序号','商品名称','分类','售价','成本','利润','状态'];
  const escapeCell = (cell) => {
    const s = String(cell == null ? '' : cell).replace(/"/g,'""');
    return /[",\n\r]/.test(s) ? '"'+s+'"' : s;
  };
  const rows = list.map((p, idx) => [
    idx + 1,
    p.name,
    p.category || '',
    p.price,
    p.cost,
    (p.price - p.cost),
    (p.status === 'on' ? '在售' : '已下架')
  ]);
  const csv = [header, ...rows].map(r => r.map(escapeCell).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff'+csv], { type:'text/csv;charset=utf-8;' });
  // 兼容中文文件名：保留中文但过滤掉 Windows 不允许的字符
  const safeFilename = String(filename).replace(/[\\/:*?"<>|]/g, '_');

  try {
    // IE / 旧 Edge 直接用 msSaveOrOpenBlob
    if(window.navigator && navigator.msSaveOrOpenBlob){
      navigator.msSaveOrOpenBlob(blob, safeFilename);
      showToast('已导出 '+list.length+' 个商品','success');
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safeFilename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    // 延迟撤销，避免部分浏览器（QQ/手机/Safari）还没开始下载链接就被回收
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    showToast('已导出 '+list.length+' 个商品','success');
  } catch(err) {
    console.error('CSV下载失败:', err);
    showToast('导出失败：'+ (err && err.message ? err.message : '浏览器拦截了下载'),'error');
  }
}

// 启动时自动清理本地重复商品：按商品名保留 updatedAt 最新的一条，其余删除。
// 同时把订单里引用到的旧 productId 替换成保留 id，避免利润/详情计算找不到商品。
function cleanupDuplicateProducts(cloudProducts){
  try{
    let products = DB.get('products') || [];
    if(!products.length) return;

    // 名称规范化：去空格、去常见括号、小写，用于识别"三头鹰 32cm 炒锅"与"三头鹰32cm炒锅"这类重复
    function normName(s){
      return String(s || '').toLowerCase().replace(/\s+/g, '').replace(/[()（）\[\]【】]/g, '');
    }

    const idMap = {}; // 被删除的 id -> 保留的 id

    // 1) 本地精确同名去重（保留 updatedAt/createdAt 最新的一条）
    const byName = {};
    products.forEach(p => {
      const n = (p.name || '').trim();
      if(!n) return;
      if(!byName[n]) byName[n] = [];
      byName[n].push(p);
    });
    let keepProducts = [];
    Object.values(byName).forEach(arr => {
      arr.sort((a, b) => {
        const ta = Date.parse(((a.updatedAt || a.createdAt || '')).replace(' ', 'T')) || 0;
        const tb = Date.parse(((b.updatedAt || b.createdAt || '')).replace(' ', 'T')) || 0;
        return tb - ta;
      });
      keepProducts.push(arr[0]);
      for(let i = 1; i < arr.length; i++) idMap[arr[i].id] = arr[0].id;
    });

    // 2) 本地模糊同名去重（去除空格/括号/大小写后仍相同，视为重复）
    const byNorm = {};
    const afterExact = keepProducts;
    keepProducts = [];
    afterExact.forEach(p => {
      const n = normName(p.name);
      if(!n) { keepProducts.push(p); return; }
      if(!byNorm[n]) byNorm[n] = [];
      byNorm[n].push(p);
    });
    Object.values(byNorm).forEach(arr => {
      arr.sort((a, b) => {
        const ta = Date.parse(((a.updatedAt || a.createdAt || '')).replace(' ', 'T')) || 0;
        const tb = Date.parse(((b.updatedAt || b.createdAt || '')).replace(' ', 'T')) || 0;
        return tb - ta;
      });
      keepProducts.push(arr[0]);
      for(let i = 1; i < arr.length; i++) idMap[arr[i].id] = arr[0].id;
    });

    // 3) 以云端商品为准：本地存在但云端没有，且规范化名称与云端某商品重复，则删除并映射到云端 ID
    //    云端列表由 _loadTable 在同步后写入 window._lastCloudProducts
    const cloud = cloudProducts || window._lastCloudProducts || [];
    if(cloud.length > 0 && products.length > cloud.length + 10){
      const cloudIdSet = new Set(cloud.map(p => p.id));
      const cloudByNorm = {};
      cloud.forEach(p => {
        const n = normName(p.name);
        if(n && !cloudByNorm[n]) cloudByNorm[n] = p.id;
      });
      const aligned = [];
      keepProducts.forEach(p => {
        if(cloudIdSet.has(p.id)){
          aligned.push(p);
          return;
        }
        const n = normName(p.name);
        if(n && cloudByNorm[n]){
          idMap[p.id] = cloudByNorm[n];
          return; // 不加入保留列表
        }
        aligned.push(p); // 可能是离线新建的真实新品，保留
      });
      keepProducts = aligned;
    }

    if(Object.keys(idMap).length === 0) return;

    // 更新本地订单中引用的 productId
    const orders = DB.get('orders');
    let orderChanged = false;
    orders.forEach(o => {
      (o.items || []).forEach(it => {
        if(it.productId && idMap[it.productId]){
          it.productId = idMap[it.productId];
          orderChanged = true;
        }
      });
    });
    if(orderChanged) DB.set('orders', orders);

    // 保存去重后的商品
    DB.set('products', keepProducts);

    // 把被删除的 id 加入排除集，防止 syncFromCloud 又把它们从云端拉回来
    const delKey = 'soms__deletedProductIds';
    const delIds = JSON.parse(localStorage.getItem(delKey) || '[]');
    const delSet = new Set(delIds);
    Object.keys(idMap).forEach(id => delSet.add(id));
    localStorage.setItem(delKey, JSON.stringify(Array.from(delSet)));

    console.log('已自动清理重复商品:', Object.keys(idMap).length, '条，保留:', keepProducts.length, '条');
    // 如果当前在商品管理页，刷新显示
    if(currentRoute === 'products' && typeof renderProducts === 'function'){
      try{ renderProducts(); }catch(e){}
    }
  }catch(e){
    console.warn('清理重复商品失败:', e.message);
  }
}

// 物理删除用户：本地移除 + 云端 DELETE + 记录 _deletedUserIds，防止被同步拉回来
async function _deleteUserPhysical(id){
  if(id === currentUser.id) return false; // 不能删自己
  try{
    const users = DB.get('users') || [];
    const idx = users.findIndex(u => u.id === id);
    if(idx < 0) return false;
    users.splice(idx, 1);
    DB.set('users', users);
    const delIds = new Set(DB.get('_deletedUserIds', []));
    delIds.add(id);
    DB.set('_deletedUserIds', Array.from(delIds));
    if(window._sbpbClient){
      try{
        await window._sbpbClient.from('users').delete().eq('id', id);
      }catch(e){ console.warn('云端删除账号失败:', e.message); }
    }
    return true;
  }catch(e){
    console.warn('物理删除用户失败:', e.message);
    return false;
  }
}

// 清理重复登录账号：同一登录名出现多个账号时，保留创建时间最早的一条，其余物理删除（含云端）
function cleanupDuplicateUsers(){
  try{
    const users = DB.get('users') || [];
    if(!users.length) return;
    const byAccount = {};
    users.forEach(u => {
      const acc = String(u.username || '').trim().toLowerCase();
      if(!acc) return;
      if(!byAccount[acc]) byAccount[acc] = [];
      byAccount[acc].push(u);
    });
    const toDelete = new Set();
    Object.values(byAccount).forEach(arr => {
      if(arr.length <= 1) return;
      // 按 updatedAt/createdAt 降序，保留最新的一条（确保保留最近修改过密码/角色的账号）
      arr.sort((a, b) => {
        const ta = Date.parse(((a.updatedAt || a.createdAt || '')).replace(' ', 'T')) || 0;
        const tb = Date.parse(((b.updatedAt || b.createdAt || '')).replace(' ', 'T')) || 0;
        return tb - ta;
      });
      // 当前用户如果也在重复组里，必须保留；否则保留最新的一条
      const keepIndex = Math.max(0, arr.findIndex(u => u.id === currentUser.id));
      for(let i = 0; i < arr.length; i++){
        if(i === keepIndex) continue;
        toDelete.add(arr[i].id);
      }
    });
    if(!toDelete.size) return;
    // 批量物理删除本地 + 云端
    const delArray = Array.from(toDelete);
    const newUsers = users.filter(u => !toDelete.has(u.id));
    DB.set('users', newUsers);
    const delIds = new Set(DB.get('_deletedUserIds', []));
    delArray.forEach(id => delIds.add(id));
    DB.set('_deletedUserIds', Array.from(delIds));
    (async () => {
      if(!window._sbpbClient) return;
      try{
        const ids = delArray.map(id => '"' + String(id).replace(/"/g, '\\"') + '"');
        await window._sbpbClient.from('users').delete().in('id', '(' + ids.join(',') + ')');
      }catch(e){ console.warn('批量云端删除重复账号失败:', e.message); }
    })();
    console.log('已自动清理重复登录账号:', delArray.length, '条');
    if(currentRoute === 'settings' && typeof renderSettings === 'function'){
      try{ renderSettings(); }catch(e){}
    }
  }catch(e){
    console.warn('清理重复账号失败:', e.message);
  }
}

// 清理重复客户：以手机号归一化（去空格/横杠）为主键合并；手机号为空时按客户名称归一化（去空格/大小写）合并。
// 保留创建时间最早的一条，其余本地合并移除；订单 customerId 同步重映射，避免历史订单丢失归属。
function cleanupDuplicateCustomers(){
  try{
    let customers = DB.get('customers') || [];
    if(!customers.length) return;
    function normPhone(p){ return String(p || '').replace(/[\s-]/g, ''); }
    function normName(s){ return String(s || '').toLowerCase().replace(/\s+/g, ''); }

    const idMap = {}; // 被合并的 id -> 保留的 id
    const byKey = {};
    customers.forEach(c => {
      const phone = normPhone(c.phone);
      const key = phone ? ('P:' + phone) : ('N:' + normName(c.name));
      if(!key || key === 'N:') return; // 手机号和名称都为空，不纳入去重
      if(!byKey[key]) byKey[key] = [];
      byKey[key].push(c);
    });
    let keep = [];
    Object.values(byKey).forEach(arr => {
      arr.sort((a, b) => {
        const ta = Date.parse(((a.createdAt || '')).replace(' ', 'T')) || 0;
        const tb = Date.parse(((b.createdAt || '')).replace(' ', 'T')) || 0;
        return ta - tb; // 保留最早创建
      });
      keep.push(arr[0]);
      for(let i = 1; i < arr.length; i++) idMap[arr[i].id] = arr[0].id;
    });
    if(Object.keys(idMap).length === 0){ showToast('未发现重复客户','info'); return; }

    // 重映射订单中的 customerId
    const orders = DB.get('orders');
    let orderChanged = false;
    orders.forEach(o => {
      if(o.customerId && idMap[o.customerId]){ o.customerId = idMap[o.customerId]; orderChanged = true; }
    });
    if(orderChanged) DB.set('orders', orders);

    DB.set('customers', keep);
    const msg = '已清理重复客户 ' + Object.keys(idMap).length + ' 条，保留 ' + keep.length + ' 条';
    console.log(msg);
    showToast(msg, 'success');
    if(currentRoute === 'customers' && typeof renderCustomers === 'function'){ try{ renderCustomers(); }catch(e){} }
  }catch(e){
    console.warn('清理重复客户失败:', e.message);
    showToast('清理失败：' + e.message, 'error');
  }
}

// 手动以云端商品为准去重对齐（管理员专用）：从云端拉取最新商品列表后，
// 清理本地重复/变体商品，使本地数量与云端一致。
async function alignProductsWithCloud(){
  if(!confirm('确定要以云端商品为准刷新本地商品库吗？\n\n这会删除本地仅存在、且与云端商品重复（名称相似）的记录，保留云端已有商品。')) return;
  try{
    showToast('正在从云端同步商品...','info');
    await DB.syncFromCloud();
    const before = (DB.get('products') || []).length;
    cleanupDuplicateProducts(window._lastCloudProducts);
    const after = (DB.get('products') || []).length;
    renderProducts();
    showToast(`对齐完成：本地商品从 ${before} 条整理为 ${after} 条`,'success');
  }catch(e){
    console.warn('对齐云端商品失败:', e.message);
    showToast('对齐失败，请检查网络后重试','error');
  }
}

// 以本机当前商品为准，强制把云端商品库对齐为本机数量（修复多设备商品数量不一致）。
// 必须用「显示正确数量（约178）的网页版」点击；不要在手机上点（否则会把手机的数量覆盖到云端）。
// 它使用登录时备份的 _preSyncLocalProducts（即使新版本首拉云端把本地覆盖成590，也能拿回本机真实的178个）。
async function reconcileProductsToCloud(){
  if(!window._sbpbClient){ showToast('离线，无法同步','error'); return; }
  const local = (window._preSyncLocalProducts && window._preSyncLocalProducts.length) ? window._preSyncLocalProducts : DB.get('products', []);
  if(!local.length){ showToast('本机没有商品数据，无法同步','error'); return; }
  if(!confirm('将以本机当前的 '+local.length+' 个商品为准，覆盖云端商品库。\n\n请确认您是在「显示正确数量的网页版」上操作，不要在手机上点！\n点确定后，所有设备都会变成这 '+local.length+' 个商品。')) return;
  try{
    showToast('正在同步到云端...','info');
    const { data, error } = await window._sbpbClient.from('products').select('id');
    if(error){ showToast('拉取云端失败：'+error.message,'error'); return; }
    const cloudIds = (data||[]).map(r=>r.id);
    const localIds = new Set(local.map(p=>p.id));
    const toDelete = cloudIds.filter(id=>!localIds.has(id));
    if(toDelete.length){
      for(let i=0;i<toDelete.length;i+=100){
        const batch = toDelete.slice(i,i+100);
        await window._sbpbClient.from('products').delete().in('id', batch);
      }
    }
    // 把本机商品写回云端（含新增/修改），保证云端与本机完全一致（只传商品表合法列）
    const snake = local.map(_productRowToSnake);
    for(let i=0;i<snake.length;i+=100){
      const batch = snake.slice(i,i+100);
      await window._sbpbClient.from('products').upsert(batch, { onConflict: 'id' });
    }
    localStorage.setItem('soms__deletedProductIds','[]');
    showToast('已同步，云端商品数='+local.length+'，请在其它设备刷新','success');
    await DB.loadProductsFromCloud();
    renderProducts();
    renderSidebar();
  }catch(e){
    console.warn('同步商品到云端失败:', e.message);
    showToast('同步失败：'+(e&&e.message||e),'error');
  }
}

// 把单个商品变更（新增/编辑/上下架）实时推送到云端，避免依赖整表批量同步（批量同步已排除商品表）。
// 商品表只有 id/name/price/cost/status/category/created_at 七列，必须只传这些，否则 upsert 会因多余列报错。
function _productRowToSnake(p){
  return {
    id: p.id,
    name: p.name,
    price: p.price,
    cost: p.cost,
    status: p.status || 'on',
    category: p.category || '',
    created_at: p.createdAt || p.created_at || new Date().toISOString().slice(0,19).replace('T',' ')
  };
}
async function pushSingleProductToCloud(product){
  if(!product || !window._sbpbClient) return;
  try{
    await window._sbpbClient.from('products').upsert(_productRowToSnake(product), { onConflict: 'id' });
  }catch(e){ console.warn('商品推云端失败:', e.message); }
}

function saveProduct(){
  const id = document.getElementById('productId').value;
  const name = document.getElementById('productName').value.trim();
  const category = document.getElementById('productCategory').value.trim();
  const price = parseInt(document.getElementById('productPrice').value);
  const cost = parseInt(document.getElementById('productCost').value);
  if(!name){ showToast('请输入商品名称','error'); return; }
  if(isNaN(price) || price < 0){ showToast('请输入有效售价','error'); return; }
  if(isNaN(cost) || cost < 0){ showToast('请输入有效成本','error'); return; }

  const products = DB.get('products');
  const nowStr = new Date().toISOString().slice(0,19).replace('T',' ');
  let savedProduct = null;
  if(id){
    const idx = products.findIndex(p => p.id === id);
    if(idx >= 0){
      products[idx] = {...products[idx], name, category, price, cost, updatedAt: nowStr};
      delete products[idx].auto_added;
      savedProduct = products[idx];
    }
  }else{
    savedProduct = {
      id: DB.uid('p_'), name, category, price, cost, status:'on', createdAt: nowStr, updatedAt: nowStr
    };

  }
  DB.set('products', products);
  closeModal();
  showToast('商品保存成功','success');
  pushSingleProductToCloud(savedProduct); // 单条上推云端，保证跨设备同步且不会把本地旧缓存糊回云端
  renderProducts();
  renderSidebar(); // 编辑保存后实时刷新左侧「待校准」角标数量
}

function toggleProductStatus(productId){
  const products = DB.get('products');
  const idx = products.findIndex(p => p.id === productId);
  if(idx >= 0){
    products[idx].status = products[idx].status === 'on' ? 'off' : 'on';
    DB.set('products', products);
    showToast(products[idx].status==='on'?'商品已上架':'商品已下架','success');
    pushSingleProductToCloud(products[idx]); // 单条上推云端，保证上下架状态跨设备同步

// 计算订单剩余尾款（订单总额 - 创建时已收金额 - 后续已到账收款合计）
function getOrderRemaining(order){
  if(!order) return 0;
  const initPaid = parseInt(order.collectedAmount) || 0;
  const paidRecords = (DB.get('payments') || []).filter(p => p.orderId === order.id && p.status === 'paid');
  const paidSum = paidRecords.reduce((s, p) => s + (parseInt(p.amount) || 0), 0);
  return Math.max(0, (parseInt(order.total) || 0) - initPaid - paidSum);
}

// 计算所有销售待收尾款总额（有定金且未结清的订单）
function calcAllPendingFinalPayments(orders){
  return (orders || []).reduce(function(s, o){
    
    const deposit = parseInt(o.deposit) || 0;
    if(deposit <= 0) return s; // 无尾款
    return s + getOrderRemaining(o);
  }, 0);
}

// 收款弹窗：选择「微信收款」时，实时显示本次收款及微信总额变化
function updatePayModalWechat(orderId){
  const wrap = document.getElementById('payWechatTotal');
  if(!wrap) return;
  const methodEl = document.getElementById('payMethod');
  const amountEl = document.getElementById('payAmount');
  const order = DB.get('orders').find(o => o.id === orderId);
  const salesId = order ? order.salesId : currentUser.id;
  if(methodEl && methodEl.value === '微信支付'){
    wrap.style.display = 'block';
    const thisAmount = parseInt(amountEl.value) || 0;
    const beforeTotal = getWechatTotal(salesId);
    const afterTotal = beforeTotal + thisAmount;
    wrap.innerHTML = '此次微信收款 <b>' + money(thisAmount) + '</b>，之前微信总额是 <b>' + money(beforeTotal) + '</b>，那么现在微信总额是 <b>' + money(afterTotal) + '</b>';
  }else{
    wrap.style.display = 'none';

}

function savePayment(orderId){
  const amount = parseInt(document.getElementById('payAmount').value);
  const method = document.getElementById('payMethod').value;
  const payDate = document.getElementById('payDate').value;
  const status = document.getElementById('payStatus').value;
  const stage = document.getElementById('payStage') ? document.getElementById('payStage').value : '其他';
  if(isNaN(amount) || amount <= 0){ showToast('请输入有效金额','error'); return; }
  if(!payDate){ showToast('请选择到账日期','error'); return; }

  const order = DB.get('orders').find(o => o.id === orderId);
  const payments = DB.get('payments');
  payments.push({
    id: DB.uid('pay_'), orderId, customerName: order.customerName,
    salesId: order.salesId, salesName: order.salesName,
    amount, method, payDate, status, stage, createdAt: nowStr()
  });
  DB.set('payments', payments);
  // ===== 收款闭环：回写订单实收金额与"已结清"标记 =====
  const allOrders = DB.get('orders');
  const target = allOrders.find(o => o.id === orderId);
  if(target){
    const initPaid = parseInt(target.collectedAmount) || 0;
    const paidSum = (DB.get('payments') || []).filter(p => p.orderId === orderId && p.status === 'paid').reduce((s, p) => s + (parseInt(p.amount) || 0), 0);
    const totalCollected = initPaid + paidSum;
    target.collectedAmount = totalCollected;
    const orderTotal = parseInt(target.total) || 0;
    target.paymentSettled = (orderTotal > 0 && totalCollected >= orderTotal);
    target.updatedAt = nowStr();
    DB.set('orders', allOrders);
  }
  logAudit({action:'collect_payment', targetType:'order', targetId: orderId, targetLabel: order.customerName, before: '', after: amount, detail: '收款 '+money(amount)+' / 阶段 '+(stage||'-')+' / 方式 '+method+(target && target.paymentSettled ? ' / 订单已结清' : '')});
  closeModal();
  if(method === '微信支付'){
    const wt = money(getWechatTotal(order.salesId));
    showToast('微信收款已记录，当前微信收款总额：' + wt, 'success');
  }else{
    showToast('收款记录已添加','success');
  }
  if(window._collectBalancePayment){
    navigate('collect-balance');
  }else{
    renderOrderDetail();
  }
  window._collectBalancePayment = false;
  schedulePushToCloud();
}

/* ============ 销售提成 ============ */

  var profit = calcOrderProfit(order);
  return Math.round(profit * (salesRate / 100));
}

function exportCommissionCSV(){
  if(currentUser.role !== 'admin'){ showToast('仅管理员可导出','error'); return; }
  var details = window._comDetails || [];
  if(!details.length){ showToast('暂无可导出数据','error'); return; }

  var csv = '\uFEFF销售,订单号,客户,完成日期,原始利润,损耗扣减,提成基数,比例(%),提成金额\n';
  details.forEach(function(d){
    csv += [d.salesName, d.orderId, d.customerName||'-', d.completionDate||'-',
            Math.round(d.originalProfit), Math.round(d.lossDeduction),
            Math.round(d.commissionBase), d.rate, Math.round(d.commission)].join(',') + '\n';
  });
  var totalProfit = details.reduce(function(s,d){ return s + d.originalProfit; }, 0);
  var totalLoss = details.reduce(function(s,d){ return s + d.lossDeduction; }, 0);
  var totalBase = details.reduce(function(s,d){ return s + d.commissionBase; }, 0);
  var totalCommission = details.reduce(function(s,d){ return s + d.commission; }, 0);
  csv += '合计,,,,,' + Math.round(totalProfit) + ',' + Math.round(totalLoss) + ',' + Math.round(totalBase) + ',' + Math.round(totalCommission) + '\n';

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '销售提成明细_'+window._comStart+'_'+window._comEnd+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV文件已导出','success');
}

function generateCommissions(){
  const period = document.getElementById('comPeriod').value;
  const rate = parseInt(document.getElementById('comRate').value);
  if(!period){ showToast('请选择提成周期','error'); return; }
  if(isNaN(rate) || rate <= 0 || rate > 100){ showToast('请输入有效提成比例(0-100)','error'); return; }

  const selected = Array.from(document.querySelectorAll('.com-order-cb:checked')).map(cb => cb.value);
  if(selected.length === 0){ showToast('请至少选择一个订单','error'); return; }

  const orders = DB.get('orders');
  const commissions = DB.get('commissions');
  selected.forEach(orderId => {
    const order = orders.find(o => o.id === orderId);
    if(order){
      commissions.push({
        id: DB.uid('com_'),
        salesId: order.salesId,
        salesName: order.salesName,
        orderId: order.id,
        customerName: order.customerName,
        amount: Math.round(order.total * rate / 100),
        rate,
        period,
        status: 'unsettled',
        createdAt: nowStr()
      });
    }
  });
  DB.set('commissions', commissions);
  closeModal();
  showToast('成功生成 '+selected.length+' 条提成记录','success');
  renderCommissions();
}

function settleCommission(commissionId){
  const commissions = DB.get('commissions');
  const idx = commissions.findIndex(c => c.id === commissionId);
  if(idx >= 0){
    commissions[idx].status = 'settled';
    DB.set('commissions', commissions);
    showToast('提成已结算','success');
    renderCommissions();
  }
}

// 售后详情损耗预览
function calcDetailLossPreview(orderId, oldLoss){
  const orders = DB.get('orders');
  const order = orders.find(o => o.id === orderId);
  const lossEl = document.getElementById('asLossInput');
  const previewEl = document.getElementById('detailLossPreview');
  if(!order || !lossEl || !previewEl) return;
  const newLoss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  const adjustedProfit = origProfit + oldLoss - newLoss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 修改后：'+
    '<strong style="color:'+(adjustedProfit>=0?'var(--success)':'var(--danger)')+'">'+money(adjustedProfit)+'</strong></span>';
}

// 保存售后详情（备注 + 物流单号 + 管理员可编辑损耗并重新核算利润）
function saveAftersaleDetail(id){
  const isAdmin = currentUser.role === 'admin';
  const remark = document.getElementById('asRemark').value.trim();
  const trackingNo = document.getElementById('asTrackingNo').value.trim();
  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }

  const oldLoss = aftersales[idx].loss || 0;
  aftersales[idx].remark = remark;
  aftersales[idx].trackingNo = trackingNo;
  aftersales[idx].updatedAt = nowStr();

  // 管理员可随时编辑损耗金额，保存后重新核算利润
  if(isAdmin){
    const lossEl = document.getElementById('asLossInput');
    if(lossEl){
      const newLoss = parseFloat(lossEl.value) || 0;
      if(newLoss < 0){ showToast('售后损耗不能为负数','error'); return; }
      aftersales[idx].loss = newLoss;

      // 财务联动：重新核算原订单利润（先减旧损耗再加新损耗）
      const orders = DB.get('orders');
      const oIdx = orders.findIndex(o => o.id === aftersales[idx].orderId);
      if(oIdx >= 0){
        orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
        orders[oIdx].afterSaleLossSyncedAt = nowStr();
        DB.set('orders', orders);
      }
    }
  }

  DB.set('aftersales', aftersales);
  showToast(isAdmin ? '售后信息已保存，利润已重新核算' : '售后备注与物流单号已保存','success');
  closeModal();
  renderAftersales();
}

// 损耗预览：展示原利润 -> 扣减后利润
function calcAfterSaleLossPreview(){
  const order = window._aftersaleSelectedOrder;
  const lossEl = document.getElementById('aftersaleLoss');
  const previewEl = document.getElementById('lossPreview');
  if(!order || !lossEl || !previewEl) return;
  const loss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  const newProfit = origProfit - loss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 扣减后：'+
    '<strong style="color:'+(newProfit>=0?'var(--success)':'var(--danger)')+'">'+money(newProfit)+'</strong></span>';
}

// 搜索订单（全部状态历史订单；销售仅检索自己创建的订单）
function searchOrdersForAftersale(keyword){
  const results = document.getElementById('orderSearchResults');
  if(!keyword || !keyword.trim()){ results.style.display='none'; return; }
  let orders = DB.get('orders');
  const isAdmin = currentUser.role === 'admin';
  if(!isAdmin){
    orders = orders.filter(o => o.salesId === currentUser.id);
  }
  // 仅「已完成」状态的订单可发起售后（已完成 / 售后完成）
  orders = orders.filter(o => ['completed','feedback_done'].includes(o.status));
  const matched = orders.filter(o =>
    (o.id||'').toLowerCase().includes(keyword.toLowerCase()) ||
    (o.customerName||'').includes(keyword) ||
    (o.contact||'').includes(keyword) ||
    (o.phone||'').includes(keyword) ||
    (o.address||'').includes(keyword) ||
    (o.region||'').includes(keyword) ||
    (o.items||[]).some(it => (it.name||'').includes(keyword))
  ).slice(0, 10);

  if(matched.length === 0){
    results.innerHTML = '<div class="ps-empty">未找到匹配订单</div>';
  }else{
    results.innerHTML = matched.map(o => `
      <div class="ps-item" onclick="selectOrderForAftersale('${o.id}')">
        <div>
          <div style="font-weight:500">${o.id} · ${escapeHtml(o.customerName)}</div>
          <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(o.phone)||''} ${escapeHtml(o.address)||''}</div>
        </div>
        <button class="btn btn-primary btn-sm">选择</button>
      </div>
    `).join('');
  }
  results.style.display = 'block';
}

// 选中订单，自动回填客户信息
function selectOrderForAftersale(orderId){
  let orders = DB.get('orders');
  const order = orders.find(o => o.id === orderId);

  if(!['completed','feedback_done'].includes(order.status)){

  document.getElementById('aftersaleOrderSearch').value = orderId;

  document.getElementById('selectedOrderInfo').innerHTML = `
    <div style="background:#f0f4ff;padding:10px 14px;border-radius:6px;font-size:13px">
      <div><strong>订单号：</strong>${order.id}</div>
      <div><strong>客户：</strong>${escapeHtml(order.customerName)} · ${escapeHtml(order.phone)||''}</div>
      <div><strong>地址：</strong>${order.region||''} ${escapeHtml(order.address)||''}</div>
    </div>

// 提交售后（含损耗金额 + 利润联动扣减；销售提交时损耗为0，由管理员后续补充）
function submitAftersale(){
  const isAdmin = currentUser.role === 'admin';
  const order = window._aftersaleSelectedOrder;
  if(!order){ showToast('请选择关联订单','error'); return; }
  if(!['completed','feedback_done'].includes(order.status)){
    showToast('只有「已完成」状态的订单才能申请售后','error'); return;
  }
  const checkedCbs = Array.from(document.querySelectorAll('.aftersale-item-cb:checked'));
  if(checkedCbs.length === 0){ showToast('请选择需要售后的商品','error'); return; }
  const reason = document.getElementById('aftersaleReason').value.trim();
  if(!reason){ showToast('请填写售后原因','error'); return; }
  // 销售看不到损耗输入框，默认0；管理员填写损耗
  const lossEl = document.getElementById('aftersaleLoss');
  const loss = lossEl ? (parseFloat(lossEl.value) || 0) : 0;
  if(loss < 0){ showToast('售后损耗不能为负数','error'); return; }

  const selectedItems = checkedCbs.map(cb => {
    const i = parseInt(cb.value);
    return { productId: order.items[i].productId, name: order.items[i].name, qty: order.items[i].qty };
  });

  const aftersales = DB.get('aftersales');
  const newAS = {
    id: 'AS' + todayStr().replace(/-/g,'') + String(Math.floor(Math.random()*9000)+1000),
    orderId: order.id,
    orderType: order.type,
    customerName: order.customerName,
    phone: order.phone,
    salesId: order.salesId,
    salesName: order.salesName,
    items: selectedItems,
    reason,
    loss,
    images: aftersaleImages,
    status: 'pending',
    createdAt: nowStr()
  };
  aftersales.push(newAS);
  DB.set('aftersales', aftersales);

  // 财务联动：原销售订单利润扣减售后损耗金额（仅管理员填写损耗时生效）
  if(isAdmin && loss > 0){
    const orders = DB.get('orders');
    const oIdx = orders.findIndex(o => o.id === order.id);
    if(oIdx >= 0){
      orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) + loss;
      orders[oIdx].afterSaleLossSyncedAt = nowStr();
      DB.set('orders', orders);
    }
    showToast('售后已创建，原订单利润已扣减损耗 '+money(loss)+' 元','success');
  }else{
    showToast('售后已提交，等待管理员处理','success');
  }
  closeModal();
  schedulePushToCloud();
  renderAftersales();
}

// 编辑损耗预览
function calcEditLossPreview(orderId, oldLoss){
  const orders = DB.get('orders');
  const order = orders.find(o => o.id === orderId);
  const lossEl = document.getElementById('editAsLoss');
  const previewEl = document.getElementById('editLossPreview');
  if(!order || !lossEl || !previewEl) return;
  const newLoss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  // 原利润需要加回旧损耗再减新损耗
  const adjustedProfit = origProfit + oldLoss - newLoss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 修改后：'+
    '<strong style="color:'+(adjustedProfit>=0?'var(--success)':'var(--danger)')+'">'+money(adjustedProfit)+'</strong></span>';
}

// 保存售后编辑（修改损耗后重新核算利润）
function saveAftersaleEdit(id){
  const reason = document.getElementById('editAsReason').value.trim();
  if(!reason){ showToast('售后原因不能为空','error'); return; }
  const newLoss = parseFloat(document.getElementById('editAsLoss').value) || 0;
  const newStatus = document.getElementById('editAsStatus').value;

  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }
  const oldLoss = aftersales[idx].loss || 0;
  const orderId = aftersales[idx].orderId;

  aftersales[idx].reason = reason;
  aftersales[idx].loss = newLoss;
  aftersales[idx].status = newStatus;
  aftersales[idx].updatedAt = nowStr();
  DB.set('aftersales', aftersales);

  // 财务联动：重新核算原订单利润（先减旧损耗再加新损耗）
  const orders = DB.get('orders');
  const oIdx = orders.findIndex(o => o.id === orderId);
  if(oIdx >= 0){
    orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
    orders[oIdx].afterSaleLossSyncedAt = nowStr();
    DB.set('orders', orders);
  }

  showToast('售后信息已更新，利润已重新核算','success');
  closeModal();
  schedulePushToCloud();
  renderAftersales();
}

function updateAftersaleStatus(id, status){
  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }
  const isAdmin = currentUser.role === 'admin';
  const oldLoss = aftersales[idx].loss || 0;

  // 更新状态
  aftersales[idx].status = status;
  aftersales[idx].updatedAt = nowStr();

  // 同步保存弹窗中已填写的损耗金额、备注、物流单号，避免切换状态时丢失
  const remarkEl = document.getElementById('asRemark');
  const trackingEl = document.getElementById('asTrackingNo');
  if(remarkEl) aftersales[idx].remark = remarkEl.value.trim();
  if(trackingEl) aftersales[idx].trackingNo = trackingEl.value.trim();

  if(isAdmin){
    const lossEl = document.getElementById('asLossInput');
    if(lossEl){
      const newLoss = parseFloat(lossEl.value) || 0;
      if(newLoss < 0){ showToast('售后损耗不能为负数','error'); return; }
      aftersales[idx].loss = newLoss;
      // 财务联动：重新核算原订单利润
      const orders = DB.get('orders');
      const oIdx = orders.findIndex(o => o.id === aftersales[idx].orderId);
      if(oIdx >= 0){
        orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
        orders[oIdx].afterSaleLossSyncedAt = nowStr();
        DB.set('orders', orders);
      }
    }
  }

  DB.set('aftersales', aftersales);
  showToast('售后状态已更新，损耗金额已同步保留','success');
  closeModal();
  renderAftersales();
}

function closeAftersale(id){
  showConfirm('确定关闭此售后记录吗？', () => {
    updateAftersaleStatus(id, 'closed');
  });
}

  // 上门订单状态组：待下单 / 已下单 / 已完成；其余内部状态归入对应显示组
  var doorStatusMap = {
    'pending': ['pending'],
    'confirmed': ['confirmed','shipped'],
    'completed': ['completed']
  };
  if(statusKey && doorStatusMap[statusKey]){
    orders = orders.filter(function(o){ return doorStatusMap[statusKey].indexOf(o.status) >= 0; });
  }

  var viewMode = window._scheduleView || 'calendar';
  var currentMonth = window._scheduleMonth || (new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0'));

  var schTabs = [
    {key:'',label:'全部'},{key:'pending',label:'待下单'},{key:'confirmed',label:'已下单'},{key:'completed',label:'已完成'}
  ];
  var schKeyword = window._scheduleFilter || '';
  var schDateStart = window._scheduleDateStart || '';
  var schDateEnd = window._scheduleDateEnd || '';

  // 关键词检索（客户姓名/电话/商品）
  if(schKeyword){
    var skw = schKeyword.toLowerCase();
    orders = orders.filter(function(o){
      return (o.customerName||'').indexOf(schKeyword) >= 0 ||
        (o.phone||'').indexOf(schKeyword) >= 0 ||
        (o.items||[]).some(function(it){ return (it.name||'').indexOf(schKeyword) >= 0; });
    });
  }
  // 日期范围筛选（按上门日期）
  if(schDateStart){
    orders = orders.filter(function(o){ var d = doorDateOf(o); return d >= schDateStart; });
  }
  if(schDateEnd){
    orders = orders.filter(function(o){ var d = doorDateOf(o); return d <= schDateEnd; });
  }

  var html = '<div class="card"><div class="card-title"><span class="title-text">📅 上门订单</span><div style="display:flex;gap:8px;align-items:center"><button class="btn btn-primary btn-sm" onclick="renderOrderNew(\'door\')">+ 新建上门订单</button><button class="btn btn-sm '+(viewMode==='calendar'?'btn-primary':'btn-secondary')+'" onclick="window._scheduleView=\'calendar\';renderSchedule()">日历视图</button><button class="btn btn-sm '+(viewMode==='list'?'btn-primary':'btn-secondary')+'" onclick="window._scheduleView=\'list\';renderSchedule()">列表视图</button><button class="btn btn-primary btn-sm" onclick="exportScheduleOrders()" style="display:inline-flex;align-items:center;gap:4px">📥 导出</button></div></div>';

    html += '<button class="btn '+(statusKey===t.key?'btn-primary':'btn-secondary')+' btn-sm" onclick="window._scheduleStatus=\''+t.key+'\';renderSchedule()" style="margin-right:6px">'+t.label+' ('+cnt+')</button>';

    html += '<button class="btn btn-secondary btn-sm" onclick="window._scheduleMonth=\''+nextMonth+'\';renderSchedule()">下月 ▶</button>';
    html += '</div>';

    var orderMap = {};
    orders.forEach(function(o){
      var date = doorDateOf(o);
      if(date && date.indexOf(currentMonth) === 0){
        if(!orderMap[date]) orderMap[date] = [];
        orderMap[date].push(o);
      }
    });

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">';
    var weekDays = ['日','一','二','三','四','五','六'];
    weekDays.forEach(function(d){
      html += '<div style="text-align:center;padding:6px;font-weight:600;color:var(--text-muted);font-size:13px">'+d+'</div>';
    });
    for(var i = 0; i < firstDay; i++){ html += '<div></div>'; }
    for(var d = 1; d <= daysInMonth; d++){
      var dateStr = currentMonth + '-' + String(d).padStart(2,'0');

      html += '<div style="font-size:12px;font-weight:'+(isToday?'700':'400')+'">'+d+'</div>';
      if(dayOrders.length){
        html += '<div style="margin-top:2px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary)"></span>';

            html += '<div style="font-size:10px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(o.customerName||'')+'</div>';
          });
        } else {
          html += '<div style="font-size:10px;color:var(--primary);margin-top:2px">'+dayOrders.length+'个订单</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    html += '</div>';

    html += '<div id="scheduleDayOrders" style="margin-top:16px"></div>';

    var monthOrders = orders.filter(function(o){
      var date = doorDateOf(o);
      return date && date.indexOf(currentMonth) === 0;
    });
    html += '<div style="margin-top:16px;padding:12px;background:#f9fafb;border-radius:6px;font-size:13px;color:var(--text-muted)">本月上门订单共 <strong style="color:var(--primary)">'+monthOrders.length+'</strong> 单</div>';

  } else {
    var sorted = orders.slice().sort(function(a,b){ return doorDateOf(b).localeCompare(doorDateOf(a)); });
    html += '<div class="table-wrap"><table><thead><tr><th>客户</th><th>状态</th><th>备注</th><th>创建时间</th><th>操作</th></tr></thead><tbody>';
      if(sorted.length){
      sorted.forEach(function(o){
        var opHtml = '<button class="btn btn-primary btn-sm" onclick="viewOrder(\''+o.id+'\')">查看</button>'; html += '<tr><td>'+orderIdCell(o.id)+'<br>'+escapeHtml(o.customerName)+'</td><td>'+statusTag(o.status)+'</td><td>'+(o.remark||'-')+'</td><td>'+formatOrderDateTime(o.createdAt)+'</td><td style="text-align:center">'+opHtml+'</td></tr>';
      });
    }
    html += '</tbody></table></div>';
  }

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function showScheduleDayOrders(dateStr){
  var isAdmin = currentUser.role === 'admin';
  // 上门订单：所有人可见（仅 admin 与提交者可编辑）
  var orders = DB.get('orders').filter(function(o){ return o.type === 'door'; });
  function doorDateOf(o){ return o.completionDate || o.orderDate || (o.createdAt||'').slice(0,10); }
  var dayOrders = orders.filter(function(o){ return doorDateOf(o) === dateStr; });
