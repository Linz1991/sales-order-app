}

/* ============ 留仓订单 ============ */
async function renderWarehouse(){
  // 渲染函数只负责展示，不自己拉网络：数据由 navigate()/Realtime/afterWriteRefresh 保证云端最新。
  if(typeof renderSidebar === 'function') renderSidebar();
  var isAdmin = currentUser.role === 'admin';
  var deletedIds = (DB.get('_deletedOrderIds') || []);
  var orders = DB.get('orders').filter(function(o){ return o.type === 'warehouse' && deletedIds.indexOf(o.id) < 0; });
  if(!isAdmin) orders = orders.filter(function(o){ return o.salesId === currentUser.id; });
  var keyword = window._warehouseFilter || '';
  var statusKey = window._warehouseStatus || '';
  var whDateStart = window._whDateStart || '';
  var whDateEnd = window._whDateEnd || '';
  // 状态映射：待下单/已下单/待反馈/已完成；其余内部状态归入对应显示组
  var statusMap = {
    'pending': ['pending'],
    'confirmed': ['confirmed','shipped'],
    'feedback': ['feedback'],
    'completed': ['completed','feedback_done']
  };
  var filtered = orders;
  if(statusKey && statusMap[statusKey]){
    filtered = filtered.filter(function(o){ return statusMap[statusKey].indexOf(o.status) >= 0; });
  }
  if(keyword){
    filtered = filtered.filter(function(o){
      return o.id.toLowerCase().indexOf(keyword.toLowerCase()) >= 0 ||
        (o.customerName||'').indexOf(keyword) >= 0 ||
        (o.phone||'').indexOf(keyword) >= 0 ||
        (o.items||[]).some(function(it){ return (it.name||'').indexOf(keyword) >= 0; });
    });
  }
  // 日期范围筛选
  if(whDateStart){
    filtered = filtered.filter(function(o){ var d = (o.orderDate||o.createdAt||'').slice(0,10); return d >= whDateStart; });
  }
  if(whDateEnd){
    filtered = filtered.filter(function(o){ var d = (o.orderDate||o.createdAt||'').slice(0,10); return d <= whDateEnd; });
  }
  filtered = filtered.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });

  var whTabs = [
    {key:'',label:'全部'},{key:'pending',label:'待下单'},{key:'confirmed',label:'已下单'},
    {key:'feedback',label:'待反馈'},{key:'completed',label:'已完成'}
  ];
  var html = '<div class="card"><div class="card-title"><span class="title-text">🏷️ 留仓订单</span><div style="display:flex;gap:8px;align-items:center"><button class="btn btn-primary btn-sm" onclick="renderOrderNew(\'warehouse\')">+ 新建留仓订单</button><button class="btn btn-primary btn-sm" onclick="exportWarehouseOrders()" style="display:inline-flex;align-items:center;gap:4px">📥 导出</button></div></div>';
  html += '<div class="admin-tab-bar" style="margin-bottom:14px">';
  whTabs.forEach(function(t){
    var count = t.key==='' ? orders.length : orders.filter(function(o){ return statusMap[t.key].indexOf(o.status) >= 0; }).length;
    html += '<button class="btn '+(statusKey===t.key?'btn-primary':'btn-secondary')+' btn-sm" onclick="window._warehouseStatus=\''+t.key+'\';renderWarehouse()" style="margin-right:6px">'+t.label+' ('+count+')</button>';
  });
  html += '</div>';
  // 日期范围筛选
  html += '<div class="date-filter">';
  html += '<span class="df-label">📅 订单日期</span>';
  html += '<input type="date" class="df-input" value="'+whDateStart+'" onchange="window._whDateStart=this.value;renderWarehouse()">';
  html += '<span class="df-sep">至</span>';
  html += '<input type="date" class="df-input" value="'+whDateEnd+'" onchange="window._whDateEnd=this.value;renderWarehouse()">';
  html += '<button class="df-clear" onclick="window._whDateStart=\'\';window._whDateEnd=\'\';renderWarehouse()">清除</button>';
  html += '</div>';
  // 检索栏
  html += '<div class="admin-tab-bar"><div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="搜索订单号/客户/电话/商品" value="'+keyword+'" oninput="window._warehouseFilter=this.value;renderWarehouse()"></div></div>';

  if(filtered.length){
    html += '<div class="table-wrap"><table><thead><tr><th>客户</th><th>状态</th><th>备注</th>'+(isAdmin?'<th>利润/损耗</th>':'')+'<th>创建时间</th><th>操作</th></tr></thead><tbody>';
    filtered.forEach(function(o){
      var totalWaste = (o.items||[]).reduce(function(s,it){ return s + (parseInt(it.waste)||0); }, 0);
      var profit = calcOrderProfit(o);
      var profitColor = profit >= 0 ? 'var(--success)' : 'var(--danger)';
      var opHtml = '<button class="btn btn-primary btn-sm" onclick="viewOrder(\''+o.id+'\')">查看</button>';
      html += '<tr><td>'+orderIdCell(o.id)+'<br>'+(o.customerName||'-')+'<br><span style="font-size:11px;color:var(--text-muted)">'+(o.phone||'')+'</span></td><td>'+statusTag(o.status)+'</td><td>'+(o.remark||'-')+'</td>'+(isAdmin?'<td style="text-align:center"><div style="font-weight:600;color:'+profitColor+'">'+money(profit)+'</div><div style="font-size:11px;color:var(--text-muted)">损耗 '+money(totalWaste)+'</div></td>':'')+'<td>'+formatOrderDateTime(o.createdAt)+'</td><td style="text-align:center">'+opHtml+'</td></tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-text">暂无留仓订单</div></div>';
  }

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

/* ============ 待收尾款（首页入口） ============ */
function renderCollectBalance(){
  var isAdmin = currentUser.role === 'admin';
  var keyword = window._balanceKeyword || '';
  var orders = DB.get('orders');
  if(!isAdmin) orders = orders.filter(function(o){ return o.salesId === currentUser.id; });
  var list = orders.filter(function(o){
    // 仅定金订单有尾款，全款订单不纳入待收尾款
    return getOrderRemaining(o) > 0 && (parseInt(o.deposit) || 0) > 0;
  });
  if(keyword){
    var kw = keyword.toLowerCase();
    list = list.filter(function(o){
      return (o.id||'').toLowerCase().indexOf(kw) >= 0 ||
        (o.customerName||'').indexOf(keyword) >= 0 ||
        (o.phone||'').indexOf(keyword) >= 0;
    });
  }
  list = list.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
  var totalBalance = list.reduce(function(s,o){ return s + getOrderRemaining(o); }, 0);

  var html = '<div class="card"><div class="card-title"><span class="title-text">💵 待收尾款</span>';
  html += '<span style="margin-left:auto;font-size:13px;color:var(--text-muted)">待收尾款合计 <b style="color:var(--warning);font-size:15px">'+money(totalBalance)+'</b></span></div>';
  html += '<div class="filter-bar"><div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="搜索订单号/客户/电话" value="'+keyword+'" oninput="window._balanceKeyword=this.value;renderCollectBalance()"></div></div>';

  if(list.length){
    html += '<div class="table-wrap"><table><thead><tr><th>客户</th><th>订单金额</th><th>已收</th><th>尾款余额</th><th>操作</th></tr></thead><tbody>';
    list.forEach(function(o){
      var total = parseInt(o.total) || 0;
      var remaining = getOrderRemaining(o);
      var paid = total - remaining;
      html += '<tr>' +
        '<td>'+ (o.customerName||'-') +'<br><span style="font-size:11px;color:var(--text-muted)">'+(o.phone||'')+'</span></td>' +
        '<td style="font-weight:600">'+money(total)+'</td>' +
        '<td>'+money(paid)+'</td>' +
        '<td style="font-weight:600;color:var(--warning)">'+money(remaining)+'</td>' +
        '<td><button class="btn btn-primary btn-sm" onclick="openAddPayment(\''+o.id+'\', true)">去收款</button></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
  } else {
    html += '<div class="empty-state"><div class="empty-icon">💵</div><div class="empty-text">暂无待收尾款订单</div></div>';
  }
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function changeUserRole(userId, role){
  if(currentUser.role !== 'admin'){ showToast('仅管理员可修改角色','error'); return; }
  if(userId === currentUser.id){ showToast('不能修改自己的角色','error'); return; }
  var users = DB.get('users');
  var idx = users.findIndex(function(u){ return u.id === userId; });
  if(idx >= 0){
    users[idx].role = role;
    DB.set('users', users);
    if(window._sbpbClient){
      window._sbpbClient.from('users').update({ role: role }).eq('id', userId)
        .then(function(){ showToast('用户角色已更新','success'); })
        .catch(function(e){ showToast('本地已更新，云端失败：' + (e.message||''), 'warning'); });
    } else {
      showToast('用户角色已更新','success');
    }
    renderSettings();
  }
}

/* ============ 利润结算辅助函数 ============ */
function getProfitDate(order){
  // 留仓/上门订单以完成日期为准
  if((order.type === 'warehouse' || order.type === 'door') && order.completionDate){
    return order.completionDate;
  }
  // 常规订单以履约日期为准
  if(order.fulfillmentDate) return order.fulfillmentDate;
  return order.orderDate || order.createdAt || '';
}

// 导出全量备份（JSON 下载）
function exportBackup(){
  const tables = ['users','customers','products','orders','aftersales','payments','commissions','audit_log'];
  const data = {};
  tables.forEach(t => { data[t] = DB.get(t) || []; });
  data._exportedAt = nowStr();
  data._version = '1.0';
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'soms-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('备份已导出到下载目录','success');
}

// 导入恢复备份：用备份文件覆盖本地及云端全部数据
function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      const tables = ['users','customers','products','orders','aftersales','payments','commissions','audit_log'];
      tables.forEach(t => { if(Array.isArray(data[t])) DB.set(t, data[t]); });
      showToast('备份已导入，正在同步到云端...','success');
      await DB.pushToCloud();
      showToast('恢复完成','success');
      renderSettings();
    }catch(e){
      showToast('备份文件解析失败：' + e.message, 'error');
    } finally {
      input.value = '';
    }
  };
  reader.readAsText(file);
}

    'ALTER TABLE users ENABLE ROW LEVEL SECURITY;\n' +

    'ALTER TABLE products ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "anon_all_products" ON products FOR ALL TO anon USING (true) WITH CHECK (true);\n' +
    'ALTER TABLE orders ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "anon_all_orders" ON orders FOR ALL TO anon USING (true) WITH CHECK (true);\n' +
    'ALTER TABLE aftersales ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "anon_all_aftersales" ON aftersales FOR ALL TO anon USING (true) WITH CHECK (true);\n' +
    'ALTER TABLE payments ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "anon_all_payments" ON payments FOR ALL TO anon USING (true) WITH CHECK (true);\n' +
    'ALTER TABLE commissions ENABLE ROW LEVEL SECURITY;\n' +
    'CREATE POLICY "anon_all_commissions" ON commissions FOR ALL TO anon USING (true) WITH CHECK (true);\n' +
    'CREATE TABLE IF NOT EXISTS audit_log (\n' +
    '  id text PRIMARY KEY,\n' +
    '  created_at text,\n' +

async function renderDashboard2(){

  const orders = DB.get('orders');

  let html = `<div class="card"><div class="card-title"><span class="title-text">📊 销售看板</span></div>`;
  html += `<div style="margin-bottom:16px;display:flex;gap:8px">`;

  html += `<button class="btn btn-sm ${window._dash2Period==='month'?'btn-primary':'btn-secondary'}" onclick="window._dash2Period='month';renderDashboard2()">本月</button>`;
  html += `</div>`;

  const period = window._dash2Period || 'today';
  const monthStart = today.slice(0,7) + '-01';
  const filterDate = period === 'today' ? today : monthStart;

  const filteredOrders = orders.filter(o => (o.orderDate || o.createdAt||'').slice(0,10) >= filterDate);
  const salesMap = {};
  users.forEach(u => { salesMap[u.id] = {name:u.name, orderCount:0, revenue:0, profit:0}; });
  let totalRevenue = 0, totalProfit = 0, totalOrders = 0;

  filteredOrders.forEach(o => {
    if(!salesMap[o.salesId]) return;
    const s = salesMap[o.salesId];
    s.orderCount++;
    totalOrders++;
    (o.items||[]).forEach(it => {
      const prod = products.find(p => p.id === it.productId);
      const cost = (it.cost != null) ? it.cost : (prod ? (prod.cost||0) : 0);
      const rev = it.price * it.qty;
      const prof = rev - cost * it.qty;
      s.revenue += rev;
      s.profit += prof;
      totalRevenue += rev;
      totalProfit += prof;
    });
  });

  html += `<div class="stat-grid">`;

  html += `<div class="stat-card"><div class="stat-label">总订单数</div><div class="stat-value">${num(totalOrders)}</div></div>`;
  html += `</div>`;

  html += `<div class="table-wrap"><table><thead><tr><th>销售员</th><th>订单数</th><th>营业额</th><th>利润</th></tr></thead><tbody>`;
  const sorted = Object.values(salesMap).sort((a,b) => b.revenue - a.revenue);
  sorted.forEach(s => {
    html += `<tr><td>${escapeHtml(s.name)}</td><td>${s.orderCount}</td><td>${money(s.revenue)}</td><td>${money(s.profit)}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // TOP3 ranking
  const top3 = sorted.slice(0,3);
  if(top3.length){
    const badgeColors = ['#FFD700','#C0C0C0','#CD7F32'];
    const badgeLabels = ['🥇','🥈','🥉'];
    html += `<div class="card" style="margin-top:16px"><div class="card-title"><span class="title-text">🏆 当日营业额TOP3</span></div>`;
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap">`;
    top3.forEach((s,i) => {
      html += `<div style="text-align:center;min-width:100px;padding:12px 16px;border-radius:8px;background:${badgeColors[i]}22;border:1px solid ${badgeColors[i]}44">`;
      html += `<div style="font-size:20px;margin-bottom:4px">${badgeLabels[i]}</div>`;
      html += `<div style="font-weight:600;font-size:14px">${escapeHtml(s.name)}</div>`;
      html += `<div style="font-size:13px;color:var(--text-muted)">${money(s.revenue)}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  html += `</div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function setProfitQuickDate(type){
  var d = new Date();
  var today = todayStr();
  if(type === 'today'){
    window._prStart = today; window._prEnd = today;
  }else if(type === 'yesterday'){
    d.setDate(d.getDate()-1);
    var yd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    window._prStart = yd; window._prEnd = yd;
  }else if(type === 'week'){
    var day = d.getDay() || 7;
    var mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    window._prStart = mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
    window._prEnd = today;
  }else if(type === 'month'){
    window._prStart = today.slice(0,7)+'-01';
    window._prEnd = today;
  }else if(type === 'lastMonth'){
    d.setDate(0);
    var lm = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    window._prStart = lm; window._prEnd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  }
  renderProfitReport();
}

/* ============ 物流状态与一键复制 ============ */

// 物流状态标签（模拟物流流转状态）
function getLogisticsStatusTag(item){
  if(!item.trackingNo) return '<span class="tag tag-pending">待发货</span>';
  // 模拟物流状态流转：运输中→派件中→已签收
  const st = item.logisticsStatus || 'transit';
  const map = {
    'shipped': '<span class="tag" style="background:#dbeafe;color:#1d4ed8">运输中</span>',
    'transit': '<span class="tag" style="background:#dbeafe;color:#1d4ed8">运输中</span>',
    'delivering': '<span class="tag" style="background:#fef3c7;color:#92400e">派件中</span>',
    'signed': '<span class="tag tag-completed">已签收</span>'
  };
  return map[st] || map['transit'];
}

// 模拟物流状态更新（仅用于本屏展示推算，绝不落盘 / 写入本地或云端）
// 旧实现会在渲染路径里 DB.set('orders') → 触发写后重拉 → 重渲染 → 再写的无限循环（频闪）；
// 改为：把推算结果直接写进传入 order 对象的内存副本（该对象为本次渲染的局部变量，不会被持久化），不再触碰 DB。
function simulateLogisticsUpdate(order){
  if(!order || !Array.isArray(order.items)) return;
  const statusFlow = ['shipped','transit','delivering','signed'];
  const createdTime = new Date(order.createdAt || order.orderDate).getTime();
  if(isNaN(createdTime)) return;
  // 基于时间模拟：订单创建时间越久，状态越靠后（每 8 小时推进一级）
  const hoursSinceCreation = (Date.now() - createdTime) / 3600000;
  const targetIdx = Math.min(Math.floor(hoursSinceCreation / 8), statusFlow.length - 1);
  order.items.forEach(function(it){
    if(!it.trackingNo) return;
    const currentIdx = statusFlow.indexOf(it.logisticsStatus || 'shipped');
    if(targetIdx > currentIdx){
      it.logisticsStatus = statusFlow[targetIdx];
    }
  });
}

// 物流状态文本（用于列表纯文本显示）
function getLogisticsStatusText(item){
  if(!item.trackingNo) return '';
  const st = item.logisticsStatus || 'transit';
  const map = {'shipped':'运输中','transit':'运输中','delivering':'派件中','signed':'已签收'};
  return map[st] || '运输中';
}

  const order = DB.get('orders').find(o => o.id === orderId);

  let text = '';

// 复制「一键收集」实时物流汇总
function copyCollectedLogi(){
  const items = window._logiCollItems || [];
  let text = '';
  items.forEach((it, i) => {
    const tn = (it.trackingNo || '').trim();
    const el = document.getElementById('logiCollStatus_' + i);
    const st = (el && el.dataset && el.dataset.status) ? el.dataset.status.split('|')[0] : '';
    text += it.name + ' x' + it.qty + (tn ? ' #' + tn : '') + (st ? ' ' + st : '') + '\n';
  });
  text = text.trim();
  navigator.clipboard.writeText(text).then(() => showToast('物流汇总已复制','success')).catch(() => showToast('物流汇总已复制','success'));
}

// 一键复制物流信息：商品 + 数量 + #单号（单号前默认加#），自动复制到剪贴板可直接粘贴
function copyLogisticsInfo(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  let text = '';
  const missing = [];
  order.items.forEach(it => {
    const tn = (it.trackingNo || '').trim();
    if(!tn) missing.push(it.name);
    text += it.name + ' x' + it.qty + (tn ? ' #' + tn : ' #⚠️') + '\n';
  });
  text = text.trim();
  const afterCopy = (ok) => {
    if(missing.length){
      showToast('⚠️ 已复制，但'+missing.length+'个商品暂无物流单号：'+missing.join('、'), 'warning');
    } else {
      showToast(ok ? '物流信息已复制到剪贴板，可直接粘贴' : '物流信息已复制', 'success');
    }
  };
  navigator.clipboard.writeText(text).then(() => {
    afterCopy(true);
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    afterCopy(false);
  });
}

function submitChangePassword(){
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  if(!oldPass || !newPass || !confirmPass){ showToast('请填写所有字段','error'); return; }
  if(newPass !== confirmPass){ showToast('两次输入的新密码不一致','error'); return; }
  if(newPass.length < 4){ showToast('新密码至少4位','error'); return; }
  const users = DB.get('users');
  const idx = users.findIndex(u => u.id === currentUser.id);
  if(idx < 0){ showToast('账号异常','error'); return; }
  const cur = users[idx];
  (async () => {
      // 方案二(Auth)：用官方接口改密码。先校验原密码（重新登录一次），再 updateUser。
      if(window._sbpbClient && currentUser && currentUser.username){
        try{
          const { error: verr } = await window._sbpbClient.auth.signInWithPassword({
            email: currentUser.username + '@soms.local',
            password: oldPass
          });
          if(verr){ showToast('原密码错误','error'); return; }
          const { error: uerr } = await window._sbpbClient.auth.updateUser({ password: newPass });
          if(uerr){ showToast('修改失败：' + (uerr.message||''), 'error'); return; }
          closeModal();
          showToast('密码修改成功','success');
          return;
        }catch(e){ /* 落到本地兼容逻辑 */ }
      }
      // 兼容期回退（Auth 账号未迁移时）：本地 sha256 校验 + 写本地缓存
      let oldOk = false;
      try{
        const h = await hashPassword(oldPass);
        if(cur.password === h) oldOk = true;
        else if(cur.password === oldPass) oldOk = true; // 兼容旧明文
      }catch(e){ if(cur.password === oldPass) oldOk = true; }
      if(!oldOk){ showToast('原密码错误','error'); return; }
      let nh;
      try{ nh = await hashPassword(newPass); }catch(e){
        showToast('密码加密失败，请重试','error');
        return;
      }
      cur.password = nh;
      cur.updatedAt = nowStr();
      DB.set('users', users);
      logAudit({action:'change_password', targetType:'user', targetId: currentUser.id, targetLabel: currentUser.name, detail: '本人修改密码'});
      let synced = false;
      let errMsg = '';
      try{
        if(window._sbpbClient){
          try{ await DB.upsertUser(cur); synced = true; }
          catch(e1){ console.warn('单条 upsert 用户失败:', e1.message); await DB.syncTable('users'); synced = true; }
        } else { schedulePushToCloud(); }
      }catch(e){ errMsg = e.message || ''; schedulePushToCloud(); }
      closeModal();
      showToast(synced ? '密码修改成功，已同步到云端' : '密码已本地更新，但云端同步失败' + (errMsg ? '：'+errMsg : '，请稍后点“同步到云端”重试'), synced ? 'success' : 'warning');
    })();
}

// 基于字符串生成简单哈希种子（保证同一运单号生成相同结果）
function trackingHashSeed(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash |= 0;
  }
  return Math.abs(hash);
}

// 简单伪随机数生成器（可重复）
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

// 模拟物流轨迹数据生成
function generateSimulatedLogistics(trackingNo, expressCompany){

  const rand = seededRandom(seed);

    '中通快递': ['深圳转运中心','广州转运中心','上海转运中心','杭州转运中心','宁波海曙派送点','义乌派送点','金华派送点','绍兴越城营业点','嘉兴南湖派送点','台州路桥营业部'],
    '韵达快递': ['深圳转运中心','杭州转运中心','上海转运中心','宁波转运中心','温州转运中心','金华派送点','绍兴柯桥派送点','嘉兴秀洲营业点','台州椒江派送点','余姚营业部'],

    'EMS': ['深圳邮件处理中心','广州邮件处理中心','上海邮件处理中心','杭州邮件处理中心','宁波邮件处理中心','温州邮件处理中心','金华邮件处理中心','嘉兴邮件处理中心','台州邮件处理中心','绍兴邮件处理中心'],
    '德邦快递': ['深圳宝安营业部','广州白云转运中心','杭州余杭转运中心','上海松江转运中心','宁波鄞州营业部','南京江宁营业部','苏州吴中营业部','无锡惠山营业部','温州瓯海营业部','金华金东营业部'],

  };

    });
  }

  // 按时间倒序排列（最新在前）
  nodes.sort((a, b) => {
    const tA = parseLogisticsTime(a.time);
    const tB = parseLogisticsTime(b.time);
    return tB - tA;
  });

  return nodes;
}

function formatLogisticsTime(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const h = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  const s = String(date.getSeconds()).padStart(2,'0');
  return `${y}-${m}-${d} ${h}:${min}:${s}`;
}

function parseLogisticsTime(str){
  return new Date(str.replace(/-/g,'/')).getTime();
}

// 物流轨迹查询（快递100 实时接口，经 Supabase Edge Function 代理）
// 策略：真实缓存优先 → 即时展示演示轨迹（明确标注）→ 后台并行重试真实接口，成功则替换
function queryLogistics(orderId, itemIndex, trackingNo, containerEl){
  const container = containerEl || document.getElementById('logistics-timeline-container');
  if(!container) return;
  const cacheKey = 'soms_logi_' + trackingNo;

  const order = DB.get('orders').find(o => o.id === orderId);
  const it = order && order.items ? order.items[itemIndex] : null;
  const expressCompany = (it && it.expressCompany) || detectExpressCompany(trackingNo);
  const com = expressCodeOf(expressCompany) || 'auto';

  // 1）优先展示真实缓存（仅当为真实数据）
  const cached = localStorage.getItem(cacheKey);
  if(cached){
    try{
      const data = JSON.parse(cached);
      if(data && data.data && Array.isArray(data.data) && data.data.length){
        renderLogisticsTimeline(trackingNo, data, container, data.expressCompany);
        return;
      }
    }catch(e){ localStorage.removeItem(cacheKey); }
  }

  // 2）实时接口大概率不可用 → 先即时展示演示轨迹（明确标注），后台并行尝试真实接口
  renderLogisticsTimeline(trackingNo, generateSimulatedLogistics(trackingNo, expressCompany), container, expressCompany, true);

  // 3）后台尝试真实接口，成功则用真实轨迹替换
  const tryReal = function(){
    if(!KUAIDI100_PROXY){ showLogiError(container, trackingNo, '未配置物流代理'); return; }
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 5000);
    fetch(KUAIDI100_PROXY + '?num=' + encodeURIComponent(trackingNo) + '&com=' + encodeURIComponent(com), { headers:{ 'Accept':'application/json' }, signal:ctrl.signal })
      .then(function(r){ return r.json(); })
      .then(function(resp){
        clearTimeout(timer);
        if(resp && resp.status === '200' && resp.data && resp.data.length){
          try{ localStorage.setItem(cacheKey, JSON.stringify(resp)); }catch(e){}
          resp.expressCompany = reverseExpressName(resp.com) || expressCompany;
          resp.trackingNo = trackingNo;
          renderLogisticsTimeline(trackingNo, resp, container, resp.expressCompany, false);
        } else {
          // 代理未返回有效数据：保持已展示的演示轨迹，不再回退前端直连（避免密钥暴露）
        }
      })
      .catch(function(){
        clearTimeout(timer);
        // 代理请求失败：保持已展示的演示轨迹，不再回退前端直连（避免密钥暴露）
      });
  };
  tryReal();
}

// 物流查询结果仅用于展示，不修改订单状态（避免查询物流时误把订单改为已签收）

// 渲染物流时间线（兼容 快递100 返回结构，自动规整为节点数组）
function renderLogisticsTimeline(trackingNo, nodes, container, expressCompany, simulated){
  if(!container) container = document.getElementById('logistics-timeline-container');
  if(!nodes) return;
  if(nodes.data && Array.isArray(nodes.data)){ nodes = normalizeKuaidiData(nodes); }
  if(!nodes.length) return;
  expressCompany = expressCompany || (nodes.expressCompany) || detectExpressCompany(trackingNo);

  let timelineHtml = '';
  nodes.forEach((node, idx) => {
    const isFirst = idx === 0;
    const isLast = idx === nodes.length - 1;
    const dotColor = isFirst ? 'var(--primary)' : (node.status === '已签收' ? '#10b981' : '#94a3b8');
    const textColor = isFirst ? 'var(--text)' : 'var(--text-secondary)';
    const fontWeight = isFirst ? '600' : '400';

    timelineHtml += `
      <div class="logi-timeline-node ${isFirst ? 'logi-timeline-first' : ''}">
        <div class="logi-timeline-dot" style="background:${dotColor}"></div>
        ${!isLast ? '<div class="logi-timeline-line"></div>' : ''}
        <div class="logi-timeline-content" style="color:${textColor};font-weight:${fontWeight}">
          <div class="logi-timeline-time">${node.time}</div>
          <div class="logi-timeline-station">${node.station || ''}</div>
          <div class="logi-timeline-desc">${node.description}</div>
        </div>
      </div>
    `;
  });

  const simWarn = simulated ? '<div class="logi-sim-warn">⚠ 实时物流接口暂未配置，以下为<b>演示轨迹</b>（非真实物流信息）</div>' : '';
  container.innerHTML = simWarn + `
    <div class="logi-timeline-card">
      <div class="logi-timeline-header">
        <span class="logi-timeline-title">${expressCompany}</span>
        <span class="logi-timeline-no">运单号：${trackingNo}</span>
        <button class="btn btn-sm" style="margin-left:auto;padding:2px 8px;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);border-radius:4px;cursor:pointer" onclick="clearLogisticsCache(escapeJsStr(trackingNo))">清除缓存</button>
      </div>
      <div class="logi-timeline-body">
        ${timelineHtml}
      </div>
    </div>
  `;
}

// 快递100 返回数据 → 时间线节点
function normalizeKuaidiData(real){
  const list = (real && real.data) || [];
  return list.map(d => ({
    time: d.ftime || d.time || '',
    station: '',
    status: mapKuaidiStatus(d.status, d.context),
    description: d.context || d.desc || ''
  }));
}
function mapKuaidiStatus(st, ctx){
  const s = (st || '').toString();
  if(s.indexOf('签收') >= 0 || s.indexOf('妥投') >= 0) return '已签收';
  if(s.indexOf('派送') >= 0) return '派送中';
  if(s.indexOf('揽') >= 0 || s.indexOf('收件') >= 0) return '已揽件';
  if(s.indexOf('疑难') >= 0 || s.indexOf('问题') >= 0) return '问题件';
  if(s.indexOf('退') >= 0) return '退签';
  return '运输中';
}
function showLogiError(container, trackingNo, msg){
  if(!container) container = document.getElementById('logistics-timeline-container');
  if(!container) return;
  const safe = (msg || '物流查询失败').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  container.innerHTML = `
    <div class="detail-note">⚠ ${safe}
      <button class="btn btn-sm" style="margin-left:8px;padding:2px 8px;font-size:11px;border:1px solid var(--border);background:var(--bg);cursor:pointer" onclick="clearLogisticsCache(escapeJsStr(trackingNo))">清除缓存</button>
    </div>`;
}

// 清除物流缓存
function clearLogisticsCache(trackingNo){
  const cacheKey = 'soms_logi_' + trackingNo;
  localStorage.removeItem(cacheKey);

// 检查并自动显示已缓存的物流轨迹
function autoShowCachedLogistics(order){
  if(!order || !order.items) return;
  const container = document.getElementById('logistics-timeline-container');
  if(!container) return;

  // 查找第一个有缓存数据的商品
  for(let i = 0; i < order.items.length; i++){
    const it = order.items[i];
    if(!it.trackingNo) continue;
    const cacheKey = 'soms_logi_' + it.trackingNo;
    const cached = localStorage.getItem(cacheKey);
    if(cached){
      try{
        const data = JSON.parse(cached);
        data.expressCompany = data.expressCompany || it.expressCompany || detectExpressCompany(it.trackingNo);
        data.trackingNo = it.trackingNo;
        renderLogisticsTimeline(it.trackingNo, data, container, data.expressCompany);
        return; // 只显示第一个有缓存的结果
      }catch(e){
        localStorage.removeItem(cacheKey);
      }
    }
  }
}

/* ============ 启动 ============ */
window.onload = async function(){
  // 显示加载指示器
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';

  // 在任何云端同步覆盖本地商品前，先备份本机当前商品（用于"以本机为准同步"按钮修复多设备数量不一致）。
  // 必须放在 syncFromCloud 之前：本机 178 来自旧版本最后一次写入，新版首拉云端会把它覆盖成云端的 590。
  try { window._preSyncLocalProducts = JSON.parse(localStorage.getItem('soms_products') || '[]'); } catch(e){ window._preSyncLocalProducts = []; }

  try{
    // 从 Supabase 同步所有数据到 localStorage 缓存
    await DB.syncFromCloud();
  }catch(e){
    console.warn('云端同步出错，将使用本地缓存:', e.message);
  }

  // 初始化预置数据（仅在缓存为空时填充种子数据）
  initData();

  // 清理脏数据：订单号 id 为 'x' 的测试订单（客户/商品均为空），启动时自动从本地移除并标记已删除，防止被同步拉回
  try{
    const orders = DB.get('orders');
    if(orders.some(o => o.id === 'x')){
      DB.set('orders', orders.filter(o => o.id !== 'x'));
      const delKey = 'soms__deletedOrderIds';
      const set = JSON.parse(localStorage.getItem(delKey) || '[]');
      if(!set.includes('x')) set.push('x');
      localStorage.setItem(delKey, JSON.stringify(set));
      console.log('已自动清理脏数据订单 id=x');
    }
  }catch(e){ console.warn('清理脏数据订单 id=x 失败:', e.message); }

  // 清理重复商品：Excel 多次导入会产生同名商品，启动时自动按名称保留最新的一条
  cleanupDuplicateProducts();
  // 清理重复登录账号：先把本地重复账号禁用，避免推送到云端时产生同名账号
  cleanupDuplicateUsers();
  // 清理重复客户：与商品/账号同源，避免重复客户
  cleanupDuplicateCustomers();

  // 双向同步：把本地（含新建/修改）数据推送到云端，确保多端/多销售可见。
  // 合并策略本地优先，不会覆盖其他端的订单。RLS 需在 Supabase 关闭才能正常读写。
  try{
    await DB.pushToCloud();
  }catch(e){
    console.warn('推送到云端失败:', e.message);
    showToast('首次同步到云端失败，请检查网络后点“同步到云端”按钮','error');
  }

  // 再从云端拉取一次，拿到云端商品基准列表后做一次云端对齐去重，
  // 防止"云端已清理到 180 条，但本地缓存仍有 333 条重复变体"导致数量虚高。
  try{
    await DB.syncFromCloud();
    cleanupDuplicateProducts(window._lastCloudProducts);
    cleanupDuplicateUsers();
    cleanupDuplicateCustomers();
  }catch(e){
    console.warn('云端对齐去重失败:', e.message);
  }

  // 恢复正常登录流程
  // 优先用 Supabase Auth 会话恢复登录（方案二）
  if(window._sbpbClient){
    try{
      const { data: sess } = await window._sbpbClient.auth.getSession();
      if(sess && sess.session && sess.session.user){
        const meta = (sess.session.user.app_metadata) || {};
        const uname = meta.username || '';
        if(uname){ await finishLoginViaAuth(uname); return; }
      }
    }catch(e){ /* 客户端未就绪，走下方 sessionStorage 兜底 */ }
  }
  const saved = sessionStorage.getItem('soms_current_user');
  if(saved){
    try{ currentUser = JSON.parse(saved); showApp(); }catch(e){}
  }else{
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('appPage').style.display = 'none';
  }
  document.getElementById('loginPass').addEventListener('keydown', e => {
    if(e.key === 'Enter') handleLogin();
  });
  document.getElementById('loginUser').addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('loginPass').focus();
  });
};

/* ===================== 多设备编辑冲突处理 ===================== */
// 查询云端该订单是否有更新（updatedAt 晚于本地）
async function checkOrderCloudConflict(orderId, localUpdatedAt){
  try{
    const url = SUPABASE_URL + '/rest/v1/orders?id=eq.' + encodeURIComponent(orderId) + '&select=updatedAt,status';
    const res = await fetch(url, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
    if(!res.ok) return null;
    const arr = await res.json();
    if(!arr || !arr.length) return null;
    const serverUpdatedAt = arr[0].updatedAt;
    if(!serverUpdatedAt) return null;
    if(serverUpdatedAt > (localUpdatedAt || '')) return { newer: true, serverUpdatedAt: serverUpdatedAt };
    return null;
  }catch(e){ return null; }
}

// 冲突弹窗：覆盖 / 放弃 / 取消，返回 Promise<boolean>
function showConflictModal(serverUpdatedAt){
  return new Promise(function(resolve){
    window._conflictUseServer = false;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'conflictModal';
    overlay.style.zIndex = 10001;
    overlay.innerHTML = '<div class="modal-box" style="max-width:440px">'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:10px">⚠️ 数据冲突提示</div>'
      + '<div style="font-size:13px;color:var(--text-muted);line-height:1.7;margin-bottom:16px">'
      + '该订单已于 <b style="color:var(--text)">' + escapeHtml(String(serverUpdatedAt||'')) + '</b> 被其他设备/账号修改过。'
      + '若继续保存，将以你当前看到的版本<b>覆盖</b>云端最新数据。请确认是否要继续。'
      + '</div>'
      + '<div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">'
      + '<button class="btn btn-secondary" onclick="closeConflictModal(false)">取消保存</button>'
      + '<button class="btn btn-secondary" onclick="closeConflictModal(\'server\')">放弃我的修改</button>'
      + '<button class="btn btn-primary" onclick="closeConflictModal(true)">用我的修改覆盖</button>'
      + '</div></div>';
    document.body.appendChild(overlay);
    window._conflictResolve = function(v){
      overlay.remove();
      if(v === 'server'){ window._conflictUseServer = true; resolve(true); }
      else if(v === true){ window._conflictUseServer = false; resolve(true); }
      else { resolve(false); }
    };
  });
}
function closeConflictModal(v){ if(window._conflictResolve) window._conflictResolve(v); }

/* ===================== 订单列表虚拟滚动（管理员端） ===================== */
// 仅当某表格行数超过阈值时启用窗口化渲染，上千条订单流畅滚动且不破坏嵌套子表
function initAdminListVirtualScroll(){
  const ids = ['adminPendingTbody','adminConfirmedTbody','adminSimpleTbody'];
  const THRESHOLD = 120;
  const VIEWPORT = 560;
  window.__vsMaps = window.__vsMaps || {};
  ids.forEach(function(id){
    const tbody = document.getElementById(id);
    if(!tbody) return;
    const wrap = tbody.closest('.table-wrap');
    if(!wrap) return;
    // 清理旧状态
    wrap.style.maxHeight = '';
    wrap.style.overflowY = '';
    wrap.onscroll = null;
    const rows = Array.from(tbody.querySelectorAll(':scope > tr'));
    if(rows.length <= THRESHOLD){ delete window.__vsMaps[id]; return; }
    const heights = rows.map(function(tr){ return tr.offsetHeight || 44; });
    const htmls = rows.map(function(tr){ return tr.outerHTML; });
    window.__vsMaps[id] = { heights: heights, htmls: htmls };
    wrap.style.maxHeight = VIEWPORT + 'px';
    wrap.style.overflowY = 'auto';
    wrap.onscroll = function(){ applyVirtualScroll(id); };
    applyVirtualScroll(id);
  });
}
function applyVirtualScroll(id){
  const vm = (window.__vsMaps||{})[id];
  const tbody = document.getElementById(id);
  const wrap = tbody && tbody.closest('.table-wrap');
  if(!vm || !tbody || !wrap) return;
  const scrollTop = wrap.scrollTop;
  const viewport = wrap.clientHeight || 560;
  // 定位起始行（累计高度）
  let acc = 0, start = 0;
  while(start < vm.heights.length && acc + vm.heights[start] <= scrollTop){ acc += vm.heights[start]; start++; }
  let end = start, accEnd = acc;
  const target = scrollTop + viewport + 240; // overscan
  while(end < vm.heights.length && accEnd < target){ accEnd += vm.heights[end]; end++; }
  start = Math.max(0, start - 4);
  end = Math.min(vm.heights.length, end + 4);
  const topH = vm.heights.slice(0, start).reduce(function(a,b){return a+b;}, 0);
  const bottomH = vm.heights.slice(end).reduce(function(a,b){return a+b;}, 0);
  let out = '';
  if(topH > 0) out += '<tr style="height:'+topH+'px"><td colspan="20" style="padding:0;border:0;height:'+topH+'px"></td></tr>';
  for(let i=start;i<end;i++) out += vm.htmls[i];
  if(bottomH > 0) out += '<tr style="height:'+bottomH+'px"><td colspan="20" style="padding:0;border:0;height:'+bottomH+'px"></td></tr>';
  tbody.innerHTML = out;
}

    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isSafari = /^((?!chrome|android|crios|fxios|edg).)*safari/i.test(ua);
    if(isIOS && isSafari && !window.navigator.standalone && !localStorage.getItem('ios_install_dismissed')){
      setTimeout(function(){

        bar.id = 'ios-install-banner';

          + '<button onclick="var b=document.getElementById(\'ios-install-banner\');if(b)b.remove();localStorage.setItem(\'ios_install_dismissed\',\'1\')" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer">知道了</button>';

<div id="newVersionModal" style="display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.45);align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:14px;max-width:360px;width:86%;padding:26px 22px;box-shadow:0 16px 48px rgba(0,0,0,.3);text-align:center;">
    <div style="font-size:42px;margin-bottom:6px">🚀</div>
    <div style="font-size:17px;font-weight:700;color:#111">发现新版本</div>
    <div id="newVersionText" style="font-size:13px;color:#666;margin:10px 0 20px;line-height:1.6">已有新版本发布，点击更新以加载最新功能与修复</div>
    <button id="newVersionRefresh" style="width:100%;padding:12px;border:none;background:#0958d9;color:#fff;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;">立即更新</button>
    <button id="newVersionClose" style="width:100%;margin-top:10px;padding:11px;border:1px solid #d9d9d9;background:#fff;color:#666;border-radius:9px;font-size:14px;cursor:pointer;">稍后再说</button>
  </div>
</div>
<script>
(function(){
  // 版本号单一数据源：直接读取页面顶栏 #headerVersion
  var APP_VERSION = ((document.getElementById('headerVersion')||{}).textContent || '').trim() || '2026-0809-3';
  window.APP_VERSION = APP_VERSION;
  function doRefresh(){
    try{
      if(navigator.serviceWorker){ navigator.serviceWorker.getRegistrations().then(function(regs){ (regs||[]).forEach(function(r){ r.unregister(); }); }); }
      if(window.caches){ caches.keys().then(function(ks){ (ks||[]).forEach(function(k){ caches.delete(k); }); }); }
    }catch(e){}
    setTimeout(function(){ location.reload(true); }, 300);
  }
  function showBanner(ver){
    var b=document.getElementById('newVersionModal');
    var t=document.getElementById('newVersionText');
    if(b&&t){ t.textContent='已发布新版本 v'+ver+'，点击更新以加载最新功能与修复'; b.style.display='flex'; }
  }
  function checkNewVersion(){
    fetch('./version.json?t='+Date.now(), {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.version && d.version !== APP_VERSION){ showBanner(d.version); } })
      .catch(function(){});
  }
  document.addEventListener('DOMContentLoaded', function(){
    var rf=document.getElementById('newVersionRefresh'); if(rf) rf.onclick=doRefresh;
    var cl=document.getElementById('newVersionClose'); if(cl) cl.onclick=function(){ var b=document.getElementById('newVersionModal'); if(b) b.style.display='none'; };
    checkNewVersion();
  });
})();
</script>
