          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="confirmBatchImport()">开始导入</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalContainer').innerHTML = modalHtml;
}

// 确认批量导入
function confirmBatchImport(){
  const data = document.getElementById('batchImportData').value.trim();
  const category = document.getElementById('batchImportCategory').value.trim();
  if(!data){ showToast('请粘贴商品数据','error'); return; }
  const products = DB.get('products');
  let successCount = 0, failCount = 0;
  const lines = data.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  lines.forEach(line => {
    // 支持 Tab 或多个空格分隔
    const parts = line.split(/\t+|\s{2,}|\s/).map(s => s.trim()).filter(Boolean);
    if(parts.length < 2){ failCount++; return; }
    const name = parts[0];
    const price = parseInt(parts[1]);
    const cost = parts[2] ? parseInt(parts[2]) : 0;
    if(!name || isNaN(price) || price < 0){ failCount++; return; }
    if(isNaN(cost) || cost < 0){ failCount++; return; }
    products.push({
      id: 'p' + Date.now() + Math.random().toString(36).slice(2,6),
      name: name,
      category: category || '',
      price: price,
      cost: cost,
      status: 'on',
      createdAt: nowStr()
    });
    successCount++;
  });
  DB.set('products', products);
  closeModal();
  showToast('导入完成：成功 '+successCount+' 条，失败 '+failCount+' 条','success');
  renderProducts();
}

// 批量删除：切换批量删除模式
function batchDeleteProducts(){
  if(window._productBatchMode){
    // 退出批量删除模式
    window._productBatchMode = false;
    window._productSelectedIds = {};
  }else{
    // 进入批量删除模式
    window._productBatchMode = true;
    window._productSelectedIds = {};

}

function toggleProductSelect(productId, checked){
  if(!window._productSelectedIds) window._productSelectedIds = {};
  if(checked){

}

function confirmBatchDeleteProducts(){

function saveProduct(){
  const id = document.getElementById('productId').value;
  const name = document.getElementById('productName').value.trim();
  const category = document.getElementById('productCategory').value.trim();
  const price = parseInt(document.getElementById('productPrice').value);
  const cost = parseInt(document.getElementById('productCost').value);
  if(!name){ showToast('请输入商品名称','error'); return; }
  if(isNaN(price) || price < 0){ showToast('请输入有效售价','error'); return; }
  if(isNaN(cost) || cost < 0){ showToast('请输入有效成本','error'); return; }

  const products = DB.get('products');
  if(id){
    const idx = products.findIndex(p => p.id === id);
    if(idx >= 0){
      products[idx] = {...products[idx], name, category, price, cost};
      delete products[idx].auto_added;
    }
  }else{
    products.push({
      id: DB.uid('p_'), name, category, price, cost, status:'on'
    });
  }
  DB.set('products', products);
  closeModal();
  showToast('商品保存成功','success');
  renderProducts();
}

function toggleProductStatus(productId){
  const products = DB.get('products');
  const idx = products.findIndex(p => p.id === productId);
  if(idx >= 0){
    products[idx].status = products[idx].status === 'on' ? 'off' : 'on';
    DB.set('products', products);
    showToast(products[idx].status==='on'?'商品已上架':'商品已下架','success');
    renderProducts();
  }
}

/* ============ 销售提成 ============ */
function calcCommission(order, salesRate){
  var profit = calcOrderProfit(order);
  return Math.round(profit * (salesRate / 100));
}

function renderCommissions(){
  var isAdmin = currentUser.role === 'admin';
  var users = DB.get('users');
  var salesUsers = users.filter(function(u){ return u.role === 'sales'; });
  var orders = DB.get('orders');

  if(!window._comStart) window._comStart = todayStr().slice(0,7)+'-01';
  if(!window._comEnd) window._comEnd = todayStr();
  if(!window._comSalesId) window._comSalesId = '';
  if(!window._comRateMin) window._comRateMin = '';
  if(!window._comRateMax) window._comRateMax = '';

  var rateMgmtHtml = '';
  if(isAdmin){
    rateMgmtHtml = `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title"><span class="title-text">⚙️ 提成比例设置</span></div>

                  '<td><button class="btn btn-primary btn-sm" onclick="saveCommissionRate(\''+u.id+'\')">保存</button></td></tr>';
              }).join('')}
            </tbody>
          </table>
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;padding:0 4px">提示：比例修改仅影响后续已完成订单的提成计算，不会追溯历史记录。</div>
      </div>
    `;
  }

  var filterHtml = `
    <div class="card" style="margin-bottom:16px;padding:16px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
        ${isAdmin ? `
          <div class="form-group" style="margin:0">
            <label class="form-label" style="font-size:12px">销售人员</label>
            <select class="form-control" style="width:auto" onchange="window._comSalesId=this.value">
              <option value="">全部</option>
              ${salesUsers.map(function(u){ return '<option value="'+u.id+'" '+(window._comSalesId===u.id?'selected':'')+'>'+u.name+'</option>'; }).join('')}
            </select>
          </div>
        ` : ''}
        <div class="form-group" style="margin:0">
          <label class="form-label" style="font-size:12px">开始日期</label>
          <input type="date" class="form-control" style="width:auto" value="${window._comStart}" onchange="window._comStart=this.value">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label" style="font-size:12px">结束日期</label>
          <input type="date" class="form-control" style="width:auto" value="${window._comEnd}" onchange="window._comEnd=this.value">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label" style="font-size:12px">提成比例(%)</label>
          <div style="display:flex;gap:4px;align-items:center">
            <input type="number" class="form-control" style="width:70px" placeholder="最小" value="${window._comRateMin}" onchange="window._comRateMin=this.value">
            <span style="color:var(--text-muted)">~</span>
            <input type="number" class="form-control" style="width:70px" placeholder="最大" value="${window._comRateMax}" onchange="window._comRateMax=this.value">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" onclick="renderCommissions()">查询</button>
        ${isAdmin ? '<button class="btn btn-secondary btn-sm" onclick="exportCommissionCSV()">📥 导出CSV</button>' : ''}
      </div>
    </div>
  `;

  var startD = window._comStart;
  var endD = window._comEnd;

  var completedOrders = orders.filter(function(o){ return o.status === 'completed'; });
  if(!isAdmin){
    completedOrders = completedOrders.filter(function(o){ return o.salesId === currentUser.id; });
  } else if(window._comSalesId){
    completedOrders = completedOrders.filter(function(o){ return o.salesId === window._comSalesId; });
  }
  completedOrders = completedOrders.filter(function(o){
    var pd = getProfitDate(o);
    if(!pd) return false;
    return pd >= startD && pd <= endD;
  });

  var details = completedOrders.map(function(o){
    var user = users.find(function(u){ return u.id === o.salesId; });
    var rate = (user && user.commission_rate != null) ? user.commission_rate : 9;
    var netProfit = calcOrderProfit(o);
    var lossDeduction = o.afterSaleLoss || 0;
    var originalProfit = netProfit + lossDeduction;
    var commission = calcCommission(o, rate);
    return {
      orderId: o.id,
      salesName: o.salesName || (user ? user.name : '-'),
      customerName: o.customerName,
      completionDate: getProfitDate(o),
      originalProfit: originalProfit,
      lossDeduction: lossDeduction,
      commissionBase: netProfit,
      rate: rate,
      commission: commission
    };
  });

  var filteredDetails = details.filter(function(d){
    if(window._comRateMin !== '' && d.rate < parseFloat(window._comRateMin)) return false;
    if(window._comRateMax !== '' && d.rate > parseFloat(window._comRateMax)) return false;
    return true;
  });
  filteredDetails.sort(function(a,b){ return (b.completionDate||'').localeCompare(a.completionDate||''); });

  var totalProfit = filteredDetails.reduce(function(s,d){ return s + d.originalProfit; }, 0);

  var totalBase = filteredDetails.reduce(function(s,d){ return s + d.commissionBase; }, 0);

  var summaryHtml = `

      <div class="stat-card"><div class="stat-label">总提成金额</div><div class="stat-value" style="color:var(--primary)">${money(totalCommission)}</div></div>
    </div>
  `;

  var cols = isAdmin ? 9 : 7;
  var detailHtml = `
    <div class="card">
      <div class="card-title"><span class="title-text">📋 提成明细</span></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              ${isAdmin ? '<th>销售</th>' : ''}
              <th>订单号</th>
              <th>客户</th>
              <th>完成日期</th>
              <th>原始利润</th>
              <th>损耗扣减</th>
              <th>提成基数</th>
              <th>比例</th>
              <th>提成金额</th>
            </tr>
          </thead>
          <tbody>
            ${filteredDetails.length ? filteredDetails.map(function(d){
              return '<tr>' +
                (isAdmin ? '<td>'+d.salesName+'</td>' : '') +
                '<td><a class="btn-link" onclick="viewOrder(\''+d.orderId+'\')">'+d.orderId+'</a></td>' +
                '<td>'+(d.customerName||'-')+'</td>' +
                '<td>'+(d.completionDate||'-')+'</td>' +
                '<td>'+money(d.originalProfit)+'</td>' +
                '<td style="color:var(--danger)">'+money(d.lossDeduction)+'</td>' +
                '<td style="font-weight:600">'+money(d.commissionBase)+'</td>' +
                '<td>'+d.rate+'%</td>' +
                '<td style="font-weight:600;color:var(--primary)">'+money(d.commission)+'</td>' +
                '</tr>';
            }).join('') : '<tr><td colspan="'+cols+'" class="table-empty">暂无符合条件的提成记录</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;

  var html = `
    <div class="card">
      <div class="card-title"><span class="title-text">🏆 销售提成</span></div>
    </div>
    ${rateMgmtHtml}
    ${filterHtml}
    ${summaryHtml}
    ${detailHtml}
  `;
  document.getElementById('mainContent').innerHTML = html;
}

function saveCommissionRate(userId){
  var el = document.getElementById('rate_' + userId);
  if(!el) return;
  var rate = parseFloat(el.value);
  if(isNaN(rate) || rate < 0 || rate > 100){ showToast('请输入0-100之间的有效比例','error'); return; }
  var users = DB.get('users');
  var idx = users.findIndex(function(u){ return u.id === userId; });
  if(idx >= 0){
    users[idx].commission_rate = rate;
    DB.set('users', users);
    showToast('提成比例已更新','success');
    renderCommissions();
  }
}

function exportCommissionCSV(){
  if(currentUser.role !== 'admin'){ showToast('仅管理员可导出','error'); return; }
  var details = window._comDetails || [];
  if(!details.length){ showToast('暂无可导出数据','error'); return; }

  var csv = '\uFEFF销售,订单号,客户,完成日期,原始利润,损耗扣减,提成基数,比例(%),提成金额\n';
  details.forEach(function(d){
    csv += [d.salesName, d.orderId, d.customerName||'-', d.completionDate||'-',
            Math.round(d.originalProfit), Math.round(d.lossDeduction),
            Math.round(d.commissionBase), d.rate, Math.round(d.commission)].join(',') + '\n';
  });
  var totalProfit = details.reduce(function(s,d){ return s + d.originalProfit; }, 0);
  var totalLoss = details.reduce(function(s,d){ return s + d.lossDeduction; }, 0);
  var totalBase = details.reduce(function(s,d){ return s + d.commissionBase; }, 0);
  var totalCommission = details.reduce(function(s,d){ return s + d.commission; }, 0);
  csv += '合计,,,,,' + Math.round(totalProfit) + ',' + Math.round(totalLoss) + ',' + Math.round(totalBase) + ',' + Math.round(totalCommission) + '\n';

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '销售提成明细_'+window._comStart+'_'+window._comEnd+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV文件已导出','success');
}

function generateCommissions(){
  const period = document.getElementById('comPeriod').value;
  const rate = parseInt(document.getElementById('comRate').value);
  if(!period){ showToast('请选择提成周期','error'); return; }
  if(isNaN(rate) || rate <= 0 || rate > 100){ showToast('请输入有效提成比例(0-100)','error'); return; }

  const selected = Array.from(document.querySelectorAll('.com-order-cb:checked')).map(cb => cb.value);
  if(selected.length === 0){ showToast('请至少选择一个订单','error'); return; }

  const orders = DB.get('orders');
  const commissions = DB.get('commissions');
  selected.forEach(orderId => {
    const order = orders.find(o => o.id === orderId);
    if(order){
      commissions.push({
        id: DB.uid('com_'),
        salesId: order.salesId,
        salesName: order.salesName,
        orderId: order.id,
        customerName: order.customerName,
        amount: Math.round(order.total * rate / 100),
        rate,
        period,
        status: 'unsettled',
        createdAt: nowStr()
      });
    }
  });
  DB.set('commissions', commissions);
  closeModal();
  showToast('成功生成 '+selected.length+' 条提成记录','success');
  renderCommissions();
}

function settleCommission(commissionId){
  const commissions = DB.get('commissions');
  const idx = commissions.findIndex(c => c.id === commissionId);
  if(idx >= 0){
    commissions[idx].status = 'settled';
    DB.set('commissions', commissions);
    showToast('提成已结算','success');
    renderCommissions();
  }
}

// 售后详情损耗预览
function calcDetailLossPreview(orderId, oldLoss){
  const orders = DB.get('orders');
  const order = orders.find(o => o.id === orderId);
  const lossEl = document.getElementById('asLossInput');
  const previewEl = document.getElementById('detailLossPreview');
  if(!order || !lossEl || !previewEl) return;
  const newLoss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  const adjustedProfit = origProfit + oldLoss - newLoss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 修改后：'+
    '<strong style="color:'+(adjustedProfit>=0?'var(--success)':'var(--danger)')+'">'+money(adjustedProfit)+'</strong></span>';
}

// 保存售后详情（备注 + 物流单号 + 管理员可编辑损耗并重新核算利润）
function saveAftersaleDetail(id){
  const isAdmin = currentUser.role === 'admin';
  const remark = document.getElementById('asRemark').value.trim();
  const trackingNo = document.getElementById('asTrackingNo').value.trim();
  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }

  const oldLoss = aftersales[idx].loss || 0;
  aftersales[idx].remark = remark;
  aftersales[idx].trackingNo = trackingNo;
  aftersales[idx].updatedAt = nowStr();

  // 管理员可随时编辑损耗金额，保存后重新核算利润
  if(isAdmin){
    const lossEl = document.getElementById('asLossInput');
    if(lossEl){
      const newLoss = parseFloat(lossEl.value) || 0;
      if(newLoss < 0){ showToast('售后损耗不能为负数','error'); return; }
      aftersales[idx].loss = newLoss;

      // 财务联动：重新核算原订单利润（先减旧损耗再加新损耗）
      const orders = DB.get('orders');
      const oIdx = orders.findIndex(o => o.id === aftersales[idx].orderId);
      if(oIdx >= 0){
        orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
        orders[oIdx].afterSaleLossSyncedAt = nowStr();
        DB.set('orders', orders);
      }
    }
  }

  DB.set('aftersales', aftersales);
  showToast(isAdmin ? '售后信息已保存，利润已重新核算' : '售后备注与物流单号已保存','success');
  closeModal();
  renderAftersales();
}

// 损耗预览：展示原利润 -> 扣减后利润
function calcAfterSaleLossPreview(){
  const order = window._aftersaleSelectedOrder;
  const lossEl = document.getElementById('aftersaleLoss');
  const previewEl = document.getElementById('lossPreview');
  if(!order || !lossEl || !previewEl) return;
  const loss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  const newProfit = origProfit - loss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 扣减后：'+
    '<strong style="color:'+(newProfit>=0?'var(--success)':'var(--danger)')+'">'+money(newProfit)+'</strong></span>';
}

// 搜索订单（全部状态历史订单；销售仅检索自己创建的订单）
function searchOrdersForAftersale(keyword){
  const results = document.getElementById('orderSearchResults');
  if(!keyword || !keyword.trim()){ results.style.display='none'; return; }
  let orders = DB.get('orders');
  const isAdmin = currentUser.role === 'admin';
  if(!isAdmin){
    orders = orders.filter(o => o.salesId === currentUser.id);
  }
  const matched = orders.filter(o =>
    (o.id||'').toLowerCase().includes(keyword.toLowerCase()) ||
    (o.customerName||'').includes(keyword) ||
    (o.contact||'').includes(keyword) ||
    (o.phone||'').includes(keyword) ||
    (o.address||'').includes(keyword) ||
    (o.region||'').includes(keyword) ||
    (o.items||[]).some(it => (it.name||'').includes(keyword))
  ).slice(0, 10);

  if(matched.length === 0){
    results.innerHTML = '<div class="ps-empty">未找到匹配订单</div>';
  }else{
    results.innerHTML = matched.map(o => `
      <div class="ps-item" onclick="selectOrderForAftersale('${o.id}')">
        <div>
          <div style="font-weight:500">${o.id} · ${o.customerName}</div>
          <div style="font-size:12px;color:var(--text-muted)">${o.phone||''} ${o.address||''}</div>
        </div>
        <button class="btn btn-primary btn-sm">选择</button>
      </div>
    `).join('');
  }
  results.style.display = 'block';
}

      <div><strong>地址：</strong>${order.region||''} ${order.address||''}</div>
    </div>

// 售后图片处理
function handleAftersaleImage(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    aftersaleImages.push(e.target.result);
    renderAftersaleImagePreview();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function renderAftersaleImagePreview(){
  const el = document.getElementById('aftersaleImagePreview');
  if(!el) return;
  el.innerHTML = aftersaleImages.map((img,i)=>`
    <div class="image-thumb-wrap">
      <img src="${img}" class="image-thumb" onclick="viewImage('${img}')">
      <div class="image-thumb-remove" onclick="removeAftersaleImage(${i})">×</div>
    </div>
  `).join('');
}

function removeAftersaleImage(i){
  aftersaleImages.splice(i,1);
  renderAftersaleImagePreview();
}

// 提交售后（含损耗金额 + 利润联动扣减；销售提交时损耗为0，由管理员后续补充）
function submitAftersale(){
  const isAdmin = currentUser.role === 'admin';
  const order = window._aftersaleSelectedOrder;
  if(!order){ showToast('请选择关联订单','error'); return; }
  const checkedCbs = Array.from(document.querySelectorAll('.aftersale-item-cb:checked'));
  if(checkedCbs.length === 0){ showToast('请选择需要售后的商品','error'); return; }
  const reason = document.getElementById('aftersaleReason').value.trim();
  if(!reason){ showToast('请填写售后原因','error'); return; }
  // 销售看不到损耗输入框，默认0；管理员填写损耗
  const lossEl = document.getElementById('aftersaleLoss');
  const loss = lossEl ? (parseFloat(lossEl.value) || 0) : 0;
  if(loss < 0){ showToast('售后损耗不能为负数','error'); return; }

  const selectedItems = checkedCbs.map(cb => {
    const i = parseInt(cb.value);
    return { productId: order.items[i].productId, name: order.items[i].name, qty: order.items[i].qty };
  });

  const aftersales = DB.get('aftersales');
  const newAS = {
    id: 'AS' + todayStr().replace(/-/g,'') + String(Math.floor(Math.random()*9000)+1000),
    orderId: order.id,
    customerName: order.customerName,
    phone: order.phone,
    salesId: order.salesId,
    salesName: order.salesName,
    items: selectedItems,
    reason,
    loss,
    images: aftersaleImages,
    status: 'pending',
    createdAt: nowStr()
  };
  aftersales.push(newAS);
  DB.set('aftersales', aftersales);

  // 财务联动：原销售订单利润扣减售后损耗金额（仅管理员填写损耗时生效）
  if(isAdmin && loss > 0){
    const orders = DB.get('orders');
    const oIdx = orders.findIndex(o => o.id === order.id);
    if(oIdx >= 0){
      orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) + loss;
      orders[oIdx].afterSaleLossSyncedAt = nowStr();
      DB.set('orders', orders);
    }
    showToast('售后已创建，原订单利润已扣减损耗 '+money(loss)+' 元','success');
  }else{
    showToast('售后已提交，等待管理员处理','success');
  }
  closeModal();
  renderAftersales();
}

// 编辑损耗预览
function calcEditLossPreview(orderId, oldLoss){
  const orders = DB.get('orders');
  const order = orders.find(o => o.id === orderId);
  const lossEl = document.getElementById('editAsLoss');
  const previewEl = document.getElementById('editLossPreview');
  if(!order || !lossEl || !previewEl) return;
  const newLoss = parseFloat(lossEl.value) || 0;
  const origProfit = calcOrderProfit(order);
  // 原利润需要加回旧损耗再减新损耗
  const adjustedProfit = origProfit + oldLoss - newLoss;
  previewEl.innerHTML = '<span style="color:var(--text-muted)">原订单利润：'+money(origProfit)+' → 修改后：'+
    '<strong style="color:'+(adjustedProfit>=0?'var(--success)':'var(--danger)')+'">'+money(adjustedProfit)+'</strong></span>';
}

// 保存售后编辑（修改损耗后重新核算利润）
function saveAftersaleEdit(id){
  const reason = document.getElementById('editAsReason').value.trim();
  if(!reason){ showToast('售后原因不能为空','error'); return; }
  const newLoss = parseFloat(document.getElementById('editAsLoss').value) || 0;
  const newStatus = document.getElementById('editAsStatus').value;

  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }
  const oldLoss = aftersales[idx].loss || 0;
  const orderId = aftersales[idx].orderId;

  aftersales[idx].reason = reason;
  aftersales[idx].loss = newLoss;
  aftersales[idx].status = newStatus;
  aftersales[idx].updatedAt = nowStr();
  DB.set('aftersales', aftersales);

  // 财务联动：重新核算原订单利润（先减旧损耗再加新损耗）
  const orders = DB.get('orders');
  const oIdx = orders.findIndex(o => o.id === orderId);
  if(oIdx >= 0){
    orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
    orders[oIdx].afterSaleLossSyncedAt = nowStr();
    DB.set('orders', orders);
  }

  showToast('售后信息已更新，利润已重新核算','success');
  closeModal();
  renderAftersales();
}

function updateAftersaleStatus(id, status){
  const aftersales = DB.get('aftersales');
  const idx = aftersales.findIndex(a => a.id === id);
  if(idx < 0){ showToast('售后记录不存在','error'); return; }
  const isAdmin = currentUser.role === 'admin';
  const oldLoss = aftersales[idx].loss || 0;

  // 更新状态
  aftersales[idx].status = status;
  aftersales[idx].updatedAt = nowStr();

  // 同步保存弹窗中已填写的损耗金额、备注、物流单号，避免切换状态时丢失
  const remarkEl = document.getElementById('asRemark');
  const trackingEl = document.getElementById('asTrackingNo');
  if(remarkEl) aftersales[idx].remark = remarkEl.value.trim();
  if(trackingEl) aftersales[idx].trackingNo = trackingEl.value.trim();

  if(isAdmin){
    const lossEl = document.getElementById('asLossInput');
    if(lossEl){
      const newLoss = parseFloat(lossEl.value) || 0;
      if(newLoss < 0){ showToast('售后损耗不能为负数','error'); return; }
      aftersales[idx].loss = newLoss;
      // 财务联动：重新核算原订单利润
      const orders = DB.get('orders');
      const oIdx = orders.findIndex(o => o.id === aftersales[idx].orderId);
      if(oIdx >= 0){
        orders[oIdx].afterSaleLoss = (orders[oIdx].afterSaleLoss || 0) - oldLoss + newLoss;
        orders[oIdx].afterSaleLossSyncedAt = nowStr();
        DB.set('orders', orders);
      }
    }
  }

  DB.set('aftersales', aftersales);
  showToast('售后状态已更新，损耗金额已同步保留','success');
  closeModal();
  renderAftersales();
}

  showConfirm('确定关闭此售后记录吗？', () => {

}

  var viewMode = window._scheduleView || 'calendar';

  var html = '<div class="card"><div class="card-title">';

  html += '<button class="btn btn-sm '+(viewMode==='calendar'?'btn-primary':'btn-secondary')+'" onclick="window._scheduleView=\'calendar\';renderSchedule()">日历视图</button>';
  html += '<button class="btn btn-sm '+(viewMode==='list'?'btn-primary':'btn-secondary')+'" onclick="window._scheduleView=\'list\';renderSchedule()">列表视图</button>';
  html += '</div></div>';

  if(viewMode === 'calendar'){
    var parts = currentMonth.split('-');
    var year = parseInt(parts[0]);
    var month = parseInt(parts[1]);
    var firstDay = new Date(year, month-1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();

    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0">';
    var prevMonth = month === 1 ? (year-1)+'-12' : year+'-'+String(month-1).padStart(2,'0');
    var nextMonth = month === 12 ? (year+1)+'-01' : year+'-'+String(month+1).padStart(2,'0');
    html += '<button class="btn btn-secondary btn-sm" onclick="window._scheduleMonth=\''+prevMonth+'\';renderSchedule()">◀ 上月</button>';
    html += '<span style="font-size:16px;font-weight:600">'+year+'年'+month+'月</span>';
    html += '<button class="btn btn-secondary btn-sm" onclick="window._scheduleMonth=\''+nextMonth+'\';renderSchedule()">下月 ▶</button>';
    html += '</div>';

    var orderMap = {};
    orders.forEach(function(o){
      var date = o.orderDate || (o.createdAt||'').slice(0,10);
      if(date && date.indexOf(currentMonth) === 0){
        if(!orderMap[date]) orderMap[date] = [];
        orderMap[date].push(o);
      }
    });

    html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px">';
    var weekDays = ['日','一','二','三','四','五','六'];
    weekDays.forEach(function(d){
      html += '<div style="text-align:center;padding:6px;font-weight:600;color:var(--text-muted);font-size:13px">'+d+'</div>';
    });
    for(var i = 0; i < firstDay; i++){ html += '<div></div>'; }
    for(var d = 1; d <= daysInMonth; d++){
      var dateStr = currentMonth + '-' + String(d).padStart(2,'0');
      var dayOrders = orderMap[dateStr] || [];
      var isToday = dateStr === todayStr();
      var clickFn = dayOrders.length ? 'showScheduleDayOrders(\''+dateStr+'\')' : '';
      html += '<div onclick="'+clickFn+'" style="min-height:60px;padding:4px;border:1px solid '+(isToday?'var(--primary)':'var(--border)')+';border-radius:4px;cursor:'+(dayOrders.length?'pointer':'default')+';background:'+(isToday?'var(--primary-light)':'#fff')+'">';
      html += '<div style="font-size:12px;font-weight:'+(isToday?'700':'400')+'">'+d+'</div>';
      if(dayOrders.length){
        html += '<div style="margin-top:2px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary)"></span>';

          dayOrders.forEach(function(o){

          html += '<div style="font-size:10px;color:var(--primary);margin-top:2px">'+dayOrders.length+'个订单</div>';
        }
        html += '</div>';
      }

    html += '</div>';

    html += '<div id="scheduleDayOrders" style="margin-top:16px"></div>';

    var monthOrders = orders.filter(function(o){
      var date = o.orderDate || (o.createdAt||'').slice(0,10);

    } else {

    }
    html += '</tbody></table></div>';
  }

  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

    totalOrders++;
    (o.items||[]).forEach(it => {
      const prod = products.find(p => p.id === it.productId);
      const cost = prod ? (prod.cost||0) : 0;
      const rev = it.price * it.qty;
      const prof = rev - cost * it.qty;
      s.revenue += rev;
      s.profit += prof;
      totalRevenue += rev;
      totalProfit += prof;
    });
  });

  html += `<div class="stat-grid">`;
  html += `<div class="stat-card"><div class="stat-label">总营业额</div><div class="stat-value">${money(totalRevenue)}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">总利润</div><div class="stat-value">${money(totalProfit)}</div></div>`;
  html += `<div class="stat-card"><div class="stat-label">总订单数</div><div class="stat-value">${num(totalOrders)}</div></div>`;
  html += `</div>`;

  html += `<div class="table-wrap"><table><thead><tr><th>销售员</th><th>订单数</th><th>营业额</th><th>利润</th></tr></thead><tbody>`;
  const sorted = Object.values(salesMap).sort((a,b) => b.revenue - a.revenue);
  sorted.forEach(s => {
    html += `<tr><td>${s.name}</td><td>${s.orderCount}</td><td>${money(s.revenue)}</td><td>${money(s.profit)}</td></tr>`;
  });
  html += `</tbody></table></div>`;

  // TOP3 ranking
  const top3 = sorted.slice(0,3);
  if(top3.length){
    const badgeColors = ['#FFD700','#C0C0C0','#CD7F32'];
    const badgeLabels = ['🥇','🥈','🥉'];
    html += `<div class="card" style="margin-top:16px"><div class="card-title"><span class="title-text">🏆 当日营业额TOP3</span></div>`;
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap">`;
    top3.forEach((s,i) => {
      html += `<div style="text-align:center;min-width:100px;padding:12px 16px;border-radius:8px;background:${badgeColors[i]}22;border:1px solid ${badgeColors[i]}44">`;
      html += `<div style="font-size:20px;margin-bottom:4px">${badgeLabels[i]}</div>`;
      html += `<div style="font-weight:600;font-size:14px">${s.name}</div>`;
      html += `<div style="font-size:13px;color:var(--text-muted)">${money(s.revenue)}</div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  }

  html += `</div>`;
  document.getElementById('mainContent').innerHTML = html;
}

function showProfitDrillDown(idx){
  var info = (window._prDrillDownKeys || [])[idx];
  if(!info) return;
  var orders = DB.get('orders');
  var products = DB.get('products');
  var isAdmin = currentUser.role === 'admin';
  var startD = window._prStart;
  var endD = window._prEnd;

  var filteredOrders = orders.filter(function(o){
    var pd = getProfitDate(o);
    if(!pd) return false;
    if(pd < startD || pd > endD) return false;
    if(!isAdmin && o.salesId !== currentUser.id) return false;
    if(isAdmin && window._prSalesId && o.salesId !== window._prSalesId) return false;
    if(window._prProduct){
      var kw = window._prProduct.toLowerCase();
      return (o.items||[]).some(function(it){ return (it.name||'').toLowerCase().indexOf(kw) >= 0; });
    }
    return true;
  });

  if(info.type === 'sales'){
    filteredOrders = filteredOrders.filter(function(o){ return o.salesId === info.key; });
  } else if(info.type === 'product'){
    filteredOrders = filteredOrders.filter(function(o){
      return (o.items||[]).some(function(it){ return (it.productId||it.name) === info.key; });
    });
  } else if(info.type === 'date'){
    filteredOrders = filteredOrders.filter(function(o){ return getProfitDate(o) === info.key; });
  }

  var modalHtml = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal lg">
        <div class="modal-header">
          <h3>📋 ${info.title} - 订单明细</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          ${filteredOrders.length ? `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>客户</th>
                    <th>完成日期</th>
                    <th>营业额</th>
                    ${isAdmin ? '<th>成本</th>' : ''}
                    <th>利润</th>
                  </tr>
                </thead>
                <tbody>
                  ${filteredOrders.map(function(o){
                    var profit = calcOrderProfit(o);
                    var cost = (o.items||[]).reduce(function(s,it){
                      var prod = products.find(function(p){ return p.id === it.productId; });
                      return s + (prod?(prod.cost||0):0) * it.qty;
                    }, 0);
                    return '<tr>' +
                      '<td><a class="btn-link" onclick="closeModal();viewOrder(\''+o.id+'\')">'+o.id+'</a></td>' +

                  }).join('')}

          ` : '<div style="padding:40px;text-align:center;color:var(--text-muted)">暂无订单数据</div>'}

        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalContainer').innerHTML = modalHtml;
}

function setProfitQuickDate(type){
  var d = new Date();
  var today = todayStr();
  if(type === 'today'){
    window._prStart = today; window._prEnd = today;
  }else if(type === 'yesterday'){
    d.setDate(d.getDate()-1);
    var yd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    window._prStart = yd; window._prEnd = yd;
  }else if(type === 'week'){
    var day = d.getDay() || 7;
    var mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    window._prStart = mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
    window._prEnd = today;
  }else if(type === 'month'){
    window._prStart = today.slice(0,7)+'-01';
    window._prEnd = today;
  }else if(type === 'lastMonth'){
    d.setDate(0);
    var lm = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
    window._prStart = lm; window._prEnd = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
  }
  renderProfitReport();
}

    var pd = getProfitDate(o);
    if(!pd) return false;
    if(pd < startD || pd > endD) return false;
    if(!isAdmin && o.salesId !== currentUser.id) return false;
    if(isAdmin && window._prSalesId && o.salesId !== window._prSalesId) return false;
    if(window._prProduct){
      var kw = window._prProduct.toLowerCase();
      return (o.items||[]).some(function(it){ return (it.name||'').toLowerCase().indexOf(kw) >= 0; });
    }
    return true;
  });

  var csv = '\uFEFF';

  if(window._prTab === 'sales'){
    csv += '销售员,订单数,营业额,' + (isAdmin?'成本,':'') + '损耗,净利润,提成\n';
    var salesMap = {};
    filteredOrders.forEach(function(o){
      if(!salesMap[o.salesId]){
        var user = users.find(function(u){ return u.id === o.salesId; });
        salesMap[o.salesId] = { name: o.salesName||(user?user.name:'-'), orderCount:0, revenue:0, cost:0, loss:0, profit:0, commission:0, orderList:[] };
      }
      var s = salesMap[o.salesId];
      s.orderCount++;
      s.orderList.push(o);
      (o.items||[]).forEach(function(it){
        var prod = products.find(function(p){ return p.id === it.productId; });
        var cost = prod ? (prod.cost||0) : 0;
        s.revenue += it.price * it.qty;
        s.cost += cost * it.qty;
        s.profit += it.price * it.qty - cost * it.qty - (it.waste||0);
      });
      s.loss += o.afterSaleLoss || 0;
      s.profit -= (o.afterSaleLoss || 0);
    });
    Object.keys(salesMap).forEach(function(sid){
      var user = users.find(function(u){ return u.id === sid; });
      var rate = (user && user.commission_rate != null) ? user.commission_rate : 9;
      salesMap[sid].commission = salesMap[sid].orderList.reduce(function(sum, o){ return sum + calcCommission(o, rate); }, 0);
    });
    Object.keys(salesMap).map(function(k){ return salesMap[k]; }).sort(function(a,b){ return b.profit - a.profit; }).forEach(function(s){
      csv += s.name + ',' + s.orderCount + ',' + Math.round(s.revenue) + ',';
      if(isAdmin) csv += Math.round(s.cost) + ',';
      csv += Math.round(s.loss) + ',' + Math.round(s.profit) + ',' + Math.round(s.commission) + '\n';
    });
  } else if(window._prTab === 'product'){
    csv += '商品名称,分类,销量,营业额,' + (isAdmin?'成本,':'') + '利润\n';
    var productMap = {};
    filteredOrders.forEach(function(o){
      (o.items||[]).forEach(function(it){
        var key = it.productId || it.name;
        if(!productMap[key]){
          var prod = products.find(function(p){ return p.id === it.productId; });
          productMap[key] = { name:it.name, category:prod?prod.category:'-', qty:0, revenue:0, cost:0, profit:0 };
        }
        var p = productMap[key];
        var prod2 = products.find(function(p2){ return p2.id === it.productId; });
        var cost = prod2 ? (prod2.cost||0) : 0;
        p.qty += it.qty;
        p.revenue += it.price * it.qty;
        p.cost += cost * it.qty;
        p.profit += it.price * it.qty - cost * it.qty - (it.waste||0);
      });
    });
    Object.keys(productMap).map(function(k){ var p = productMap[k]; p.k = k; return p; }).sort(function(a,b){ return b.profit - a.profit; }).forEach(function(p){
      csv += '"' + p.name.replace(/"/g,'""') + '",' + p.category + ',' + p.qty + ',' + Math.round(p.revenue) + ',';
      if(isAdmin) csv += Math.round(p.cost) + ',';
      csv += Math.round(p.profit) + '\n';
    });
  } else {
    csv += '日期,订单数,营业额,' + (isAdmin?'成本,':'') + '损耗,利润\n';
    var dateMap = {};
    filteredOrders.forEach(function(o){
      var pd = getProfitDate(o);
      if(!pd) return;
      if(!dateMap[pd]) dateMap[pd] = { date:pd, count:0, revenue:0, cost:0, loss:0, profit:0 };
      var d = dateMap[pd];
      d.count++;
      (o.items||[]).forEach(function(it){
        var prod = products.find(function(p){ return p.id === it.productId; });
        var cost = prod ? (prod.cost||0) : 0;
        d.revenue += it.price * it.qty;
        d.cost += cost * it.qty;
        d.profit += it.price * it.qty - cost * it.qty - (it.waste||0);
      });
      d.loss += o.afterSaleLoss || 0;
      d.profit -= (o.afterSaleLoss || 0);
    });
    Object.keys(dateMap).map(function(k){ return dateMap[k]; }).sort(function(a,b){ return a.date.localeCompare(b.date); }).forEach(function(d){
      csv += d.date + ',' + d.count + ',' + Math.round(d.revenue) + ',';
      if(isAdmin) csv += Math.round(d.cost) + ',';
      csv += Math.round(d.loss) + ',' + Math.round(d.profit) + '\n';
    });
  }

  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '利润报表_'+window._prTab+'_'+startD+'_'+endD+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV文件已导出','success');
}

// 物流状态标签（模拟物流流转状态）
function getLogisticsStatusTag(item){
  if(!item.trackingNo) return '<span class="tag tag-pending">待发货</span>';
  // 模拟物流状态流转：运输中→派件中→已签收
  const st = item.logisticsStatus || 'transit';
  const map = {
    'shipped': '<span class="tag" style="background:#dbeafe;color:#1d4ed8">运输中</span>',
    'transit': '<span class="tag" style="background:#dbeafe;color:#1d4ed8">运输中</span>',
    'delivering': '<span class="tag" style="background:#fef3c7;color:#92400e">派件中</span>',
    'signed': '<span class="tag tag-completed">已签收</span>'
  };
  return map[st] || map['transit'];
}

// 模拟物流状态更新（每次查看时随机推进）
function simulateLogisticsUpdate(orderId){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  const order = orders[idx];
  let changed = false;
  const statusFlow = ['shipped','transit','delivering','signed'];
  order.items.forEach(it => {
    if(!it.trackingNo) return;
    const currentIdx = statusFlow.indexOf(it.logisticsStatus || 'shipped');
    // 基于时间模拟：订单创建时间越久，状态越靠后
    const hoursSinceCreation = (Date.now() - new Date(order.createdAt||order.orderDate).getTime()) / 3600000;
    const targetIdx = Math.min(Math.floor(hoursSinceCreation / 8), statusFlow.length - 1);
    if(targetIdx > currentIdx){
      it.logisticsStatus = statusFlow[targetIdx];
      changed = true;
    }
  });
  if(changed) DB.set('orders', orders);
}

// 物流状态文本（用于列表纯文本显示）
function getLogisticsStatusText(item){
  if(!item.trackingNo) return '';
  const st = item.logisticsStatus || 'transit';
  const map = {'shipped':'运输中','transit':'运输中','delivering':'派件中','signed':'已签收'};
  return map[st] || '运输中';
}

// 一键复制订单信息（客户信息+商品+物流单号#开头，无单号加⚠️）
function copyOrderInfo(orderId){
  const order = DB.get('orders').find(o => o.id === orderId);
  if(!order){ showToast('订单不存在','error'); return; }
  let text = '';
  // 客户信息
  text += '客户：' + (order.contact || order.customerName || '') + ' ' + (order.phone || '') + '\n';
  text += '地址：' + (order.region || '') + (order.address || '') + '\n';
  text += '---\n';
  // 商品信息+物流单号
  order.items.forEach(it => {
    text += it.name + ' x' + it.qty + ' ¥' + it.price;
    if(it.trackingNo){
      text += ' #' + it.trackingNo.trim();
    } else {
      text += ' ⚠️';
    }
    text += '\n';
  });
  navigator.clipboard.writeText(text).then(() => {
    showToast('订单信息已复制到剪贴板','success');
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('订单信息已复制','success');
  });
}

// 基于字符串生成简单哈希种子（保证同一运单号生成相同结果）
function trackingHashSeed(str){
  let hash = 0;
  for(let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash |= 0;
  }
  return Math.abs(hash);
}

// 简单伪随机数生成器（可重复）
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

    // 选择不重复的站点
    let stationIdx;
    do {
      stationIdx = Math.floor(rand() * stations.length);
    } while(usedStationIndices.includes(stationIdx) && usedStationIndices.length < stations.length);
    usedStationIndices.push(stationIdx);

    const hoursAgo = i * (4 + Math.floor(rand() * 12));
    const time = new Date(now.getTime() - hoursAgo * 3600000);
    const status = statuses[i] || '已揽件';

    nodes.push({
      time: formatLogisticsTime(time),
      station: stations[stationIdx],
      status: status,
      description: statusDescs[status] || status
    });
  }

  // 按时间倒序排列（最新在前）
  nodes.sort((a, b) => {
    const tA = parseLogisticsTime(a.time);
    const tB = parseLogisticsTime(b.time);
    return tB - tA;
  });

  return nodes;
}

function formatLogisticsTime(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  const h = String(date.getHours()).padStart(2,'0');
  const min = String(date.getMinutes()).padStart(2,'0');
  const s = String(date.getSeconds()).padStart(2,'0');
  return `${y}-${m}-${d} ${h}:${min}:${s}`;
}

function parseLogisticsTime(str){
  return new Date(str.replace(/-/g,'/')).getTime();
}

// 物流轨迹查询
function queryLogistics(orderId, itemIndex, trackingNo){
  const container = document.getElementById('logistics-timeline-container');
  if(!container) return;

  // 显示加载中
  container.innerHTML = `
    <div style="text-align:center;padding:20px;color:var(--text-muted)">
      <span style="display:inline-block;width:16px;height:16px;border:2px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px;vertical-align:middle"></span>
      正在查询物流信息...
    </div>
  `;

  // 检查缓存
  const cacheKey = 'soms_logi_' + trackingNo;
  const cached = localStorage.getItem(cacheKey);
  if(cached){
    setTimeout(() => {
      try{
        const data = JSON.parse(cached);
        renderLogisticsTimeline(trackingNo, data, container);
        syncOrderStatusFromLogistics(orderId, data);
      }catch(e){
        localStorage.removeItem(cacheKey);
        queryLogistics(orderId, itemIndex, trackingNo);
      }
    }, 300);
    return;
  }

  // 模拟网络延迟
  const delay = 600 + Math.random() * 800;
  setTimeout(() => {
    const expressCompany = detectExpressCompany(trackingNo);
    const data = generateSimulatedLogistics(trackingNo, expressCompany);

    // 缓存结果
    try{
      localStorage.setItem(cacheKey, JSON.stringify(data));
    }catch(e){}

    data.expressCompany = expressCompany;
    data.trackingNo = trackingNo;
    renderLogisticsTimeline(trackingNo, data, container);
    syncOrderStatusFromLogistics(orderId, data);
  }, delay);
}

// 物流查询结果同步订单状态：已签收时自动更新订单状态
function syncOrderStatusFromLogistics(orderId, data){
  if(!orderId || !data || !data.length) return;
  // 检查最新节点（第一条）是否为"已签收"
  const latestNode = data[0];
  if(latestNode && latestNode.status === '已签收'){
    const orders = DB.get('orders');
    const idx = orders.findIndex(o => o.id === orderId);
    if(idx >= 0){
      // 更新订单状态为已签收（仅当当前状态为运输中或已下单时）
      if(orders[idx].status === 'shipped' || orders[idx].status === 'confirmed'){
        orders[idx].status = 'received';
        orders[idx].receivedAt = nowStr();
        DB.set('orders', orders);
        showToast('物流已签收，订单状态已自动更新为"已签收"','success');
        // 刷新当前页面
        if(typeof renderOrders === 'function' && (currentRoute === 'orders' || currentRoute === 'order-detail')){
          renderOrders();
        }
      }
      // 同步更新商品的物流状态
      orders[idx].items.forEach(it => {
        if(it.trackingNo) it.logisticsStatus = 'signed';
      });
      DB.set('orders', orders);
    }
  }
}

// 渲染物流时间线
function renderLogisticsTimeline(trackingNo, data, container){
  if(!container) container = document.getElementById('logistics-timeline-container');
  if(!container || !data || !data.length) return;

  const expressCompany = data.expressCompany || detectExpressCompany(trackingNo);

  let timelineHtml = '';
  data.forEach((node, idx) => {
    const isFirst = idx === 0;
    const isLast = idx === data.length - 1;
    const dotColor = isFirst ? 'var(--primary)' : (node.status === '已签收' ? '#10b981' : '#94a3b8');
    const textColor = isFirst ? 'var(--text)' : 'var(--text-secondary)';
    const fontWeight = isFirst ? '600' : '400';

    timelineHtml += `
      <div class="logi-timeline-node ${isFirst ? 'logi-timeline-first' : ''}">
        <div class="logi-timeline-dot" style="background:${dotColor}"></div>
        ${!isLast ? '<div class="logi-timeline-line"></div>' : ''}
        <div class="logi-timeline-content" style="color:${textColor};font-weight:${fontWeight}">
          <div class="logi-timeline-time">${node.time}</div>
          <div class="logi-timeline-station">${node.station}</div>
          <div class="logi-timeline-desc">${node.description}</div>
        </div>
      </div>
    `;
  });

  container.innerHTML = `
    <div class="logi-timeline-card">
      <div class="logi-timeline-header">
        <span class="logi-timeline-title">${expressCompany}</span>
        <span class="logi-timeline-no">运单号：${trackingNo}</span>
        <button class="btn btn-sm" style="margin-left:auto;padding:2px 8px;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);border-radius:4px;cursor:pointer" onclick="clearLogisticsCache('${trackingNo}')">清除缓存</button>
      </div>
      <div class="logi-timeline-body">
        ${timelineHtml}
      </div>
    </div>
  `;
}

// 清除物流缓存
function clearLogisticsCache(trackingNo){
  const cacheKey = 'soms_logi_' + trackingNo;
  localStorage.removeItem(cacheKey);
  showToast('物流缓存已清除','info');
  const container = document.getElementById('logistics-timeline-container');
  if(container) container.innerHTML = '';
}

// 检查并自动显示已缓存的物流轨迹
function autoShowCachedLogistics(order){
  if(!order || !order.items) return;
  const container = document.getElementById('logistics-timeline-container');
  if(!container) return;

  // 查找第一个有缓存数据的商品
  for(let i = 0; i < order.items.length; i++){
    const it = order.items[i];
    if(!it.trackingNo) continue;
    const cacheKey = 'soms_logi_' + it.trackingNo;
    const cached = localStorage.getItem(cacheKey);
    if(cached){
      try{
        const data = JSON.parse(cached);
        data.expressCompany = data.expressCompany || it.expressCompany || detectExpressCompany(it.trackingNo);
        data.trackingNo = it.trackingNo;
        renderLogisticsTimeline(it.trackingNo, data, container);
        return; // 只显示第一个有缓存的结果
      }catch(e){
        localStorage.removeItem(cacheKey);
      }
    }
  }
}

/* ============ 启动 ============ */
window.onload = async function(){
  // 显示加载指示器
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('appPage').style.display = 'none';

  try{
    // 从 Supabase 同步所有数据到 localStorage 缓存
    await DB.syncFromCloud();
  }catch(e){
    console.warn('云端同步出错，将使用本地缓存:', e.message);
  }

  // 初始化预置数据（仅在缓存为空时填充种子数据）
  initData();

  // 如果是首次运行且写入了种子数据，推送到 Supabase
  const users = DB.get('users', null);
  if(users && users.length > 0){
    try{
      // 检查 Supabase 是否已有数据（如果刚同步过且为空，说明是首次）
      const { data: cloudUsers, error } = await window._sbpbClient.from('users').select('id').limit(1);
      if(!error && (!cloudUsers || cloudUsers.length === 0)){
        // 首次运行，推送种子数据到云端
        await DB.pushToCloud();
      }
    }catch(e){
      console.warn('检测云端数据失败:', e.message);
    }
  }

  // 恢复正常登录流程
  const saved = sessionStorage.getItem('soms_current_user');
  if(saved){
    currentUser = JSON.parse(saved);
    showApp();
  }else{
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('appPage').style.display = 'none';
  }
  document.getElementById('loginPass').addEventListener('keydown', e => {
    if(e.key === 'Enter') handleLogin();
  });
  document.getElementById('loginUser').addEventListener('keydown', e => {
    if(e.key === 'Enter') document.getElementById('loginPass').focus();
  });
};
