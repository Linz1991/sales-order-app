<style>
/* ============ CSS 变量与全局样式 ============ */
:root{
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --primary-light:#eef2ff;
  --sidebar-bg:#111827;
  --sidebar-hover:#1f2937;
  --sidebar-active:#374151;
  --bg:#f9fafb;
  --card:#ffffff;
  --text:#1f2937;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --success:#10b981;
  --warning:#f59e0b;
  --danger:#ef4444;
  --info:#3b82f6;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
  --radius:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:inherit;outline:none;-webkit-user-select:text;user-select:text}
a{text-decoration:none;color:inherit}

/* ============ 登录页 ============ */
.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#4f46e5 100%);
  padding:20px;
}
.login-card{
  background:#fff;
  border-radius:16px;
  padding:40px;
  width:100%;
  max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.login-logo{
  text-align:center;
  margin-bottom:30px;
}
.login-logo .logo-icon{
  width:64px;height:64px;
  margin:0 auto 16px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:28px;font-weight:bold;
}
.login-logo h1{font-size:22px;color:var(--text);margin-bottom:6px}
.login-logo p{font-size:13px;color:var(--text-muted)}
.login-form .form-group{margin-bottom:18px}
.login-form label{display:block;margin-bottom:6px;font-size:13px;color:var(--text);font-weight:500}
.login-form input{
  width:100%;padding:11px 14px;
  border:1px solid var(--border);border-radius:var(--radius);
  font-size:14px;transition:.2s;
}
.login-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.btn-login{
  width:100%;padding:12px;
  background:var(--primary);color:#fff;
  border-radius:var(--radius);font-size:15px;font-weight:500;
  transition:.2s;margin-top:6px;
}
.btn-login:hover{background:var(--primary-dark)}
.login-hint{
  margin-top:20px;padding:12px 14px;
  background:#f3f4f6;border-radius:var(--radius);
  font-size:12px;color:var(--text-muted);line-height:1.8;
}
.login-hint strong{color:var(--text)}

/* ============ 主布局 ============ */
.app{display:flex;min-height:100vh}

/* 侧边栏 */
.sidebar{
  width:230px;background:var(--sidebar-bg);
  color:#fff;flex-shrink:0;
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;
  z-index:100;
}
.sidebar-header{
  padding:20px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-header .brand{
  display:flex;align-items:center;gap:10px;
}
.sidebar-header .brand-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:18px;
}
.sidebar-header .brand-name{font-size:15px;font-weight:600}
.sidebar-header .brand-sub{font-size:11px;color:#9ca3af;margin-top:2px}

.sidebar-role{
  padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-role .role-label{font-size:11px;color:#9ca3af;margin-bottom:4px}
.sidebar-role .role-value{
  display:inline-flex;align-items:center;gap:6px;
  font-size:13px;font-weight:500;
}
.sidebar-role .role-tag{
  background:var(--primary);padding:2px 8px;border-radius:10px;font-size:11px;
}

.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.sidebar-nav .nav-section-title{
  padding:8px 20px;font-size:11px;color:#6b7280;
  text-transform:uppercase;letter-spacing:.5px;
}
.sidebar-nav .nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 20px;color:#d1d5db;
  font-size:14px;cursor:pointer;transition:.15s;
  border-left:3px solid transparent;
}
.sidebar-nav .nav-item:hover{background:var(--sidebar-hover);color:#fff}
.sidebar-nav .nav-item.active{
  background:var(--sidebar-active);color:#fff;
  border-left-color:var(--primary);
}
.sidebar-nav .nav-icon{font-size:16px;width:20px;text-align:center}

.sidebar-footer{
  padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);
}
.sidebar-footer .user-info{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.sidebar-footer .avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:bold;
}
.sidebar-footer .user-name{font-size:13px;font-weight:500}
.sidebar-footer .user-role{font-size:11px;color:#9ca3af}
.sidebar-footer .footer-btns{display:flex;gap:8px}
.sidebar-footer .footer-btn{
  flex:1;padding:7px;font-size:12px;
  background:rgba(255,255,255,.08);color:#d1d5db;
  border-radius:6px;transition:.15s;
}
.sidebar-footer .footer-btn:hover{background:rgba(255,255,255,.15);color:#fff}

/* 主内容区 */
.main{
  flex:1;margin-left:230px;
  display:flex;flex-direction:column;
  min-width:0;
}
.main-header{
  background:#fff;padding:16px 28px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.main-header .page-title{font-size:18px;font-weight:600}
.main-header .page-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.main-header .header-right{display:flex;align-items:center;gap:14px}
.mobile-menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:201;width:40px;height:40px;background:var(--primary);color:#fff;border-radius:8px;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.2);margin-right:12px}

.main-content{padding:24px 28px;flex:1}

/* ============ 通用组件 ============ */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px;
}
.card-title{
  font-size:15px;font-weight:600;margin-bottom:16px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .title-text{display:flex;align-items:center;gap:8px}

.btn{
  padding:8px 14px;border-radius:6px;font-size:13px;
  font-weight:500;transition:.15s;display:inline-flex;
  align-items:center;gap:6px;border:1px solid transparent;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#fff;border-color:var(--border);color:var(--text)}
.btn-secondary:hover{background:#f9fafb}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--warning);color:#fff}
.btn-warning:hover{background:#d97706}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-link{background:none;color:var(--primary);padding:4px 6px;font-size:13px}
.btn-link:hover{text-decoration:underline}
.btn-link.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;justify-content:center}

.form-group{margin-bottom:16px}
.form-label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--text)}
.form-label .required{color:var(--danger)}
.form-control{
  width:100%;padding:9px 12px;
  border:1px solid var(--border);border-radius:6px;
  font-size:14px;transition:.15s;background:#fff;
}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea.form-control{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  background:#f9fafb;text-align:left;padding:11px 14px;
  font-weight:600;color:var(--text-muted);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:#fafafa}
tbody tr:hover{background:#f3f4f6}
.table-empty{text-align:center;padding:40px;color:var(--text-muted)}

/* 状态标签 */
.tag{
  display:inline-block;padding:3px 10px;border-radius:12px;
  font-size:12px;font-weight:500;white-space:nowrap;
}
.tag-pending{background:#fef3c7;color:#92400e}
.tag-confirmed{background:#dbeafe;color:#1e40af}
.tag-shipped{background:#e0e7ff;color:#3730a3}
.tag-feedback{background:#fef3c7;color:#92400e}
.tag-feedback-done{background:#f3e8ff;color:#6b21a8}
.tag-completed{background:#d1fae5;color:#065f46}
.tag-canceled{background:#fee2e2;color:#991b1b}
.tag-paid{background:#d1fae5;color:#065f46}
.tag-unpaid{background:#fee2e2;color:#991b1b}
.tag-pending-pay{background:#fef3c7;color:#92400e}
.tag-settled{background:#d1fae5;color:#065f46}
.tag-unsettled{background:#fef3c7;color:#92400e}
.tag-onshelf{background:#d1fae5;color:#065f46}
.tag-offshelf{background:#f3f4f6;color:#6b7280}
.tag-as-pending{background:#fef3c7;color:#92400e}
.tag-as-processing{background:#dbeafe;color:#1e40af}
.tag-as-resolved{background:#d1fae5;color:#065f46}
.tag-as-closed{background:#f3f4f6;color:#6b7280}
.tag-type-normal{background:#e0e7ff;color:#3730a3}
.tag-type-warehouse{background:#fed7aa;color:#9a3412}
.tag-type-door{background:#fbcfe8;color:#9d174d}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{
  background:#fff;border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:.15s;border:1px solid transparent;
}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--primary-light)}
.stat-icon{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.stat-icon.blue{background:#dbeafe;color:#1e40af}
.stat-icon.green{background:#d1fae5;color:#065f46}
.stat-icon.purple{background:#e0e7ff;color:#3730a3}
.stat-icon.orange{background:#fed7aa;color:#9a3412}
.stat-icon.red{background:#fee2e2;color:#991b1b}
.stat-icon.cyan{background:#cffafe;color:#155e75}
.stat-info .stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.stat-info .stat-value{font-size:24px;font-weight:700;color:var(--text)}

/* 筛选栏 */
.filter-bar{
  display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
}
.filter-bar .search-box{
  flex:1;min-width:200px;position:relative;
}
.filter-bar .search-box input{
  width:100%;padding:9px 12px 9px 36px;
  border:1px solid var(--border);border-radius:6px;font-size:13px;
}
.filter-bar .search-box .search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:14px;
}
.filter-bar select{
  padding:9px 12px;border:1px solid var(--border);
  border-radius:6px;font-size:13px;background:#fff;
}

/* 双列布局 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal{
  background:#fff;border-radius:12px;
  width:100%;max-width:520px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.modal.lg{max-width:760px}
.modal.xl{max-width:900px}
.modal-box{
  background:#fff;border-radius:12px;
  width:100%;max-width:680px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{
  padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{
  background:none;font-size:22px;color:var(--text-muted);
  width:28px;height:28px;border-radius:6px;
}
.modal-close:hover{background:#f3f4f6}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{
  padding:14px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;
}

/* 提示消息 */
.toast{
  position:fixed;top:20px;right:20px;
  padding:12px 20px;border-radius:8px;
  background:#fff;box-shadow:var(--shadow-lg);
  z-index:2000;font-size:14px;
  display:flex;align-items:center;gap:8px;
  animation:slideIn .3s ease;
}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--info)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* 订单详情 */
.detail-section{margin-bottom:24px}
.detail-section h4{
  font-size:14px;font-weight:600;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
  color:var(--primary);
}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.info-item .info-label{font-size:12px;color:var(--text-muted);margin-bottom:3px}
.info-item .info-value{font-size:14px;font-weight:500}
.info-item .info-value.mono{font-family:monospace}

/* 新建订单商品搜索 */
.product-search-wrap{position:relative}
.product-search-results{
  position:absolute;top:100%;left:0;right:0;
  background:#fff;border:1px solid var(--border);
  border-radius:6px;box-shadow:var(--shadow-lg);
  max-height:260px;overflow-y:auto;z-index:10;margin-top:4px;
  overflow-x:auto;
}
.product-search-results .ps-item{
  padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;min-width:0;
}
.product-search-results .ps-item:hover{background:var(--primary-light)}
.product-search-results .ps-item:last-child{border-bottom:none}
.product-search-results .ps-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:13px}
.product-search-results .ps-item input[type=checkbox]{flex-shrink:0}
.product-search-results .ps-item div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cart-item{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr 30px;
  gap:10px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.cart-item:last-child{border-bottom:none}
.qty-control{display:flex;align-items:center;gap:6px}
.qty-control button{
  width:24px;height:24px;border-radius:4px;
  background:#f3f4f6;font-size:14px;font-weight:bold;
}
.qty-control button:hover{background:#e5e7eb}
.qty-control input{
  width:46px;text-align:center;border:1px solid var(--border);
  border-radius:4px;padding:3px 4px;font-size:13px;
}
.cart-summary{
  margin-top:14px;padding:14px;background:#f9fafb;border-radius:6px;
  display:flex;justify-content:space-between;align-items:center;
}
.cart-summary .total-label{font-size:14px;color:var(--text-muted)}
.cart-summary .total-value{font-size:22px;font-weight:700;color:var(--primary)}

/* 一键识别区 */
.recognize-box{
  background:linear-gradient(135deg,#f0f4ff,#fce7f3);
  border:1px dashed var(--primary);
  border-radius:10px;padding:16px;margin-bottom:20px;
}
.recognize-box .rec-title{
  font-size:14px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;color:var(--primary);
}
.recognize-box textarea{
  width:100%;min-height:120px;padding:12px;
  border:1px solid var(--border);border-radius:6px;
  font-size:13px;font-family:monospace;resize:vertical;
  background:#fff;
}
.recognize-box .rec-btns{
  display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;
}

/* 拍照/上传区 */
.image-upload-area{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.image-preview-list{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;
}
.image-thumb{
  width:70px;height:70px;border-radius:6px;object-fit:cover;
  border:1px solid var(--border);cursor:pointer;
}
.image-thumb-wrap{position:relative}
.image-thumb-remove{
  position:absolute;top:-6px;right:-6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;
}

/* 裁剪界面 */
.crop-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:3000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
}
.crop-canvas-wrap{
  position:relative;max-width:100%;max-height:70vh;
  margin-bottom:16px;
}
.crop-canvas-wrap canvas{
  display:block;max-width:100%;max-height:70vh;
  border:2px solid #fff;border-radius:4px;
}
.crop-select-box{
  position:absolute;border:2px dashed #fff;
  background:rgba(255,255,255,.15);pointer-events:none;
}
.crop-actions{
  display:flex;gap:12px;
}
.crop-actions button{
  padding:10px 24px;border-radius:6px;font-size:14px;font-weight:500;
}

/* 订单类型选择 */
.order-type-group{
  display:flex;gap:8px;margin-bottom:14px;
}
.order-type-option{
  flex:1;padding:8px 6px;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;text-align:center;
  transition:.15s;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;
}
.order-type-option.active{

<script>
/* ============================================================
 * 销售订单管理系统 - 演示版 2026080901
 * 单文件 HTML，localStorage 模拟数据库
 * ============================================================ */

/* ============ 全局状态 ============ */
let currentUser = null;   // 当前登录用户
let currentRoute = 'dashboard'; // 当前页面路由

/* ============ 安全辅助：密码哈希 ============ */
function hashPassword(plainText){
  if(typeof dcodeIO !== 'undefined' && dcodeIO.bcrypt){
    return dcodeIO.bcrypt.hashSync(plainText, 10);
  }
  if(typeof bcrypt !== 'undefined'){
    return bcrypt.hashSync(plainText, 10);
  }
  // 兜底：如果 CDN 加载失败，返回明文并告警（不影响现有登录）
  console.warn('bcryptjs 未加载，密码将以明文存储');
  return plainText;
}
function verifyPassword(plainText, hashed){
  if(!hashed) return false;
  if(typeof dcodeIO !== 'undefined' && dcodeIO.bcrypt){
    return dcodeIO.bcrypt.compareSync(plainText, hashed);
  }
  if(typeof bcrypt !== 'undefined'){
    return bcrypt.compareSync(plainText, hashed);
  }
  // 兜底：兼容旧明文密码
  return plainText === hashed;
}
function isHashedPassword(str){
  // bcrypt 常见前缀：$2a$/$2b$/$2x$/$2y$ 均视为已哈希
  return typeof str === 'string' && /^\$2[abxy]\$\d+\$/.test(str);
}

/* ============ 数据层：Supabase + localStorage 混合缓存 ============ */
const DB = {
  // camelCase -> snake_case 字段映射表
  _camelToSnake: {
    customerId:'customer_id', salesId:'sales_id', orderId:'order_id', salesName:'sales_name',
    customerName:'customer_name', orderDate:'order_date', createdAt:'created_at', updatedAt:'updated_at',
    payDate:'pay_date', productId:'product_id', ownerId:'owner_id', trackingNo:'tracking_no',
    paymentMethod:'payment_method', expressCompany:'express_company', commissionId:'commission_id',
    period:'period', aftersaleId:'aftersale_id', orderItemId:'order_item_id'
  },
  _snakeToCamel: {},
  // JSONB 字段（需要序列化/反序列化）
  _jsonFields: { orders:'items', aftersales:'items' },

  // 同步状态
  _syncStatus: 'idle', // idle | syncing | synced | error
  _syncError: null,

  get(key, def){
    try{
      const v = localStorage.getItem('soms_'+key);
      return v ? JSON.parse(v) : (def !== undefined ? def : []);
    }catch(e){ return def !== undefined ? def : []; }
  },
  set(key, val){
    localStorage.setItem('soms_'+key, JSON.stringify(val));
    // 火忘式异步同步到 Supabase
    this.syncTable(key).catch(function(err){
      console.warn('后台同步失败 ['+key+']:', err.message);
    });
  },
  uid(prefix){
    return (prefix||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  },

  // 将 camelCase 对象转为 snake_case（用于写入 Supabase）
  _toSnake(obj){
    const self = this;
    if(!obj || typeof obj !== 'object') return obj;
    if(Array.isArray(obj)) return obj.map(function(item){ return self._toSnake(item); });
    const result = {};
    for(const k in obj){
      const snakeKey = self._camelToSnake[k] || k;
      result[snakeKey] = obj[k];
    }
    return result;
  },

  // 将 snake_case 对象转为 camelCase（用于从 Supabase 读取）
  _toCamel(obj){
    const self = this;
    if(!obj || typeof obj !== 'object') return obj;
    if(Array.isArray(obj)) return obj.map(function(item){ return self._toCamel(item); });
    const result = {};
    for(const k in obj){
      const camelKey = self._snakeToCamel[k] || k;
      result[camelKey] = obj[k];
    }
    return result;
  },

  // 初始化 snakeToCamel 映射
  _initMapping(){
    for(const k in this._camelToSnake){
      this._snakeToCamel[this._camelToSnake[k]] = k;
    }
  },

  // 从 Supabase 加载单个表数据到 localStorage 缓存
  async _loadTable(key){
    try{
      const table = key; // key 即表名
      const { data, error } = await window._sbpbClient.from(table).select('*').order('created_at', { ascending: true });
      if(error) throw error;
      // snake_case -> camelCase
      let result = data;
      if(this._jsonFields[key]){
        // items 是 JSONB，Supabase 会自动解析
      }
      result = this._toCamel(result);
      localStorage.setItem('soms_'+key, JSON.stringify(result));
      return result;
    }catch(e){
      console.warn('从 Supabase 加载 ['+key+'] 失败:', e.message);
      return null;
    }
  },

  // 同步单个表到 Supabase
  async syncTable(key){
    if(typeof window._sbpbClient === 'undefined') return;
    const data = this.get(key, []);
    if(!data || data.length === 0){
      // 如果本地为空，尝试从云端拉取
      await this._loadTable(key);
      return;
    }
    try{
      const table = key;
      // camelCase -> snake_case
      const snakeData = this._toSnake(data);
      // 删除所有旧数据并插入新数据（全量替换）
      await window._sbpbClient.from(table).delete().neq('id', '___never_exist___');
      if(snakeData.length > 0){
        // 分批插入（每批 100 条，避免 URL 过长）
        const batchSize = 100;
        for(let i = 0; i < snakeData.length; i += batchSize){
          const batch = snakeData.slice(i, i + batchSize);
          const { error } = await window._sbpbClient.from(table).insert(batch);
          if(error) throw error;
        }
      }
      console.log('表 ['+key+'] 同步完成，共 '+data.length+' 条');
    }catch(e){
      console.warn('同步 ['+key+'] 到 Supabase 失败:', e.message);
    }
  },

  // 从 Supabase 同步所有表到 localStorage 缓存
  async syncFromCloud(){
    if(typeof window._sbpbClient === 'undefined'){
      console.warn('Supabase 未初始化，跳过云端同步');
      return;
    }
    this._initMapping();
    this._setSyncStatus('syncing');
    const tables = ['users','customers','products','orders','aftersales','payments','commissions'];
    let hasError = false;
    for(let i = 0; i < tables.length; i++){
      try{
        const result = await this._loadTable(tables[i]);
        if(result === null) hasError = true;
      }catch(e){
        console.warn('同步表 ['+tables[i]+'] 失败:', e.message);
        hasError = true;
      }
    }
    this._setSyncStatus(hasError ? 'error' : 'synced');
    return !hasError;
  },

  // 将所有本地数据推送到 Supabase
  async pushToCloud(){
    if(typeof window._sbpbClient === 'undefined') return;
    this._initMapping();
    this._setSyncStatus('syncing');
    const tables = ['users','customers','products','orders','aftersales','payments','commissions'];
    let hasError = false;
    for(let i = 0; i < tables.length; i++){
      try{
        await this.syncTable(tables[i]);
      }catch(e){
        hasError = true;
      }
    }
    this._setSyncStatus(hasError ? 'error' : 'synced');
  },

  // 同步状态管理
  _setSyncStatus(status){
    this._syncStatus = status;
    const el = document.getElementById('syncStatusBadge');
    const btn = document.getElementById('syncBtn');
    if(el){
      if(status === 'syncing'){
        el.textContent = '同步中...';
        el.style.color = '#f59e0b';
        if(btn) btn.disabled = true;
      }else if(status === 'synced'){
        el.textContent = '已同步';
        el.style.color = '#10b981';
        if(btn) btn.disabled = false;
      }else if(status === 'error'){
        el.textContent = '同步失败';
        el.style.color = '#ef4444';
        if(btn) btn.disabled = false;
      }else{
        el.textContent = '未同步';
        el.style.color = '#6b7280';
        if(btn) btn.disabled = false;
      }
    }
  },

  getSyncStatus(){
    return this._syncStatus;
  }
};

// 初始化映射
DB._initMapping();

/* ============ 初始化预置数据 ============ */
function initData(){
  // 用户数据（含密码）
  let users = DB.get('users', null);

      {id:'u_xiaoxing', username:'xiaoxing', password:'123456', name:'小邢', role:'sales', phone:'13800000003'}
    ];
  }
  // 自动把明文密码哈希化（兼容旧数据升级）
  let needSave = false;
  users = users.map(function(u){
    if(!isHashedPassword(u.password)){
      needSave = true;
      return Object.assign({}, u, { password: hashPassword(u.password) });

  if(needSave){
    DB.set('users', users);

  // 客户数据
  const customers = DB.get('customers', null);
  if(!customers){
    DB.set('customers', [

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+

/* ============ 模糊匹配商品算法 ============ */
function fuzzyMatchProduct(inputName, products){
  if(!inputName || !products || !products.length) return null;
  // 去除空格和常见后缀/量词
  const clean = inputName.replace(/\s+/g,'')
    .replace(/(个|件|台|只|把|双|套|箱|盒|包|送)$/g,'')
    .toLowerCase();
  if(!clean) return null;

  let best = null;
  let bestScore = 0;
  const onProducts = products.filter(p => p.status === 'on');

  onProducts.forEach(p => {
    const pname = p.name.replace(/\s+/g,'').toLowerCase();
    const pcategory = (p.category||'').replace(/\s+/g,'').toLowerCase();
    let score = 0;

    // 1. 完全包含：输入名包含在商品名中，或反之
    if(pname.includes(clean) || clean.includes(pname)){
      score += 0.8;
    }

    // 2. 字符重叠率
    const inputChars = new Set(clean.split(''));
    let hit = 0;
    inputChars.forEach(ch => {
      if(pname.includes(ch) || pcategory.includes(ch)) hit++;
    });
    const overlap = hit / inputChars.size;
    score += overlap * 0.5;

    // 3. 核心关键词加分：连续子串匹配
    // 提取输入中的连续2字以上中文/字母片段
    const tokens = clean.match(/[\u4e00-\u9fa5]{2,}|[a-z0-9]{2,}/g) || [];
    tokens.forEach(tok => {
      if(pname.includes(tok)){
        score += 0.3;
      }
    });

    // 4. 数字/型号精确匹配加分
    const inputNums = clean.match(/[0-9]+[a-z]*/g) || [];
    const pNums = pname.match(/[0-9]+[a-z]*/g) || [];
    inputNums.forEach(n => {
      if(pNums.some(pn => pn === n || pn.includes(n) || n.includes(pn))){
        score += 0.25;
      }
    });

    if(score > bestScore){
      bestScore = score;
      best = p;
    }
  });

  // 阈值 > 0.3
  return bestScore > 0.3 ? best : null;
}

/* ============ 订单文本一键识别解析（三块结构化拆分） ============ */
function parseOrderText(text){
  const result = {
    contact:'', phone:'', region:'', address:'',
    fullAddress:'',   // 拼接后的完整地址字符串（省+市+区+小区+楼栋房号）
    items:[], remark:'',
    rawCustomer:'',   // 原始客户信息文本块
    rawRemark:'',     // 原始备注文本块
    rawItems:[]       // 原始商品文本块
  };
  if(!text) return result;
  const products = DB.get('products');
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  const fullText = lines.join(' ');

  /* ---- 常见商品关键词黑名单（用于排除非地址/非姓名文本）---- */
  const productBrandKeywords = [
    '电饭煲','电压力锅','炒锅','煎锅','汤锅','炖锅','蒸锅','奶锅','砂锅','水壶',
    '电磁炉','微波炉','烤箱','空气炸锅','破壁机','榨汁机','料理机','豆浆机',
    '热水器','油烟机','燃气灶','冰箱','洗衣机','空调','电视','净水器','消毒柜',
    '福库','三头鹰','苏泊尔','美的','九阳','海尔','格力','方太','老板','华帝',
    '松下','飞利浦','小米','奔腾','康佳','TCL','创维','海信','志高','万和',
    '林内','能率','史密斯','樱花','帅康','万家乐','西门子','博世','伊莱克斯',
    '新飞','美菱','容声','奥克斯','长虹','小熊','九阳','康巴赫','双立人','WMF',
    '铁锅','不粘锅','不锈钢','珐琅','铸铁','陶瓷','玻璃','硅胶',
    '铲子','锅铲','勺子','漏勺','蒸笼','蒸屉','砧板','刀具','刀架','杯','碗','盘',
    '小白贝','压力IH','压力','IH电饭煲','电饭煲'
  ];

  /* ---- 姓名排除黑名单（常见非人名2-4字词）---- */
  const nameExcludeWords = new Set([
    '开发区','经济开发区','高新区','工业园区','产业园区','示范区','自贸区',
    '龙湖','万科','碧桂园','恒大','融创','保利','中海','绿地','华润','招商',
    '新城','世茂','金茂','绿城','阳光城','融信','金科','蓝光','雅居乐','龙光',
    '电饭煲','炒锅','煎锅','汤锅','炖锅','蒸锅','砂锅','水壶','电磁炉',
    '微波炉','烤箱','炸锅','破壁机','榨汁机','料理机','豆浆机','热水器',
    '油烟机','燃气灶','冰箱','洗衣机','空调','净水器','消毒柜','锅铲',
    '赠品','赠品','赠送','附赠','配件','礼品'
  ]);

  /* ============ 第一步：提取赠品备注 ============ */
  const remarkLines = [];
  const remarkPatterns = [
    /^送(.{1,20})/,
    /^附赠(.{1,20})/,
    /^赠送(.{1,20})/,
    /(?:送|附赠|赠送|礼品|配件|赠品)[：:]\s*(.{1,30})/,
    /(?:配套|附带|加送|再加|还送|多送)(.{1,20})/
  ];
  // 逐行扫描赠品
  lines.forEach(line => {
    for(const pat of remarkPatterns){
      if(pat.test(line)){
        remarkLines.push(line.trim());
        return;
      }
    }
  });

  /* ============ 第二步：提取手机号 ============ */
  let phone = '';
  const phoneMatch = fullText.match(/1[3-9]\d{9}/);
  if(phoneMatch) phone = phoneMatch[0];
  result.phone = phone;

  /* ============ 第三步：提取地址（省+市+区/县+小区+楼栋房号）============ */
  let region = '', address = '', fullAddress = '';
  // 先尝试带标签格式
  lines.forEach(line => {
    let m;
    if(m = line.match(/所在地区\s*[:：]\s*(.+)/)){ region = m[1].trim(); return; }
    if(m = line.match(/详细地址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/收货地址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/地\s*址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/Address\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
  });

  if(region || address){
    // 带标签格式：直接使用
    result.region = region;
    result.address = address;
    fullAddress = (region + ' ' + address).trim();
  } else {
    // 无标签：从原文智能提取地址
    // 策略：匹配包含 省/市/区/县 + 小区/路/街道 + 楼栋房号 的连续文本片段
    // 先尝试整行匹配（通常地址在单独一行或多行中）
    const addrLinePattern = /^([\u4e00-\u9fa5]+省[\u4e00-\u9fa5]+市[\u4e00-\u9fa5]*(?:区|县|开发区|高新区|经济区)[\u4e00-\u9fa5]*(?:街道|路|镇|乡|村)?[\u4e00-\u9fa5]*(?:小区|花园|城|府|园|苑|居|庭|邸|庄|湾|郡|都|汇|公馆|国际|广场|中心|天地|新城|半岛|华府|豪庭|雅苑|家园|雅居|丽景|星城|水晶|翡翠|凤凰|龙庭|御景|碧桂|金色|阳光|银座|蓝光|华润|龙湖|万科|碧桂园|融创|保利|中海|绿地)[\u4e00-\u9fa5]*(?:路|街|道|巷)?[\u4e00-\u9fa5]*(?:号楼?|幢|栋|座|单元|层)[\s\-]*[\w\u4e00-\u9fa5]+(?:室|号|房)?)$/;

    // 策略A：单行匹配完整地址
    let addrFound = false;
    for(const line of lines){
      const m = line.match(addrLinePattern);
      if(m){
        fullAddress = m[1].trim();
        addrFound = true;
        break;
      }
    }

    if(!addrFound){
      // 策略B：多行拼接，找出包含省/市/区/县/开发区的连续文本
      // 先定位地址起始行
      let addrStartIdx = -1, addrEndIdx = -1;
      lines.forEach((line, idx) => {
        if(addrStartIdx < 0){
          // 地址通常以"省"开头
          if(/[\u4e00-\u9fa5]+省/.test(line) && !remarkLines.includes(line)){
            addrStartIdx = idx;
          }
        }
      });
      if(addrStartIdx >= 0){
        // 从起始行开始，连续拼接直到遇到非地址行
        const addrParts = [];
        for(let i = addrStartIdx; i < lines.length; i++){
          const line = lines[i];
          // 跳过赠品行
          if(remarkLines.includes(line)) continue;
          // 跳过手机号行
          if(/^1[3-9]\d{9}$/.test(line)) continue;
          // 跳过纯数字价格行
          if(/^\d{1,6}$/.test(line)) continue;
          // 如果遇到商品关键词，停止
          const hasProductKeyword = productBrandKeywords.some(kw => line.includes(kw));
          if(hasProductKeyword && addrParts.length > 0) break;
          // 地址通常包含地名关键字
          if(/[省市区县镇村路街道巷号幢栋楼室层开发].+/.test(line) || addrParts.length === 0){
            addrParts.push(line);
            addrEndIdx = i;
          } else {
            break;
          }
        }
        fullAddress = addrParts.join(' ').trim();
      }
    }

    if(!fullAddress){
      // 策略C：正则从全文中提取地址片段
      const addrRegex = /([\u4e00-\u9fa5]+省[\u4e00-\u9fa5]+(?:市|自治区|特别行政区)[\u4e00-\u9fa5]*(?:区|县|开发区|高新区|经济区|新区|旗)[\u4e00-\u9fa5]*(?:街道|路|镇|乡|村)?[\u4e00-\u9fa5]*(?:小区|花园|城|府|园|苑|居|庭|邸|庄|湾|郡|都|汇|公馆|国际|广场|中心|天地|新城|半岛|华府|豪庭|雅苑|家园|雅居|丽景|星城|水晶|翡翠|凤凰|龙庭|御景|碧桂|金色|阳光|银座|蓝光|华润|龙湖|万科|碧桂园|融创|保利|中海|绿地)[\u4e00-\u9fa5]*(?:路|街|道|巷)?[\u4e00-\u9fa5]*(?:号楼?|幢|栋|座|单元|层)[\s\-]*[\w\u4e00-\u9fa5]+(?:室|号|房)?)/;
      const m = fullText.match(addrRegex);
      if(m) fullAddress = m[1].trim();
    }

    // 如果有地址文本，尝试拆分 region 和 address
    if(fullAddress){
      const regionEndKeywords = ['区','县','开发区','高新区','经济区','新区','旗'];
      let splitPos = -1;
      for(const kw of regionEndKeywords){
        const idx = fullText.lastIndexOf(kw);
        if(idx > 0 && (splitPos < 0 || idx > splitPos)){
          splitPos = idx + kw.length;
        }
      }
      if(splitPos > 0 && splitPos < fullAddress.length - 2){
        result.region = fullText.substring(0, splitPos).trim();
        result.address = fullText.substring(splitPos).trim();
      } else {
        result.address = fullAddress;
      }
    }
  }
  result.fullAddress = fullAddress;

  /* ============ 第四步：提取联系人姓名 ============ */
  let contact = '';
  // 先检查带标签
  lines.forEach(line => {
    let m;
    if(m = line.match(/收货人\s*[:：]\s*(.+)/)){ contact = m[1].trim(); return; }
    if(m = line.match(/收件人\s*[:：]\s*(.+)/)){ contact = m[1].trim(); return; }
    if(m = line.match(/联系人\s*[:：]\s*(.+)/)){ contact = m[1].trim(); return; }
    if(m = line.match(/客\s*户\s*[:：]\s*(.+)/)){ contact = m[1].trim(); return; }
    if(m = line.match(/姓\s*名\s*[:：]\s*(.+)/)){ contact = m[1].trim(); return; }
  });

  if(!contact){
    // 策略A：在地址文本末尾找独立单姓（1个汉字，紧跟手机号或空格+手机号）
    if(fullAddress && phone){
      // "地址 姓 手机号" 或 "地址 姓 手机号" 格式
      const addrWithoutPhone = fullText.replace(phone, '');
      // 在去掉地址和赠品后的剩余文本中找姓氏
      const cleanText = addrWithoutPhone
        .replace(fullAddress, '')
        .replace(/送.+?$/gm, '')
        .replace(/附赠.+?$/gm, '')
        .replace(/赠送.+?$/gm, '')
        .trim();

      // 清理后找独立短词（1-4个汉字，不含数字、不含商品关键词）
      const wordCandidates = cleanText.match(/[\u4e00-\u9fa5]{1,4}/g) || [];
      for(const w of wordCandidates){
        if(!nameExcludeWords.has(w)
           && !productBrandKeywords.some(kw => w.includes(kw))
           && w.length >= 1 && w.length <= 4
           && !/^\d+$/.test(w)
           && !/[\d一二三四五六七八九十百千万]/.test(w)){
          contact = w;
          break;
        }
      }
    }

    // 策略B：在全文中找"姓 手机号"模式中的姓
    if(!contact && phone){
      // 匹配 "姓"紧跟空格/逗号然后紧跟手机号
      const surnamePattern = new RegExp('([\\u4e00-\\u9fa5]{1,2})\\s*' + phone.replace('+','\\+'));
      const sm = fullText.match(surnamePattern);
      if(sm){
        const candidate = sm[1];
        if(!productBrandKeywords.some(kw => candidate.includes(kw))
           && !nameExcludeWords.has(candidate)){
          contact = candidate;
        }
      }
    }

    // 策略C：在地址后面的短文本中找姓氏
    if(!contact){
      // 从每行中提取：不在地址中、不在赠品中、不是商品名、1-4个汉字
      const usedTexts = new Set([fullAddress, phone, ...remarkLines].filter(Boolean));
      lines.forEach(line => {
        if(contact) return;
        if(usedTexts.has(line)) return;
        if(remarkLines.includes(line)) return;
        // 尝试找行中独立的短汉字词组
        const words = line.split(/[\s,，、]+/).filter(Boolean);
        for(const w of words){
          if(/^[\u4e00-\u9fa5]{1,4}$/.test(w)
             && !productBrandKeywords.some(kw => w.includes(kw))
             && !nameExcludeWords.has(w)){
            contact = w;
            return;
          }
        }
      });
    }
  }
  result.contact = contact;

  /* ============ 第五步：逐行匹配商品 ============ */
  const itemLines = [];
  const skipTexts = new Set([
    fullAddress, phone, contact,
    ...remarkLines
  ].filter(Boolean));

  lines.forEach((line, lineIdx) => {
    // 跳过客户信息标签行
    let m;
    if(m = line.match(/收件人\s*[:：]/)) return;
    if(m = line.match(/手机号?码?\s*[:：]/)) return;
    if(m = line.match(/所在地区\s*[:：]/)) return;
    if(m = line.match(/详细地址\s*[:：]/)) return;
    if(m = line.match(/联系人\s*[:：]/)) return;
    if(m = line.match(/地址\s*[:：]/)) return;
    if(m = line.match(/姓\s*名\s*[:：]/)) return;
    // 跳过赠品行
    if(remarkLines.includes(line)) return;
    // 跳过纯手机号行
    if(line === phone) return;
    // 跳过纯数字行（可能是价格）
    if(/^\d{1,6}$/.test(line)) return;

    // 检查是否包含在地址文本中
    if(fullAddress && fullAddress.includes(line.trim()) && line.trim().length > 5) return;

    // 尝试匹配商品：带价格的行 "名称  数字"
    const priceMatch = line.match(/^(.+?)\s+(\d{1,6})\s*(元|块)?$/);
    if(priceMatch){
      const namePart = priceMatch[1].trim();
      // 去除可能混入的姓名
      const cleanName = namePart.replace(new RegExp(contact ? contact : ''), '').trim();
      const matched = fuzzyMatchProduct(cleanName || namePart, products);
      if(matched){
        result.items.push({
          productId: matched.id,
          name: matched.name,
          price: matched.price,
          qty: 1,
          subtotal: matched.price,
          inputName: line,
          matchedScore: '已匹配'
        });
        return;
      }
      // 即使没匹配商品库，也作为原始商品行保留（因为可能是新品）
      itemLines.push(line);
      return;
    }

    // 纯名称匹配（含商品关键词的行）
    const hasProductKw = productBrandKeywords.some(kw => line.includes(kw));
    if(hasProductKw && line.length >= 3){
      const matched2 = fuzzyMatchProduct(line.replace(/\d+/g,'').trim(), products);
      if(matched2){
        result.items.push({
          productId: matched2.id,
          name: matched2.name,
          price: matched2.price,
          qty: 1,
          subtotal: matched2.price,
          inputName: line,
          matchedScore: '已匹配'
        });
      } else {
        itemLines.push(line);
      }
      return;
    }

    // 剩余行中，如果包含品牌+型号特征但未被上面匹配
    if(/[\u4e00-\u9fa5]{2,6}\s*\d/.test(line) && line.length >= 4 && !skipTexts.has(line)){
      itemLines.push(line);
      return;
    }
  });

  result.remark = remarkLines.join('，');
  result.rawItems = itemLines;
  result.rawCustomer = [fullAddress, contact, phone].filter(Boolean).join(' ');

  return result;
}

function handleLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!user || !pass){ showToast('请输入用户名和密码','error'); return; }
  // 用户数据已通过 DB.syncFromCloud() 从 Supabase 同步到 localStorage 缓存
  const users = DB.get('users');
  const found = users.find(u => u.username === user && verifyPassword(pass, u.password));
  if(!found){ showToast('用户名或密码错误','error'); return; }
  currentUser = found;
  sessionStorage.setItem('soms_current_user', JSON.stringify(found));
  showApp();
  showToast('登录成功，欢迎回来 '+found.name,'success');
}

  sessionStorage.removeItem('soms_current_user');
  document.getElementById('appPage').style.display = 'none';

function navigate(route){
  // 未发货模块已合并到订单管理
  if(route === 'unshipped') route = 'orders';
  currentRoute = route;
  // 权限检查：销售角色不能访问管理员专属页面
  const isAdmin = currentUser.role === 'admin';
  const restrictedRoutes = ['customers','payments','dashboard2','settings','commissions','profit-report'];
  if(!isAdmin && restrictedRoutes.includes(route)){
    showToast('无访问权限','error');
    route = 'dashboard';
    currentRoute = route;
  }
  const t = routeTitles[route] || ['页面',''];
  document.getElementById('pageTitle').textContent = t[0];
  document.getElementById('pageSub').textContent = t[1];
  document.querySelectorAll('.sidebar-nav .nav-item').forEach(item => {
    item.classList.remove('active');
  });
  const navItems = document.querySelectorAll('.sidebar-nav .nav-item');
  // 映射子路由到主菜单
  let mapRoute = route;
  if(['order-new','order-detail','order-edit'].includes(route)) mapRoute = 'orders';
  if(['aftersale-new','aftersale-detail'].includes(route)) mapRoute = 'aftersales';
  if(route==='product-edit') mapRoute = 'products';
  navItems.forEach(item => {
    const onclick = item.getAttribute('onclick');
    if(onclick && onclick.includes("'"+mapRoute+"'")){
      item.classList.add('active');
    }
  });
  const renderers = {
    dashboard: renderDashboard,
    orders: renderOrders,
    'order-new': renderOrderNew,
    'order-detail': renderOrderDetail,
    'order-edit': renderOrderEdit,
    schedule: renderSchedule,
    warehouse: renderWarehouse,
    customers: renderCustomers,
    products: renderProducts,
    'product-edit': renderProductEdit,
    payments: renderPayments,
    commissions: renderCommissions,
    unshipped: renderUnshipped,
    aftersales: renderAftersales,
    'aftersale-new': renderAftersaleNew,
    'aftersale-detail': renderAftersales,
    dashboard2: renderDashboard2,
    'profit-report': renderProfitReport,
    settings: renderSettings,
    users: renderUsers
  };
  const fn = renderers[route] || renderDashboard;
  fn();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  window.scrollTo(0,0);
  // 浏览器历史记录兼容：导航时推送 state
  if(window._skipHistoryPush !== true){
    history.pushState({route: route, orderId: window._currentOrderId}, '', '#' + route);

// 按日期自动流转订单状态：留仓/上门订单到期自动改为待下单
function checkOrderAutoFlow(){
  const orders = DB.get('orders');
  const today = todayStr();
  let changed = false;
  orders.forEach(o => {
    // 仅处理留仓/上门订单
    if(o.type !== 'warehouse' && o.type !== 'door') return;
    // 必须有订单日期字段
    if(!o.orderDate) return;
    // 跳过已处理/终态状态
    if(['completed','canceled','confirmed'].includes(o.status)) return;
    // 今日 >= 订单日期，且状态非终态 → 改为待下单
    if(today >= o.orderDate && o.status !== 'pending'){
      o.status = 'pending';
      changed = true;
    }
  });
  if(changed){
    DB.set('orders', orders);
  }
}

            html += `<tr><td>${it.name}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(cost)}</td><td>${it.waste||0}</td>`;

            if(it.expressCompany) html += `<br><span style="font-size:11px;color:var(--info)">${it.expressCompany}</span>`;
            html += `</td></tr>`;
          });
          html += `</tbody></table></td>`;

        filtered.forEach(o => {
          html += `<tr>`;
          html += `<td>${o.customerName}</td>`;
          html += `<td style="font-weight:600">${money(o.total)}</td>`;
          html += `<td>${orderTypeTag(o.type)}</td>`;

    checkOrderAutoFlow();
    return;
  }

  // === 销售端 ===
  const isMobile = window.innerWidth <= 768 || /Mobile|Android|iPhone/.test(navigator.userAgent);
  let filtered = orders;
  if(keyword){
    filtered = filtered.filter(o =>
      o.id.toLowerCase().includes(keyword.toLowerCase()) ||
      (o.customerName||'').includes(keyword) ||
      (o.contact||'').includes(keyword) ||
      (o.phone||'').includes(keyword)
    );
  }
  if(status) filtered = filtered.filter(o => o.status === status);
  if(typeFilter === 'whdoor'){
    filtered = filtered.filter(o => o.type==='warehouse' || o.type==='door');
  }
  if(dateFilter){
    filtered = filtered.filter(o => (o.createdAt||'').startsWith(dateFilter));
  }

  filtered = [...filtered].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  // 状态选项：合并普通/留仓(已反馈)与上门(已完成)终态
  const statusOptions = [
    ['pending','待下单'],['confirmed','已下单'],['shipped','运输中'],['received','已签收'],
    ['feedback','待反馈'],['feedback_done','已反馈(普通/留仓)'],['completed','已完成(上门)'],['canceled','已取消']
  ];

  let html = `

    if(filtered.length){
      filtered.forEach(o => {
        simulateLogisticsUpdate(o.id);
        const freshO = DB.get('orders').find(x=>x.id===o.id);
        if(freshO) Object.assign(o, freshO);
        const logisticsInfo = o.items.map(it => {
          if(!it.trackingNo) return '';
          return '<div>'+it.name.substring(0,6)+' '+it.trackingNo+' '+getLogisticsStatusText(it)+'</div>';

        html += `

            </div>

            <div class="card-footer">
              <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();viewOrder('${o.id}')">查看</button>
              ${(o.status !== 'completed' && o.status !== 'canceled') ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editOrder('${o.id}')">编辑</button>` : ''}
            </div>
          </div>`;
      });
    } else {
      html += `<div class="table-empty">暂无符合条件的订单</div>`;
    }
    html += `</div>`;
  } else {
    // 桌面端：表格布局
    html += `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>客户</th>
              <th>类型</th>
              <th>状态</th>
              <th>物流信息</th>
              <th>创建时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.length ? filtered.map(o=>{
              simulateLogisticsUpdate(o.id);
              const freshO = DB.get('orders').find(x=>x.id===o.id);
              if(freshO) Object.assign(o, freshO);
              const logisticsInfo = o.items.map(it => {
                if(!it.trackingNo) return '';
                return '<div style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px" title="'+it.trackingNo+'">'+it.name.substring(0,6)+' '+it.trackingNo+' '+getLogisticsStatusText(it)+'</div>';
              }).join('');
              return `
              <tr>
                <td><a class="btn-link" onclick="viewOrder('${o.id}')">${o.customerName}</a></td>
                <td>${orderTypeTag(o.type)}</td>
                <td>${statusTag(o.status)}</td>

                <td>${o.createdAt||'-'}</td>

              </tr>`;
            }).join('') : '<tr><td colspan="6" class="table-empty">暂无符合条件的订单</td></tr>'}
          </tbody>
        </table>
      </div>`;
  }

  html += `
    </div>
  `;
  document.getElementById('mainContent').innerHTML = html;
  // 检查留仓/上门订单是否到期待流转
  checkOrderAutoFlow();
}

function clearDateFilter(){
  window._orderDateFilter = '';
  renderOrders();
}

function filterOrders(value, type){
  if(type === 'keyword') window._orderFilter = value;
  else if(type === 'status') window._orderStatus = value;
  else if(type === 'type') window._orderType = value;
  renderOrders();
}

function viewOrder(orderId){
  window._currentOrderId = orderId;
  window._orderEditMode = false;
  navigate('order-detail');
}

function deleteOrder(orderId){
  showConfirm('确定删除此订单吗？删除后不可恢复。', () => {
    DB.set('orders', DB.get('orders').filter(o => o.id !== orderId));
    showToast('订单已删除','success');
    navigate('orders');
  });
}

// 选择订单类型
function selectOrderType(type){
  newOrderType = type;
  ['normal','warehouse','door'].forEach(t => {
    document.getElementById('otype-'+t).classList.toggle('active', t===type);
  });
  document.getElementById('doorExtraSection').style.display = (type==='door' || type==='warehouse') ? 'block' : 'none';
  var fdGroup = document.getElementById('fulfillmentDateGroup');
  var cdGroup = document.getElementById('completionDateGroup');
  if(fdGroup) fdGroup.style.display = (type === 'normal') ? '' : 'none';
  if(cdGroup) cdGroup.style.display = (type === 'warehouse' || type === 'door') ? '' : 'none';
}

// 一键识别
function doRecognize(){
  const text = document.getElementById('recognizeText').value.trim();
  if(!text){ showToast('请粘贴订单文本','error'); return; }
  const parsed = parseOrderText(text);

  // ---- 在识别区下方展示三块结构化结果 ----
  let previewHTML = '<div style="margin-top:12px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">';

  // 块1：客户信息
  const customerParts = [parsed.fullAddress, parsed.contact, parsed.phone].filter(Boolean);
  previewHTML += '<div style="background:#f0f7ff; border:1px solid #b3d4fc; border-radius:8px; padding:10px;">';
  previewHTML += '<div style="font-size:12px; font-weight:600; color:#1565c0; margin-bottom:6px;">客户信息</div>';
  if(customerParts.length){
    previewHTML += customerParts.map(p =>
      '<div style="font-size:13px; color:#333; padding:2px 0; border-bottom:1px dashed #ddd; word-break:break-all;">' + p + '</div>'
    ).join('');
  } else {
    previewHTML += '<div style="font-size:12px; color:#999;">未识别到客户信息</div>';
  }
  previewHTML += '</div>';

  // 块2：订单备注（赠品等）
  previewHTML += '<div style="background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:10px;">';
  previewHTML += '<div style="font-size:12px; font-weight:600; color:#f57f17; margin-bottom:6px;">订单备注</div>';
  if(parsed.remark){
    const remarkItems = parsed.remark.split(/[，,;；]/).filter(Boolean);
    previewHTML += remarkItems.map(r =>
      '<div style="font-size:13px; color:#333; padding:2px 0; border-bottom:1px dashed #ddd;">' + r.trim() + '</div>'
    ).join('');
  } else {
    previewHTML += '<div style="font-size:12px; color:#999;">无赠品备注</div>';
  }
  previewHTML += '</div>';

  // 块3：商品清单
  previewHTML += '<div style="background:#f1f8e9; border:1px solid #aed581; border-radius:8px; padding:10px;">';
  previewHTML += '<div style="font-size:12px; font-weight:600; color:#2e7d32; margin-bottom:6px;">商品清单</div>';
  // 合并展示：已匹配商品 + 未匹配的原始商品行
  let hasAny = false;
  if(parsed.items.length){
    hasAny = true;
    previewHTML += parsed.items.map(i =>
      '<div style="font-size:13px; color:#2e7d32; padding:2px 0; border-bottom:1px dashed #ddd; word-break:break-all;">' + i.name + ' ¥' + i.price + ' <span style="font-size:11px; color:#888;">(已匹配)</span></div>'
    ).join('');
  }
  if(parsed.rawItems.length){
    hasAny = true;
    previewHTML += parsed.rawItems.map(item =>
      '<div style="font-size:13px; color:#e65100; padding:2px 0; border-bottom:1px dashed #ddd; word-break:break-all;">' + item + ' <span style="font-size:11px; color:#888;">(未匹配商品库)</span></div>'
    ).join('');
  }
  if(!hasAny){
    previewHTML += '<div style="font-size:12px; color:#999;">未识别到商品</div>';
  }
  previewHTML += '</div>';

  previewHTML += '</div>';

  // 显示/隐藏结果面板
  let resultPanel = document.getElementById('recognizeResultPanel');
  if(!resultPanel){
    resultPanel = document.createElement('div');
    resultPanel.id = 'recognizeResultPanel';
    // 插入到识别框（recognize-box）之后
    const recBox = document.querySelector('.recognize-box');
    recBox.parentNode.insertBefore(resultPanel, recBox.nextSibling);
  }
  resultPanel.innerHTML = previewHTML;

  // ---- 自动填充表单 ----
  // 填充客户信息
  if(parsed.contact) document.getElementById('custContact').value = parsed.contact;
  if(parsed.phone) document.getElementById('custPhone').value = parsed.phone;
  if(parsed.region) document.getElementById('custRegion').value = parsed.region;
  if(parsed.address) document.getElementById('custAddress').value = parsed.address;
  let custDisplay = '';
  if(parsed.fullAddress) custDisplay += parsed.fullAddress + ' ';
  if(parsed.contact) custDisplay += parsed.contact + ' ';
  if(parsed.phone) custDisplay += parsed.phone;
  if(custDisplay.trim()){
    document.getElementById('custInfo').value = custDisplay.trim();
  }
  // 填充商品
  if(parsed.items.length){
    cart = parsed.items.map(it => ({
      productId: it.productId,
      name: it.name,
      price: it.price,
      qty: it.qty,
      subtotal: it.subtotal
    }));
    renderCart();
  }
  // 填充备注
  if(parsed.remark){
    const remarkEl = document.getElementById('orderRemark');
    remarkEl.value = parsed.remark;
  }

  const itemCount = parsed.items.length + parsed.rawItems.length;
  const matchedCount = parsed.items.length;
  const unmatchedCount = parsed.rawItems.length;
  let toastMsg = '识别完成：'+itemCount+' 件商品';
  if(matchedCount && unmatchedCount) toastMsg += '（'+matchedCount+' 已匹配，'+unmatchedCount+' 待确认）';
  if(parsed.remark) toastMsg += '，'+parsed.remark.split(/[，,]/).length+' 条备注';
  if(parsed.contact) toastMsg += '，客户 '+parsed.contact;
  showToast(toastMsg,'success');
  if(parsed.contact || parsed.phone || parsed.address){
    setTimeout(()=>showToast('已识别客户信息','info'),500);
  }
}

// 解析客户信息文本 → 拆分姓名/电话/地区/地址
function parseCustInfo(text){
  if(!text) return;
  text = text.trim().replace(/\s+/g,' ');
  // 提取手机号（11位连续数字）
  const phoneMatch = text.match(/1[3-9]\d{9}/);
  let phone = '';
  if(phoneMatch){ phone = phoneMatch[0]; text = text.replace(phone, ''); }
  // 提取姓名（第一个非空的短词）
  const parts = text.split(/\s+/).filter(Boolean);
  let name = '', region = '', address = '';
  if(parts.length > 0){
    // 姓名通常是2-4个字且不含数字
    const nameIdx = parts.findIndex(p => !/\d/.test(p) && p.length >= 2 && p.length <= 4);
    if(nameIdx >= 0){ name = parts.splice(nameIdx, 1)[0]; }
  }
  // 剩余部分：前半通常是地区（含省/市/区/县/街道），后半是地址
  const rest = parts.join(' ');
  if(rest){
    // 尝试按常见分隔拆
    const regionKeywords = ['省','市','区','县','镇','街道','乡','路'];
    let splitIdx = -1;
    for(let i = 0; i < rest.length; i++){
      if(regionKeywords.includes(rest[i])) splitIdx = i + 1;
    }
    if(splitIdx > 0 && splitIdx < rest.length - 2){
      region = rest.substring(0, splitIdx);
      address = rest.substring(splitIdx);
    }else{
      address = rest;
    }
  }
  document.getElementById('custContact').value = name;
  document.getElementById('custPhone').value = phone;
  document.getElementById('custRegion').value = region;
  document.getElementById('custAddress').value = address;
  // 显示解析结果
  const el = document.getElementById('custInfoParsed');
  if(el && (name || phone)){
    el.style.display = 'block';
    let info = [];
    if(name) info.push('收件人: ' + name);
    if(phone) info.push('电话: ' + phone);
    if(region) info.push('地区: ' + region);
    if(address) info.push('地址: ' + address);
    el.innerHTML = '<span style="color:var(--success)">已识别:</span> ' + info.join(' | ');
  }else if(el){
    el.style.display = 'none';
  }
}

  const products = DB.get('products').filter(p => p.status === 'on');

 const cbs = results.querySelectorAll('input[type=checkbox]');

function changeQty(index, delta){
  cart[index].qty = Math.max(1, cart[index].qty + delta);
  cart[index].subtotal = Math.round(cart[index].price) * cart[index].qty;
  renderCart();
}
function setQty(index, val){
  const qty = Math.max(1, parseInt(val) || 1);
  cart[index].qty = qty;
  cart[index].subtotal = Math.round(cart[index].price) * qty;
  renderCart();
}
// 销售编辑单价（仅影响该订单，不改商品库）
function setCartPrice(index, val){
  const price = Math.max(0, parseInt(val) || 0);
  cart[index].price = price;
  cart[index].subtotal = price * cart[index].qty;
  const subEl = document.getElementById('cartSub_'+index);
  if(subEl) subEl.textContent = money(cart[index].subtotal);
  // 更新合计
  const total = cart.reduce((s,c)=>s+c.subtotal, 0);
  document.getElementById('cartTotal').textContent = money(total);
}
function removeFromCart(index){
  cart.splice(index, 1);
  renderCart();
}

// 裁剪界面
let cropState = { img:null, canvas:null, ctx:null, box:{x:0,y:0,w:0,h:0}, dragging:false, start:{x:0,y:0} };

function openCropInterface(imgSrc, source){
  const img = new Image();
  img.onload = function(){
    cropState.img = img;
    const maxW = Math.min(window.innerWidth - 40, 700);
    const maxH = window.innerHeight * 0.6;
    let w = img.width, h = img.height;
    const scale = Math.min(maxW/w, maxH/h, 1);
    w = w * scale; h = h * scale;

    const html = `
      <div class="crop-overlay" id="cropOverlay">
        <div style="color:#fff;font-size:16px;margin-bottom:12px">拖拽选择裁剪区域</div>
        <div class="crop-canvas-wrap" id="cropCanvasWrap">
          <canvas id="cropCanvas" width="${w}" height="${h}"></canvas>
          <div class="crop-select-box" id="cropSelectBox" style="left:0;top:0;width:0;height:0;display:none"></div>
        </div>
        <div class="crop-actions">
          <button class="btn btn-secondary" onclick="cancelCrop()">取消</button>
          <button class="btn btn-primary" onclick="confirmCrop('${source}')">确认裁剪并识别</button>
          <button class="btn btn-secondary" onclick="confirmCropNoCrop('${source}')">使用原图</button>
        </div>
      </div>
    `;
    document.getElementById('cropContainer').innerHTML = html;

    const canvas = document.getElementById('cropCanvas');
    const ctx = canvas.getContext('2d');
    cropState.canvas = canvas;
    cropState.ctx = ctx;
    cropState.box = {x:0,y:0,w:0,h:0};
    ctx.drawImage(img, 0, 0, w, h);

    // 鼠标/触摸事件
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    };

    const onStart = (e) => {
      e.preventDefault();
      cropState.dragging = true;
      const p = getPos(e);
      cropState.start = p;
      cropState.box = {x:p.x, y:p.y, w:0, h:0};
    };
    const onMove = (e) => {
      if(!cropState.dragging) return;
      e.preventDefault();
      const p = getPos(e);
      cropState.box = {
        x: Math.min(cropState.start.x, p.x),
        y: Math.min(cropState.start.y, p.y),
        w: Math.abs(p.x - cropState.start.x),
        h: Math.abs(p.y - cropState.start.y)
      };
      // 重绘
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      // 遮罩
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      // 清除选中区域
      ctx.clearRect(cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
      ctx.drawImage(img, cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h,
                    cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
      // 边框
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(cropState.box.x, cropState.box.y, cropState.box.w, cropState.box.h);
    };
    const onEnd = (e) => {
      cropState.dragging = false;
    };

    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('mouseleave', onEnd);
    canvas.addEventListener('touchstart', onStart, {passive:false});
    canvas.addEventListener('touchmove', onMove, {passive:false});
    canvas.addEventListener('touchend', onEnd);
  };
  img.src = imgSrc;
}

function cancelCrop(){
  document.getElementById('cropContainer').innerHTML = '';
}

function confirmCrop(source){
  const canvas = cropState.canvas;
  const img = cropState.img;
  const box = cropState.box;
  if(!box.w || !box.h || box.w < 10 || box.h < 10){
    showToast('请先拖拽选择裁剪区域','error');
    return;
  }
  // 计算原图坐标
  const scaleX = img.width / canvas.width;
  const scaleY = img.height / canvas.height;
  const sx = box.x * scaleX;
  const sy = box.y * scaleY;
  const sw = box.w * scaleX;
  const sh = box.h * scaleY;

  const outCanvas = document.createElement('canvas');
  outCanvas.width = sw;
  outCanvas.height = sh;
  const outCtx = outCanvas.getContext('2d');
  outCtx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  const base64 = outCanvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('cropContainer').innerHTML = '';
  finishImageRecognize(base64, source);
}

function confirmCropNoCrop(source){
  const img = cropState.img;
  const outCanvas = document.createElement('canvas');
  outCanvas.width = img.width;
  outCanvas.height = img.height;
  const outCtx = outCanvas.getContext('2d');
  outCtx.drawImage(img, 0, 0);
  const base64 = outCanvas.toDataURL('image/jpeg', 0.7);
  document.getElementById('cropContainer').innerHTML = '';
  finishImageRecognize(base64, source);
}

  let status = 'pending';

    createdAt: nowStr()
  };

  // 留仓/上门订单：收款信息
  if(newOrderType === 'door' || newOrderType === 'warehouse'){
    newOrder.items.forEach(it => { it.stock = it.stock || '否'; });
    const fpEl = document.getElementById('newOrderFullPay');
    const dpEl = document.getElementById('newOrderDeposit');
    const fxEl = document.getElementById('newOrderFinalPay');
    newOrder.fullPayment = fpEl ? (parseInt(fpEl.value) || 0) : 0;
    newOrder.deposit = dpEl ? (parseInt(dpEl.value) || 0) : 0;
    newOrder.finalPayment = fxEl ? (parseInt(fxEl.value) || 0) : 0;
  }

  const orders = DB.get('orders');
  orders.push(newOrder);
  DB.set('orders', orders);

  // 自动添加新品到商品库
  const _products = DB.get('products');
  let _newProdCount = 0;
  newOrder.items.forEach(item => {
    if(item.productId && !_products.find(p => p.id === item.productId)){
      _products.push({
        id: item.productId,
        name: item.name,
        price: item.price,
        cost: item.price,
        status: 'on',
        category: '其他',
        auto_added: true
      });
      _newProdCount++;
    }
  });
  if(_newProdCount > 0){
    DB.set('products', _products);
  }

  showToast('订单创建成功！订单号：'+orderId, 'success');
  window._orderFilter = '';
  navigate('orders');
}

function copyToClipboard(text, label){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      showToast(label + '已复制到剪贴板','success');
    }).catch(() => {
      fallbackCopy(text, label);
    });
  } else {
    fallbackCopy(text, label);
  }
}

// 综合复制：弹窗提示「订单信息已复制，可直接粘贴」，电脑手机全端兼容
function copyToClipboardWithMsg(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      showToast('订单信息已复制，可直接粘贴','success');
    }).catch(() => {
      fallbackCopyWithMsg(text);
    });
  } else {
    fallbackCopyWithMsg(text);
  }
}

function fallbackCopyWithMsg(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  // 关键：使用 white-space: pre-wrap 保证换行符在移动端正确传递
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px;white-space:pre-wrap';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  // 移动端兼容：设置 selectionRange
  ta.setSelectionRange(0, ta.value.length);
  try{
    document.execCommand('copy');
    showToast('订单信息已复制，可直接粘贴','success');
  }catch(e){
    showToast('复制失败，请手动复制','error');
  }
  document.body.removeChild(ta);
}

function fallbackCopy(text, label){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast(label + '已复制到剪贴板','success');
  }catch(e){
    showToast('复制失败，请手动复制','error');
  }
  document.body.removeChild(ta);
}

// 保存订单编辑页的物流单号（核心：localStorage 缓存 + 云端同步模拟）
function saveOrderEditTracking(orderId){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0){ showToast('订单不存在','error'); return; }
  const order = orders[idx];
  let changedCount = 0;
  let hasTracking = false;

  order.items.forEach((it, i) => {
    const input = document.getElementById('editTrackingNo_' + i);
    if(input){
      const newVal = input.value.trim();
      if(newVal !== (it.trackingNo || '')){
        it.trackingNo = newVal;
        it.expressCompany = newVal ? detectExpressCompany(newVal) : '';
        changedCount++;
      }
      if(newVal) hasTracking = true;
    }
  });

  if(changedCount === 0){
    showToast('单号无变更','info');
    return;
  }

  // 自动状态流转
  const allTracking = order.items.every(it => it.trackingNo);
  if(hasTracking && (order.status === 'confirmed' || order.status === 'pending')){
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
    } else {
      order.status = 'shipped';
      order.shippedAt = nowStr();
    }
  } else if(order.status === 'shipped' && allTracking){
    order.status = 'feedback';
    order.feedbackAt = nowStr();
  }

  // 记录同步时间戳
  const syncTime = nowStr();
  order.syncedAt = syncTime;
  order.updatedAt = syncTime;

  // 1. 保存到 localStorage（主数据源）
  DB.set('orders', orders);

  // 2. 本地缓存物流单号（独立缓存，支持离线查看）
  const trackingCache = JSON.parse(localStorage.getItem('soms_tracking_cache') || '{}');
  trackingCache[orderId] = {
    items: order.items.map(it => ({
      name: it.name,
      trackingNo: it.trackingNo || '',
      expressCompany: it.expressCompany || ''
    })),
    syncedAt: syncTime,
    syncedFrom: navigator.userAgent.includes('Mobile') ? 'mobile' : 'desktop'
  };
  localStorage.setItem('soms_tracking_cache', JSON.stringify(trackingCache));

  // 3. 模拟云端同步（实际项目此处调用后端API）
  const syncResultEl = document.getElementById('syncResult_' + orderId);
  if(syncResultEl){
    syncResultEl.innerHTML = `
      <div style="padding:10px;background:#f0fdf4;border:1px solid #86efac;border-radius:6px;font-size:13px">
        <div style="color:#15803d;font-weight:600">✅ 同步成功</div>
        <div style="margin-top:4px;color:#666">
          • 本地缓存已更新（localStorage）<br>
          • 云端数据库已同步（${syncTime}）<br>
          • 多端访问将自动获取最新单号<br>
          • 修改商品数：${changedCount} 件，订单状态：${statusTag(order.status)}
        </div>
      </div>
    `;
  }

  // 更新同步状态显示
  const syncStatusEl = document.getElementById('syncStatus_' + orderId);
  if(syncStatusEl){
    syncStatusEl.innerHTML = '✅ 已同步：' + syncTime + '（' + (navigator.userAgent.includes('Mobile') ? '手机端' : '电脑端') + '）';
    syncStatusEl.style.color = 'var(--success)';
  }

  showToast('物流单号已保存，已同步至云端（' + changedCount + ' 件变更）','success');
}

// 编辑模式商品搜索
var _editSearchSelected = new Set();
function searchEditProducts(keyword){
  const results = document.getElementById('editSearchResults');
  if(!keyword.trim()){ _editSearchSelected.clear(); results.style.display='none'; return; }
  const products = DB.get('products').filter(p => p.status === 'on');
  const kw = keyword.toLowerCase();
  // 排除已在订单中的商品
  const orderId = window._currentOrderId;
  const order = DB.get('orders').find(o => o.id === orderId);
  const existIds = order ? order.items.map(it => it.productId) : [];
  const matched = products.filter(p => !existIds.includes(p.id) && (p.name.toLowerCase().includes(kw) || (p.category && p.category.toLowerCase().includes(kw))));
  let html = "<div style='padding:8px 14px;border-bottom:1px solid var(--border)'><button class='btn btn-secondary btn-sm' onclick='event.stopPropagation();showManualAddToOrder()' style='width:100%'>+ 手动添加新商品</button></div>";
  if(matched.length === 0){
    html += "<div class='ps-empty' style='padding:10px 14px'>未找到匹配商品</div>";
  }else{
    html = matched.map(p => {
      const checked = _editSearchSelected.has(p.id) ? 'checked' : '';
      return `<div class="ps-item" style="cursor:pointer" onclick="toggleEditSelect('${p.id}',event)"><input type="checkbox" ${checked} style="width:16px;height:16px;flex-shrink:0;cursor:pointer" onclick="event.stopPropagation();toggleEditSelect('${p.id}',event)"><div><div style="font-weight:500">${p.name}</div><div style="font-size:12px;color:var(--text-muted)">${p.category||''}</div></div></div>`;
    }).join('');
  }
  results.innerHTML = html;
  results.style.display = 'block';
}
function toggleEditSelect(pid, e){
  e && e.stopPropagation();
  if(_editSearchSelected.has(pid)) _editSearchSelected.delete(pid);
  else _editSearchSelected.add(pid);
  const results = document.getElementById('editSearchResults');
  const items = results.querySelectorAll('.ps-item');
  const cbs = results.querySelectorAll('input[type=checkbox]');
  items.forEach((item, i) => {
    const m = item.getAttribute('onclick')?.match(/toggleEditSelect\('([^']+)'/);
    if(m) cbs[i] && (cbs[i].checked = _editSearchSelected.has(m[1]));
  });
}

// 保存编辑订单
function saveEditOrder(orderId){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0) return;
  if(orders[idx] && currentUser.role !== 'admin' && (orders[idx].status === 'completed' || orders[idx].status === 'canceled')){
    showToast('该订单已完结，无法修改','error');
    return;
  }
  const order = orders[idx];
  let total = 0;
  order.items.forEach((it,i) => {
    const name = document.getElementById('editItemName_'+i).value.trim();
    const price = parseInt(document.getElementById('editItemPrice_'+i).value) || 0;
    const qty = Math.max(1, parseInt(document.getElementById('editItemQty_'+i).value) || 1);
    it.name = name;
    it.price = price;
    it.qty = qty;
    it.subtotal = price * qty;
    total += it.subtotal;
    const stockEl = document.getElementById('editItemStock_'+i);
    if(stockEl) it.stock = stockEl.value;
  });
  order.total = total;
  // 保存客户信息（从隐藏字段读取）
  const contactEl = document.getElementById('custContact');
  if(contactEl){ order.contact = contactEl.value.trim(); order.customerName = contactEl.value.trim(); }
  const phoneEl = document.getElementById('custPhone');
  if(phoneEl) order.phone = phoneEl.value.trim();
  const regionEl = document.getElementById('custRegion');
  if(regionEl) order.region = regionEl.value.trim();
  const addrEl = document.getElementById('custAddress');
  if(addrEl) order.address = addrEl.value.trim();
  // 保存备注
  const remarkEl = document.getElementById('editOrderRemark') || document.getElementById('editRemark');
  if(remarkEl) order.remark = remarkEl.value.trim();
  // 保存发货日期（留仓/上门订单）
  const orderDateEl = document.getElementById('editOrderDate');
  if(orderDateEl) order.orderDate = orderDateEl.value;
  // 保存履约日期/完成日期
  const _editFulfillmentDateEl = document.getElementById('editFulfillmentDate');
  if(_editFulfillmentDateEl) order.fulfillmentDate = _editFulfillmentDateEl.value;
  const _editCompletionDateEl = document.getElementById('editCompletionDate');
  if(_editCompletionDateEl) order.completionDate = _editCompletionDateEl.value;
  orders[idx] = order;
  DB.set('orders', orders);

  // 自动添加新品到商品库
  const _products = DB.get('products');
  let _newProdCount = 0;
  order.items.forEach(item => {
    if(item.productId && !_products.find(p => p.id === item.productId)){
      _products.push({
        id: item.productId,
        name: item.name,
        price: item.price,
        cost: item.price,
        status: 'on',
        category: '其他',
        auto_added: true
      });
      _newProdCount++;
    }
  });
  if(_newProdCount > 0){
    DB.set('products', _products);
  }

  window._orderEditMode = false;
  showToast('订单已更新','success');
  renderOrderDetail();
}

// 保存收款信息
function saveDoorPayments(orderId){
  const fpEl = document.getElementById('doorFullPay');
  const fullPayment = fpEl ? (parseInt(fpEl.value) || 0) : 0;
  const deposit = parseInt(document.getElementById('doorDeposit').value) || 0;
  const finalPayment = Math.max(0, fullPayment - deposit);
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx >= 0){
    orders[idx].fullPayment = fullPayment;
    orders[idx].deposit = deposit;
    orders[idx].finalPayment = finalPayment;
    DB.set('orders', orders);
    showToast('收款信息已保存','success');
  }
}

// 更新订单状态
function updateOrderStatus(orderId, status){
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx >= 0){
    orders[idx].status = status;
    if(status === 'confirmed') orders[idx].confirmedAt = nowStr();
    if(status === 'completed'){
      if(!orders[idx].completionDate){
        orders[idx].completionDate = todayStr();
      }
      orders[idx].completedAt = nowStr();
    }
    if(status === 'shipped') orders[idx].shippedAt = nowStr();
    DB.set('orders', orders);
    showToast('订单状态已更新','success');
    window._orderEditMode = false;
    renderOrderDetail();
  }
}

/* ============ 管理员订单辅助函数 ============ */

// 快递公司识别
function detectExpressCompany(trackingNo) {
  if (!trackingNo) return '';
  const n = trackingNo.trim();
  if (/^SF/.test(n)) return '顺丰速运';
  if (/^JD/.test(n)) return '京东物流';
  if (/^YT/.test(n)) return '圆通速递';
  if (/^ZTO/.test(n) || /^7/.test(n)) return '中通快递';
  if (/^YD/.test(n)) return '韵达快递';
  if (/^STO/.test(n)) return '申通快递';
  if (/^EMS/.test(n)) return 'EMS';
  if (/^DB/.test(n)) return '德邦快递';
  if (/^YZPY/.test(n) || /^8/.test(n)) return '邮政包裹';
  return '其他快递';
}

// 利润计算
function calcOrderProfit(order) {
  if (!order || !order.items) return 0;
  const products = DB.get('products');
  const grossProfit = order.items.reduce((total, it) => {
    const prod = products.find(p => p.id === it.productId);
    const cost = prod ? prod.cost : 0;
    const itemProfit = it.price * it.qty - cost * it.qty - (it.waste || 0);
    return total + itemProfit;
  }, 0);
  // 扣减售后损耗金额（财务联动）
  return grossProfit - (order.afterSaleLoss || 0);
}

// 利润归属日期
function calcProfitDate(order) {
  if (!order) return null;
  if (order.type === 'door') {
    // 上门订单：利润算在已完成那天
    return (order.completedAt || '').slice(0, 10) || null;
  }
  if (order.type === 'warehouse') {
    // 留仓订单：利润算在变为已下单那天
    return (order.confirmedAt || '').slice(0, 10) || (order.orderDate || null);
  }
  // 普通订单：利润算在变为已下单那天
  return (order.confirmedAt || '').slice(0, 10) || null;
}

// 管理员单品标记已下单
function markItemOrdered(orderId, itemIndex) {
  if(currentUser.role !== 'admin'){ showToast('仅管理员可操作','error'); return; }
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if(idx < 0){ showToast('订单不存在','error'); return; }
  const order = orders[idx];
  const item = order.items[itemIndex];
  if(!item){ showToast('商品不存在','error'); return; }
  if(item.ordered){ showToast('该商品已下单','info'); return; }

  // 标记单品已下单
  item.ordered = true;
  item.orderedAt = nowStr();

  // 检查是否全部商品都已下单
  const allOrdered = order.items.every(it => it.ordered);
  if(allOrdered){
    order.status = 'confirmed';
    order.confirmedAt = nowStr();
    order.syncedAt = nowStr();
    order.updatedAt = nowStr();
    showToast('全部商品已下单，订单状态已更新为「已下单」','success');
  } else {
    order.updatedAt = nowStr();
    order.syncedAt = nowStr();
    showToast(item.name + ' 已标记为已下单','success');
  }

  // 保存并同步
  DB.set('orders', orders);

  // 刷新页面展示最新状态
  renderOrders();
}

// 一键收集待下单订单信息
function collectPendingOrdersInfo() {
  const orders = DB.get('orders').filter(o => o.status === 'pending');
  if (!orders.length) { showToast('暂无待下单订单', 'info'); return; }
  const products = DB.get('products');
  let text = '=== 订单汇总 ===\n';
  orders.forEach(o => {
    text += `【${o.id}】客户：${o.customerName} 电话：${o.phone||''} 销售：${o.salesName}\n`;
    if (o.remark) text += `备注：${o.remark}\n`;
    o.items.forEach(it => {
      const prod = products.find(p => p.id === it.productId);
      const cost = prod ? prod.cost : 0;
      const profit = it.price * it.qty - cost * it.qty - (it.waste || 0);
      // 物流单号格式：有单号前置#，无单号末尾加⚠️
      const trackingStr = it.trackingNo ? ' #' + it.trackingNo.trim() : ' ⚠️';
      text += `  - ${it.name} x${it.qty} 售价:${money(it.price)} 成本:${money(cost)} 利润:${money(profit)}${trackingStr}\n`;
    });
    text += '\n';
  });
  const box = document.getElementById('collectInfoBox');
  if (box) {
    box.style.display = 'block';
    box.textContent = text;
  }
}

// 详情页保存物流单号
function saveTrackingNo(orderId, itemIndex, value) {
  const orders = DB.get('orders');
  const idx = orders.findIndex(o => o.id === orderId);
  if (idx < 0) return;
  const item = orders[idx].items[itemIndex];
  item.trackingNo = value.trim();
  item.expressCompany = value.trim() ? detectExpressCompany(value.trim()) : '';
  const order = orders[idx];
  if(order.status === 'confirmed' || order.status === 'pending'){
    const hasTracking = order.items.some(it => it.trackingNo);
    const allTracking = order.items.every(it => it.trackingNo);
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
    }else if(hasTracking){
      order.status = 'shipped';
      order.shippedAt = nowStr();
      showToast('已填写物流单号，订单状态已更新为"运输中"', 'success');
    }
  }else if(order.status === 'shipped'){
    const allTracking = order.items.every(it => it.trackingNo);
    if(allTracking){
      order.status = 'feedback';
      order.feedbackAt = nowStr();
      showToast('所有商品均已填写物流，订单状态已更新为"待反馈"', 'success');
    }
  }
  DB.set('orders', orders);
  renderOrderDetail();
}

// 查看全部商品汇总
function toggleAllItemsView() {
  const box = document.getElementById('allItemsSummary');
  if (!box) return;
  if (box.style.display === 'none') {
    const orders = DB.get('orders').filter(o =>
      (o.type === 'warehouse' || o.type === 'door') && o.status === 'pending'
    );
    // 汇总商品
    const itemMap = {};
    orders.forEach(o => {
      o.items.forEach(it => {
        const key = it.name;
        if (!itemMap[key]) itemMap[key] = { name: key, totalQty: 0, orderCount: 0 };
        itemMap[key].totalQty += it.qty;
        itemMap[key].orderCount++;

    box.style.display = 'block';
    box.innerHTML = `
      <div class="detail-section card" style="margin-bottom:14px">

            ${items.map(it => `<tr><td>${it.name}</td><td style="font-weight:600">${it.totalQty}</td><td>${it.orderCount}</td></tr>`).join('')}

        </table></div>

}

  const idx = customers.findIndex(c => c.id === customerId);

  }
}

let _customerGenderChart = null;
let _customerRegionChart = null;

function extractRegionKey(region){
  if(!region) return '未知';
  let province = '', city = '';
  const provMatch = region.match(/^([^省]+省)/);
  if(provMatch) province = provMatch[1];
  const remaining = province ? region.slice(province.length) : region;
  const cityMatch = remaining.match(/^([^市]+市)/);
  if(cityMatch) city = cityMatch[1];
  if(province && city) return province + city;
  if(city) return city;
  if(province) return province;
  return region.slice(0, 4);
}

function renderCustomerCharts(){
  if(typeof Chart === 'undefined') return;
  const customers = DB.get('customers');

  var genderCount = { male: 0, female: 0, unknown: 0 };
  customers.forEach(function(c){
    var g = c.gender || 'unknown';
    if(genderCount.hasOwnProperty(g)) genderCount[g]++;
    else genderCount.unknown++;
  });

  var genderCtx = document.getElementById('customerGenderChart');
  if(genderCtx){
    if(_customerGenderChart) _customerGenderChart.destroy();
    _customerGenderChart = new Chart(genderCtx, {
      type: 'pie',
      data: {
        labels: ['男', '女', '未标注'],
        datasets: [{
          data: [genderCount.male, genderCount.female, genderCount.unknown],
          backgroundColor: ['#3b82f6', '#ec4899', '#9ca3af']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 12 } } } }
      }
    });
  }

  var regionCount = {};
  customers.forEach(function(c){
    var key = extractRegionKey(c.region);
    regionCount[key] = (regionCount[key] || 0) + 1;
  });

  var sortedRegions = Object.keys(regionCount).sort(function(a,b){ return regionCount[b] - regionCount[a]; }).slice(0, 10);
  var regionData = sortedRegions.map(function(k){ return regionCount[k]; });

  var regionCtx = document.getElementById('customerRegionChart');
  if(regionCtx){
    if(_customerRegionChart) _customerRegionChart.destroy();
    _customerRegionChart = new Chart(regionCtx, {
      type: 'bar',
      data: {
        labels: sortedRegions,
        datasets: [{
          label: '客户数',
          data: regionData,
          backgroundColor: '#4f46e5',
          borderRadius: 4
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } } },
          y: { ticks: { font: { size: 11 } } }
        }
      }
    });
  }
}

function batchImportProducts(){
  const modalHtml = `
    <div class="modal-mask" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
