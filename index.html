<script>
const SUPABASE_URL = 'https://mfimcrzewhnlbtkjgqlq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nwhoBCwURiqEoUegkuGI5g_6AJwfrBj';
function _initSupabase(){
  if(window.supabase){
    try{ window._sbpbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }
    catch(e){ console.warn('[Supabase] 初始化失败：', (e && e.message) || e); }
    // Realtime 订阅依赖 DB / 渲染器等后续定义的对象，必须等整段脚本执行完（DOMContentLoaded）再挂
    window.addEventListener('DOMContentLoaded', function(){ try{ setupRealtime(); }catch(e){ console.warn('[Realtime] 初始化失败：', (e && e.message) || e); } });
    return;
  }
  window._sbpbClient = null;
  // CDN 兜底：本地 libs/supabase.min.js 加载失败时，动态从 jsDelivr 加载 supabase 库，确保云同步可用
  try{
    var _sb = document.createElement('script');
    _sb.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    _sb.onload = function(){ try{ window._sbpbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); setupRealtime(); }catch(e){ window._sbpbClient = null; } };
    _sb.onerror = function(){ console.warn('[Supabase] CDN 兜底加载失败，云同步不可用'); };
    document.head.appendChild(_sb);
  }catch(e){}
}
// Supabase Realtime 实时订阅：订单/商品表被其它设备增删改时，当前设备自动拉取最新并刷新（Req3）
// 注意：需在 Supabase 后台开启表的实时（见随附 SQL），否则订阅收不到事件。
function setupRealtime(){
  if(window._realtimeReady) return;
  if(!window._sbpbClient || typeof window._sbpbClient.channel !== 'function') return;
  try{
    const sb = window._sbpbClient;
    window._rtOrders = sb.channel('rt-orders')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, function(payload){ onRealtimeChange('orders'); })
      .subscribe(function(status){ if(status === 'SUBSCRIBED') console.log('[Realtime] orders 已订阅'); });
    window._rtProducts = sb.channel('rt-products')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, function(payload){ onRealtimeChange('products'); })
      .subscribe(function(status){ if(status === 'SUBSCRIBED') console.log('[Realtime] products 已订阅'); });
    window._rtAftersales = sb.channel('rt-aftersales')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'aftersales' }, function(payload){ onRealtimeChange('aftersales'); })
      .subscribe(function(status){ if(status === 'SUBSCRIBED') console.log('[Realtime] aftersales 已订阅'); });
    // 客户表订阅：新建订单自动建档的客户、或在客户管理手动维护的客户，任一设备变更后其它设备实时刷新（修复“客户信息未维护到客户管理板块/跨设备看不到”）
    window._rtCustomers = sb.channel('rt-customers')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' }, function(payload){ onRealtimeChange('customers'); })
      .subscribe(function(status){ if(status === 'SUBSCRIBED') console.log('[Realtime] customers 已订阅'); });
    window._realtimeReady = true;
  }catch(e){ console.warn('[Realtime] 订阅失败：', (e && e.message) || e); }
}
_initSupabase();

// 注意：原先的“一次性清空全部订单”脚本（含云端 DELETE）已移除——
// 其云端 DELETE 会在未设标记的浏览器首次加载时清空整个 orders 表，误删他人刚提交的订单。
// 清旧单已通过云端 Node 脚本完成；本地残留旧单保留，避免误删。

/* ============ 快递100 实时物流（真实接口，非模拟） ============
 * 快递100 实时查询(poll) 接口需要 key + customer + MD5 签名，且浏览器直连会被 CORS 拦截，
 * 因此统一经 Supabase Edge Function 代理：密钥仅存于函数 Secrets（不下发前端），
 * 函数地址由 Supabase 项目自动推导。部署函数并在函数 Secrets 中配置
 * KUAIDI100_KEY / KUAIDI100_CUSTOMER 后即生效。
 */
const KUAIDI100_PROXY = SUPABASE_URL.replace(/\.supabase\.co$/, '.functions.supabase.co') + '/query-kuaidi100';
// ── 快递100 密钥：不再硬编码于前端 ──
//   公开 PWA 代码里的密钥会被任何人抓取并盗刷查询次数。所有查询统一经 Supabase Edge Function
//   代理中转（见 supabase/functions/query-kuaidi100/index.ts），密钥仅存于函数 Secrets。
const KUAIDI100_KEY    = '';
const KUAIDI100_CUSTOMER = '';
// 快递公司中文名 → 快递100 公司编码（com）
const EXPRESS_CODE_MAP = {
  '顺丰速运':'shunfeng','顺丰':'shunfeng','京东物流':'jd','京东':'jd','圆通速递':'yuantong','圆通':'yuantong',
  '中通快递':'zhongtong','中通':'zhongtong','韵达快递':'yunda','韵达':'yunda','申通快递':'shentong','申通':'shentong',
  'EMS':'ems','德邦快递':'deppon','德邦':'deppon','邮政包裹':'youzhengguonei','邮政':'youzhengguonei','其他快递':''
};
const EXPRESS_NAME_MAP = {shunfeng:'顺丰速运',jd:'京东物流',yuantong:'圆通速递',zhongtong:'中通快递',yunda:'韵达快递',shentong:'申通快递',ems:'EMS',deppon:'德邦快递',youzhengguonei:'邮政包裹'};
function expressCodeOf(name){ return EXPRESS_CODE_MAP[(name||'').trim()] || ''; }
function reverseExpressName(code){ return EXPRESS_NAME_MAP[code] || (code||''); }

/* 说明：快递100 查询已无任何前端直连 / JSONP 分支——明文密钥绝不能出现在公开 PWA 代码中
   （任何人都能抓取并盗刷查询次数）。所有查询统一经 Supabase Edge Function 代理中转
   （supabase/functions/query-kuaidi100/index.ts），密钥仅存于函数 Secrets
   （KUAIDI100_KEY / KUAIDI100_CUSTOMER）。前端零密钥暴露。 */
</script>

/* 表格内按钮统一居中：垂直对齐 + 操作列水平居中 */
.table-wrap td{vertical-align:middle}
.table-wrap td:has(>.btn),.table-wrap td:has(>button){text-align:center}
/* 仅含单个按钮的独立操作区块：水平居中 */
div:has(> .btn):not(:has(> *:not(.btn))):not(.search-box):not(.card-title):not(.filter-bar):not(.btn-block){text-align:center}

.form-group{margin-bottom:16px}
.form-label{display:block;margin-bottom:6px;font-size:13px;font-weight:500;color:var(--text)}
.form-label .required{color:var(--danger)}
.form-control{
  width:100%;padding:10px 14px;
  border:1px solid var(--border);border-radius:8px;
  font-size:16px;transition:.15s;background:#fff;
  box-sizing:border-box;
}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea.form-control{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.table-wrap{overflow-x:auto;border-radius:var(--radius);min-width:0;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0}
thead th{
  background:#f9fafb;text-align:left;padding:13px 16px;
  font-weight:600;color:var(--text-muted);
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:13px 16px;border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:#fafafa}
tbody tr:hover{background:#f3f4f6}
.table-empty{text-align:center;padding:40px;color:var(--text-muted)}

/* 销售端订单列表：状态分段控件（替代原细按钮） */
.sales-tab-seg{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:12px;margin-bottom:14px;overflow-x:auto}
.sales-tab-seg .seg-item{flex:1 1 0;min-width:64px;border:none;background:transparent;color:var(--text-muted);font-size:13px;padding:8px 4px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:all .15s;font-weight:500}
.sales-tab-seg .seg-item:hover{color:var(--text)}
.sales-tab-seg .seg-item.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
.sales-tab-seg .seg-count{display:inline-block;margin-left:2px;font-size:11px;opacity:.7}

/* 订单列表「类型分段切换」（方案A：普通/留仓分开，上门在独立菜单） */
.order-type-seg{display:flex;gap:6px;background:linear-gradient(135deg,#f8fafc,#eef2f7);padding:5px;border-radius:14px;margin-bottom:14px;box-shadow:inset 0 1px 3px rgba(15,23,42,.06);overflow-x:auto}
.order-type-seg .ot-item{flex:1 1 0;min-width:88px;border:none;background:transparent;color:var(--text-muted);font-size:13px;padding:9px 6px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .18s;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.order-type-seg .ot-item:hover{color:var(--text);background:rgba(255,255,255,.55)}
.order-type-seg .ot-item.active{background:#fff;color:var(--primary);box-shadow:0 2px 10px rgba(59,130,246,.20);font-weight:700}
.order-type-seg .ot-item .ot-icon{font-size:15px;line-height:1}
.order-type-seg .ot-item .ot-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:rgba(15,23,42,.08);font-size:11px;font-weight:600;color:var(--text-muted)}
.order-type-seg .ot-item.active .ot-count{background:var(--primary);color:#fff}
@media(max-width:600px){.order-type-seg .ot-item{min-width:72px;font-size:12px;padding:8px 4px}}

/* 销售端订单列表：空状态引导 */
.sales-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 16px;color:var(--text-muted)}
.sales-empty .empty-icon{font-size:40px}
.sales-empty .empty-text{font-size:14px}

/* 状态标签 */
.tag{
  display:inline-block;padding:4px 12px;border-radius:12px;
  font-size:12px;font-weight:500;white-space:nowrap;
}
.tag-pending{background:#fef3c7;color:#92400e}
.tag-confirmed{background:#dbeafe;color:#1e40af}
.tag-feedback{background:#fef3c7;color:#92400e}
.tag-feedback-done{background:#f3e8ff;color:#6b21a8}
.tag-completed{background:#d1fae5;color:#065f46}
.tag-paid{background:#d1fae5;color:#065f46}
.tag-unpaid{background:#fee2e2;color:#991b1b}
.tag-pending-pay{background:#fef3c7;color:#92400e}
.tag-settled{background:#d1fae5;color:#065f46}
.tag-unsettled{background:#fef3c7;color:#92400e}
.tag-onshelf{background:#d1fae5;color:#065f46}
.tag-offshelf{background:#f3f4f6;color:#6b7280}
.tag-as-pending{background:#fef3c7;color:#92400e}
.tag-as-processing{background:#dbeafe;color:#1e40af}
.tag-as-resolved{background:#d1fae5;color:#065f46}
.tag-as-closed{background:#f3f4f6;color:#6b7280}
.tag-type-normal{background:#e0e7ff;color:#3730a3}
.tag-type-warehouse{background:#fed7aa;color:#9a3412}
.tag-type-door{background:#fbcfe8;color:#9d174d}

/* 统计卡片 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:24px}
.stat-card{
  background:#fff;border-radius:var(--radius-lg);padding:22px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:.15s;border:1px solid #f1f3f5;
}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--primary-light)}
.stat-icon{
  width:48px;height:48px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.stat-icon.blue{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.stat-icon.green{background:linear-gradient(135deg,#10b981,#059669);color:#fff}
.stat-icon.purple{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.stat-icon.orange{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff}
.stat-icon.red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.stat-icon.cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff}
.stat-info .stat-label{font-size:12px;color:var(--text-muted);margin-bottom:4px}
.stat-info .stat-value{font-size:24px;font-weight:700;color:var(--text)}

/* 销售首页新版仪表盘 */
.dashboard-greeting{font-size:20px;font-weight:600;color:var(--text);margin-bottom:20px}
.dashboard-greeting .name{color:var(--primary)}
.dashboard-top{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:24px}
.dashboard-summary-card{
  background:#fff;border-radius:var(--radius-lg);padding:24px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;
  border:1px solid transparent;transition:.15s;
}
.dashboard-summary-card:hover{box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.dashboard-summary-icon{
  width:64px;height:64px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;
}
.dashboard-summary-icon.red{background:#fee2e2;color:#991b1b}
.dashboard-summary-icon.blue{background:#dbeafe;color:#1e40af}
.dashboard-summary-info{flex:1}
.dashboard-summary-label{font-size:14px;color:var(--text-muted);margin-bottom:8px}
.dashboard-summary-value{font-size:32px;font-weight:700;color:var(--text);margin-bottom:8px}
.dashboard-summary-compare{font-size:13px;color:var(--text-muted)}
.dashboard-actions{margin-top:28px;text-align:center}
.btn-dashboard-new{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;border:none;border-radius:14px;padding:20px 48px;
  font-size:18px;font-weight:800;letter-spacing:2px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s,filter .15s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn-dashboard-new:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);filter:brightness(1.05)}
.btn-dashboard-new:active{transform:translateY(0) scale(.98);box-shadow:var(--shadow)}

/* 筛选栏 */
.filter-bar{
  display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;align-items:center;
  min-width:0;
}
.filter-bar .search-box{
  flex:1;min-width:0;position:relative;
}
.filter-bar .search-box input{
  width:100%;padding:10px 12px 10px 36px;
  border:1px solid var(--border);border-radius:8px;font-size:16px;
  box-sizing:border-box;
}
.filter-bar .search-box .search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:14px;
}
.filter-bar select{
  padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;background:#fff;
}

/* 日期范围筛选：统一美观组件（订单管理 / 售后工单 共用） */
.date-filter{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#f8fafc;border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;margin:14px 0 6px;
}
.date-filter .df-label{
  font-size:13px;font-weight:600;color:var(--text-secondary);
  white-space:nowrap;display:inline-flex;align-items:center;gap:6px;
}
.date-filter .df-sep{color:var(--text-muted);font-size:13px}
.date-filter .df-input{
  width:150px;padding:7px 10px;border:1px solid var(--border);
  border-radius:8px;font-size:13px;background:#fff;color:var(--text);transition:.15s;
}
.date-filter .df-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.date-filter .df-clear{
  padding:6px 12px;border:1px solid var(--border);border-radius:8px;
  background:#fff;color:var(--text-secondary);font-size:12px;cursor:pointer;transition:.15s;
}
.date-filter .df-clear:hover{background:#f1f5f9;color:var(--text)}
/* 移动端：日期筛选纵向堆叠 */
@media(max-width:768px){
  .date-filter{flex-direction:column;align-items:stretch}
  .date-filter .df-input{width:100%}
}

/* 双列布局 */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:20px;
}
.modal{
  background:#fff;border-radius:var(--radius-lg);
  width:100%;max-width:520px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.modal.lg{max-width:760px}
.modal.xl{max-width:900px}
.modal-box{
  background:#fff;border-radius:var(--radius-lg);
  width:100%;max-width:680px;max-height:90vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
  animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-header{
  padding:18px 24px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{
  background:none;font-size:22px;color:var(--text-muted);
  width:28px;height:28px;border-radius:6px;
}
.modal-close:hover{background:#f3f4f6}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-footer{
  padding:16px 24px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:10px;
}

/* 提示消息 */
.toast{
  position:fixed;top:20px;right:20px;
  padding:12px 20px;border-radius:8px;
  background:#fff;box-shadow:var(--shadow-lg);
  z-index:2000;font-size:14px;
  display:flex;align-items:center;gap:8px;
  animation:slideIn .3s ease;
}
.toast.success{border-left:4px solid var(--success)}
.toast.error{border-left:4px solid var(--danger)}
.toast.info{border-left:4px solid var(--info)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* 订单详情 */
.detail-section{margin-bottom:28px}
.detail-section h4{
  font-size:14px;font-weight:600;margin-bottom:12px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
  color:var(--primary);
}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.info-item .info-label{font-size:12px;color:var(--text-muted);margin-bottom:3px}
.info-item .info-value{font-size:14px;font-weight:500}
.info-item .info-value.mono{font-family:monospace}

/* 新建订单商品搜索 */
.product-search-wrap{position:relative}
.product-search-results{
  position:absolute;top:100%;left:0;right:0;
  background:#fff;border:1px solid var(--border);
  border-radius:6px;box-shadow:var(--shadow-lg);
  max-height:260px;overflow-y:auto;z-index:10;margin-top:4px;
  overflow-x:auto;
}
.product-search-results .ps-item{
  padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;min-width:0;
}
.product-search-results .ps-item:hover{background:var(--primary-light)}
.product-search-results .ps-item:last-child{border-bottom:none}
.product-search-results .ps-empty{padding:14px;text-align:center;color:var(--text-muted);font-size:13px}
.product-search-results .ps-item input[type=checkbox]{flex-shrink:0}
.product-search-wrap{position:relative;width:100%;min-width:0}
.product-search-results{
  position:absolute;
  left:0;right:0;top:calc(100% + 4px);
  z-index:100;
  background:#fff;
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  max-height:320px;
  overflow-y:auto;
  box-sizing:border-box;
}
.product-search-results .ps-item div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cart-item{
  display:grid;grid-template-columns:2fr 1fr 1fr 1fr 30px;
  gap:10px;align-items:center;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.cart-item:last-child{border-bottom:none}
.qty-control{display:flex;align-items:center;gap:6px}
.qty-control button{
  width:24px;height:24px;border-radius:4px;
  background:#f3f4f6;font-size:14px;font-weight:bold;
}
.qty-control button:hover{background:#e5e7eb}
.qty-control input{
  width:46px;text-align:center;border:1px solid var(--border);
  border-radius:4px;padding:3px 4px;font-size:13px;
}
.cart-summary{
  margin-top:14px;padding:16px;background:#f8fafc;border:1px solid #eef1f4;border-radius:10px;
  display:flex;justify-content:space-between;align-items:center;
}
.cart-summary .total-label{font-size:14px;color:var(--text-muted)}
.cart-summary .total-value{font-size:24px;font-weight:700;color:var(--primary)}

/* 核对订单金额 + 收款方式 */
.payment-check-section{
  margin-top:16px;padding:20px;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);
}
.payment-check-title{
  font-size:15px;font-weight:600;color:var(--text);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.pay-mode{
  display:flex;gap:12px;margin-bottom:16px;
}
.pay-mode-option{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border:1px solid var(--border);border-radius:10px;
  cursor:pointer;transition:.15s;background:#fff;
}
.pay-mode-option:hover{border-color:var(--primary-light);background:var(--primary-light)}
.pay-mode-option input[type=radio]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.pay-mode-option:has(input[type=radio]:checked){
  border-color:var(--primary);background:#f0f5ff;color:var(--primary);
}
.payment-hint{margin-top:10px;font-size:12px;color:var(--danger);min-height:18px}

/* 一键识别区 */
.recognize-box{
  background:linear-gradient(135deg,#f0f4ff,#fce7f3);
  border:1px dashed var(--primary);
  border-radius:10px;padding:16px;margin-bottom:20px;
}
.recognize-box .rec-title{
  font-size:14px;font-weight:600;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;color:var(--primary);
}
.recognize-box textarea{
  width:100%;min-height:120px;padding:12px;
  border:1px solid var(--border);border-radius:6px;
  font-size:13px;font-family:monospace;resize:vertical;
  background:#fff;
}
.recognize-box .rec-btns{
  display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;
}
.rec-preview-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px;
}
.rec-preview-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);
}
.rec-preview-card .rpc-title{
  font-size:12px;font-weight:600;margin-bottom:8px;
}
.rec-preview-card .rpc-item{
  font-size:13px;color:var(--text);padding:5px 0;
  border-bottom:1px dashed var(--border);word-break:break-all;
}
.rec-preview-card .rpc-item:last-child{border-bottom:none}
.rec-preview-card .rpc-empty{font-size:12px;color:var(--text-muted)}

/* 拍照/上传区 */
.image-upload-area{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.image-preview-list{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;
}
.image-thumb{
  width:70px;height:70px;border-radius:6px;object-fit:cover;
  border:1px solid var(--border);cursor:pointer;
}
.image-thumb-wrap{position:relative}
.image-thumb-remove{
  position:absolute;top:-6px;right:-6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;
}

/* 裁剪界面 */
.crop-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:3000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;
}
.crop-canvas-wrap{
  position:relative;max-width:100%;max-height:70vh;
  margin-bottom:16px;
}
.crop-canvas-wrap canvas{
  display:block;max-width:100%;max-height:70vh;
  border:2px solid #fff;border-radius:4px;
}
.crop-select-box{
  position:absolute;border:2px dashed #fff;
  background:rgba(255,255,255,.15);pointer-events:none;
}
.crop-actions{
  display:flex;gap:12px;
}
.crop-actions button{
  padding:10px 24px;border-radius:6px;font-size:14px;font-weight:500;
}

/* 订单类型选择 */
.order-type-group{
  display:flex;gap:8px;margin-bottom:14px;
}
.order-type-option{
  flex:1;padding:8px 6px;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;text-align:center;
  transition:.15s;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px;
}
.order-type-option.active{
  border-color:var(--primary);background:var(--primary-light);
  color:var(--primary);font-weight:600;
}
.order-type-option .ot-icon{font-size:15px}
.order-type-option .ot-name{font-size:13px}
.order-type-option .ot-desc{display:none}
@media(min-width:500px){.order-type-option .ot-desc{display:inline;font-size:11px;color:var(--text-muted);margin-left:2px}.order-type-option{gap:6px}}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}
.empty-state .empty-text{font-size:14px}

.back-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--primary);font-size:13px;cursor:pointer;margin-bottom:14px;
}
.back-link:hover{text-decoration:underline}

/* 上门订单备货/定金尾款 */
.door-extra{
  background:#fdf2f8;border:1px solid #fbcfe8;border-radius:8px;
  padding:14px;margin-top:14px;
}
.door-payments{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px;
}

/* 售后图片 */
.after-images{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.after-images img{
  width:90px;height:90px;object-fit:cover;border-radius:6px;
  border:1px solid var(--border);cursor:pointer;
}

/* 详情页信息框（留白通透） */
.detail-box{
  margin-top:12px;padding:12px 14px;
  background:#f8fafc;border:1px solid #eef1f4;border-radius:10px;
  font-size:13px;color:var(--text);line-height:1.7;

        <span class="sync-badge" id="syncBadge">已联网</span>
        <span style="font-size:13px;color:var(--text-muted)" id="headerDate"></span>
      </div>
    </header>
    <main class="main-content" id="mainContent"></main>
  </div>
</div>

<!-- 弹窗容器 -->
<div id="modalContainer"></div>
<!-- 裁剪容器 -->
<div id="cropContainer"></div>
<!-- 提示容器 -->
<div id="toastContainer"></div>

<script>
/* ============================================================
 * 销售订单管理系统 - 2026-0809-3
 * 单文件 HTML，localStorage 模拟数据库
 * ============================================================ */

/* ============ 全局状态 ============ */
let currentUser = null;   // 当前登录用户
let currentRoute = 'dashboard'; // 当前页面路由

/* ============ 数据层：Supabase + localStorage 混合缓存 ============ */
const DB = {
  // camelCase -> snake_case 字段映射表
  _camelToSnake: {
    customerId:'customer_id', salesId:'sales_id', orderId:'order_id', salesName:'sales_name',
    customerName:'customer_name', orderDate:'order_date', createdAt:'created_at', updatedAt:'updated_at',
    payDate:'pay_date', productId:'product_id', ownerId:'owner_id', trackingNo:'tracking_no',
    paymentMethod:'payment_method', expressCompany:'express_company', commissionId:'commission_id',
    period:'period', aftersaleId:'aftersale_id', orderItemId:'order_item_id',
    fullPayment:'full_payment', finalPayment:'final_payment', completionDate:'completion_date',
    collectedAmount:'collected_amount', doorDate:'door_date', contactName:'contact_name',
    actorId:'actor_id', actorName:'actor_name', actorRole:'actor_role', action:'action',
    targetType:'target_type', targetId:'target_id', targetLabel:'target_label', before:'before', after:'after', detail:'detail',
    lockedBy:'locked_by', lockedAt:'locked_at'
  },
  _snakeToCamel: {},
  // JSONB 字段（需要序列化/反序列化）
  _jsonFields: { orders:'items', aftersales:'items' },

  // 同步状态
  _syncStatus: 'idle', // idle | syncing | synced | error
  _syncError: null,

  get(key, def){
    try{
      const v = localStorage.getItem('soms_'+key);
      return v ? JSON.parse(v) : (def !== undefined ? def : []);
    }catch(e){ return def !== undefined ? def : []; }
  },
  set(key, val){
    if(key === 'users') val = this._scrubUserPasswords(val);
    localStorage.setItem('soms_'+key, JSON.stringify(val));
    // 火忘式异步同步到 Supabase
    this.syncTable(key).catch(function(err){
      console.warn('后台同步失败 ['+key+']:', err.message);
    });
    // 2026-0808：订单/商品写后，立即从云端权威重拉全量并刷新当前视图（Req4），
    // 不依赖本地状态。避免“一端保存后，另一端界面仍显示旧值”。
    // 用防抖合并连续写操作（如逐商品填单号），避免重渲染风暴。
    if((key === 'orders' || key === 'products' || key === 'aftersales') && typeof window._afterWriteRefresh === 'function'){
      if(!window._afterWriteTimers) window._afterWriteTimers = {};
      const k = key;
      clearTimeout(window._afterWriteTimers[k]);
      window._afterWriteTimers[k] = setTimeout(function(){ window._afterWriteRefresh(k); }, 350);
    }
  },

  // 安全：擦除写入本地的 users 缓存中的 password 字段（即使是哈希），
  // 防止凭据被 XSS / 本地存储读取拖走做离线字典攻击。密码校验一律走 Supabase Auth（联网）。
  _scrubUserPasswords(list){
    if(!Array.isArray(list)) return list;
    return list.map(function(u){
      if(u && u.password != null){
        const c = Object.assign({}, u);
        delete c.password;
        return c;
      }
      return u;
    });
  },
  uid(prefix){
    return (prefix||'') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  },

  // 将 camelCase 对象转为 snake_case（用于写入 Supabase）
  _toSnake(obj){
    const self = this;
    if(!obj || typeof obj !== 'object') return obj;
    if(Array.isArray(obj)) return obj.map(function(item){ return self._toSnake(item); });
    const result = {};
    for(const k in obj){
      const snakeKey = self._camelToSnake[k] || k;
      result[snakeKey] = obj[k];
    }
    return result;
  },

  // 将 snake_case 对象转为 camelCase（用于从 Supabase 读取）
  _toCamel(obj){
    const self = this;
    if(!obj || typeof obj !== 'object') return obj;
    if(Array.isArray(obj)) return obj.map(function(item){ return self._toCamel(item); });
    const result = {};
    for(const k in obj){
      const camelKey = self._snakeToCamel[k] || k;
      result[camelKey] = obj[k];
    }
    return result;
  },

  // 初始化 snakeToCamel 映射
  _initMapping(){
    for(const k in this._camelToSnake){
      this._snakeToCamel[this._camelToSnake[k]] = k;
    }
  },

  // 从 Supabase 加载单个表数据到 localStorage 缓存
  async _loadTable(key){
    try{
      const table = key; // key 即表名
      const { data, error } = await window._sbpbClient.from(table).select('*').order('created_at', { ascending: true });
      if(error) throw error;
      // snake_case -> camelCase
      let cloud = this._toCamel(data || []);
      if(key === 'users'){
        // 账号表：云端为密码权威（避免“同账号在不同设备密码不一致 / 多密码”）。
        // 本地与云端都存在的账号：密码/姓名/角色/手机号以云端为准；本地独有账号保留，云端独有账号补入。
        // 之所以不能走下面的“本地优先合并”：users 表在 Supabase 无 updated_at 列，改密码后时间戳不变，
        // _mergeById 永远判定“本地不旧于云端”而保留本地旧密码，导致多端密码永不收敛。
        const local = this.get(key, []);
        const cloudById = {}; const cloudByUser = {};
        (cloud||[]).forEach(r => { if(r&&r.id!=null) cloudById[r.id]=r; if(r&&r.username) cloudByUser[String(r.username||'').toLowerCase()]=r; });
        const seen = new Set(); const mergedArr = [];
        local.forEach(r => {
          if(!r||r.id==null) return;
          const c = cloudById[r.id] || cloudByUser[String(r.username||'').toLowerCase()];
          if(c){
            mergedArr.push(Object.assign({}, r, {
              name: c.name != null ? c.name : r.name,
              role: c.role != null ? c.role : r.role,
              phone: c.phone != null ? c.phone : r.phone,
              disabled: c.disabled != null ? c.disabled : r.disabled
            }));
          } else { mergedArr.push(r); }
          seen.add(r.id);
        });
        (cloud||[]).forEach(r => { if(r&&r.id!=null && !seen.has(r.id)){ mergedArr.push(r); seen.add(r.id); } });
        localStorage.setItem('soms_'+key, JSON.stringify(key === 'users' ? this._scrubUserPasswords(mergedArr) : mergedArr));
        return mergedArr;
      }
      // 本地优先合并：避免云端数据（可能为空或滞后）覆盖掉本地刚新增/修改的数据，
      // 导致“刷新后订单丢失 / 销售下的单管理员看不到”等问题。与 syncTable 的合并策略一致。
      const local = this.get(key, []);
      const merged = this._mergeById(local, cloud,
        key === 'orders' ? this.get('_deletedOrderIds', []) :
        key === 'products' ? this.get('_deletedProductIds', []) :
        key === 'users' ? this.get('_deletedUserIds', []) : null
      );
      // 售后工单：云端已被清空（或本就为空）时，强制清空本地缓存，避免刷新后本地旧单被合并逻辑复活上云。
      // 正常新建售后单会即时上云（cloud 非空），不会受影响。
      if(key === 'aftersales' && (!cloud || cloud.length === 0)){
        localStorage.setItem('soms_aftersales', JSON.stringify([]));
        return [];
      }
      // 商品表：把原始云端列表暂存，供启动时去重对齐使用（避免本地旧缓存重复上云）
      if(key === 'products') window._lastCloudProducts = cloud || [];
      localStorage.setItem('soms_'+key, JSON.stringify(key === 'users' ? this._scrubUserPasswords(merged) : merged));
      return merged;
    }catch(e){
      console.warn('从 Supabase 加载 ['+key+'] 失败:', e.message);
      return null;
    }
  },

  // 网络权威拉取：直接从云端 select 全量，覆盖本地缓存（不合并本地，确保拿到数据库最新数据）。
  // 用于导航进入页面、实时订阅变更、写后重拉等“数据库为唯一数据源”场景（Req2/3/4/6）。
  async pullTableAuthoritative(key){
    if(!window._sbpbClient) return null;
    try{
      const { data, error } = await window._sbpbClient.from(key).select('*').order('created_at', { ascending: true });
      if(error) throw error;
      let cloud = this._toCamel(data || []);
      // 尊重本地已删除标记：云端权威拉取后，仍要排除 _deletedOrderIds/_deletedProductIds/_deletedUserIds，
      // 否则 purgeOrdersForSales / deleteOrder 刚清理的订单会被同步/实时订阅立即拉回，导致页面闪烁、订单消失又出现。
      const excludeMap = { orders: '_deletedOrderIds', products: '_deletedProductIds', users: '_deletedUserIds' };
      const excludeKey = excludeMap[key];
      const excludeIds = excludeKey ? this.get(excludeKey, []) : null;
      if(excludeIds && excludeIds.length) cloud = cloud.filter(r => r && r.id != null && !excludeIds.includes(r.id));
      const cloudIds = new Set((cloud || []).map(r => r && r.id).filter(Boolean));
      // 关键修复（2026-0808-16）：云端拉取不再“直接覆盖本地”，而是与本地按 updatedAt 较新者合并，
      // 并移除“云端已不存在”的本地行（删除传播）。这样同时解决两类对立问题：
      //  ① admin 刚完成「下单 / 改状态 / 编辑损耗」后，afterWriteRefresh / Realtime / 15秒轮询 任一次拉到
      //     “稍旧”的云端副本时，会把本地刚写入的较新改动覆盖回旧值（表现：下单按钮先变「已下单」、过一会又退回「下单」）；
      //  ② 仍保证他人删除的订单/商品能从本端移除（删除传播），不回归“清理后订单又出现”的旧 bug。
      const local = this.get(key, []);
      let merged = this._mergeById(local, cloud, excludeIds);
      // 删除传播：云端已不存在、又不在本端排除集的本地行，视为被他人删除 → 移除
      merged = merged.filter(r => !r || !r.id || cloudIds.has(r.id));
      localStorage.setItem('soms_'+key, JSON.stringify(key === 'users' ? this._scrubUserPasswords(merged) : merged));
      if(key === 'products') window._lastCloudProducts = cloud || [];
      return merged;
    }catch(e){
      console.warn('云端权威拉取 ['+key+'] 失败:', e.message);
      return null;
    }
  },

  // 按 id 合并本地与云端数据：以 updatedAt/createdAt 较新者优先（云端权威、更新覆盖旧本地），
  // 解决多端协作时“一端改动被另一端本地旧版覆盖/订单丢失”的问题。
  // excludeIds：已在本端删除、但云端可能仍残留的订单 id，合并时强制跳过，避免被同步拉回。
  _mergeById(local, cloud, excludeIds){
    const exSet = (excludeIds && excludeIds.length) ? new Set(excludeIds) : null;
    const map = {};
    const ts = r => {
      if(!r) return 0;
      const v = r.updatedAt || r.createdAt || r.orderDate || r.payDate || '';
      const n = v ? Date.parse((''+v).replace(' ', 'T')) : 0;
      return isNaN(n) ? 0 : n;
    };
    const sig = r => { try { return JSON.stringify(r); } catch(e){ return String(r && r.id); } };
    (local || []).forEach(r => { if(r && r.id != null && !(exSet && exSet.has(r.id))) map[r.id] = r; });
    (cloud || []).forEach(r => {
      if(!r || r.id == null || (exSet && exSet.has(r.id))) return;
      if(!map[r.id]) map[r.id] = r;                 // 云端独有 → 保留
      else {
        // 订单：本地行正被「本人」锁定（下单/编辑中）时，云端不得覆盖本地，
        // 防止刚点的「已下单」、刚改的损耗被稍旧的云端副本冲掉（即便时间戳相等也优先本地）。
        const lr = map[r.id];
        // 订单锁定优先（修复“下单变已下单后又回退待下单”的多端时间戳碰撞）：
        // 任一端正在下单/编辑（lockedBy 未超时）时，锁定方持有的版本优先，禁止其它端用陈旧本地副本
        // 把“已下单/损耗”等较新改动冲掉。已下单的订单在管理员离开详情页前保持锁定，确保 confirmed 跨端稳固。
        const lockActive = function(x){ return x && x.lockedBy && (Date.now() - Date.parse(((x.lockedAt||'').replace(' ','T'))||0)) < ORDER_LOCK_TTL_MS; };
        const curName = (typeof currentUser !== 'undefined' && currentUser) ? currentUser.name : null;
        const rLock = lockActive(r);
        const lrLock = lockActive(lr);
        const lrIsMine = lrLock && curName && lr.lockedBy === curName;
        if(rLock && !lrIsMine){ map[r.id] = r; return; }  // 云端被他人锁定 → 云端优先，禁止陈旧本地覆盖
        if(lrIsMine){ return; }                           // 本地被本人锁定 → 本人最新本地优先（含撤销）
        const ct = ts(r), mt = ts(lr);
        if(ct > mt) map[r.id] = r;                  // 云端严格更新 → 覆盖本地
        else if(ct === mt && sig(r) !== sig(lr)) {
          // 时间戳相等但内容不同：取内容哈希较大者作为确定性胜者，保证多端必然收敛
          map[r.id] = sig(r) > sig(lr) ? r : lr;
        }
        // 否则（云端不新，或相等且内容相同）→ 保留本地，避免刚保存的修改被旧云端数据冲掉
      }
    });
    return Object.keys(map).map(id => map[id]);
  },

  // 同步单个表到 Supabase
  async syncTable(key){
    if(!window._sbpbClient) return;
    try{
      const table = key;
      const local = this.get(key, []);
      // 先拉取云端数据，与本地合并（较新优先），得到全集
      let data = local;
      try{
        const { data: cloudRows, error } = await window._sbpbClient.from(table).select('*');
        if(!error && cloudRows){
          const cloud = this._toCamel(cloudRows);
          data = this._mergeById(local, cloud,
            key === 'orders' ? this.get('_deletedOrderIds', []) :
            key === 'products' ? this.get('_deletedProductIds', []) :
            key === 'users' ? this.get('_deletedUserIds', []) : null
          );
          // 写回本地缓存为合并后的全集（users 不写密码哈希）
          localStorage.setItem('soms_' + key, JSON.stringify(key === 'users' ? this._scrubUserPasswords(data) : data));
        }
      }catch(e){
        console.warn('合并云端数据失败，改用本地数据 ['+key+']:', e.message);
      }
      // 账号表：迁移到 Supabase Auth 后，users 由 Auth/后台管理，前端只拉不推，
      // 避免把本地旧的 sha256 密码误写回云端、或覆盖后台改过的角色/状态。
      if(table === 'users'){
        console.log('表 [users] 已同步（仅拉取，Auth 接管写权限）');
        return;
      }
      if(!data || data.length === 0){
        // 本地与云端都为空：清空云端残留
        await window._sbpbClient.from(table).delete().neq('id', '___never_exist___');
        return;
      }
      let snakeData = this._toSnake(data);
      // aftersales 表：云端历史建表仅含基础列（缺 loss/remark/tracking_no/updated_at 等）。
      // 若把本地多余字段一并 upsert，PostgREST 报「列不存在」导致整批失败，表现为
      // 「售后状态改为已处理后刷新又变回待处理」。这里只 upsert 云端确定存在的列，
      // 保证 status 等可靠上云。缺失列请按下方 SQL 在 Supabase 补齐后再扩展同步白名单。
      if(table === 'aftersales'){
        const asCols = new Set(['id','order_id','customer_name','phone','sales_id','sales_name','items','reason','images','status']);
        snakeData = snakeData.map(function(o){
          const f = {};
          Object.keys(o).forEach(function(k){ if(asCols.has(k)) f[k] = o[k]; });
          return f;
        });
      }
      // 账号表：Supabase 实际列只有 id/username/password/name/role/phone/created_at，
      // 本地为了业务需要扩展了 disabled/wechatAmount 等字段。 upsert 时必须剥掉不存在的列，
      // 否则 PostgREST 会报 "column users.xxx does not exist" 导致整批账号同步失败。
      // 同时按登录名去重（保留创建时间最早的一条），避免云端出现同名账号。
      if(table === 'users'){
        const allowed = new Set(['id','username','password','name','role','phone','created_at']);
        const seen = new Set();
        snakeData = snakeData
          .sort((a, b) => {
            const ta = Date.parse(((a.created_at || '')).replace(' ', 'T')) || 0;
            const tb = Date.parse(((b.created_at || '')).replace(' ', 'T')) || 0;
            return ta - tb;
          })
          .map(u => {
            const o = {};
            Object.keys(u).forEach(k => { if(allowed.has(k)) o[k] = u[k]; });
            return o;
          })
          .filter(u => {
            const acc = String(u.username || '').trim().toLowerCase();
            if(!acc || seen.has(acc)) return false;
            seen.add(acc);
            return true;
          });
      }
      // upsert（按 id 冲突更新）：单条/单批失败不拖垮整批，但需上抛以便前端提示
      const batchSize = 100;
      const upsertErrors = [];
      for(let i = 0; i < snakeData.length; i += batchSize){
        const batch = snakeData.slice(i, i + batchSize);
        try{
          const { error } = await window._sbpbClient.from(table).upsert(batch, { onConflict: 'id' });
          if(error) upsertErrors.push(error.message || String(error));
        }catch(e){ upsertErrors.push(e.message || String(e)); }
      }
      if(upsertErrors.length){
        throw new Error('部分数据同步失败(' + upsertErrors.length + '批): ' + upsertErrors.join('; '));
      }
      // 删除云端中"合并集里已不存在"的 id，传播本地删除（不影响其它端新增的单）
      if(key === 'users'){
        // 账号表：只清理被明确标记为已删除的 id，避免落后设备误删别人新建的账号。
        // 同时这些 id 在 _mergeById 中已被过滤，不会从云端拉回到本地。
        const delIds = this.get('_deletedUserIds', []);
        if(delIds.length){
          const ids = delIds.filter(id => id != null).map(id => '"' + String(id).replace(/"/g, '\\"') + '"');
          if(ids.length){
            const { error: delErr } = await window._sbpbClient.from(table)
              .delete().in('id', '(' + ids.join(',') + ')');
            if(delErr) console.warn('清理已删除账号失败 ['+key+']:', delErr.message);
          }
        }
      }else if(key !== 'products'){
        // 商品表除外：商品是“云端唯一真相”，绝不允许按本设备本地清单反删云端，
        // 否则某设备本地缓存为旧子集时一旦新增/修改商品，会把云端其它商品误删，导致各端数量不一致。
        // 商品的删除由批量删除入口显式物理删除云端（products.delete().in('id',...)）传播，无需此处批量清理。
        const ids = data.map(r => r && r.id != null ? r.id : null).filter(Boolean)
          .map(id => '"' + String(id).replace(/"/g, '\\"') + '"');
        if(ids.length){
          const { error: delErr } = await window._sbpbClient.from(table)
            .delete().not('id', 'in', '(' + ids.join(',') + ')');
          if(delErr) console.warn('清理已删除记录失败 ['+key+']:', delErr.message);
        }
      }
      console.log('表 ['+key+'] 同步完成，共 '+data.length+' 条');
    }catch(e){
      console.warn('同步 ['+key+'] 到 Supabase 失败:', e.message);
      throw e; // 上抛，让调用方（改密码/重置密码/推送）能感知并提示用户，不再静默丢失
    }
  },

  // 把单条用户记录直接 upsert 到云端（用于改密码/重置密码等只需更新一条账号的场景）。
  // 避免 syncTable('users') 全量拉取+合并时因 Service Worker 缓存/网络抖动导致失败提示。
  // 注意：这是单向推送本地→云端；登录/自动同步时仍由 _loadTable 的云端权威合并保证多端收敛。
  async upsertUser(user){
    if(!window._sbpbClient) throw new Error('Supabase 未初始化');
    const payload = {
      id: user.id,
      username: user.username,
      password: user.password,
      name: user.name || '',
      role: user.role || 'sales',
      phone: user.phone || '',
      created_at: user.createdAt || user.created_at || new Date().toISOString()
    };
    const { error } = await window._sbpbClient.from('users').upsert(payload, { onConflict: 'id' });
    if(error) throw error;
  },

  // 从 Supabase 同步所有表到 localStorage 缓存
  async syncFromCloud(){
    if(!window._sbpbClient){
      console.warn('Supabase 未初始化，跳过云端同步');
      return;
    }
    this._initMapping();
    this._setSyncStatus('syncing');
    const tables = ['users','customers','products','orders','aftersales','payments','commissions','audit_log'];
    let hasError = false;
    for(let i = 0; i < tables.length; i++){
      try{
      let result;
      // 订单/商品走 NetworkOnly：先推本地未同步数据上云，再用云端全量替换本地缓存，
      // 避免 _loadTable 的本地优先合并在多设备间产生不一致（如上门订单徽章数不同）。
      if(tables[i] === 'orders'){
        result = await this.loadOrdersFromCloud();
      } else if(tables[i] === 'products'){
        result = await this.loadProductsFromCloud();
      } else {
        result = await this._loadTable(tables[i]);
      }
      if(result === null){
        // audit_log 表可能尚未在 Supabase 创建（需用户跑一次 copyRlsSql 的建表语句），
        // 此时跳过该表，避免把整体同步状态误报为"失败"。本地审计始终可用。
        if(tables[i] === 'audit_log'){ console.warn('audit_log 表尚未创建，跳过同步（本地审计仍可用）'); continue; }
        hasError = true;
      }
      }catch(e){
        console.warn('同步表 ['+tables[i]+'] 失败:', e.message);
        hasError = true;
      }
    }
    this._setSyncStatus(hasError ? 'error' : 'synced');
    return !hasError;
  },

  // 将所有本地数据推送到 Supabase
  async pushToCloud(){
    if(!window._sbpbClient) return;
    this._initMapping();
    this._setSyncStatus('syncing');
    // 注意：商品表不在此批量上推，避免把某台设备的本地旧缓存（如手机上残留的 300+ 条）糊回云端。
    // 商品由「进入页面云端覆盖」+「改/增时单条上推」+「以本机为准同步」按钮来保证一致。
    // audit_log 是本地审计日志，无需跨端传播；且该表可能尚未创建，避免因此把整体同步状态报红。
    const tables = ['users','customers','orders','aftersales','payments','commissions'];
    let hasError = false;
    for(let i = 0; i < tables.length; i++){
      try{
        await this.syncTable(tables[i]);
      }catch(e){
        console.warn('pushToCloud 同步表失败 ['+tables[i]+']:', e.message);
        hasError = true;
      }
    }
    this._setSyncStatus(hasError ? 'error' : 'synced');
  },

  // 自动同步时上推本地新增/修改的数据（不含 users：避免账号密码被本地旧值覆盖，users 由登录拉取时的云端权威合并保护；
  // 也不含 audit_log：本地审计日志无需跨端传播；也不含 products：商品由云端覆盖 + 单条上推保证一致，避免把旧缓存糊回云端）。
  // 使任一端创建的订单/售后/收款等最多 15 秒内出现在其他端，修复“一端创建的订单另一端看不到”的问题。
  async pushLocalChanges(keys){
    if(!window._sbpbClient) return;
    const tables = keys || ['orders','aftersales','payments','commissions','customers'];
    for(let i = 0; i < tables.length; i++){
      try{
        await this.syncTable(tables[i]);
      }catch(e){
        console.warn('自动上推 ['+tables[i]+'] 失败:', e.message);
      }
    }
  },

  // 订单类页面 NetworkOnly：先把本地未同步的订单推上云，再把云端最新订单合并到本地缓存后渲染。
  // 关键：采用「云端合并入本地」（而非直接覆盖），防止本地刚点的「已下单/反馈」等状态因推送尚未完成
  // 就被云端旧数据冲掉，导致按钮/状态闪回。
  async loadOrdersFromCloud(){
    if(!window._sbpbClient) return;
    // 第一步：把本地新增/修改/删除先推上云并合并，确保本端最新改动进入合并池
    try{ await this.syncTable('orders'); }catch(e){ console.warn('推订单上云失败:', e.message); }
    // 第二步：拉取云端最新订单，按 updatedAt 较新者优先合并到本地（本地有更新的改动不会被覆盖）
    const { data, error } = await window._sbpbClient.from('orders').select('*').order('created_at', { ascending: true });
    if(error) throw error;
    const cloud = this._toCamel(data || []);
    const local = this.get('orders', []);
    const merged = this._mergeById(local, cloud, this.get('_deletedOrderIds', []));
    localStorage.setItem('soms_orders', JSON.stringify(merged));
    return merged;
  },

  // 商品列表：云端为唯一真相。进入商品页时直接用云端全量「覆盖」本地缓存（不再套本机删除记录），
  // 保证任意浏览器/设备看到的商品数量都 = 云端数量，彻底解决「网页178、手机300+」这类多端不一致。
  async loadProductsFromCloud(){
    if(!window._sbpbClient) return;
    const { data, error } = await window._sbpbClient.from('products').select('*').order('created_at', { ascending: true });
    if(error) throw error;
    const cloud = this._toCamel(data || []);
    localStorage.setItem('soms_products', JSON.stringify(cloud));
    return cloud;
  },

  // 同步状态管理
  _setSyncStatus(status){
    this._syncStatus = status;
    const el = document.getElementById('syncStatusBadge');
    const btn = document.getElementById('syncBtn');
    if(el){
      if(status === 'syncing'){
        el.textContent = '同步中...';
        el.style.color = '#f59e0b';
        if(btn) btn.disabled = true;
      }else if(status === 'synced'){
        el.textContent = '已同步';
        el.style.color = '#10b981';
        if(btn) btn.disabled = false;
      }else if(status === 'error'){
        el.textContent = '同步失败';
        el.style.color = '#ef4444';
        if(btn) btn.disabled = false;
      }else{
        el.textContent = '未同步';
        el.style.color = '#6b7280';
        if(btn) btn.disabled = false;
      }
    }
  },

  getSyncStatus(){
    return this._syncStatus;
  }
};

      id: DB.uid('log_'),

      before: (opts.before != null && opts.before !== '') ? String(opts.before) : '',
      after: (opts.after != null && opts.after !== '') ? String(opts.after) : '',
      detail: opts.detail || ''
    };
    const logs = DB.get('audit_log', []);
    logs.push(entry);
    if(logs.length > 2000) logs.splice(0, logs.length - 2000); // 限制本地长度，避免无限增长
    DB.set('audit_log', logs);
  }catch(e){ console.warn('logAudit 失败:', e.message); }
}

/* ============ 工具函数 ============ */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  // 关键修复：补充毫秒精度，与 toISOString() 保持一致，避免 _mergeById 用 Date.parse 比较时
  // 因“本地 nowStr(无毫秒) < 云端 toISOString(有毫秒)”误判本地更新更旧，导致刚填的损耗被云端旧数据覆盖。
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+
    p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+String(d.getMilliseconds()).padStart(3,'0');
}
// HTML 转义（防注入：用于订单备注等用户自由文本渲染到 innerHTML）
function escapeHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// JS 字符串转义：把不可信数据安全地塞进 onclick 等 HTML 属性里的 JS 字符串字面量（单引号）中。
// 不能用 escapeHtml：escapeHtml 把 ' 变成 &#39;，浏览器在解析 HTML 属性时会先把 &#39; 解码回 '，
// 最终 JS 引擎仍会把它当成字符串结束符 → 脱离字符串、造成 XSS。此处：反斜杠先转义；单引号转成 \'（阻止脱离 JS 字符串）；
// 双引号转成 &quot;（阻止脱离外层双引号 HTML 属性）；换行转义。
function escapeJsStr(s){
  return String(s == null ? '' : s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'\\n').replace(/\r/g,'\\r');
}
// 手机号规范化：去掉空格与横杠，统一为连续数字（如 177 1278 0802 → 17712780802）
function normalizePhone(raw){
  if(!raw) return '';
  return String(raw).replace(/[\s-]/g, '');
}
// 金额格式化（整数，千分位）
function money(n){
  return '¥' + Math.round(n).toLocaleString();
}
// 纯数字格式化
function num(n){
  return Math.round(n).toLocaleString();
}

/* ============ 模糊匹配商品算法 ============ */
function fuzzyMatchProduct(inputName, products){
  if(!inputName || !products || !products.length) return null;
  // 去除空格和常见后缀/量词
  const clean = inputName.replace(/\s+/g,'')
    .replace(/(个|件|台|只|把|双|套|箱|盒|包|送)$/g,'')
    .toLowerCase();
  if(!clean) return null;

  let best = null;
  let bestScore = 0;
  const onProducts = products.filter(p => p.status === 'on');

  onProducts.forEach(p => {
    const pname = p.name.replace(/\s+/g,'').toLowerCase();
    const pcategory = (p.category||'').replace(/\s+/g,'').toLowerCase();
    let score = 0;

    // 1. 完全包含：输入名包含在商品名中，或反之
    if(pname.includes(clean) || clean.includes(pname)){
      score += 0.8;
    }

    // 2. 字符重叠率
    const inputChars = new Set(clean.split(''));
    let hit = 0;
    inputChars.forEach(ch => {
      if(pname.includes(ch) || pcategory.includes(ch)) hit++;
    });
    const overlap = hit / inputChars.size;
    score += overlap * 0.5;

    // 3. 核心关键词加分：连续子串匹配
    // 提取输入中的连续2字以上中文/字母片段
    const tokens = clean.match(/[\u4e00-\u9fa5]{2,}|[a-z0-9]{2,}/g) || [];
    tokens.forEach(tok => {
      if(pname.includes(tok)){
        score += 0.3;
      }
    });

    // 4. 数字/型号精确匹配加分
    const inputNums = clean.match(/[0-9]+[a-z]*/g) || [];
    const pNums = pname.match(/[0-9]+[a-z]*/g) || [];
    inputNums.forEach(n => {
      if(pNums.some(pn => pn === n || pn.includes(n) || n.includes(pn))){
        score += 0.25;
      }
    });

    if(score > bestScore){
      bestScore = score;
      best = p;
    }
  });

  // 阈值 > 0.6：提高匹配门槛，避免仅靠字符重叠（最高 0.5）把无关商品误匹配进来。
  // 显式子串包含仍记 0.8，可靠的完全/部分包含匹配不受影响；低置信度（仅零散字符重叠）不再匹配，
  // 识别不到商品库内商品时退回"未匹配"，由用户手动确认，避免"识别出商品库里没有的商品"。
  return bestScore > 0.6 ? best : null;
}

/* ============ 省市区数据 + 地址结构化解析/补全（京东式） ============ */
let _areaIndex = null;
function getAreaIndex(){
  if(_areaIndex) return _areaIndex;
  const AREA = window.AREA_DATA || [];
  const provinces = [], cities = [], districts = [];
  const cityToProv = {}, distToCityProv = {};
  const skip = new Set(['市辖区','县','区']);
  for(const p of AREA){
    provinces.push(p.name);
    for(const c of (p.children||[])){
      if(c.name && !skip.has(c.name)){ cities.push(c.name); cityToProv[c.name] = p.name; }
      for(const d of (c.children||[])){
        if(d.name && !skip.has(d.name)){ districts.push(d.name); (distToCityProv[d.name] = distToCityProv[d.name]||[]).push({city:c.name, province:p.name}); }
      }
    }
  }
  _areaIndex = { provinces, cities, districts, cityToProv, distToCityProv };
  return _areaIndex;
}
const MUNICIPALITIES = ['北京市','上海市','天津市','重庆市'];
function findLongest(text, names){
  let best = '';
  for(const n of names){ if(text.indexOf(n) >= 0 && n.length > best.length) best = n; }
  return best;
}
// 从地址文本提取 省/市/区 + 详细地址，并自动补全缺失层级（如只给区县补出省市）
function parseAddressText(text){
  const idx = getAreaIndex();
  let province = '', city = '', district = '';
  // 优先用文本中出现的市名来消歧（京东式：城市优先，避免多同名区县误判）
  // 兼容用户只写简称："常州" -> "常州市"
  let cityHit = findLongest(text, idx.cities);
  if(!cityHit){
    for(const c of idx.cities){
      const short = c.replace(/市$/,'');
      if(short && short !== c && text.indexOf(short) >= 0){
        if(!cityHit || short.length > cityHit.replace(/市$/,'').length){ cityHit = c; }
      }
    }
  }
  if(cityHit){ city = cityHit; province = idx.cityToProv[cityHit] || ''; }
  // 区县匹配池：若已锁定城市，则只在该市的区县里找，避免跨市歧义
  let districtsPool = idx.districts;
  if(cityHit){
    const prov = (window.AREA_DATA||[]).find(p => p.name === province);
    const c = prov && (prov.children||[]).find(x => x.name === city);
    if(c) districtsPool = (c.children||[]).map(d => d.name);
  }
  district = findLongest(text, districtsPool);
  // 若文本没出现市名，但命中了区县，则用区县反查（第一个候选）
  if(district && !cityHit){
    const cands = idx.distToCityProv[district] || [];
    if(cands.length){ city = cands[0].city; province = cands[0].province; }
  }
  const provHit = findLongest(text, idx.provinces);
  if(provHit) province = provHit;
  if(MUNICIPALITIES.indexOf(province) >= 0 && city === '市辖区') city = province;
  // D11：地标→区 智能补全（如"常州荷花池商务楼" → 天宁区）
  if(!district && (text.indexOf('常州') >= 0 || text.indexOf('江苏') >= 0)){
    const LANDMARK = ['荷花池商务楼','荷花池','天宁宝塔'];
    if(LANDMARK.some(k => text.indexOf(k) >= 0)){
      district = '天宁区';
      if(!city) city = '常州市';
      if(!province) province = '江苏省';
    }
  }
  let detail = text;
  [province, city, district].forEach(n => {
    if(!n) return;
    detail = detail.split(n).join('');
    // 同时去掉行政后缀简称："江苏省"->"江苏"，"常州市"->"常州"，避免详细地址重复
    const short = n.replace(/(省|市|自治区|特别行政区|区|县)$/, '');
    if(short && short !== n && short.length >= 2) detail = detail.split(short).join('');
  });
  detail = detail.replace(/\s+/g, ' ').replace(/[，,。.、；;]/g, ' ').replace(/\s+/g, ' ').trim();
  return { province, city, district, detail };
}
// 三级联动：初始化省份下拉
function fillAreaSelectsInit(){
  const pv = document.getElementById('custProvince');
  if(!pv) return;
  const idx = getAreaIndex();
  pv.innerHTML = '<option value="">请选择省份</option>' + idx.provinces.map(p => '<option value="'+p+'">'+p+'</option>').join('');
}
function onProvinceChange(){
  const pv = document.getElementById('custProvince');
  const cv = document.getElementById('custCity');
  const dv = document.getElementById('custDistrict');
  if(!pv || !cv || !dv) return;
  const prov = (window.AREA_DATA||[]).find(p => p.name === pv.value);
  dv.innerHTML = '<option value="">请选择区县</option>';
  if(!prov){ cv.innerHTML = '<option value="">请选择城市</option>'; return; }
  if(MUNICIPALITIES.indexOf(pv.value) >= 0){
    cv.innerHTML = '<option value="'+pv.value+'">'+pv.value+'</option>';
    cv.value = pv.value;
    onCityChange();
    return;
  }
  cv.innerHTML = '<option value="">请选择城市</option>' + (prov.children||[]).map(c => '<option value="'+escapeHtml(c.name)+'">'+escapeHtml(c.name)+'</option>').join('');
}
function onCityChange(){
  const pv = document.getElementById('custProvince');
  const cv = document.getElementById('custCity');
  const dv = document.getElementById('custDistrict');
  if(!pv || !cv || !dv) return;
  const prov = (window.AREA_DATA||[]).find(p => p.name === pv.value);
  if(!prov){ dv.innerHTML = '<option value="">请选择区县</option>'; return; }
  let city;
  if(MUNICIPALITIES.indexOf(pv.value) >= 0){ city = prov; }
  else { city = (prov.children||[]).find(c => c.name === cv.value); }
  dv.innerHTML = '<option value="">请选择区县</option>' + (city && city.children ? (city.children||[]).map(d => '<option value="'+d.name+'">'+d.name+'</option>').join('') : '');
}
function setAreaSelects(province, city, district){
  const pv = document.getElementById('custProvince');
  if(!pv) return;
  pv.value = province || '';
  onProvinceChange();
  const cv = document.getElementById('custCity');
  if(cv) cv.value = city || '';
  onCityChange();
  const dv = document.getElementById('custDistrict');
  if(dv) dv.value = district || '';
}

// 统一格式化订单地址：有省市区则结构化展示，旧订单回退 region/address
function formatOrderAddress(order){
  if(!order) return '';
  if(order.province || order.city || order.district){
    return [order.province, order.city, order.district, order.address].filter(Boolean).join(' ');
  }
  return [order.region, order.address].filter(Boolean).join(' ');
}

/* ============ 订单文本一键识别解析（三块结构化拆分） ============ */
function parseOrderText(text){
  const result = {
    contact:'', phone:'', region:'', address:'',
    province:'', city:'', district:'',  // 结构化省市区（京东式，自动补全）
    fullAddress:'',   // 拼接后的完整地址字符串（省+市+区+小区+楼栋房号）
    items:[], remark:'',
    rawCustomer:'',   // 原始客户信息文本块
    rawRemark:'',     // 原始备注文本块
    rawItems:[]       // 原始商品文本块
  };
  if(!text) return result;
  const products = DB.get('products');

  /* ---- 过滤图片标注/水印/占位提示等噪声行 ---- */
  const noisePatterns = [
    /添加订单备注内容即可/,
    /点击.*添加.*备注/,
    /请输入.*备注/,
    /请填写.*备注/,
    /此处添加备注/,
    /订单备注[：:]?\s*请填写/,
    /请在此输入/,
    /^备注[：:]?\s*$/
  ];
  const lines = text.split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l && !noisePatterns.some(p => p.test(l)));
  const fullText = lines.join(' ');

  /* ---- 常见商品关键词黑名单（用于排除非地址/非姓名文本）---- */
  const productBrandKeywords = [
    '电饭煲','电压力锅','炒锅','煎锅','汤锅','炖锅','蒸锅','奶锅','砂锅','水壶',
    '电磁炉','微波炉','烤箱','空气炸锅','破壁机','榨汁机','料理机','豆浆机',
    '热水器','油烟机','燃气灶','冰箱','洗衣机','空调','电视','净水器','消毒柜',
    '福库','三头鹰','苏泊尔','美的','九阳','海尔','格力','方太','老板','华帝',
    '松下','飞利浦','小米','奔腾','康佳','TCL','创维','海信','志高','万和',
    '林内','能率','史密斯','樱花','帅康','万家乐','西门子','博世','伊莱克斯',
    '新飞','美菱','容声','奥克斯','长虹','小熊','九阳','康巴赫','双立人','WMF',
    '铁锅','不粘锅','不锈钢','珐琅','铸铁','陶瓷','玻璃','硅胶',
    '铲子','锅铲','勺子','漏勺','蒸笼','蒸屉','砧板','刀具','刀架','杯','碗','盘',
    '小白贝','压力IH','压力','IH电饭煲','电饭煲'
  ];

  /* ---- 姓名排除黑名单（常见非人名2-4字词）---- */
  const nameExcludeWords = new Set([
    '开发区','经济开发区','高新区','工业园区','产业园区','示范区','自贸区',
    '龙湖','万科','碧桂园','恒大','融创','保利','中海','绿地','华润','招商',
    '新城','世茂','金茂','绿城','阳光城','融信','金科','蓝光','雅居乐','龙光',
    '电饭煲','炒锅','煎锅','汤锅','炖锅','蒸锅','砂锅','水壶','电磁炉',
    '微波炉','烤箱','炸锅','破壁机','榨汁机','料理机','豆浆机','热水器',
    '油烟机','燃气灶','冰箱','洗衣机','空调','净水器','消毒柜','锅铲',
    '赠品','赠品','赠送','附赠','配件','礼品'
  ]);

  /* ============ 第一步：提取赠品备注 ============ */
  const remarkLines = [];
  const remarkPatterns = [
    /^送(.{1,20})/,
    /^附赠(.{1,20})/,
    /^赠送(.{1,20})/,
    /(?:送|附赠|赠送|礼品|配件|赠品)[：:]\s*(.{1,30})/,
    /(?:配套|附带|加送|再加|还送|多送)(.{1,20})/
  ];
  // 逐行扫描赠品
  lines.forEach(line => {
    for(const pat of remarkPatterns){
      if(pat.test(line)){
        remarkLines.push(line.trim());
        return;
      }
    }
  });

  /* ============ 第二步：提取手机号 ============ */
  let phone = '';
  const phoneText = fullText.replace(/[\s-]/g, '');
  const phoneMatch = phoneText.match(/1[3-9]\d{9}/);
  if(phoneMatch) phone = phoneMatch[0];
  result.phone = phone;

  // 注意：此处不修改 lines，避免破坏后续"姓名提取-策略0"（依赖含手机号的原始行定位姓名）。
  // "地址.姓名电话"粘连格式的清理统一在第三步提取地址后做（仅清洗 fullAddress 字符串）。

  /* ============ 第三步：提取地址（省+市+区/县+小区+楼栋房号）============ */
  let region = '', address = '', fullAddress = '';
  // 先尝试带标签格式
  lines.forEach(line => {
    let m;
    if(m = line.match(/所在地区\s*[:：]\s*(.+)/)){ region = m[1].trim(); return; }
    if(m = line.match(/详细地址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/收货地址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/地\s*址\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
    if(m = line.match(/Address\s*[:：]\s*(.+)/)){ address = m[1].trim(); return; }
  });

  if(region || address){
    // 带标签格式：直接使用
    result.region = region;
    result.address = address;
    fullAddress = (region + ' ' + address).trim();
  } else {
    // 无标签：从原文智能提取地址
    // 策略：匹配包含 省/市/区/县 + 小区/路/街道 + 楼栋房号 的连续文本片段
    // 先尝试整行匹配（通常地址在单独一行或多行中）
    const addrLinePattern = /^([\u4e00-\u9fa5]+省[\u4e00-\u9fa5]+市[\u4e00-\u9fa5]*(?:区|县|开发区|高新区|经济区)[\u4e00-\u9fa5]*(?:街道|路|镇|乡|村)?[\u4e00-\u9fa5]*(?:小区|花园|城|府|园|苑|居|庭|邸|庄|湾|郡|都|汇|公馆|国际|广场|中心|天地|新城|半岛|华府|豪庭|雅苑|家园|雅居|丽景|星城|水晶|翡翠|凤凰|龙庭|御景|碧桂|金色|阳光|银座|蓝光|华润|龙湖|万科|碧桂园|融创|保利|中海|绿地)[\u4e00-\u9fa5]*(?:路|街|道|巷)?[\u4e00-\u9fa5]*(?:号楼?|幢|栋|座|单元|层)[\s\-]*[\w\u4e00-\u9fa5]+(?:室|号|房)?)$/;

    // 策略A：单行匹配完整地址
    let addrFound = false;
    for(const line of lines){
      const m = line.match(addrLinePattern);
      if(m){
        fullAddress = m[1].trim();
        addrFound = true;
        break;
      }
    }

    if(!addrFound){
      // 策略B：多行拼接，找出包含省/市/区/县/开发区的连续文本
      // 先定位地址起始行
      let addrStartIdx = -1, addrEndIdx = -1;
      lines.forEach((line, idx) => {
        if(addrStartIdx < 0){
          // 地址通常以"省"开头
          if(/[\u4e00-\u9fa5]+省/.test(line) && !remarkLines.includes(line)){
            addrStartIdx = idx;
          }
        }
      });
      if(addrStartIdx >= 0){
        // 从起始行开始，连续拼接直到遇到非地址行
        const addrParts = [];
        for(let i = addrStartIdx; i < lines.length; i++){
          const line = lines[i];
          // 跳过赠品行
          if(remarkLines.includes(line)) continue;
          // 跳过手机号行
          if(/^1[3-9]\d{9}$/.test(line)) continue;
          // 跳过纯数字价格行
          if(/^\d{1,6}$/.test(line)) continue;
          // 如果遇到商品关键词，停止
          const hasProductKeyword = productBrandKeywords.some(kw => line.includes(kw));
          if(hasProductKeyword && addrParts.length > 0) break;
          // 地址通常包含地名关键字
          if(/[省市区县镇村路街道巷号幢栋楼室层开发].+/.test(line) || addrParts.length === 0){
            addrParts.push(line);
            addrEndIdx = i;
          } else {
            break;
          }
        }
        fullAddress = addrParts.join(' ').trim();
      }
    }

    if(!fullAddress){
      // 策略C：正则从全文中提取地址片段
      const addrRegex = /([\u4e00-\u9fa5]+省[\u4e00-\u9fa5]+(?:市|自治区|特别行政区)[\u4e00-\u9fa5]*(?:区|县|开发区|高新区|经济区|新区|旗)[\u4e00-\u9fa5]*(?:街道|路|镇|乡|村)?[\u4e00-\u9fa5]*(?:小区|花园|城|府|园|苑|居|庭|邸|庄|湾|郡|都|汇|公馆|国际|广场|中心|天地|新城|半岛|华府|豪庭|雅苑|家园|雅居|丽景|星城|水晶|翡翠|凤凰|龙庭|御景|碧桂|金色|阳光|银座|蓝光|华润|龙湖|万科|碧桂园|融创|保利|中海|绿地)[\u4e00-\u9fa5]*(?:路|街|道|巷)?[\u4e00-\u9fa5]*(?:号楼?|幢|栋|座|单元|层)[\s\-]*[\w\u4e00-\u9fa5]+(?:室|号|房)?)/;
      const m = fullText.match(addrRegex);
      if(m) fullAddress = m[1].trim();
    }

    // 策略D：按地址关键词识别（兼容省略"省"的写法，如"福州市…""宁波市…""常州…"）
    if(!fullAddress){
      const idx = getAreaIndex();
      const cityShortNames = idx.cities.map(c => c.replace(/市$/,'')).filter(c => c.length >= 2);
      const addrKeywordLines = [];
      lines.forEach(line => {
        if(remarkLines.includes(line)) return;
        if(/^1[3-9]\d{9}$/.test(line)) return;
        if(productBrandKeywords.some(kw => line.includes(kw))) return;
        // 含省/市/区/县/路/街道/号/栋/幢/室/小区/公寓/楼等地址特征
        const hasAddrKw = /[省市区县镇乡街道巷号栋幢室社区村组]|小区|花园|广场|府|园|苑|城|华府|豪庭|山庄|公馆|大厦|公寓|楼/.test(line);
        // 或包含任何城市名/简称（常州→常州市）
        const hasCity = idx.cities.some(c => line.indexOf(c) >= 0) || cityShortNames.some(c => line.indexOf(c) >= 0);
        if((hasAddrKw || hasCity) && line.length >= 4){
          addrKeywordLines.push(line);
        }
      });
      if(addrKeywordLines.length){
        fullAddress = addrKeywordLines.join(' ').trim();
        // 清理：地址行常把姓名/电话混在同一行，需拆分出来
        // 1) 去掉手机号
        if(phone){ fullAddress = fullAddress.split(phone).join('').replace(/\s+/g,' ').trim(); }
        // 2) 从末尾提取可能的姓名（2-4个汉字，不是地址关键词/商品词），避免污染地址
        const nameCandMatch = fullAddress.match(/([\u4e00-\u9fa5]{2,4})\s*$/);
        if(nameCandMatch){
          const cand = nameCandMatch[1];
          const addrKwInCand = /[省市区县镇乡街道巷号栋幢室社区村组]|小区|花园|广场|府|园|苑|城|华府|豪庭|山庄|公馆|大厦|公寓|楼/.test(cand);
          const isProduct = productBrandKeywords.some(kw => cand.indexOf(kw) >= 0);
          const isExcluded = nameExcludeWords.has(cand);
          if(!addrKwInCand && !isProduct && !isExcluded){
            result.contact = cand;
            fullAddress = fullAddress.substring(0, fullAddress.length - cand.length).replace(/\s+$/,'');
          }
        }
      }
    }

    // 如果有地址文本，尝试拆分 region 和 address（基于 fullAddress，避免把姓名/电话卷进地区）
    if(fullAddress){
      const regionEndKeywords = ['区','县','开发区','高新区','经济区','新区','旗'];
      let splitPos = -1;
      for(const kw of regionEndKeywords){
        const idx = fullAddress.lastIndexOf(kw);
        if(idx > 0 && (splitPos < 0 || idx > splitPos)){
          splitPos = idx + kw.length;
        }
      }
      if(splitPos > 0 && splitPos < fullAddress.length - 2){
        result.region = fullAddress.substring(0, splitPos).trim();
        result.address = fullAddress.substring(splitPos).trim();
      } else {
        result.address = fullAddress;
      }
    }
  }

  // 清理地址：去掉手机号，并剥离行尾粘连的姓名（"地址.姓名" / "地址 姓名" 无分隔格式）
  // 解决"四川省成都市新都区澜悦溪岸9-3-502.李艳15828247773"这类把姓名/电话整体卷进地址、导致姓名提取失败的问题
  if(phone && fullAddress){
    if(fullAddress.includes(phone)) fullAddress = fullAddress.split(phone).join('');
    const trailName = fullAddress.match(/[.。、\s]*([\u4e00-\u9fa5]{2,4})\s*$/);
    if(trailName){
      const cand = trailName[1];
      if(!nameExcludeWords.has(cand) && !productBrandKeywords.some(kw => cand.indexOf(kw) >= 0)){
        fullAddress = fullAddress.substring(0, fullAddress.length - trailName[0].length).replace(/[.。、\s]+$/, '');
      }
    }
  }
  result.fullAddress = fullAddress;

  // 用行政区划数据做省市区结构化拆分 + 自动补全缺失层级（京东式）
  if(fullAddress){
    const ad = parseAddressText(fullAddress);
    result.province = ad.province;
    result.city = ad.city;
    result.district = ad.district;
    result.address = ad.detail || address || fullAddress;
    const rg = [ad.province, ad.city, ad.district].filter(Boolean).join(' ');
    if(rg) result.region = rg;
  }

  /* ============ 第四步：提取联系人姓名 ============ */
  let contact = '';
  // 带标签的值可能把电话/地址也粘在后面（如"客户：秦女士 电话：177... 地址：..."），需要截断
  function cleanContactValue(v){
    return v.split(/[\s,，、]*(?:电话|手机|手机号|地址|收货地址|所在地区|备注)/)[0].trim();
  }
  // 先检查带标签
  lines.forEach(line => {
    let m;
    if(m = line.match(/收货人\s*[:：]\s*(.+)/)){ contact = cleanContactValue(m[1]); return; }
    if(m = line.match(/收件人\s*[:：]\s*(.+)/)){ contact = cleanContactValue(m[1]); return; }
    if(m = line.match(/联系人\s*[:：]\s*(.+)/)){ contact = cleanContactValue(m[1]); return; }
    if(m = line.match(/客\s*户\s*[:：]\s*(.+)/)){ contact = cleanContactValue(m[1]); return; }
    if(m = line.match(/姓\s*名\s*[:：]\s*(.+)/)){ contact = cleanContactValue(m[1]); return; }
  });

  if(!contact){
    // 策略0：从含手机号的行中提取姓名（姓名通常为手机号同行的 2-4 个汉字词）
    if(phone){
      const phoneLine = lines.find(l => l.includes(phone));
      if(phoneLine){
        const toks = phoneLine.split(/[\s,，、]+/).filter(Boolean);
        for(const t of toks){
          if(t === phone) continue;
          if(/^[\u4e00-\u9fa5]{2,4}$/.test(t)
             && !nameExcludeWords.has(t)
             && !productBrandKeywords.some(kw => t.includes(kw))){
            contact = t; break;
          }
        }
      }
    }
  }

  if(!contact && fullAddress && phone){
      // "地址 姓 手机号" 或 "地址 姓 手机号" 格式
      const addrWithoutPhone = fullText.replace(phone, '');
      // 在去掉地址和赠品后的剩余文本中找姓氏
      const cleanText = addrWithoutPhone
        .replace(fullAddress, '')
        .replace(/送.+?$/gm, '')
        .replace(/附赠.+?$/gm, '')
        .replace(/赠送.+?$/gm, '')
        .trim();

      // 清理后找独立短词（1-4个汉字，不含数字、不含商品关键词）
      const cleanTextNoChecklist = cleanText.replace(/^\s*[-*]\s*\[[ xX]\]\s*.*$/gm, '');
      const wordCandidates = (cleanTextNoChecklist.match(/[\u4e00-\u9fa5]{1,4}/g) || []);
      for(const w of wordCandidates){
        if(!nameExcludeWords.has(w)
           && !productBrandKeywords.some(kw => w.includes(kw))
           && w.length >= 1 && w.length <= 4
           && !/^\d+$/.test(w)
           && !/[\d一二三四五六七八九十百千万]/.test(w)){
          contact = w;
          break;
        }
      }
    }

    // 策略B：在全文中找"姓 手机号"模式中的姓
    if(!contact && phone){
      // 匹配 "姓"紧跟空格/逗号然后紧跟手机号
      const surnamePattern = new RegExp('([\\u4e00-\\u9fa5]{1,2})\\s*' + phone.replace('+','\\+'));
      const sm = fullText.match(surnamePattern);
      if(sm){
        const candidate = sm[1];
        if(!productBrandKeywords.some(kw => candidate.includes(kw))
           && !nameExcludeWords.has(candidate)){
          contact = candidate;
        }
      }
    }

    // 策略C：在地址后面的短文本中找姓氏
    if(!contact){
      // 从每行中提取：不在地址中、不在赠品中、不是商品名、1-4个汉字
      const usedTexts = new Set([fullAddress, phone, ...remarkLines].filter(Boolean));
      lines.forEach(line => {
        if(contact) return;
        if(usedTexts.has(line)) return;
        if(remarkLines.includes(line)) return;
        // 跳过 Markdown 勾选清单行（商品目录/待办），其中不含客户姓名
        if(/^\s*[-*]\s*\[[ xX]\]\s*/.test(line)) return;
        // 尝试找行中独立的短汉字词组
        const words = line.split(/[\s,，、]+/).filter(Boolean);
        for(const w of words){
          if(/^[\u4e00-\u9fa5]{1,4}$/.test(w)
             && !productBrandKeywords.some(kw => w.includes(kw))
             && !nameExcludeWords.has(w)){
            contact = w;
            return;
          }
        }
      });
    }
  // 合并策略D可能已提取的姓名
  if(!contact && result.contact) contact = result.contact;
  result.contact = contact;

  // 清理地址：如果联系人姓名被卷进 fullAddress（如"江苏省 常州市 秦女士 荷花池商务楼902"），
  // 在确认姓名后将其从地址中剥离，并重新解析省市区。
  if(contact && fullAddress){
    const escaped = contact.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const cleaned = fullAddress.replace(new RegExp(escaped, 'g'), '')
      .replace(/\s+/g, ' ').replace(/\s(?=\d)/g, '').trim();
    if(cleaned !== fullAddress){
      fullAddress = cleaned;
      result.fullAddress = fullAddress;
      const ad2 = parseAddressText(fullAddress);
      result.province = ad2.province;
      result.city = ad2.city;
      result.district = ad2.district;
      result.address = ad2.detail || result.address;
      const rg2 = [ad2.province, ad2.city, ad2.district].filter(Boolean).join(' ');
      if(rg2) result.region = rg2;
    }
  }

  /* ============ 第五步：逐行匹配商品 ============ */
  const itemLines = [];
  const skipTexts = new Set([
    fullAddress, phone, contact,
    ...remarkLines
  ].filter(Boolean));

  lines.forEach((line, lineIdx) => {
    // 跳过客户信息标签行
    let m;
    if(m = line.match(/收件人\s*[:：]/)) return;
    if(m = line.match(/手机号?码?\s*[:：]/)) return;
    if(m = line.match(/所在地区\s*[:：]/)) return;
    if(m = line.match(/详细地址\s*[:：]/)) return;
    if(m = line.match(/联系人\s*[:：]/)) return;
    if(m = line.match(/地址\s*[:：]/)) return;
    if(m = line.match(/姓\s*名\s*[:：]/)) return;
    // 跳过 Markdown 编号清单行（如 "- [x] 1. 净水器s1200" 商品目录），但保留实际下单项（如 "- [x] 花梨木砧板*1"）
    if(/^\s*[-*]\s*\[[ xX]\]\s*\d+[.、．]/.test(line)) return;
    // 跳过赠品行
    if(remarkLines.includes(line)) return;
    // 跳过纯手机号行
    if(line === phone) return;
    // 跳过含手机号的客户信息行（如"张华珍 18559176780"）
    if(phone && line.includes(phone)) return;
    // 跳过纯数字行（可能是价格）
    if(/^\d{1,6}$/.test(line)) return;

    // 去除 Markdown 勾选前缀（如 "- [x] "），得到干净的商品行用于匹配
    const nline = line.replace(/^\s*[-*]\s*\[[ xX]\]\s*/, '').trim();

    // 检查是否包含在地址文本中
    if(fullAddress && fullAddress.includes(line.trim()) && line.trim().length > 5) return;

    // 尝试匹配商品：带价格的行 "名称  数字"
    const priceMatch = nline.match(/^(.+?)\s+(\d{1,6})\s*(元|块)?$/);
    if(priceMatch){
      const namePart = priceMatch[1].trim();
      // 去除可能混入的姓名
      const cleanName = namePart.replace(new RegExp(contact ? contact : ''), '').trim();
      const matched = fuzzyMatchProduct(cleanName || namePart, products);
      if(matched){
        result.items.push({
          productId: matched.id,
          name: matched.name,
          price: matched.price,
          cost: matched.cost,
          qty: 1,
          subtotal: matched.price,
          inputName: nline,
          matchedScore: '已匹配'
        });
        return;
      }
      // 即使没匹配商品库，也作为原始商品行保留（因为可能是新品）
      itemLines.push(nline);
      return;
    }

    // 纯名称匹配（含商品关键词的行）
    const hasProductKw = productBrandKeywords.some(kw => nline.includes(kw));
    if(hasProductKw && nline.length >= 3){
      const cleanName = nline.replace(/[*×xX]\s*\d+\s*(台|个|套|件|只|把|条|盒|份)?/g,'').replace(/\d+/g,'').trim();
      const matched2 = fuzzyMatchProduct(cleanName, products);
      if(matched2){
        result.items.push({
          productId: matched2.id,
          name: matched2.name,
          price: matched2.price,
          cost: matched2.cost,
          qty: 1,
          subtotal: matched2.price,
          inputName: nline,
          matchedScore: '已匹配'
        });
      } else {
        itemLines.push(nline);
      }
      return;
    }

    // 剩余行中，如果包含品牌+型号特征但未被上面匹配
    if(/[\u4e00-\u9fa5]{2,6}\s*\d/.test(nline) && nline.length >= 4 && !skipTexts.has(nline)){
      itemLines.push(nline);
      return;
    }

    // 兜底：未被上述规则消费、且看起来像商品描述的行，保留为"待确认"商品，避免漏单
    // （如"OOU 鲸钛"等非品牌关键词、无数字的商品名）。客户/地址/备注/手机号行已在前面 return。
    if(nline.length >= 2 && !/^[\d\s]+$/.test(nline) && !remarkLines.includes(line)){
      itemLines.push(nline);
    }
  });

  result.remark = remarkLines.join('，');
  result.rawItems = itemLines;
  result.rawCustomer = [fullAddress, contact, phone].filter(Boolean).join(' ');

  return result;
}

// 纯 JS SHA-256（与 Web Crypto / Node crypto 结果完全一致），用于密码哈希，避免非安全上下文（file:// / http）下 crypto.subtle 不可用导致登录失败
function sha256js(str){
  function utf8(s){var out=[];for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c<0x80)out.push(c);else if(c<0x800)out.push(0xc0|(c>>6),0x80|(c&0x3f));else if(c>=0xd800&&c<=0xdbff){var c2=s.charCodeAt(++i);var cp=0x10000+((c&0x3ff)<<10)+(c2&0x3ff);out.push(0xf0|(cp>>18),0x80|((cp>>12)&0x3f),0x80|((cp>>6)&0x3f),0x80|(cp&0x3f));}else out.push(0xe0|(c>>12),0x80|((c>>6)&0x3f),0x80|(c&0x3f));}return out;}
  function r(x,n){x=x>>>0;var lo=(1<<n)-1;return ((x>>>n)|((x&lo)<<(32-n)))>>>0;}
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var m=utf8(str);var L=m.length;var bitLen=L*8;
  var hi=Math.floor(bitLen/0x100000000), lo=bitLen>>>0;
  m.push(0x80);while(m.length%64!==56)m.push(0);
  m.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255);
  m.push((lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(var i=0;i<m.length;i+=64){
    var w=new Array(64);
    for(var j=0;j<16;j++){w[j]=((m[i+j*4]<<24)|(m[i+j*4+1]<<16)|(m[i+j*4+2]<<8)|(m[i+j*4+3]))>>>0;}
    for(var j=16;j<64;j++){var s0=r(w[j-15],7)^r(w[j-15],18)^(w[j-15]>>>3);var s1=r(w[j-2],17)^r(w[j-2],19)^(w[j-2]>>>10);w[j]=((w[j-16]+s0+w[j-7]+s1)|0)>>>0;}
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(var j=0;j<64;j++){
      var S1=r(e,6)^r(e,11)^r(e,25);var ch=(e&f)^((~e)&g);var t1=((h+S1+ch+K[j]+w[j])|0)>>>0;
      var S0=r(a,2)^r(a,13)^r(a,22);var maj=(a&b)^(a&c)^(b&c);var t2=((S0+maj)|0)>>>0;
      h=g;g=f;f=e;e=((d+t1)|0)>>>0;d=c;c=b;b=a;a=((t1+t2)|0)>>>0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  function hex(n){return (('00000000'+((n>>>0).toString(16))).slice(-8));}
  return H.map(hex).join('');
}

// 密码加盐哈希（SHA-256），避免明文存储；兼容旧明文数据自动升级。同步函数，任何上下文结果一致
function hashPassword(pwd){
  return sha256js('soms_salt_2024' + pwd);
}

// 登录成功后的统一收尾：用 authenticated 客户端拉取账号资料（受 RLS 约束），写入会话
async function finishLoginViaAuth(username){
  let profile = null;
  try{
    const { data, error } = await window._sbpbClient.from('users').select('*').eq('username', username).single();
    if(data) profile = data;
  }catch(e){ /* 资料缺失则降级用 Auth 元数据 */ }
  if(!profile){
    try{
      const { data: au } = await window._sbpbClient.auth.getUser();
      const meta = (au && au.user && au.user.app_metadata) || {};
      profile = {
        id: (au && au.user && au.user.id) || '',
        username: meta.username || username,
        name: (au && au.user && au.user.user_metadata && au.user.user_metadata.name) || meta.username || username,
        role: meta.role || 'sales'
      };
    }catch(e){ profile = { id:'', username:username, name:username, role:'sales' }; }
  }
  const { password, ...safe } = profile;
  currentUser = safe;
  sessionStorage.setItem('soms_current_user', JSON.stringify(safe));
  showApp();
  showToast('登录成功，欢迎回来 ' + (safe.name || username),'success');
  if(window._sbpbClient){ DB.syncFromCloud().catch(function(){}); }
  else { setTimeout(function(){ DB.syncFromCloud().catch(function(){}); }, 2000); }
  // 擦除本地缓存中残留的密码哈希（历史版本写入的），仅保留 username/name/role 等
  DB.set('users', DB.get('users', []));
}

async function handleLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!user || !pass){ showToast('请输入用户名和密码','error'); return; }
  // —— 方案二(Auth)：优先走 Supabase 官方认证（密码哈希在服务端校验，绝不下发前端）——
  if(window._sbpbClient){
    try{
      const { data, error } = await window._sbpbClient.auth.signInWithPassword({
        email: user + '@soms.local',
        password: pass
      });
      if(data && data.user){
        await finishLoginViaAuth(user);
        return;
      }
      // 已迁移账号必须以 Supabase Auth 为准：密码错误/账号不存在时直接报错，
      // 禁止回退到本地缓存的旧哈希，否则旧密码（如 123456）仍能登录，形成后门。
      showToast('用户名或密码错误', 'error');
      return;
    }catch(e){ /* 真正的异常（网络中断/客户端未就绪）：降级到下方本地离线兜底 */ }
  }
  // 兼容期回退：Auth 账号尚未迁移时，用本地缓存的 sha256 校验（开通 RLS 后此分支自动失效，不会更不安全）
  // 登录前先强制从云端拉取最新账号（解决"在其他设备/浏览器刚创建的账号，本机缓存还没同步"导致登录不上的问题）
  try{
    if(window._sbpbClient){
      await DB._loadTable('users');
    }
  }catch(e){ /* 云端不可用则降级用本地缓存，不阻断登录 */ }
  // 用户数据已通过 DB.syncFromCloud() + 上面强制刷新 从 Supabase 同步到 localStorage 缓存
  // 清理重复/残留账号，确保同名账号只保留最新（含最新密码）的一条
  cleanupDuplicateUsers();
  // 清理重复客户：避免多次下单/录入手机号不一致产生重复客户
  cleanupDuplicateCustomers();
  const users = DB.get('users');
  const target = users.find(u => u.username === user && !u.disabled);
  if(!target){ showToast('用户名或密码错误','error'); return; }
  if(target.disabled){ showToast('该账号已被禁用，无法登录','error'); return; }
  let ok = false;
  try{
    const h = await hashPassword(pass);
    if(target.password === h) ok = true;
    else if(target.password === pass){ // 兼容旧明文：首次登录自动升级为哈希
      target.password = h; DB.set('users', users); ok = true;
    }
  }catch(e){
    // 非安全上下文（如 http）Web Crypto 不可用，降级明文比对，保证可登录
    if(target.password === pass) ok = true;
  }
  if(!ok){ showToast('用户名或密码错误','error'); return; }
  // 不把密码（即使是哈希）存入会话，降低泄露风险
  const {password, ...safe} = target;
  currentUser = safe;
  sessionStorage.setItem('soms_current_user', JSON.stringify(safe));
  showApp();
  showToast('登录成功，欢迎回来 '+safe.name,'success');
  // 擦除本地缓存中残留的密码哈希（历史版本写入的）
  DB.set('users', DB.get('users', []));
  // 登录后立即从云端拉取全部数据（含订单），确保销售即登即见自己名下订单，不依赖15秒轮询
  if(window._sbpbClient){ DB.syncFromCloud().catch(function(){}); }
  else { setTimeout(function(){ DB.syncFromCloud().catch(function(){}); }, 2000); } // CDN兜底加载中，稍后重试
}
